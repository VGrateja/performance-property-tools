<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adelaide returns &mdash; Performance Property</title>
<link rel="icon" href="../assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ADELAIDE RETURNS — public client page (no sign-in, no telemetry).
   Research meeting 2026-10-14: show what Performance Property's Adelaide
   purchases did for a client's deposit against shares, bonds, A-REITs, cash
   and the property market — every figure, label and sentence editable in the
   hub (tools/adelaide-returns.html, Vault) without a code change.

   Data: public.client_pages key 'adelaide-returns-2026' (migration 127, anon
   read). Opened as ?preview=1 inside the editor's iframe, the page renders the
   editor's DRAFT payload sent by postMessage instead — the preview and the
   client page are the same code. If the row cannot be read the page says it is
   being updated: it never falls back to numbers embedded here.
   Maths: client/adelaide-returns-math.js (tested by
   scripts/adelaide-returns-math.test.mjs). Feature note:
   docs/pp-os-migration/adelaide-returns.md
   A light, printable client document — it ignores the hub's dark default.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --teal:#00A0B4; --ink:#171B24; --ink2:#3a4150; --mut:#63666A; --line:#D9D9D6;
  --soft:#f4f6f8; --paper:#ffffff; --teal-soft:rgba(0,160,180,0.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);overflow-x:hidden}
body{font-family:'Montserrat',Arial,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.doc{max-width:1040px;margin:0 auto;padding:40px 32px 24px}
.state{max-width:640px;margin:18vh auto;padding:0 16px;text-align:center;color:var(--mut)}
.state h1{font-size:22px;color:var(--ink);margin:0 0 8px;font-weight:700}
.state img{height:36px;margin-top:28px}
[hidden]{display:none !important}

.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
h1.title{font-size:34px;line-height:1.2;font-weight:800;margin:8px 0 10px;letter-spacing:-0.01em;max-width:860px}
.subtitle{font-size:17px;color:var(--ink2);margin:0 0 6px;max-width:820px}
.meta{font-size:12.5px;color:var(--mut);margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:28px 0 8px}
.tile{border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px;padding:14px 16px;background:var(--paper)}
.tile b{display:block;font-size:clamp(20px,2.4vw,28px);font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ink)}
.tile span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.tile.blank b{color:var(--line)}

section.block{margin:44px 0 0;break-inside:avoid-page}
h2{font-size:22px;font-weight:800;margin:0 0 8px;letter-spacing:-0.005em}
h3{font-size:15px;font-weight:700;margin:18px 0 4px}
p{margin:0 0 10px}
.lead{color:var(--ink2);max-width:860px;white-space:pre-line}
.chart{width:100%;height:380px;margin:10px 0 6px}
.chart.tall{height:440px}
.takeaway{border-left:4px solid var(--teal);background:var(--teal-soft);padding:12px 16px;border-radius:0 10px 10px 0;font-weight:600;margin:14px 0 10px;white-space:pre-line}
.taxflag{border:2px solid #FFA91F;border-left-width:6px;background:rgba(255,169,31,.12);border-radius:12px;padding:14px 18px;margin:18px 0 4px}
.taxflag b{display:block;font-size:17px;font-weight:800;color:var(--ink);margin-bottom:2px}
.taxflag span{display:block;color:var(--ink2);font-size:14px;white-space:pre-line}
.note{font-size:12.5px;color:var(--mut);white-space:pre-line;max-width:900px}
.src{font-size:11.5px;color:var(--mut);margin:6px 0 0;line-height:1.5}
.src b{font-weight:700;color:var(--ink2)}
.tbl-wrap{overflow-x:auto;margin:6px 0 4px}
table.ret{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.ret th,table.ret td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.ret th:first-child,table.ret td:first-child{text-align:left;white-space:normal}
table.ret thead th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--ink)}
table.ret tr.pp td{font-weight:800;color:var(--ink);background:var(--teal-soft)}
table.ret tr.pp td:first-child{border-left:4px solid var(--teal)}
table.ret tr.blank td{color:var(--mut);font-weight:600}
table.ret td.tocome{text-align:left;color:var(--mut);font-weight:600;font-style:italic}
table.ret .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:baseline}
.footnotes{margin:44px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.footnotes p{font-size:12.5px;color:var(--ink2);white-space:pre-line}
.footnotes p.lev{font-weight:600;color:var(--ink)}
.legal{margin:36px 0 0;padding:20px 22px;background:var(--soft);border-radius:12px}
.legal h2{font-size:17px}
.legal h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.legal p{font-size:12.5px;color:var(--ink2);white-space:pre-line}
footer.doc-foot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin:36px 0 0;padding:16px 0 8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}
footer.doc-foot img{height:36px;width:auto;display:block;flex:none;margin-left:auto}
.print-logo{display:none}
.preview-pill{position:fixed;top:10px;right:10px;z-index:5;font:700 11px 'Montserrat',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:#FFA91F;color:var(--ink);box-shadow:0 2px 8px rgba(23,27,36,.18)}
.preview-pill.saved{background:var(--teal);color:#fff}

@media (max-width:760px){
  .doc{padding:24px 16px 16px}
  h1.title{font-size:25px}
  .subtitle{font-size:15px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile b{font-size:22px}
  .chart{height:340px}
  .chart.tall{height:420px}
  table.ret{font-size:12.5px}
  table.ret th,table.ret td{padding:8px 6px}
  table.ret thead th{font-size:10.5px;letter-spacing:.03em}
}
@media print{
  @page{size:A4;margin:14mm 12mm 22mm}
  body{font-size:12px}
  .doc{max-width:none;padding:0}
  .preview-pill{display:none}
  footer.doc-foot img{display:none}
  .print-logo{display:block;position:fixed;right:0;bottom:-14mm;height:32px}
  section.block{break-inside:avoid}
}
</style>
</head>
<body>
<div class="state" id="stLoading"><p>Loading…</p></div>
<div class="state" id="stUpdating" hidden>
  <h1>This page is being updated</h1>
  <p>Please check back shortly, or contact your Performance Property advisor.</p>
  <img src="../assets/Reports/logo-color-black.png" alt="Performance Property">
</div>
<div class="preview-pill" id="pvPill" hidden>Draft preview</div>

<main class="doc" id="doc" hidden>
  <header>
    <div class="eyebrow" id="tEyebrow"></div>
    <h1 class="title" id="tTitle"></h1>
    <p class="subtitle" id="tSubtitle"></p>
    <p class="meta" id="tMeta"></p>
  </header>
  <div class="tiles" id="tiles"></div>
  <div class="taxflag" id="taxFlag" role="note" hidden><b id="taxFlagTitle"></b><span id="taxFlagBody"></span></div>

  <section class="block" id="sDeposit">
    <h2 id="hDeposit"></h2>
    <p class="lead" id="tDepositLine"></p>
    <p class="note" id="tWindowLine"></p>
    <div class="chart" id="chDeposit" role="img"></div>
    <div class="tbl-wrap"><table class="ret" id="tblDeposit"></table></div>
    <p class="takeaway" id="kDeposit"></p>
    <p class="src" id="srcDeposit"></p>
  </section>

  <section class="block" id="sYears">
    <h2 id="hYears"></h2>
    <div class="chart tall" id="chYears" role="img"></div>
    <p class="takeaway" id="kYears"></p>
    <p class="note" id="nYears"></p>
    <p class="src" id="srcYears"></p>
  </section>

  <section class="block" id="sPeriods">
    <h2 id="hPeriods"></h2>
    <p class="lead" id="tPeriodsLead"></p>
    <div class="tbl-wrap"><table class="ret" id="tblPeriods"></table></div>
    <p class="note" id="nPeriods"></p>
    <p class="src" id="srcPeriods"></p>
  </section>

  <section class="block" id="sSelection">
    <h2 id="hSelection"></h2>
    <div class="chart" id="chSelection" role="img"></div>
    <p class="takeaway" id="kSelection"></p>
    <p class="src" id="srcSelection"></p>
  </section>

  <section class="block" id="sRisk">
    <h2 id="hRisk"></h2>
    <div class="chart tall" id="chRisk" role="img"></div>
    <p class="takeaway" id="kRisk"></p>
    <p class="note" id="nRisk"></p>
    <p class="src" id="srcRisk"></p>
  </section>

  <div class="footnotes">
    <p class="lev" id="fLeverage"></p>
    <p id="fMethod"></p>
  </div>

  <section class="legal" id="sLegal">
    <h2 id="hLegal"></h2>
    <h3 id="hDisclaimer"></h3>
    <p id="lDisclaimer"></p>
    <h3 id="hRiskWarning"></h3>
    <p id="lRiskWarning"></p>
  </section>

  <footer class="doc-foot">
    <span id="tFooter"></span>
    <img src="../assets/Reports/logo-color-black.png" alt="Performance Property">
  </footer>
  <img class="print-logo" src="../assets/Reports/logo-color-black.png" alt="">
</main>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="../shared/supabase-client.js?v=afefc0c4"></script>
<script src="adelaide-returns-math.js"></script>
<script>
'use strict';
(function () {
  const KEY = 'adelaide-returns-2026';
  const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
  const M = window.ADLMath;
  const $ = id => document.getElementById(id);
  const TEAL = '#00A0B4', INK = '#171B24', INK2 = '#3a4150', MUT = '#63666A', LINE = '#D9D9D6';
  /* brand colours for the alternatives, in benchmark order (Dark Teal, then the accents) */
  const PALETTE = ['#171B24', '#54A6DE', '#63666A', '#3E7967', '#FFA91F', '#233AE7', '#71B357', '#C445C4', '#E72347'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const isNum = v => typeof v === 'number' && isFinite(v);
  const LEVERAGE_FALLBACK = 'The Performance Property figure is the return on the client\'s own cash ({depositPct} of the purchase price); a loan covered the other {loanPct} of the price, and borrowing magnifies both gains and losses. The alternatives are shown unleveraged.';

  /* ── AU formatting ───────────────────────────────────────────────────── */
  const DASH = '—';
  const money = v => isNum(v) ? (v < 0 ? '−$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-AU') : DASH;
  const pct = (v, dp) => isNum(v) ? (v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(dp == null ? 1 : dp) + '%' : DASH;
  const pa = v => isNum(v) ? pct(v) + ' p.a.' : DASH;
  const num = v => isNum(v) ? (+v.toFixed(2)).toLocaleString('en-AU') : DASH;
  /* decimal year (month grid) → "Dec 2018": the month the instant falls in;
     an exact month boundary k/12 is the END of month k */
  function monthLabel(t) {
    if (!isNum(t)) return DASH;
    let y = Math.floor(t + 1e-9), m = Math.ceil((t - y) * 12 - 1e-9) - 1;
    if (m < 0) { y -= 1; m = 11; }
    return MON[m] + ' ' + y;
  }
  function dateLabel(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    return m ? (+m[3]) + ' ' + MON[+m[2] - 1] + ' ' + m[1] : DASH;
  }

  /* ── {tokens} in every text block ─────────────────────────────────────
     {deposit} {price} {depositPct} {loanPct} {ppIrr} {ppCagr} {ppEnd} {ppTotal}
     {hold} {properties} {startLabel} {endLabel} {ytdEndLabel} {purchasePeriod}
     {asAt} · per benchmark: {pa:key} {total:key} {end:key} {growth:key} */
  function tokensFor(p, R) {
    const pp = p.pp || {}, w = R.window;
    const byKey = {};
    (p.benchmarks || []).forEach(b => {
      const t = M.annualise(b, p, R.deposit) || {};
      const g = M.annualise(b, p, null, true) || {};
      byKey[b.key] = { pa: pa(t.pa), total: pct(t.total), end: money(t.end), growth: pa(g.pa) };
    });
    return {
      byKey,
      tok: {
        deposit: money(R.deposit), price: money(pp.medianPurchasePrice),
        depositPct: pct(pp.depositPct), loanPct: pct(isNum(pp.lvr) ? pp.lvr : 0.9),
        ppIrr: pa(pp.medianIrr), ppCagr: pa(pp.medianCagr),
        ppEnd: money(R.pp && R.pp.end), ppTotal: pct(R.pp && R.pp.total),
        hold: num(pp.medianHoldYears), properties: isNum(pp.properties) ? String(pp.properties) : DASH,
        startLabel: monthLabel(w && w.start), endLabel: monthLabel(w && w.end),
        ytdEndLabel: dateLabel(p.window && p.window.ytdEnd),
        purchasePeriod: pp.purchasePeriodLabel || DASH, asAt: pp.asAtLabel || DASH,
        periodEndLabel: (fy => fy.length ? '31 December ' + fy[fy.length - 1] : DASH)((p.years || []).filter(k => /^\d{4}$/.test(k)).sort()),
      },
    };
  }
  function fill(s, T) {
    return String(s == null ? '' : s).replace(/\{(\w+)(?::([\w-]+))?\}/g, (m, k, arg) => {
      if (arg) { const b = T.byKey[arg]; return b && k in b ? b[k] : m; }
      return k in T.tok ? T.tok[k] : m;
    });
  }
  function setText(id, s, T) {
    const el = $(id), v = fill(s, T).trim();
    el.textContent = v;
    el.hidden = !v;
  }

  /* ── charts ──────────────────────────────────────────────────────────── */
  const charts = [];
  function chart(id, option) {
    if (!window.echarts) { $(id).hidden = true; return; }
    const el = $(id);
    el.hidden = false;
    const c = echarts.getInstanceByDom(el) || echarts.init(el, null, { renderer: 'svg' });
    if (!charts.includes(c)) charts.push(c);
    option.animation = !PREVIEW;
    option.textStyle = Object.assign({ fontFamily: 'Montserrat, Arial, sans-serif', color: INK }, option.textStyle || {});
    c.setOption(option, true);
  }
  window.addEventListener('resize', () => charts.forEach(c => c.resize()));
  window.addEventListener('beforeprint', () => charts.forEach(c => c.resize()));
  const narrow = () => window.innerWidth < 760;
  const moneyAxis = v => '$' + (Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'm' : Math.round(v / 1e3) + 'k');

  function depositChart(R, p, ordered) {
    const items = [];
    if (R.pp) items.push({ name: p.pp.label, value: R.pp.end, color: TEAL });
    ordered.forEach(r => { if (isNum(r.end)) items.push({ name: r.label, value: r.end, color: r.color }); });
    chart('chDeposit', {
      grid: { left: 8, right: narrow() ? 74 : 96, top: 8, bottom: 26, containLabel: true },
      tooltip: { trigger: 'item', formatter: q => q.name + '<br><b>' + money(q.value) + '</b>' },
      xAxis: { type: 'value', axisLabel: { color: MUT, fontSize: 11, formatter: moneyAxis }, splitLine: { lineStyle: { color: LINE } } },
      yAxis: { type: 'category', inverse: true, data: items.map(i => i.name), axisTick: { show: false }, axisLine: { lineStyle: { color: LINE } },
        axisLabel: { color: INK, fontSize: narrow() ? 10.5 : 12, fontWeight: 600, width: narrow() ? 110 : 230, overflow: 'break', lineHeight: 14 } },
      series: [{ type: 'bar', barMaxWidth: 26,
        data: items.map(i => ({ value: i.value, name: i.name, itemStyle: { color: i.color, borderRadius: [0, 4, 4, 0] } })),
        label: { show: true, position: 'right', color: INK, fontSize: narrow() ? 10.5 : 12, fontWeight: 700, formatter: q => money(q.value) },
        markLine: isNum(R.deposit) ? { symbol: 'none', silent: true, lineStyle: { color: MUT, type: 'dashed' },
          label: { formatter: 'Deposit ' + money(R.deposit), color: MUT, fontSize: 10.5, position: 'insideEndTop' },
          data: [{ xAxis: R.deposit }] } : undefined }],
    });
    $('chDeposit').setAttribute('aria-label', 'End value of the deposit: ' + items.map(i => i.name + ' ' + money(i.value)).join('; '));
  }

  function yearsChart(R, p, ordered) {
    const w = R.window;
    if (!w || !isNum(R.deposit)) { $('chYears').hidden = true; return; }
    const series = [];
    if (R.pp) {
      const pts = [], n = Math.max(2, Math.round(w.years * 12));
      for (let i = 0; i <= n; i++) { const t = w.start + w.years * i / n; pts.push([t, R.deposit * Math.pow(1 + p.pp.medianIrr, t - w.start)]); }
      series.push({ name: p.pp.label, type: 'line', smooth: true, showSymbol: false, data: pts, lineStyle: { width: 4, color: TEAL }, itemStyle: { color: TEAL }, z: 5 });
    }
    ordered.forEach(r => {
      if (!r.path.length) return;
      series.push({ name: r.label, type: 'line', showSymbol: true, symbolSize: 5, data: r.path.map(([t, f]) => [t, R.deposit * f]),
        lineStyle: { width: 2, color: r.color }, itemStyle: { color: r.color } });
    });
    chart('chYears', {
      legend: { top: 0, left: 0, type: 'plain', icon: 'roundRect', itemWidth: 14, itemHeight: 4, textStyle: { fontSize: narrow() ? 10 : 11.5, color: INK } },
      grid: { left: 8, right: 16, top: narrow() ? 110 : 64, bottom: 24, containLabel: true },
      tooltip: { trigger: 'axis', valueFormatter: money,
        axisPointer: { label: { formatter: q => monthLabel(q.value) } } },
      xAxis: { type: 'value', min: Math.floor(w.start), max: Math.ceil(w.end), interval: 1, axisLine: { lineStyle: { color: LINE } }, splitLine: { show: false },
        axisLabel: { color: MUT, fontSize: 11, formatter: v => Math.abs(v - Math.round(v)) < 1e-6 ? String(Math.round(v)) : '' } },
      yAxis: { type: 'value', scale: true, axisLabel: { color: MUT, fontSize: 11, formatter: moneyAxis }, splitLine: { lineStyle: { color: LINE } } },
      series,
    });
  }

  function selectionChart(R, p) {
    const items = [];
    if (isNum(p.pp.medianCagr)) items.push({ name: (p.selection && p.selection.ppLabel) || p.pp.label, value: p.pp.medianCagr, color: TEAL });
    R.selection.forEach((s, i) => { if (isNum(s.pa)) items.push({ name: s.label, value: s.pa, color: i === 0 ? INK : MUT }); });
    chart('chSelection', {
      grid: { left: 8, right: 8, top: 30, bottom: 8, containLabel: true },
      tooltip: { trigger: 'item', formatter: q => q.name + '<br><b>' + pa(q.value) + '</b>' },
      xAxis: { type: 'category', data: items.map(i => i.name), axisTick: { show: false }, axisLine: { lineStyle: { color: LINE } },
        axisLabel: { color: INK, fontSize: narrow() ? 10.5 : 12, fontWeight: 600, interval: 0, width: narrow() ? 100 : 220, overflow: 'break', lineHeight: 14 } },
      yAxis: { type: 'value', min: 0, axisLabel: { color: MUT, fontSize: 11, formatter: v => pct(v, 0) }, splitLine: { lineStyle: { color: LINE } } },
      series: [{ type: 'bar', barMaxWidth: 72,
        data: items.map(i => ({ value: i.value, name: i.name, itemStyle: { color: i.color, borderRadius: [4, 4, 0, 0] } })),
        label: { show: true, position: 'top', color: INK, fontSize: narrow() ? 12 : 14, fontWeight: 800, formatter: q => pa(q.value) } }],
    });
    $('chSelection').setAttribute('aria-label', items.map(i => i.name + ' ' + pa(i.value)).join('; '));
  }

  function riskChart(p) {
    const rk = p.risk || {};
    const rows = (rk.rows || []).filter(r => isNum(r.risk) && isNum(r.reward));
    const ppOn = isNum(p.pp.medianIrr) && isNum(rk.ppRisk);
    const all = rows.map(r => r.reward).concat(ppOn ? [p.pp.medianIrr] : []);
    const yMax = Math.max(0.25, Math.ceil((Math.max.apply(null, all.concat([0])) + 0.005) / 0.05) * 0.05);
    const xMax = Math.max(35, Math.ceil((Math.max.apply(null, rows.map(r => r.risk).concat([rk.ppRisk || 0])) + 1) / 5) * 5);
    const fs = narrow() ? 9 : 11;
    const series = [{
      type: 'scatter', symbolSize: narrow() ? 7 : 9, itemStyle: { color: MUT },
      data: rows.map(r => ({ name: r.label, value: [r.risk, r.reward], label: r.risk > xMax * 0.6 ? { position: 'left' } : undefined })),
      label: { show: true, position: 'right', formatter: q => q.name, fontSize: fs, color: INK2 },
      labelLayout: { hideOverlap: true },
    }];
    if (ppOn) series.push({
      type: 'scatter', symbol: 'circle', symbolSize: narrow() ? 16 : 20, z: 10,
      itemStyle: { color: TEAL, borderColor: '#fff', borderWidth: 2, shadowBlur: 6, shadowColor: 'rgba(0,160,180,.45)' },
      data: [{ name: rk.ppLabel || p.pp.label, value: [rk.ppRisk, p.pp.medianIrr] }],
      label: { show: true, position: narrow() ? 'top' : 'left', distance: 10, formatter: q => q.name, fontSize: narrow() ? 10.5 : 12.5, fontWeight: 800, color: TEAL,
        backgroundColor: 'rgba(255,255,255,.9)', padding: [2, 4], width: narrow() ? 150 : 260, overflow: 'break' },
    });
    chart('chRisk', {
      grid: { left: narrow() ? 30 : 40, right: narrow() ? 20 : 40, top: 24, bottom: 34, containLabel: true },
      tooltip: { trigger: 'item', formatter: q => q.name + '<br>Risk score ' + q.value[0] + ' · return ' + pa(q.value[1]) },
      xAxis: { type: 'value', name: rk.xLabel || 'Risk score', nameLocation: 'middle', nameGap: 26, min: 0, max: xMax,
        nameTextStyle: { color: MUT, fontSize: 11, fontWeight: 600 }, axisLabel: { color: MUT, fontSize: 11 },
        axisLine: { lineStyle: { color: LINE } }, splitLine: { lineStyle: { color: LINE, opacity: .6 } } },
      yAxis: { type: 'value', name: rk.yLabel || '20-year average return p.a.', nameLocation: 'middle', nameGap: narrow() ? 36 : 44, min: 0, max: yMax,
        nameTextStyle: { color: MUT, fontSize: 11, fontWeight: 600 }, axisLabel: { color: MUT, fontSize: 11, formatter: v => pct(v, 0) },
        splitLine: { lineStyle: { color: LINE, opacity: .6 } } },
      series,
    });
  }

  /* ── standard periods: annual return over the last 1/3/5/10 full calendar
     years; a period with any blank year shows "—", never an estimate ───── */
  function periodPa(get, p, n) {
    const ys = (p.years || []).filter(k => /^\d{4}$/.test(k)).sort(), last = ys[ys.length - 1];
    if (!last) return null;
    let f = 1;
    for (let y = +last - n + 1; y <= +last; y++) {
      const r = get(String(y));
      if (!isNum(r)) return null;
      f *= 1 + r;
    }
    return Math.pow(f, 1 / n) - 1;
  }
  function periodsTable(p, R, T) {
    const NS = [1, 3, 5, 10];
    const ppYears = (p.ppYears && p.ppYears.returns) || {};
    const ppHas = Object.keys(ppYears).some(k => isNum(ppYears[k]));
    const colorOf = {}; R.rows.forEach(r => { colorOf[r.key] = r.color; });
    const yearOf = b => k => { const per = M.periodOf(k, p.window.ytdEnd); return per ? M.periodReturn(b, k, per[1] - per[0]) : null; };
    let h = '<thead><tr><th>' + esc(fill((p.text.table && p.text.table.asset) || 'Investment', T)) + '</th>' + NS.map(n => '<th>' + n + (n === 1 ? ' year' : ' years') + '</th>').join('') + '</tr></thead><tbody>';
    h += '<tr class="pp"><td>' + esc(p.pp.label) + '</td>' + (ppHas
      ? NS.map(n => '<td>' + pct(periodPa(k => ppYears[k], p, n)) + '</td>').join('')
      : '<td class="tocome" colspan="' + NS.length + '">' + esc(fill(p.text.ppRowToCome || 'Figures to come', T)) + '</td>') + '</tr>';
    (p.benchmarks || []).forEach(b => {
      const get = yearOf(b);
      h += '<tr><td><span class="sw" style="background:' + (colorOf[b.key] || MUT) + '"></span>' + esc(b.label) + '</td>' +
        NS.map(n => '<td>' + pct(periodPa(get, p, n)) + '</td>').join('') + '</tr>';
    });
    $('tblPeriods').innerHTML = h + '</tbody>';
  }

  /* ── render ──────────────────────────────────────────────────────────── */
  function valid(p) { return p && typeof p === 'object' && p.pp && Array.isArray(p.benchmarks) && p.text && p.window; }

  function render(p) {
    const R = M.compute(p);
    const T = tokensFor(p, R);
    const tx = p.text || {}, h = tx.headings || {}, k = tx.takeaways || {}, n = tx.notes || {}, f = tx.footnotes || {}, tl = tx.tiles || {}, pp = p.pp;
    R.rows.forEach((r, i) => { r.color = PALETTE[i % PALETTE.length]; });
    const ordered = R.rows.slice().sort((a, b) => (isNum(b.end) ? b.end : -Infinity) - (isNum(a.end) ? a.end : -Infinity));

    document.title = fill(tx.title, T) + ' — Performance Property';
    setText('tEyebrow', tx.eyebrow, T);
    setText('tTitle', tx.title, T);
    setText('tSubtitle', tx.subtitle, T);
    setText('tMeta', tx.meta, T);

    const tiles = [
      [tl.irr, pa(pp.medianIrr)], [tl.cagr, pa(pp.medianCagr)],
      [tl.hold, isNum(pp.medianHoldYears) ? num(pp.medianHoldYears) + ' years' : DASH],
      [tl.properties, isNum(pp.properties) ? String(pp.properties) : DASH],
    ];
    $('tiles').innerHTML = '';
    tiles.forEach(([label, value]) => {
      const d = document.createElement('div');
      d.className = 'tile' + (value === DASH ? ' blank' : '');
      const b = document.createElement('b'); b.textContent = value;
      const s = document.createElement('span'); s.textContent = fill(label, T);
      d.append(b, s); $('tiles').append(d);
    });

    const bt = tx.beforeTax || {};
    setText('taxFlagTitle', bt.title, T); setText('taxFlagBody', bt.body, T);
    $('taxFlag').hidden = !bt.title;

    /* 2 · the deposit */
    setText('hDeposit', h.deposit, T);
    setText('tDepositLine', tx.depositLine, T);
    setText('tWindowLine', tx.windowLine, T);
    depositChart(R, p, ordered);
    const th = tx.table || {};
    const head = '<thead><tr><th>' + esc(fill(th.asset || 'Investment', T)) + '</th><th>' + esc(fill(th.pa || '% p.a.', T)) + '</th><th>' + esc(fill(th.total || 'Total', T)) + '</th><th>' + esc(fill(th.end || 'End value', T)) + '</th></tr></thead>';
    const ppRow = '<tr class="pp' + (R.pp ? '' : ' blank') + '"><td>' + esc(pp.label) + '</td><td>' + pct(R.pp && R.pp.pa) + '</td><td>' + pct(R.pp && R.pp.total) + '</td><td>' + money(R.pp && R.pp.end) + '</td></tr>';
    const body = ordered.map(r => '<tr><td><span class="sw" style="background:' + r.color + '"></span>' + esc(r.label) + (r.short ? ' *' : '') +
      '</td><td>' + pct(r.pa) + '</td><td>' + pct(r.total) + '</td><td>' + money(r.end) + '</td></tr>').join('');
    $('tblDeposit').innerHTML = head + '<tbody>' + ppRow + body + '</tbody>';
    setText('kDeposit', k.deposit, T);
    const shortRows = ordered.filter(r => r.short);
    const srcList = ordered.map(r => r.label + ' — ' + (r.source || DASH)).join('; ');
    const shortNote = shortRows.length ? ' * Data covers ' + shortRows.map(r => r.label + ' ' + num(r.covered) + ' of ' + num(R.window && R.window.years) + ' years').join(', ') + '.' : '';
    $('srcDeposit').innerHTML = '<b>' + esc(fill(tx.sourcesLabel || 'Sources', T)) + ':</b> ' + esc(fill(pp.source, T)) + (pp.source ? '; ' : '') + esc(srcList) + '.' + esc(shortNote);

    /* 3 · year by year */
    setText('hYears', h.yearByYear, T);
    yearsChart(R, p, ordered);
    setText('kYears', k.yearByYear, T);
    setText('nYears', n.yearByYear, T);
    $('srcYears').innerHTML = '<b>' + esc(fill(tx.sourcesLabel || 'Sources', T)) + ':</b> as above.';

    /* 3b · standard periods */
    setText('hPeriods', h.periods || 'Standard periods', T);
    setText('tPeriodsLead', tx.periodsLead, T);
    periodsTable(p, R, T);
    setText('nPeriods', n.periods, T);
    $('srcPeriods').innerHTML = '<b>' + esc(fill(tx.sourcesLabel || 'Sources', T)) + ':</b> as above' +
      ((p.ppYears && p.ppYears.source) ? '; ' + esc(fill(p.ppYears.source, T)) : '') + '.';

    /* 4 · selection */
    setText('hSelection', h.selection, T);
    selectionChart(R, p);
    setText('kSelection', k.selection, T);
    $('srcSelection').innerHTML = '<b>' + esc(fill(tx.sourcesLabel || 'Sources', T)) + ':</b> ' + esc(fill(pp.source, T)) + (pp.source ? '; ' : '') +
      esc(R.selection.map(s => s.label + ' — ' + (s.source || DASH) + ' (growth only, no rent)').join('; ')) + '.';

    /* 5 · risk v return */
    setText('hRisk', h.risk, T);
    riskChart(p);
    setText('kRisk', k.risk, T);
    setText('nRisk', n.risk, T);
    $('srcRisk').innerHTML = '<b>' + esc(fill(tx.sourcesLabel || 'Sources', T)) + ':</b> ' + esc(fill((p.risk && p.risk.source) || '', T));

    /* 6 · footnotes · 7 · legal */
    /* the leverage footnote keeps the comparison honest: a blanked one falls
       back to this wording (text only — the figures still come from the payload) */
    setText('fLeverage', String(f.leverage || '').trim() ? f.leverage : LEVERAGE_FALLBACK, T);
    setText('fMethod', f.method, T);
    setText('hLegal', h.legal, T);
    setText('hDisclaimer', h.disclaimer, T);
    setText('lDisclaimer', p.legal && p.legal.disclaimer, T);
    setText('hRiskWarning', h.riskWarning, T);
    setText('lRiskWarning', p.legal && p.legal.riskWarning, T);
    setText('tFooter', tx.footer, T);

    $('stLoading').hidden = true; $('stUpdating').hidden = true; $('doc').hidden = false;
    charts.forEach(c => c.resize());
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function updating() { $('stLoading').hidden = true; $('doc').hidden = true; $('stUpdating').hidden = false; }

  /* ── boot ────────────────────────────────────────────────────────────── */
  if (PREVIEW) {
    window.addEventListener('message', e => {
      if (e.origin !== location.origin || !e.data || e.data.type !== 'adl-preview') return;
      const pill = $('pvPill');
      pill.hidden = false;
      pill.textContent = e.data.status || 'Draft preview';
      pill.classList.toggle('saved', !!e.data.saved);
      if (valid(e.data.payload)) { try { render(e.data.payload); } catch (err) { console.error(err); updating(); } } else updating();
    });
    if (window.parent !== window) window.parent.postMessage({ type: 'adl-ready' }, location.origin);
    return;
  }
  (async function () {
    try {
      let g = 0; while (!window.sb && g++ < 50) await new Promise(r => setTimeout(r, 100));
      if (!window.sb) return updating();
      const { data, error } = await window.sb.from('client_pages').select('payload, updated_at').eq('key', KEY).maybeSingle();
      if (error || !data || !valid(data.payload)) return updating();
      render(data.payload);
    } catch (e) { console.error(e); updating(); }
  })();
})();
</script>
</body>
</html>
