# =============================================================================
# Data Forge — 2/ PUBLISH (rebuild mart)
#
# STEP 2 of 2. Rebuilds the report mart from whatever is currently in Forge and
# pushes it to every tool that reads Forge. Steps, in load-bearing order:
#   • publish-readiness-gate   — INPUT gate: stores exist/sane, no error statuses (FAILS the run)
#   • sync-cotality-medians    -> rdp_raw_series    (current-year mp_h/mp_u from the Cotality drop)
#   • sync-arrears             -> rdp_raw_series    (S&P SPIN drop → the arrears series ALL reports read)
#   • build-ranking            -> rdp_raw_series    (derived: median-price rank H/U → Traffic Lights Value)
#   • build-report-feed        -> rdp_report_feed   (Online Reports; preserves payload.extras)
#   • build-national-report    -> national report feed
#   • enrich-marts             -> payload.extras    (must FOLLOW the two feed builds)
#   • rebuild-vr-forecast      -> rdp_vr_forecast   (VR Projection + Demand Score's Adjusted VR)
#   • sync-rolling-cash        -> rdp_runway_config (forecast cash := rolling 216M cash average)
#   • build-runway             -> rdp_runway        (Runway Workbook)
#   • build-commercial-from-rdp-> forge_commercial  (Commercial report — API tabs; FAILS on >25% divergence)
#   • refresh-snapshots        -> report_data_cache (Presentation snapshot)
#   • post-publish-verify      — OUTPUT gate: marts absorbed the stores, parity holds (FAILS the run)
#
# Run this AFTER "Data Forge — 1/ GATHER" and after you've checked the data in
# Data Forge. Nothing here fetches external data — it only reshapes what is
# already in Forge, so it's safe to re-run (idempotent; a red run = fix + re-dispatch).
# Success/failure is recorded to forge_data_status (data_key 'pipeline_publish')
# so the Data Forge UI can show pipeline health without opening GitHub.
#
# MANUAL only (workflow_dispatch) while Forge is being verified.
#
# Secrets (already configured for the other workflows):
#   SUPABASE_URL                project URL
#   SUPABASE_SERVICE_ROLE_KEY   server-side write to rdp_* + forge_*
# =============================================================================
name: Data Forge — 2/ PUBLISH (rebuild mart)

on:
  workflow_dispatch:        # manual run from the Actions tab

concurrency:
  group: forge-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}   # sync-rolling-cash emails Pre DD + Jonathan when the rate assumption moves (Saskia 2026-08-10)
      PUPPETEER_SKIP_DOWNLOAD: 'true'            # no Chromium needed — skip the slow download
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Rebuild report mart + refresh snapshots
        run: |
          set -e
          echo "::group::readiness-gate";        node scripts/publish-readiness-gate.mjs;        echo "::endgroup::"   # INPUT gate — abort before any write if a store is missing/corrupt or an ingest errored
          echo "::group::sync-cotality-medians"; node scripts/sync-cotality-medians-to-rdp.mjs --write; echo "::endgroup::"   # wire the FULL monthly Cotality drop into the current-year annual rows (medians, sales, DOM, stock-on-market, vacancy rate, rents) so build-report-feed picks them up
          echo "::group::sync-arrears";          node scripts/sync-arrears-to-rdp.mjs   --write; echo "::endgroup::"   # wire the S&P SPIN drop (forge_arrears, percent) into rdp arrears (fraction, capital slugs) so enrich-marts serves fresh arrears to ALL reports
          echo "::group::build-ranking";         node scripts/build-ranking.mjs         --write; echo "::endgroup::"   # derived: rank every region by median price (H/U) from forge_monthly_price → rdp_raw_series ranking_h/ranking_u (feeds the Traffic Lights Value indicator)
          echo "::group::sync-gccsa-population";  node scripts/sync-gccsa-to-population-capitals.mjs --write; echo "::endgroup::"   # capitals' `population` = GCCSA (regionals stay SUA). MUST run BEFORE build-report-feed + rebuild-vr-forecast so they pick it up, and EVERY publish — the monthly GATHER re-writes SUA from ABS. NOTE: no --stash (that was one-time on the 2026-07-30 first run; re-stashing would capture the already-GCCSA value)
          echo "::group::build-report-feed";     node scripts/build-report-feed.mjs     --write; echo "::endgroup::"
          echo "::group::build-national-report"; node scripts/build-national-report.mjs --write; echo "::endgroup::"
          echo "::group::enrich-marts";          node scripts/enrich-marts.mjs          --write; echo "::endgroup::"
          echo "::group::rebuild-vr-forecast";   node scripts/rebuild-vr-forecast-from-forge.mjs --write; echo "::endgroup::"   # recompute rdp_vr_forecast from fresh Forge inputs (VR Projection tool + Demand Score's Adjusted VR)
          echo "::group::sync-rolling-cash";     node scripts/sync-rolling-cash-to-runway-config.mjs --write; echo "::endgroup::"   # forecast cash rate := rolling 216M cash average (the IC's method since Mar 2026) → rdp_runway_config; MUST precede build-runway, which bakes the rate into payloads
          echo "::group::build-runway";          node scripts/build-runway.mjs          --write; echo "::endgroup::"   # recompute rdp_runway from the mart (Runway Workbook tool)
          echo "::group::build-commercial";      node scripts/build-commercial-from-rdp.mjs --write; echo "::endgroup::"   # refresh forge_commercial's API tabs (retail/corp-bond/approvals/population) from rdp_raw_series; manual/subscription tabs untouched
          echo "::group::refresh-snapshots";     node scripts/refresh-snapshots-from-forge.mjs --write; echo "::endgroup::"   # repoint report_data_cache (presentation snapshot) at Forge
          echo "::group::post-publish-verify";   node scripts/post-publish-verify.mjs;           echo "::endgroup::"   # OUTPUT gate — red run if any mart failed to absorb its store (idempotent: fix + re-dispatch)

      # Record the outcome to forge_data_status so the Data Forge UI shows
      # pipeline health without anyone opening the Actions tab. Uses the same
      # service-role secret (server-side only) — no new secrets or permissions.
      - name: Record publish outcome in Data Forge
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "$OUTCOME" = "success" ]; then STATUS=ok; MSG="PUBLISH succeeded $NOW"; LASTOK=",\"last_ok_at\":\"$NOW\""; else STATUS=error; MSG="PUBLISH FAILED $NOW — open the Actions log, fix the cause, re-dispatch (idempotent)"; LASTOK=""; fi
          curl -sf -X POST "$SUPABASE_URL/rest/v1/forge_data_status?on_conflict=data_key" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates" \
            -d "[{\"data_key\":\"pipeline_publish\",\"label\":\"PUBLISH pipeline\",\"source\":\"forge-publish.yml\",\"status\":\"$STATUS\",\"message\":\"$MSG\",\"last_run_at\":\"$NOW\"$LASTOK,\"updated_at\":\"$NOW\"}]" || echo "::warning::could not record publish outcome"
