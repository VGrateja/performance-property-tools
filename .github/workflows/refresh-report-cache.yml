# =============================================================================
# ⚠ DEPRECATED / EMERGENCY FALLBACK ONLY — Apps-Script-sourced snapshot refresh.
#
# Since the Forge cutover the report_data_cache snapshots are written FROM
# FORGE: by scripts/refresh-snapshots-from-forge.mjs in the PUBLISH workflow
# (forge-publish.yml) and by the reports' "Save data" buttons. Running THIS
# workflow overwrites those Forge-built snapshots with Google Apps Script
# data. Keep it only for an emergency where Forge is broken and the reports
# must be repointed at the old feeds — hence the typed OVERWRITE confirmation.
#
# Legacy behaviour: refreshes report_data_cache (migration 040) from the six
# Apps Script feeds (four regional clusters + national + commercial).
#
# Required GitHub Secrets (already present for the PDF renderer):
#   SUPABASE_URL                https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   server-side write to report_data_cache
# =============================================================================

name: '[DEPRECATED] Refresh report data cache (Apps Script)'

on:
  # Auto monthly data-cache refresh DISABLED (deprecated — the PUBLISH workflow
  # refreshes snapshots from Forge). Manual runs require typing OVERWRITE.
  # schedule:
  #   - cron: '30 3 13 * *'   # 03:30 UTC on the 13th of every month
  workflow_dispatch:         # manual trigger from the Actions tab
    inputs:
      confirm:
        description: 'type OVERWRITE to confirm you want Apps-Script data to overwrite the Forge snapshots'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: refresh-report-cache
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15      # six feeds, sequential, generous headroom for cold starts

    steps:
      # Deprecation gate — this workflow overwrites the Forge-built snapshots
      # with Apps Script data, so refuse to run without the typed confirmation.
      - name: Require typed OVERWRITE confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}   # via env, not inline interpolation — the raw input must never be spliced into the script
        run: |
          if [ "$CONFIRM" != "OVERWRITE" ]; then
            echo "::error::This workflow is DEPRECATED — snapshots are refreshed from Forge by forge-publish.yml."
            echo "::error::To force an Apps Script overwrite anyway, re-run with confirm=OVERWRITE."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22+ — supabase-js v2 wants a native WebSocket at createClient().
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh report snapshots
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run refresh-report-cache
