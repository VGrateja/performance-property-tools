# =============================================================================
# Data Forge — 1/ GATHER (API ingests)
#
# STEP 1 of 2. Refreshes every CI-reachable API-sourced Data Forge data point
# (ABS / RBA / IMF·FRED, plus SQM rents + vacancy for the Demand Score Dashboard)
# into the isolated research DB (rdp_raw_series + the forge_* stores). It does
# NOT rebuild the report mart — review the data in Data Forge, then run the
# "Data Forge — 2/ PUBLISH (rebuild mart)" workflow to push it to the tools.
#
# Manual-only points (Cotality, Mortgage Arrears, the Industry REMPLAN uploads,
# and the REA listings in the Demand Score card) are NOT here — they need a file
# drop / manual entry.
#
# Job Creation (JSA) is also NOT here: jobsandskills.gov.au hard-blocks the
# GitHub runner IPs (connection refused, not a UA filter — a browser UA + retry
# both failed), so it's run locally each month from a non-blocked machine:
#   node scripts/ingest-jsa-jobcreation.mjs --write
#
# SCHEDULE: auto on the 10th of each month (1:00 AM Sydney), plus manual.
#     0 15 9 * *  =  15:00 UTC on the 9th  =  1:00 AM AEST on the 10th
#   (GitHub cron is UTC and ignores DST; during AEDT Oct–Apr it lands ~2:00 AM.)
#   Gathers only — review in Data Forge, then run 2/ PUBLISH to push to the tools.
#
# Secrets (already configured for the other workflows):
#   SUPABASE_URL                project URL
#   SUPABASE_SERVICE_ROLE_KEY   server-side write to rdp_* + forge_*
#
# Resilience: each ingest runs independently — one failure doesn't stop the
# others (and each records status='error' to forge_data_status, which the Data
# Forge UI flags red). The job fails at the end if any ingest errored so the run
# shows red in the Actions tab.
# =============================================================================
name: Data Forge — 1/ GATHER (API ingests)

on:
  # GATHER runs automatically on the 10th to pull fresh data into Forge. It does
  # NOT rebuild the mart — the separate 2/ PUBLISH workflow (manual) does that
  # once you've reviewed the data in Data Forge. Can also be run manually.
  schedule:
    - cron: '0 15 9 * *'   # 1:00 AM (AEST) on the 10th — see header note
  workflow_dispatch:        # manual run from the Actions tab any time

concurrency:
  group: forge-ingests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUPPETEER_SKIP_DOWNLOAD: 'true'            # ingests don't need Chromium — skip the slow download
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run API ingests (--write)
        id: ingests
        run: |
          set +e
          fails=""
          for s in \
            ingest-abs-population.mjs \
            ingest-abs-income.mjs \
            ingest-abs-popcomponents.mjs \
            ingest-abs-lending.mjs \
            ingest-abs-business-finance.mjs \
            ingest-abs-fhb.mjs \
            ingest-abs-jobvacancies.mjs \
            ingest-abs-inflation.mjs \
            ingest-abs-cpi.mjs \
            ingest-rba-rates.mjs \
            ingest-abs-business-investment.mjs \
            ingest-abs-retail.mjs \
            ingest-abs-approvals.mjs \
            ingest-abs-unemployment.mjs \
            ingest-abs-mineral-exploration.mjs \
            ingest-fred-iron-ore.mjs \
            ingest-oecd-consumer-confidence.mjs \
            ingest-cav-rental-bonds.mjs \
            ingest-abs-pop-pyramid.mjs \
            ingest-abs-commercial.mjs \
            ingest-rba-commercial.mjs \
            ingest-national-only.mjs \
            ingest-abs-act-industry.mjs \
            ingest-sqm-rents.mjs \
            ingest-sqm-vacancy.mjs ; do
            echo "::group::$s"
            node "scripts/$s" --write
            if [ $? -ne 0 ]; then echo "::warning::$s exited non-zero"; fails="$fails $s"; fi
            echo "::endgroup::"
          done
          echo "fails=$fails" >> "$GITHUB_OUTPUT"

      # Record the GATHER outcome to forge_data_status (data_key 'pipeline_gather')
      # so the Data Forge UI can show "GATHER ran this month" / "GATHER failed"
      # without anyone opening the Actions tab, and the watchdog can detect a
      # missed month. Same service-role secret — no new secrets or permissions.
      - name: Record gather outcome in Data Forge
        if: always()
        env:
          FAILS: ${{ steps.ingests.outputs.fails }}
          INGESTS_OUTCOME: ${{ steps.ingests.outcome }}
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # ok requires the ingests step to have actually RUN and succeeded — a
          # checkout/npm failure or cancellation leaves FAILS empty too, and
          # recording ok then would fake a green month (the silent-gap class
          # this heartbeat exists to catch).
          if [ "$INGESTS_OUTCOME" = "success" ] && [ -z "$FAILS" ]; then STATUS=ok; MSG="GATHER succeeded $NOW (all ingests ok)"; LASTOK=",\"last_ok_at\":\"$NOW\""; else STATUS=error; MSG="GATHER $NOW — ingests outcome: ${INGESTS_OUTCOME:-skipped}; failed:$FAILS"; LASTOK=""; fi
          curl -sf -X POST "$SUPABASE_URL/rest/v1/forge_data_status?on_conflict=data_key" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates" \
            -d "[{\"data_key\":\"pipeline_gather\",\"label\":\"GATHER pipeline\",\"source\":\"forge-ingests.yml\",\"status\":\"$STATUS\",\"message\":\"$MSG\",\"last_run_at\":\"$NOW\"$LASTOK,\"updated_at\":\"$NOW\"}]" || echo "::warning::could not record gather outcome"

      - name: Fail the run if any ingest errored
        if: steps.ingests.outputs.fails != ''
        run: |
          echo "These ingests failed (see their groups above + the red flags in Data Forge):${{ steps.ingests.outputs.fails }}"
          exit 1
