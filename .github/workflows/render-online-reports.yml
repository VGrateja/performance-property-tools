# =============================================================================
# Monthly Online Reports PDF renderer.
#
# Triggers:
#   • Auto — after every successful Data Forge PUBLISH run (workflow_run);
#            publish is Van-verified by definition, so PDFs always capture
#            published data. (The old blind 12th-of-month cron stays disabled.)
#   • Manual — workflow_dispatch lets you kick a run from the Actions
#            tab any time (e.g. after a mid-month data correction).
#
# Required GitHub Secrets:
#   SUPABASE_URL                  https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY     for storage writes (bucket: online-reports)
#   SUPABASE_ANON_KEY             for the renderer's signInWithPassword call
#   PDF_RENDERER_EMAIL            pdf-renderer@performanceproperty.com.au
#   PDF_RENDERER_PASSWORD         password for the service account
#   APP_URL                       https://app.url (no trailing slash) —
#                                 host serving tools/online-reports.html
# =============================================================================

name: Render Online Reports PDFs

on:
  # Auto-renders after every SUCCESSFUL "Data Forge — 2/ PUBLISH" run (Van
  # 2026-08-11): publish only ever happens after the data is verified, so the
  # fresh PDFs always capture published data. The BLIND monthly cron stays
  # disabled (the original request) — a fixed date could render unverified data.
  # schedule:
  #   - cron: '0 3 12 * *'   # 03:00 UTC on the 12th of every month
  workflow_run:
    workflows: ["Data Forge — 2/ PUBLISH (rebuild mart)"]
    types: [completed]
  workflow_dispatch:        # manual trigger from the Actions tab

# Permissions: nothing outside the repo. The renderer only writes to
# Supabase Storage via the service-role key.
permissions:
  contents: read

# Limit concurrency to one run at a time. If a manual trigger fires
# while the scheduled run is still in progress, the new one queues
# (or supersedes — see cancel-in-progress) instead of racing the cache.
concurrency:
  group: render-online-reports
  cancel-in-progress: false

jobs:
  render:
    name: Render & upload
    # workflow_run fires on FAILED publishes too — only render when the
    # publish concluded green (manual dispatch always runs).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60    # 72 PDFs × ~10s + boot/setup. Generous headroom.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22+ — supabase-js v2 wants a native WebSocket at
          # createClient() time, which Node 20 doesn't have. Cheapest
          # fix is the runtime bump; the alternative was wiring `ws`
          # through as a custom transport.
          node-version: '22'

      # `npm install` (not `npm ci`) — we don't commit package-lock.json
      # because the renderer's only consumer is this workflow. If we ever
      # want repeatable builds we can `npm install` locally once, commit
      # the lockfile, then switch back to `npm ci` for speed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Puppeteer ships a Chromium binary by default — no separate install
      # needed. If GitHub's runner image already has Chromium cached the
      # download is fast (~30s); otherwise ~1 minute on a cold cache.

      - name: Render & upload PDFs
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          PDF_RENDERER_EMAIL:        ${{ secrets.PDF_RENDERER_EMAIL }}
          PDF_RENDERER_PASSWORD:     ${{ secrets.PDF_RENDERER_PASSWORD }}
          APP_URL:                   ${{ secrets.APP_URL }}
        run: npm run render-reports

      # -----------------------------------------------------------------------
      # Proactive failure alert (#4). render-reports.mjs exits non-zero if ANY
      # report fails OR on a total crash, so this fires for every failure mode
      # (and for an earlier-step failure like checkout/npm install too).
      #
      # Emails the maintainer via Resend — the same provider + verified sender
      # the notify-cadence function uses, so no new vendor. Best-effort: a
      # missing RESEND_API_KEY or a Resend hiccup logs a warning and never
      # masks the real failure. GitHub's own "scheduled workflow failed" email
      # to the repo owner remains the backstop.
      #
      # One-time setup (repo Settings → Secrets and variables → Actions):
      #   RESEND_API_KEY      same value already set on the notify-cadence fn
      #   RENDER_ALERT_EMAIL  (optional) recipient; defaults to vandolf@…
      # -----------------------------------------------------------------------
      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO:       ${{ secrets.RENDER_ALERT_EMAIL }}
          RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY not set as a repo secret — failure email skipped. Add it under Settings → Secrets and variables → Actions (same value as the notify-cadence function) to enable inbox alerts."
            exit 0
          fi
          TO="${ALERT_TO:-vandolf@performanceproperty.com.au}"
          HTML="<p style=\"font-family:Arial,sans-serif;font-size:14px;color:#0f172a\">The monthly <strong>Online Reports PDF render</strong> failed.</p><p style=\"font-family:Arial,sans-serif;font-size:13px;color:#475569\">Cached PDFs were not refreshed for this month — the tools fall back to live html2canvas rendering, so reports still download, but the \"Cached &lt;date&gt;\" pill won't advance until this is fixed. Open the run to see which reports failed and why.</p><p><a href=\"$RUN_URL\" style=\"display:inline-block;background:#00b6cb;color:#0a1520;padding:11px 22px;border-radius:6px;text-decoration:none;font-weight:700;font-size:13px;font-family:Arial,sans-serif\">View the failed run →</a></p>"
          BODY=$(jq -n \
            --arg from "Performance Property Alerts <cadence@performanceproperty.com.au>" \
            --arg to "$TO" \
            --arg subject "⚠ Monthly Online Reports PDF render FAILED" \
            --arg html "$HTML" \
            '{from:$from, to:$to, subject:$subject, html:$html}')
          if curl -sS -X POST https://api.resend.com/emails \
               -H "Authorization: Bearer $RESEND_API_KEY" \
               -H "Content-Type: application/json" \
               -d "$BODY"; then
            echo "Failure alert emailed to $TO"
          else
            echo "::warning::Could not send the failure-alert email (Resend error) — see the run logs above."
          fi
