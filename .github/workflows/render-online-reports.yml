# =============================================================================
# Monthly Online Reports PDF renderer.
#
# Triggers:
#   • Cron — 12th of every month at 03:00 UTC (= 1pm Melbourne AEST,
#            2pm AEDT). Lands 2 days after the CoreLogic 10th-of-month
#            data refresh so the rendered PDFs include the new month.
#   • Manual — workflow_dispatch lets you kick a run from the Actions
#            tab any time (e.g. after a mid-month data correction).
#
# Required GitHub Secrets:
#   SUPABASE_URL                  https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY     for storage writes (bucket: online-reports)
#   SUPABASE_ANON_KEY             for the renderer's signInWithPassword call
#   PDF_RENDERER_EMAIL            pdf-renderer@performanceproperty.com.au
#   PDF_RENDERER_PASSWORD         password for the service account
#   APP_URL                       https://app.url (no trailing slash) —
#                                 host serving tools/online-reports.html
# =============================================================================

name: Render Online Reports PDFs

on:
  schedule:
    - cron: '0 3 12 * *'   # 03:00 UTC on the 12th of every month
  workflow_dispatch:        # manual trigger from the Actions tab

# Permissions: nothing outside the repo. The renderer only writes to
# Supabase Storage via the service-role key.
permissions:
  contents: read

# Limit concurrency to one run at a time. If a manual trigger fires
# while the scheduled run is still in progress, the new one queues
# (or supersedes — see cancel-in-progress) instead of racing the cache.
concurrency:
  group: render-online-reports
  cancel-in-progress: false

jobs:
  render:
    name: Render & upload
    runs-on: ubuntu-latest
    timeout-minutes: 60    # 72 PDFs × ~10s + boot/setup. Generous headroom.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Puppeteer ships a Chromium binary by default — no separate install
      # needed. If GitHub's runner image already has Chromium cached the
      # download is fast (~30s); otherwise ~1 minute on a cold cache.

      - name: Render & upload PDFs
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
          PDF_RENDERER_EMAIL:        ${{ secrets.PDF_RENDERER_EMAIL }}
          PDF_RENDERER_PASSWORD:     ${{ secrets.PDF_RENDERER_PASSWORD }}
          APP_URL:                   ${{ secrets.APP_URL }}
        run: npm run render-reports
