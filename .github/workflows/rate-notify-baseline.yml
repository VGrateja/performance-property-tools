# =============================================================================
# Rolling cash rate — send the CURRENT assumption as a baseline/test email.
#
# Manual-dispatch only. Runs sync-rolling-cash-to-runway-config.mjs with
# --notify-current: no config change required or made — it just emails the
# current forecast cash / PP variable rate to the rate-change recipients
# (Pre DD + Jonathan + Van), or to the override list you type when
# dispatching (use your own address to test without emailing the team).
#
# The automatic change emails live in forge-publish.yml; this exists for
# testing and for announcing a baseline (Van 2026-08-11).
# =============================================================================
name: Rate Notify — baseline/test email

on:
  workflow_dispatch:
    inputs:
      recipients:
        description: 'Override recipients (comma-separated). Leave empty for the real list (Pre DD + Jonathan + Van).'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
      RATE_NOTIFY_TO:            ${{ inputs.recipients }}
      PUPPETEER_SKIP_DOWNLOAD: 'true'            # no Chromium needed — skip the slow download
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Send current-assumption email
        run: node scripts/sync-rolling-cash-to-runway-config.mjs --notify-current
