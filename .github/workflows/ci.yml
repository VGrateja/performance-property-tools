# =============================================================================
# CI sanity gate for the no-build static site.
#
# Runs scripts/check-static.mjs on every push + pull request:
#   • node --check on every shared/ + scripts/ .js/.mjs (syntax)
#   • broken local-ref scan across the HTML tools + shared CSS
#
# No dependencies — the checker uses Node built-ins only, so there's no
# `npm install` step (fast: just checkout + node + run). This is the gate
# that catches the stray-brace / renamed-asset class of bugs that would
# otherwise only surface live, since GitHub Pages has no build step.
# =============================================================================

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# One run per ref; a newer push supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run static checks
        run: node scripts/check-static.mjs
