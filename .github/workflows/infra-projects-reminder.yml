# =============================================================================
# Quarterly reminder — B/S Slides "Major Infrastructure Projects" page.
#
# The 4 region tables (Rockingham / Mandurah / Townsville / Darwin) are
# HARDCODED in tools/buying-selling-slides.html (INFRA_PROJECTS) and the
# source figures only update quarterly. This emails Van on the 1st of
# Feb / May / Aug / Nov to re-check and refresh them (Van 2026-08-11).
#
# Secrets: RESEND_API_KEY (already present for scorecard reminders).
# =============================================================================
name: Infra Projects Reminder (quarterly)

on:
  schedule:
    # 23:03 UTC on the 1st of Feb/May/Aug/Nov ≈ 9–10am AEST/AEDT on the 2nd —
    # close enough for a quarterly nudge; off the :00 mark on purpose.
    - cron: '3 23 1 2,5,8,11 *'
  workflow_dispatch: {}   # manual run for testing

permissions:
  contents: read

concurrency:
  group: infra-projects-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send quarterly refresh reminder
        run: node scripts/notify-infra-refresh.mjs
