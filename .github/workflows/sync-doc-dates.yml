# =============================================================================
# Documents — daily "last updated" date sync.
#
# Runs scripts/sync-doc-dates.mjs: for every Documents card linking to the
# GCS-backed docs.performanceproperty.com.au bucket (Whitepapers, Strategies,
# stray Research Links customs), reads the file's Last-Modified header and
# stamps the card's date when the file changed. Upload a new PDF to the bucket
# → the date on the Documents page corrects itself within a day (or run this
# manually right after uploading).
#
# Supabase-hosted cards are managed elsewhere: regionals + national/commercial
# by render-online-reports.yml; the Clock PDF by the Clock tool's Save.
#
# Secrets (already configured): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
# =============================================================================
name: Sync Documents dates

on:
  schedule:
    - cron: '0 18 * * *'   # daily 18:00 UTC = 4:00 AM AEST (5:00 AM AEDT)
  workflow_dispatch:        # manual run from the Actions tab (after an upload)

concurrency:
  group: sync-doc-dates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUPPETEER_SKIP_DOWNLOAD: 'true'            # no Chromium needed — skip the slow download
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Sync dates from bucket Last-Modified
        run: node scripts/sync-doc-dates.mjs --write
