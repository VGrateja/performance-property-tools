[build]
  publish   = "."
  functions = "netlify/functions"

# Several write tokens appear inline in client HTML/JS by design — they're
# the Bearer tokens the page sends to the corresponding Netlify Function on
# save. The functions are the actual security boundary (they hold the
# JSONBin master key server-side); the inline tokens are just an internal-
# tool barrier. Tell Netlify's secrets scanner to ignore all of them.
#   CLOCK_WRITE_SECRET        → tools/property-clock.html
#   REPORTS_WRITE_SECRET      → tools/online-reports.html
#   USERS_ADMIN_SECRET        → shared/auth.js (Tier-3 admin approve/reject)
#   PRESENTATION_WRITE_SECRET → tools/presentation.html
#   DOCUMENTS_WRITE_SECRET    → tools/whitepapers-strategies.html
# The JSONBin master key never appears in any file and remains scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "CLOCK_WRITE_SECRET,REPORTS_WRITE_SECRET,USERS_ADMIN_SECRET,PRESENTATION_WRITE_SECRET,DOCUMENTS_WRITE_SECRET"
