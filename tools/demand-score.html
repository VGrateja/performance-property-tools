/* ============================================================================
   COMPARE vs PREVIOUS SNAPSHOT
   A manager-approval gate: current (live) Demand Score + Runway vs the last
   stored snapshot (forge_demand_snapshots), with the diff, before the numbers
   are pushed to Runway v Demand. Mirrors the workbook's "Prev - Cur" tab.
   ============================================================================ */
async function loadSnapshots() {
  try {
    for (let i = 0; i < 40 && !window.sb; i++) await new Promise(r => setTimeout(r, 100));
    if (!window.sb) return;
    // ALL captured monthly snapshots, newest first. Exclude the 'rvd-*' Runway-v-Demand
    // push mirrors — they're a different payload shape and not part of the month history.
    const { data } = await window.sb.from("forge_demand_snapshots").select("version,label,data").not("version", "like", "rvd-%").order("version", { ascending: false });
    state.snapshots = data || [];
    if (state.view === "compare") render();
  } catch (e) { /* table may not exist yet */ }
}

// per-market snapshot shape (what a capture freezes + what the compare reads back)
const _snapMap = arr => { const o = {}; (arr || []).forEach(m => { const s = _fSlug(m.name); if (s) o[s] = { ds: m.demandScore, rw: m.runway, pop: m.population, listings: m.listings, avr: m.adjustedVR, rg: m.rentalGrowth36m, median: m.medianPrice }; }); return o; };
const _MONS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const _monthVer = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const _monthLabel = d => _MONS[d.getMonth()] + " " + d.getFullYear();
const _labelToVer = s => { const m = String(s).toLowerCase().match(/([a-z]{3,})\.?\s+(\d{4})/); if (m) { const mi = _MONS.findIndex(x => x.toLowerCase() === m[1].slice(0, 3)); if (mi >= 0) return m[2] + "-" + String(mi + 1).padStart(2, "0"); } const m2 = String(s).match(/(\d{4})-(\d{2})/); return m2 ? m2[1] + "-" + m2[2] : null; };

/* Custom hover tooltip — native title="" doesn't render reliably under the
   fit-screen CSS `zoom` on <html>, so we draw our own. Positions in CSS px by
   dividing the (zoomed) client coords by the documentElement zoom factor. */
let _dsTip = null;
function _dsTipEl() {
  if (!_dsTip) {
    _dsTip = document.createElement("div");
    _dsTip.style.cssText = "position:fixed;z-index:99999;max-width:340px;padding:10px 13px;border-radius:9px;background:#0f172a;color:#e6edf7;font:600 12px/1.55 system-ui,-apple-system,sans-serif;white-space:pre-line;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid rgba(148,163,184,.28);pointer-events:none;display:none";
    document.body.appendChild(_dsTip);
  }
  return _dsTip;
}
const _dsZoom = () => parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
function _showTip(text, e) { const t = _dsTipEl(); t.textContent = text; t.style.display = "block"; _moveTip(e); }
function _moveTip(e) {
  const t = _dsTip; if (!t || t.style.display === "none") return;
  const z = _dsZoom(), cx = e.clientX / z, cy = e.clientY / z, vw = window.innerWidth / z, vh = window.innerHeight / z;
  let x = cx + 16, y = cy + 16;
  if (x + t.offsetWidth > vw - 8) x = cx - t.offsetWidth - 16;
  if (y + t.offsetHeight > vh - 8) y = cy - t.offsetHeight - 16;
  t.style.left = Math.max(4, x) + "px"; t.style.top = Math.max(4, y) + "px";
}
function _hideTip() { if (_dsTip) _dsTip.style.display = "none"; }

const _cmpDS = v => (v == null || isNaN(v)) ? "—" : Math.round(+v).toString();          // DS: no decimals
const _cmpRW = v => (v == null || isNaN(v)) ? "—" : (+v * 100).toFixed(2) + "%";         // Runway: 2 decimals
function _cmpDelta(cur, prev, kind) {
  if (cur == null || prev == null || isNaN(cur) || isNaN(prev)) return { txt: "—", col: "var(--ds-fg-faint)" };
  // Subtract the DISPLAYED values, not the raw ones, so the delta always reconciles
  // with the two cells on screen — e.g. DS 13 and 4 read as +9, never +8.
  let d, txt;
  if (kind === "rw") {                    // Runway diff → whole-number %, matching the sheet's rounded difference
    const raw = +(((+cur) - (+prev)) * 100).toFixed(4);
    d = (raw < 0 ? -Math.round(-raw) : Math.round(raw)) || 0;   // integer %, Excel-style half-away, no -0
    txt = (d > 0 ? "+" : "") + d + "%";
  } else {                                // DS cells show whole numbers, so delta = their integer difference
    d = Math.round(+cur) - Math.round(+prev);
    txt = (d > 0 ? "+" : "") + d;
  }
  return { txt, col: d === 0 ? "var(--ds-fg-faint)" : (d > 0 ? "#4D7F39" : "#CA1637") };
}

/* ── Display re-rate: show every month's runway on the CURRENT PP Variable Rate
   (Current 216M Ave = 4.91%), matching Runway v Demand. runway = (ceiling−median)/
   median and the ceiling scales with the rate via a 30-yr annuity factor that is
   independent of price/income, so re-rating a stored month is exact:
       rw_new = (1 + rw_old) × AF(target) / AF(rate_that_month) − 1   (cap 130%)
   Demand score, median, listings etc. are untouched, and the stored snapshot
   RECORDS are never modified — this only changes what the compare view displays.
   Live/current data is already built at 4.91%, so only stored snapshots re-rate. */
const DS_REC_RATE = {
  '2025-01':0.0545,'2025-02':0.0545,'2025-03':0.0545,'2025-04':0.0545,'2025-05':0.0535,'2025-06':0.0555,
  '2025-07':0.0555,'2025-08':0.0540,'2025-09':0.0540,'2025-10':0.0540,'2025-11':0.0560,'2025-12':0.0560,
  '2026-01':0.0560,'2026-02':0.0603,'2026-03':0.0494,'2026-04':0.0494,'2026-05':0.0494,'2026-06':0.0494,'2026-07':0.0491
};
const DS_RATE_TARGET = 0.0491;   // Current 216M Ave / PP Variable Rate — the display basis
function _dsAF(r){ r=+r; if(!(r>0)) return null; const m=r/12; return (1-Math.pow(1+m,-360))/m; }
function _dsReRate(map, version){   // rw is a DECIMAL here (from _snapMap: m.runway); cap 1.3 = 130%
  if(!map) return map;
  const rOld = DS_REC_RATE[String(version||'').slice(0,7)], afT = _dsAF(DS_RATE_TARGET);
  if(!rOld || afT==null) return map;
  const afO = _dsAF(rOld); if(!afO) return map;
  const f = afT/afO;
  if(f===1) return map;
  const out = {};
  for(const slug in map){ const r=map[slug];
    out[slug] = (r && r.rw!=null) ? Object.assign({}, r, { rw: Math.min(1.3, (1+(+r.rw))*f - 1) }) : r; }
  return out;
}
function compareView(tab) {
  const snaps = state.snapshots || [];
  const canWrite = (typeof isAdmin === "function" && isAdmin());
  const key = tab === "Houses" ? "houses" : "units";
  const now = new Date();
  const wrap = h("div", {});

  // slug → {name, state} from the live markets (always loaded) so stored snapshots render with names
  const nameBySlug = {};
  (state.houseData || []).concat(state.unitData || []).forEach(m => { const s = _fSlug(m.name); if (s && !nameBySlug[s]) nameBySlug[s] = { name: m.name, st: m.state }; });

  // month options: a "Live" (uncaptured current) entry on top, then every captured month
  const LIVE = "live";
  const options = [{ v: LIVE, label: "Live — " + _monthLabel(now) + " (uncaptured)" }]
    .concat(snaps.map(s => ({ v: s.version, label: s.label || s.version })));
  let sel = state.compareMonth;
  if (!options.some(o => o.v === sel)) sel = LIVE;

  // resolve current + previous data maps for the selected month
  let curMap, prevMap, curLabel, prevLabel;
  if (sel === LIVE) {
    curMap = _snapMap(tab === "Houses" ? state.houseData : state.unitData);   // live = already at the current PP Variable Rate
    curLabel = "Live (" + _monthLabel(now) + ")";
    const pv = snaps[0];
    prevMap = _dsReRate((pv && pv.data && pv.data[key]) || {}, pv && pv.version);
    prevLabel = pv ? (pv.label || pv.version) : "—";
  } else {
    const i = snaps.findIndex(s => s.version === sel), cur = snaps[i], pv = snaps[i + 1];
    curMap = _dsReRate((cur && cur.data && cur.data[key]) || {}, cur && cur.version);
    curLabel = cur ? (cur.label || cur.version) : sel;
    prevMap = _dsReRate((pv && pv.data && pv.data[key]) || {}, pv && pv.version);
    prevLabel = pv ? (pv.label || pv.version) : "— (earliest month)";
  }

  const picker = h("select", { style: { padding: "7px 12px", borderRadius: "7px", border: "1px solid var(--ds-surface-4)", background: "var(--ds-surface-2)", color: "var(--ds-fg-1)", fontSize: "12px", fontWeight: "700", cursor: "pointer" }, onChange: e => { state.compareMonth = e.target.value; render(); } },
    ...options.map(o => h("option", { value: o.v, style: { background: "var(--ds-surface-2)", color: "var(--ds-fg-1)" } }, o.label)));
  picker.value = sel;

  wrap.appendChild(h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: "10px", marginBottom: "12px" } },
    h("div", {},
      h("div", { style: { fontSize: "14px", fontWeight: "800", color: "var(--ds-fg-1)" } }, curLabel + " vs " + prevLabel + " — " + tab),
      h("div", { style: { fontSize: "11px", color: "var(--ds-fg-muted)", marginTop: "3px", maxWidth: "640px", lineHeight: "1.5" } },
        "Δ = current − previous; sorted by biggest Demand-Score move. Pick a month to compare it against the month before it.")),
    h("div", { style: { display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap" } },
      h("label", { style: { fontSize: "11px", fontWeight: "700", color: "var(--ds-fg-muted)" } }, "Month"),
      picker,
      canWrite ? h("button", { style: { padding: "7px 14px", borderRadius: "7px", border: "1px solid var(--ds-selection)", background: "var(--ds-indigo-lav)", color: "var(--ds-indigo-ink)", fontSize: "12px", fontWeight: "700", cursor: "pointer", whiteSpace: "nowrap" }, onClick: captureMonth }, "Capture " + _monthLabel(now)) : null)
  ));

  if (!Object.keys(curMap).length) return (wrap.appendChild(h("div", { style: { padding: "40px 20px", textAlign: "center", color: "var(--ds-fg-muted)", fontSize: "13px", lineHeight: "1.6" } },
    sel === LIVE ? "No live data loaded yet." : "No data stored for this month.", h("br"),
    canWrite ? "Click “Capture " + _monthLabel(now) + "” to freeze the current live numbers as this month." : "")), wrap);

  const _arrow = (pv, cv, fmt) => ((pv == null || isNaN(pv)) ? "—" : fmt(+pv)) + "  →  " + ((cv == null || isNaN(cv)) ? "—" : fmt(+cv));
  const _int0 = v => Math.round(v).toLocaleString();
  const rows = Object.keys(curMap).map(slug => {
    const c = curMap[slug] || {}, p = prevMap[slug] || {};
    const nm = nameBySlug[slug] || { name: slug, st: "" };
    const dsTitle = "What changed (prev → now):\n"
      + "Population: " + _arrow(p.pop, c.pop, _int0) + "\n"
      + "Listings: " + _arrow(p.listings, c.listings, _int0) + "\n"
      + "Adjusted VR: " + _arrow(p.avr, c.avr, v => v.toFixed(2)) + "\n"
      + "Rental Growth: " + _arrow(p.rg, c.rg, v => v.toFixed(2) + "%");
    const rwTitle = "What changed (prev → now):\n"
      + "Median " + (tab === "Houses" ? "house" : "unit") + " price: " + _arrow(p.median, c.median, fmtPrice);
    return { name: nm.name, st: nm.st, dsCur: (c.ds == null ? null : +c.ds), dsPrev: (p.ds == null ? null : +p.ds), rwCur: (c.rw == null ? null : +c.rw), rwPrev: (p.rw == null ? null : +p.rw), dsTitle, rwTitle };
  });
  const chg = r => (r.dsCur == null || r.dsPrev == null) ? -1 : Math.abs(r.dsCur - r.dsPrev);
  rows.sort((a, b) => chg(b) - chg(a));

  const GL = "1px solid var(--ds-surface-4)";        // grid line
  const DIV = "3px solid var(--ds-fg-faint)";         // bold DS↔RW group divider
  const th = (t, al, opts) => {
    opts = opts || {};
    const s = { padding: "13px 14px", textAlign: al || "left", fontSize: "14px", fontWeight: "800", color: "var(--ds-fg-1)", background: "var(--ds-surface-3)", position: "sticky", top: "0", zIndex: "2", borderBottom: "2px solid var(--ds-fg-faint)", borderRight: GL, whiteSpace: "nowrap" };
    if (opts.left) { s.left = "0"; s.zIndex = "3"; }
    if (opts.group) s.borderLeft = DIV;
    return h("th", { style: s }, t);
  };
  const td = (c, al, extra, tip, opts) => {
    opts = opts || {};
    const s = Object.assign({ padding: "11px 14px", textAlign: al || "left", borderBottom: GL, borderRight: GL, fontVariantNumeric: "tabular-nums" }, extra || {});
    if (opts.left) { s.position = "sticky"; s.left = "0"; s.zIndex = "1"; s.background = opts.bg || "var(--ds-surface-1)"; }
    if (opts.group) s.borderLeft = DIV;
    const el = h("td", { style: s }, c);
    if (tip) { el.style.cursor = "help"; el.addEventListener("mouseenter", e => _showTip(tip, e)); el.addEventListener("mousemove", _moveTip); el.addEventListener("mouseleave", _hideTip); }
    return el;
  };
  const table = h("table", { style: { width: "100%", fontSize: "13.5px", borderCollapse: "separate", borderSpacing: "0" } });
  table.appendChild(h("thead", {}, h("tr", {},
    th("Market", "left", { left: true }), th("St"),
    th("Current RW", "right"), th("Prev RW", "right"), th("Difference", "right"),
    th("Current DS", "right", { group: true }), th("Prev DS", "right"), th("Difference", "right"))));
  const tb = h("tbody", {});
  rows.forEach((r, idx) => {
    const bg = idx % 2 === 0 ? "var(--ds-surface-1)" : "var(--ds-surface-2)";
    const dds = _cmpDelta(r.dsCur, r.dsPrev, "ds"), drw = _cmpDelta(r.rwCur, r.rwPrev, "rw");
    tb.appendChild(h("tr", {},
      td(r.name, "left", { fontWeight: "800", color: "var(--ds-fg-1)" }, null, { left: true, bg }),
      td(r.st, "left", { color: "var(--ds-fg-muted)", background: bg }),
      td(_cmpRW(r.rwCur), "right", { fontWeight: "700", background: bg }, r.rwTitle),
      td(_cmpRW(r.rwPrev), "right", { color: "var(--ds-fg-muted)", background: bg }, r.rwTitle),
      td(drw.txt, "right", { color: drw.col, fontWeight: "800", background: bg }, r.rwTitle),
      td(_cmpDS(r.dsCur), "right", { fontWeight: "700", background: bg }, r.dsTitle, { group: true }),
      td(_cmpDS(r.dsPrev), "right", { color: "var(--ds-fg-muted)", background: bg }, r.dsTitle),
      td(dds.txt, "right", { color: dds.col, fontWeight: "800", background: bg }, r.dsTitle)));
  });
  table.appendChild(tb);
  wrap.appendChild(h("div", { style: { maxHeight: "72vh", overflow: "auto", borderRadius: "12px", border: GL } }, table));
  return wrap;
}

async function captureMonth() {
  if (!(typeof isAdmin === "function" && isAdmin())) { alert("Only dev / admin can capture snapshots."); return; }
  const now = new Date();
  const label = (prompt("Freeze the current live numbers (latest Runway Workbook + VR Projection) as which month?\nThis becomes the newest month; the previous capture becomes its comparison baseline.", _monthLabel(now)) || "").trim();
  if (!label) return;
  const ver = _labelToVer(label) || _monthVer(now);
  // Re-pull live data so we snapshot the very latest RW Workbook + VR Projection marts.
  try { await loadData(); } catch (e) { /* fall back to the data already in state */ }
  const data = { houses: _snapMap(state.houseData), units: _snapMap(state.unitData) };
  let email = null; try { const p = await sbCurrentProfile(); email = p && p.email; } catch (e) {}
  const { error } = await window.sb.from("forge_demand_snapshots").upsert({ version: ver, label, data, captured_at: new Date().toISOString(), captured_by: email }, { onConflict: "version" });
  if (error) { alert("Save failed (writers only): " + error.message); return; }
  await loadSnapshots();
  state.compareMonth = ver;   // jump to the just-captured month (shown vs the prior capture)
  state.view = "compare";
  render();
  const prior = (state.snapshots.find(s => s.version < ver) || {});
  alert("Captured “" + label + "”. Now comparing it against " + (prior.label || prior.version || "— (no earlier month)") + ".");
}

/* ============================================================================
   PUSH TO RUNWAY V DEMAND
   Writes the current sheet snapshot to localStorage under a chosen month key.
   The Runway v Demand chart reads that same key on load and merges the month
   into its timeline.
   ============================================================================ */
const PUSH_STORAGE_KEY = "ppt-runway-pushed-data";
const PUSH_MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* Regions present in the Demand Dashboard sheet but NOT pushed to
   Runway v Demand. Match is by exact `name` (case-insensitive) against
   the cleaned market name. Add more entries here if other regions
   should be excluded from the Runway v Demand timeline. */
const PUSH_EXCLUDED_REGIONS = new Set([]);   // Mandurah now included in the push (June baseline added to Runway v Demand)
const isPushExcluded = (m) => m && typeof m.name === "string" &&
  PUSH_EXCLUDED_REGIONS.has(m.name.trim().toLowerCase());
const PUSH_BASELINE_MONTHS = new Set([
  "Jan 2025","Feb 2025","Mar 2025","Apr 2025","May 2025","Jun 2025","Jul 2025","Aug 2025",
  "Sep 2025","Oct 2025","Nov 2025","Dec 2025","Jan 2026","Feb 2026","Mar 2026","Apr 2026","May 2026"
]);
const PUSH_BASELINE_LAST = { y: 2026, m: 4 }; // May 2026

function readPushedData() {
  try { return JSON.parse(localStorage.getItem(PUSH_STORAGE_KEY) || "{}") || {}; }
  catch(e){ return {}; }
}
function writePushedData(obj) {
  localStorage.setItem(PUSH_STORAGE_KEY, JSON.stringify(obj));
}

const PUSH_MONTH_LONG = ["January","February","March","April","May","June",
                         "July","August","September","October","November","December"];

/* The month that a push represents is ALWAYS the current calendar month.
   This keeps "Runway v Demand"'s timeline in sync with real-world time so
   that pushing in April writes to "Apr 2026" and pushing in May writes to
   "May 2026", regardless of what's in the sheet. Admins can delete a month
   from the Runway v Demand side if a push happened prematurely. */
function getLivePushMonth(now) {
  const d = now || new Date();
  const m = d.getMonth(), y = d.getFullYear();
  return {
    m, y,
    name: PUSH_MONTH_NAMES[m],
    longName: PUSH_MONTH_LONG[m],
    label: PUSH_MONTH_NAMES[m] + " " + y,
    longLabel: PUSH_MONTH_LONG[m] + " " + y
  };
}

function formatLiveDateChip(now) {
  const d = now || new Date();
  const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const pad = n => n < 10 ? "0" + n : "" + n;
  return dayNames[d.getDay()] + " · " + pad(d.getDate()) + " " + PUSH_MONTH_NAMES[d.getMonth()] + " " + d.getFullYear();
}

function buildPushPayload() {
  const toRow = m => ({
    city: m.name,
    rw: Math.round((Number(m.runway) || 0) * 100 * 100) / 100,
    ds: Math.round(Number(m.demandScore) || 0)
  });
  // Snapshot the legend block so the Runway v Demand "Demand
  // Dashboard" mode can read its year + variable rate from the most
  // recent push instead of the hardcoded 5/4.94 defaults. Per-tab
  // shape mirrors the V2 (Live Sheet) format on the consumer side.
  const leg = state.legend || { house:{}, unit:{} };
  return {
    houses: (state.houseData || []).filter(m => !isPushExcluded(m)).map(toRow),
    units:  (state.unitData  || []).filter(m => !isPushExcluded(m)).map(toRow),
    legend: {
      house: { year: leg.house ? leg.house.year : null, rate: leg.house ? leg.house.rate : null },
      unit:  { year: leg.unit  ? leg.unit.year  : null, rate: leg.unit  ? leg.unit.rate  : null }
    },
    pushedAt: new Date().toISOString()
  };
}

/* ============================================================================
   FORGE ADAPTER — the SOLE data source. Computes every demand score from Forge
   via PP_DEMAND_ENGINE (the legacy Apps-Script feed was retired 2026-07-04).
     population   ← rdp_raw_series (metric=population)
     listings h/u ← forge_demand_inputs (Demand Score Dashboard Data card)
     adjusted VR  ← rdp_vr_forecast.forecastVR × 100  (same for house & unit)
     DOM h/u      ← forge_cotality (cap+lga rows, last col)
     36-mo growth ← forge_demand_inputs (rent − rent_3yr)/rent_3yr
     median+grw   ← forge_monthly_price (monthly h/u arrays)
     runway       ← rdp_runway.payload.house/unit.forecast_wg_pct (forecast rate + wage growth)
     weekly rent  ← forge_demand_inputs.rent_h/u
   Month-over-month deltas (prev*) are 0 — no computed-score snapshots in Forge yet.
   ============================================================================ */

function _fSlug(s){
  s = String(s == null ? '' : s).trim(); if (/^national$/i.test(s)) return 'australia';
  return s.replace(/\([^)]*\)/g, ' ').replace(/,\s*(act|nsw|nt|qld|sa|tas|vic|wa)\b/ig, ' ')
    .replace(/\bgreater\b/ig, ' ').replace(/\bregional\b/ig, ' ').replace(/-hastings/ig, ' ')
    .replace(/\s+/g, ' ').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}
const _fNum = v => { const n = +String(v == null ? '' : v).replace(/[$,%\s]/g, ''); return isFinite(n) ? n : null; };
function _mpStats(arr){
  const a = Array.isArray(arr) ? arr.filter(v => typeof v === 'number' && isFinite(v) && v > 0) : [];
  const n = a.length; if (!n) return { median: 0, g12: 0, g3: 0 };
  const latest = a[n - 1], v12 = n > 12 ? a[n - 13] : null, v3 = n > 3 ? a[n - 4] : null;
  return { median: Math.round(latest), g12: v12 ? Math.round((latest - v12) / v12 * 1000) / 10 : 0, g3: v3 ? Math.round((latest - v3) / v3 * 1000) / 10 : 0 };
}

async function loadForgeAll(){
  for (let i = 0; i < 50 && !window.sb; i++) await new Promise(r => setTimeout(r, 100));
  if (!window.sb) throw new Error('No database connection.');
  const [reg, di, vr, rw, mp, pop, cot, rc] = await Promise.all([
    window.sb.from('rdp_regions').select('slug,name,state,cluster'),
    window.sb.from('forge_demand_inputs').select('data').eq('id', 'latest').maybeSingle(),
    window.sb.from('rdp_vr_forecast').select('region_slug,payload'),
    window.sb.from('rdp_runway').select('region_slug,payload'),
    window.sb.from('forge_monthly_price').select('data').eq('id', 'latest').maybeSingle(),
    window.sb.from('rdp_raw_series').select('region_slug,period,value').eq('metric', 'population').gte('period', '2020-01-01'),
    window.sb.from('forge_cotality').select('data').eq('id', 'latest').maybeSingle(),
    window.sb.from('rdp_runway_config').select('key,value').in('key', ['rates', 'wage_growth']),
  ]);
  // Check EVERY read — a silent cot/mp/rc failure would zero DOM/medians/legend
  // and corrupt the computed scores without surfacing the error UI.
  const err = reg.error || di.error || vr.error || rw.error || pop.error || cot.error || mp.error || rc.error;
  if (err) throw new Error(err.message || 'Forge read failed');

  const M = { name: {}, state: {}, pop: {}, adjVR: {}, runway: {}, domH: {}, domU: {}, mp: {} };
  (reg.data || []).forEach(r => { M.name[r.slug] = r.name; M.state[r.slug] = r.state; });
  { const latest = {}; for (const r of (pop.data || [])) { const s = r.region_slug; if (!latest[s] || r.period > latest[s]) { latest[s] = r.period; M.pop[s] = +r.value; } } }
  (vr.data || []).forEach(r => { const f = r.payload && r.payload.forecastVR; if (f != null) M.adjVR[r.region_slug] = f * 100; });
  // Runway = the Runway Workbook's headline scenario: FORECAST rate + wage-grown income
  // (forecast_wg_pct), NOT the current-rate leg. Falls back to runway_pct if an old mart
  // row hasn't been rebuilt yet.
  (rw.data || []).forEach(r => { const p = r.payload || {}; M.runway[r.region_slug] = { h: p.house && (p.house.forecast_wg_pct ?? p.house.runway_pct), u: p.unit && (p.unit.forecast_wg_pct ?? p.unit.runway_pct) }; });
  const cotData = (cot.data && cot.data.data) || {};   // .select('data').maybeSingle() nests the jsonb at .data.data
  const cotRows = [...((cotData.cap || {}).rows || []), ...((cotData.lga || {}).rows || [])];
  for (const row of cotRows) { const slug = _fSlug(row[1]); const dom = _fNum(row[6]); if (!slug || dom == null) continue; if (String(row[2]).toUpperCase() === 'U') M.domU[slug] = dom; else M.domH[slug] = dom; }
  M.mp = ((mp.data && mp.data.data && mp.data.data.regions)) || {};
  const DI = ((di.data && di.data.data && di.data.data.regions)) || {};
  if (!Object.keys(DI).length) throw new Error('No Demand Score Dashboard Data in Forge yet.');

  // Wage-growth years + PP variable rate ← rdp_runway_config (Runway Workbook config).
  // Legend text is "Runway - <year> Year Wage Growth | PP Variable Rate: <rate>%".
  //   year = wage_growth.years ; rate = rates.forecast.rate (the FORECAST variable
  //   rate — the affordability assumption, 0.0494 → 4.94%, matches the sheet legend).
  // Same national assumption for house & unit (config is not split by type).
  const cfg = {}; (rc.data || []).forEach(r => { cfg[r.key] = r.value; });
  const wgY = (cfg.wage_growth && typeof cfg.wage_growth.years === 'number') ? cfg.wage_growth.years : null;
  const ppR = (cfg.rates && cfg.rates.forecast && typeof cfg.rates.forecast.rate === 'number') ? cfg.rates.forecast.rate : null;
  const legend = { house: { year: wgY, rate: ppR }, unit: { year: wgY, rate: ppR } };

  return { houses: buildForgeMarkets('houses', DI, M), units: buildForgeMarkets('units', DI, M), legend };
}

function buildForgeMarkets(propertyType, DI, M){
  const isU = propertyType === 'units';
  const rawRows = Object.keys(DI).map(slug => {
    const d = DI[slug] || {};
    const rentNow = isU ? d.rent_u : d.rent_h, rent3 = isU ? d.rent_u_3yr : d.rent_h_3yr;
    return {
      slug,
      name: M.name[slug] || (slug === 'australia' ? 'National' : slug),
      state: M.state[slug] || '',
      population: M.pop[slug] || 0,
      listings: (isU ? d.listings_u : d.listings_h) || 0,
      vr: M.adjVR[slug] != null ? M.adjVR[slug] : 0,               // adjusted VR (percent)
      dom: (isU ? M.domU[slug] : M.domH[slug]) || 0,
      rentGrowth: (rentNow != null && rent3 != null && rent3 > 0) ? (rentNow - rent3) / rent3 : 0,
      isNational: slug === 'australia',
    };
  });
  PP_DEMAND_ENGINE.compute(rawRows);   // National kept in the set for the benchmark median

  const markets = [];
  rawRows.forEach(r => {
    if (r.isNational) return;
    const d = DI[r.slug] || {};
    const st = _mpStats((M.mp[r.slug] || {})[isU ? 'u' : 'h']);
    const rw = M.runway[r.slug] || {};
    const rent = isU ? d.rent_u : d.rent_h;
    markets.push({
      name: r.name, state: r.state, population: r.population, listings: r.listings,
      listingsPer1k: r.listingsPer1k, adjustedVR: Math.round(r.vr * 100) / 100,
      supplyScore: r.supplyScore, dom: r.dom, rentalGrowth36m: Math.round(r.rentGrowth * 10000) / 100,
      rawDS: r.rawDS, demandScore: r.demandScore, scoreInversion: r.scoreInversion,
      runway: (isU ? rw.u : rw.h) != null ? Math.round((isU ? rw.u : rw.h) * 10000) / 10000 : 0,
      prevRW: 0, rwDiff: 0, prevDS: 0, dsDiff: 0,
      medianPrice: st.median, priceGrowth12m: st.g12, priceGrowth3m: st.g3,
      weeklyRent: rent != null ? Math.round(rent) : 0,
      marketType: classifyMarket(r.name, propertyType),
    });
  });
  markets.sort((a, b) => b.demandScore - a.demandScore);
  markets.forEach((m, i) => m.dsRank = i + 1);
  try { if (markets.length) localStorage.setItem('ppa-demand-markets', String(markets.length)); } catch (e) {}
  return markets;
}

async function loadData() {
  // Initial load (no data yet) goes through the loading=true path so
  // the dedicated full-screen loading shell renders. Subsequent
  // refreshes show a translucent overlay over the existing dashboard
  // instead of blanking it — the previous data stays visible until
  // the new payload arrives. The Refresh button still spins via its
  // own state.loading binding.
  const isInitial = !state.houseData && !state.unitData;
  if(isInitial){
    setState({ loading: true, error: null });
  } else {
    state.loading = true;
    state.error = null;
    showDashboardSyncOverlay();
    // Re-render once so the Refresh button's "Syncing" label + icon
    // spin reflect the new state without rebuilding the whole table.
    render();
  }
  try {
    // Demand scores are computed from Forge (PP_DEMAND_ENGINE, inputs from the DB).
    const fm = await loadForgeAll();
    const houseData = fm.houses, unitData = fm.units;
    const legend = fm.legend || { house: { year: null, rate: null }, unit: { year: null, rate: null } };
    setState({ houseData, unitData, legend, lastUpdated: new Date(), loading: false });
    // Refresh clock-sourced types and re-render once they land.
    syncTypesFromClock();
  } catch (err) {
    setState({ error: err.message || "Failed to fetch", loading: false });
  } finally {
    hideDashboardSyncOverlay();
  }
}

/* ============================================================================
   SYNC MARKET TYPES FROM PROPERTY CLOCK (Supabase)
   Property Clock is the source of truth for smooth/workforce classification.
   Runs after each loadData() so a change on the clock flows in within the
   5-minute auto-refresh cycle.
   ============================================================================ */
async function syncTypesFromClock() {
  try {
    if (!window.sb) return;
    const { data, error } = await window.sb
      .from('clock_state')
      .select('payload')
      .eq('id', 1)
      .single();
    if (error) return;
    const s = data && data.payload;
    if (!s) return;
    const houseMap = {}, unitMap = {};
    (Array.isArray(s.houses) ? s.houses : []).forEach(r => {
      if (r && r.name && r.type) houseMap[canonMarketName(r.name)] = r.type;
    });
    (Array.isArray(s.units) ? s.units : []).forEach(r => {
      if (r && r.name && r.type) unitMap[canonMarketName(r.name)] = r.type;
    });
    if (!Object.keys(houseMap).length && !Object.keys(unitMap).length) return;
    // Replace CLOCK_TYPE contents in-place (preserves references).
    Object.keys(CLOCK_TYPE.houses).forEach(k => delete CLOCK_TYPE.houses[k]);
    Object.keys(CLOCK_TYPE.units).forEach(k => delete CLOCK_TYPE.units[k]);
    Object.assign(CLOCK_TYPE.houses, houseMap);
    Object.assign(CLOCK_TYPE.units,  unitMap);
    // Reclassify already-loaded markets.
    let changed = false;
    if (state.houseData) state.houseData.forEach(m => {
      const t = classifyMarket(m.name, "houses");
      if (t !== m.marketType) { m.marketType = t; changed = true; }
    });
    if (state.unitData) state.unitData.forEach(m => {
      const t = classifyMarket(m.name, "units");
      if (t !== m.marketType) { m.marketType = t; changed = true; }
    });
    if (changed) render();
  } catch (e) {
    console.warn("Clock type sync failed:", e);
  }
}

/* ═══ Live-data loading overlay control ═══
   Overlay is visible by default in the HTML so it paints with the
   page. T0 captured at script-eval time so elapsed measurement
   starts close to when the user picked the tool. The first
   loadData() call hides it (via .finally so success + failure both
   route through). Auto-refresh loadData() calls every 5 min do NOT
   re-show it — the overlay is a first-load thing only. */
const LIVE_OVERLAY_MIN_MS = 3000;
const LIVE_OVERLAY_T0 = Date.now();
function hideLiveLoadingOverlay(){
  const ov = document.getElementById('live-loading-overlay');
  if (ov) ov.classList.add('hidden');
}
function scheduleOverlayHide(){
  const elapsed = Date.now() - LIVE_OVERLAY_T0;
  const remaining = Math.max(0, LIVE_OVERLAY_MIN_MS - elapsed);
  if (remaining === 0) hideLiveLoadingOverlay();
  else setTimeout(hideLiveLoadingOverlay, remaining);
}

/* Re-shows the loading overlay with a "Returning to Hub" message
   and navigates after the fade-in completes. Reuses the existing
   .live-loading-overlay element so the visual matches the inbound
   transition. */
function navigateToHub(){
  const ov = document.getElementById('live-loading-overlay');
  if (ov){
    const head = ov.querySelector('.live-loading-region');
    const sub  = ov.querySelector('.live-loading-sub');
    if (head) head.textContent = 'Returning to Hub';
    if (sub)  sub.textContent  = 'Loading hub';
    ov.classList.remove('hidden');
  }
  setTimeout(() => { location.href = '../'; }, 450);
}
function backToVault(){
  const ov = document.getElementById('live-loading-overlay');
  if (ov){
    const head = ov.querySelector('.live-loading-region');
    const sub  = ov.querySelector('.live-loading-sub');
    if (head) head.textContent = 'Returning to Vault';
    if (sub)  sub.textContent  = 'Loading hub';
    ov.classList.remove('hidden');
  }
  setTimeout(() => { location.href = '../#vault'; }, 450);
}

loadData().finally(scheduleOverlayHide);
loadSnapshots();   // fetch every captured monthly snapshot for the compare view + month picker

/* Defensive 30 s fallback — hides the overlay even if loadData
   never resolves (network entirely dead etc.). */
setTimeout(hideLiveLoadingOverlay, 30000);

// No auto-refresh — data only reloads when the user clicks Refresh
// or reloads the page. loadData() bypasses HTTP cache (cache:
// 'no-store') so the click always pulls the latest sheet state.

// Keep the live-date chip and Push button label in sync with real time —
// matters around midnight/month rollover so the button always reflects the
// month that a click will actually push to.
setInterval(() => {
  const txt = document.getElementById("ds-live-date-text");
  if (txt) txt.textContent = formatLiveDateChip();
  const lbl = document.getElementById("ds-push-btn-label");
  if (lbl) lbl.textContent = "Push " + getLivePushMonth().label;
}, 60 * 1000);

// Keyboard: Esc closes panels
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (state.showCompare) setState({ showCompare: false });
    else if (state.selected) setState({ selected: null });
  }
});
