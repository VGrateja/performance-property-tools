<style>
/* ============================================================================
   Demand Score — Design tokens
   ============================================================================ */
:root {
  /* Canvas & surface */
  --ds-canvas:        #020617;
  --ds-surface-1:     #0b1120;
  --ds-surface-2:     #0f172a;
  --ds-surface-3:     #1e293b;
  --ds-surface-4:     #334155;

  /* Foreground */
  --ds-fg-1:          #f8fafc;
  --ds-fg-2:          #f1f5f9;
  --ds-fg-3:          #e2e8f0;
  --ds-fg-muted:      #94a3b8;
  --ds-fg-dim:        #64748b;
  --ds-fg-faint:      #475569;
  --ds-fg-ghost:      #334155;

  /* Tabs */
  --ds-houses:        #318DD8;
  --ds-houses-2:      #76B3E5;
  --ds-houses-bg:     #1e3a5f;
  --ds-houses-tint:   #172554;
  --ds-houses-deep:   #144167;

  --ds-units:         #C445C4;
  --ds-units-2:       #DD92DD;
  --ds-units-bg:      #3b1f5e;
  --ds-units-tint:    #2e1065;
  --ds-units-deep:    #4E184E;

  /* Tiers */
  --ds-tier-strong:        #4D7F39;
  --ds-tier-strong-bg:     #ecfdf5;
  --ds-tier-strong-ring:   #a7f3d0;
  --ds-tier-buy:           #3E7967;
  --ds-tier-buy-bg:        #f0fdfa;
  --ds-tier-buy-ring:      #99f6e4;
  --ds-tier-hold:          #E08A00;
  --ds-tier-hold-bg:       #fffbeb;
  --ds-tier-hold-ring:     #fde68a;
  --ds-tier-watch:         #F59700;
  --ds-tier-watch-bg:      #fff7ed;
  --ds-tier-watch-ring:    #fed7aa;
  --ds-tier-avoid:         #CA1637;
  --ds-tier-avoid-bg:      #fef2f2;
  --ds-tier-avoid-ring:    #fecaca;

  /* Delta */
  --ds-delta-pos:     #71B357;
  --ds-delta-neg:     #E72347;
  --ds-delta-neutral: #64748b;

  /* Thresholds */
  --ds-ok:            #71B357;
  --ds-warn:          #FFC870;
  --ds-warn-2:        #FFA91F;
  --ds-danger:        #E72347;

  /* State */
  --ds-live:          #4D7F39;
  --ds-selection:     #7E8CF1;
  --ds-indigo-deep:   #1e1b4b;
  --ds-indigo-lav:    #c7d2fe;
  --ds-indigo-ink:    #312e81;

  /* Type */
  --ds-font-display:  'Montserrat', system-ui, sans-serif;
  --ds-font-sans:     'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* Geometry */
  --ds-maxw:          1200px;
}

/* ═══ LIGHT-MODE TOKEN FLIP ═══
   Inverts the canvas/surface/foreground ramp so the same component
   styles (which reference --ds-* vars) read on a light background.
   Tier accent colours (--ds-tier-*) already have their own light
   `*-bg` / `*-ring` variants and stay as-is. The user's chart blocks
   are also unaffected — those use their own light backgrounds inside
   .ds-card surfaces. */
[data-theme="light"]:root,
[data-theme="light"] {
  --ds-canvas:        #f4f6fa;
  --ds-surface-1:     #ffffff;
  --ds-surface-2:     #f8fafc;
  /* In dark mode --ds-surface-3 / -4 are LIGHTER than canvas (they
     read as raised/visible against the dark bg). To preserve that
     "lighter = more contrast" feel in light mode we have to invert
     the relationship — surface-3/4 become DARKER than the canvas so
     borders + separators don't dissolve into the bg. Earlier values
     #eef1f7 / #cbd5e1 sat too close to --ds-canvas (#f4f6fa) so
     every chart card / table border vanished. */
  --ds-surface-3:     #cbd5e1;  /* slate-300 — chart card borders, hover bg, table sticky bg */
  --ds-surface-4:     #94a3b8;  /* slate-400 — strong borders, scrollbar thumb */

  --ds-fg-1:          #0f172a;
  --ds-fg-2:          #1e293b;
  --ds-fg-3:          #334155;
  --ds-fg-muted:      #64748b;
  --ds-fg-dim:        #94a3b8;
  --ds-fg-faint:      #cbd5e1;
  --ds-fg-ghost:      #e2e8f0;

  --ds-houses-bg:     #dbeafe;
  --ds-houses-tint:   #eff6ff;
  --ds-houses-deep:   #bfdbfe;
  --ds-units-bg:      #ede9fe;
  --ds-units-tint:    #f5f3ff;
  --ds-units-deep:    #ddd6fe;

  --ds-indigo-deep:   #eef2ff;

  /* Hero overlays: in dark mode the JS uses translucent white for
     tile backgrounds / borders / inactive-tab bg, which works on the
     dark hero gradient but turns invisible on the light gradient.
     These vars (only defined here, in light mode) are referenced from
     the JS with the original rgba(255,255,255,…) values as fallback,
     so dark mode is untouched. */
  --ds-hero-tile-bg:        rgba(15, 23, 42, 0.05);
  --ds-hero-tile-border:    rgba(15, 23, 42, 0.10);
  --ds-hero-tile-bg-soft:   rgba(15, 23, 42, 0.04);
  --ds-hero-tile-bg-faint:  rgba(15, 23, 42, 0.03);
  --ds-hero-tab-active-fg:  #1e293b;
}

/* (hero logo retired — the OS app bar owns branding) */

/* Theme toggle — circular reveal via View Transitions API where
   supported (Chrome 111+, Safari 18+). theme.js sets --ppt-x/--ppt-y/
   --ppt-r on <html> before triggering the transition. Inlined here
   because demand-score doesn't load common.css. */
@supports (view-transition-name: none) {
  ::view-transition-old(root),
  ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-old(root) { z-index: 1; }
  ::view-transition-new(root) {
    z-index: 2;
    animation: pp-theme-circle-reveal 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes pp-theme-circle-reveal {
    from { clip-path: circle(0px at var(--ppt-x, 50%) var(--ppt-y, 50%)); }
    to   { clip-path: circle(var(--ppt-r, 150vmax) at var(--ppt-x, 50%) var(--ppt-y, 50%)); }
  }
}

/* Fallback cross-fade for browsers without View Transitions support. */
.pp-theme-transitioning,
.pp-theme-transitioning *,
.pp-theme-transitioning *::before,
.pp-theme-transitioning *::after{
  transition:
    background-color 700ms cubic-bezier(0.22, 1, 0.36, 1),
    background       700ms cubic-bezier(0.22, 1, 0.36, 1),
    color            700ms cubic-bezier(0.22, 1, 0.36, 1),
    border-color     700ms cubic-bezier(0.22, 1, 0.36, 1),
    box-shadow       700ms cubic-bezier(0.22, 1, 0.36, 1),
    fill             700ms cubic-bezier(0.22, 1, 0.36, 1),
    stroke           700ms cubic-bezier(0.22, 1, 0.36, 1) !important;
}
@media (prefers-reduced-motion: reduce){
  .pp-theme-transitioning,
  .pp-theme-transitioning *,
  .pp-theme-transitioning *::before,
  .pp-theme-transitioning *::after{ transition: none !important; }
}

/* (back-button chrome retired — uniform OS app bar) */

/* (in-tool theme toggle retired — appearance lives in the OS app bar) */

* { margin: 0; padding: 0; box-sizing: border-box; }

/* ═══ FUTURISTIC ANIMATED BG (demand-score inline copy) ═══
   Same vocabulary as common.css. @property registers the colour
   vars so keyframes can interpolate them smoothly. body bg + the
   drifting orbs ride a 50s cycle; complementary hues swap together.
   Inlined here because demand-score doesn't load common.css.
   Chart cards (.ds-card etc.) stay opaque so the data viz layer is
   never tinted by the orbs — only the canvas margins around them
   pick up the colour shift. */
/* Static futuristic gradient on body. No animation, no orbs, no
   @property — keeps the deep-tech vibe without GPU cost while the
   dashboard renders many ECharts/Leaflet layers. */
/* body background retired — the OS day-cycle wallpaper (.wall.scrim) owns it;
   see the pp-os-skin block for the token re-point. */
html, body {
  color: var(--ds-fg-3);
  font-family: var(--ds-font-sans);
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

table { border-collapse: collapse; }
button, input, select { font-family: var(--ds-font-sans); }

::selection { background: var(--ds-selection); color: #fff; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--ds-surface-2); }
::-webkit-scrollbar-thumb { background: var(--ds-surface-4); border-radius: 3px; }

@keyframes ds-spin { to { transform: rotate(360deg); } }

/* Sync overlay — shown over the dashboard while loadData() refetches
   the bound sheet. Lives outside the React-style render() rebuild
   (created on demand under <body>) so it isn't blown away when the
   render swaps the DOM. Pointer-events:none on the wrapper while
   inactive so the dashboard underneath stays interactive. */
#ds-sync-overlay{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(15,23,42,0.45);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  z-index:9999;
  opacity:0; pointer-events:none;
  transition:opacity .22s ease;
}
[data-theme="light"] #ds-sync-overlay{ background:rgba(15,23,42,0.18); }
#ds-sync-overlay.active{ opacity:1; pointer-events:auto; }
#ds-sync-overlay .ds-sync-card{
  display:flex; flex-direction:column; align-items:center; gap:14px;
  background:var(--ds-surface-2); border:1px solid var(--ds-surface-3);
  border-radius:12px; padding:26px 38px;
  box-shadow:0 14px 60px rgba(0,0,0,.45);
}
#ds-sync-overlay .ds-sync-spinner{
  width:40px; height:40px;
  border:3px solid rgba(255,142,99,0.18);
  border-top-color:#FF8E63;
  border-radius:50%;
  animation:ds-spin .85s linear infinite;
}
#ds-sync-overlay .ds-sync-text{
  font-family:'Montserrat',system-ui,sans-serif;
  font-size:13px; font-weight:700; letter-spacing:.04em;
  color:var(--ds-fg-2);
}
@keyframes ds-pulse {
  0%, 100% { opacity: 0.85; }
  50% { opacity: 0.45; }
}
@keyframes ds-fade-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes ds-slide-in {
  from { transform: translateX(100%); }
  to   { transform: translateX(0); }
}

/* Lucide sizing */
[data-lucide] { stroke-width: 2; width: 14px; height: 14px; flex: none; }
.i-lg  [data-lucide] { width: 16px; height: 16px; }
.i-xl  [data-lucide] { width: 20px; height: 20px; }
.i-sm  [data-lucide] { width: 12px; height: 12px; }

/* Small helpers */
.row-hover { transition: background 0.15s; }
.row-hover:hover { background: var(--ds-surface-3) !important; }

/* Pill/button hover */
.ds-pill { transition: all 0.15s; }
.ds-pill:hover { border-color: var(--ds-surface-4); color: var(--ds-fg-3); }
.ds-pill.active:hover { border-color: var(--ds-selection); }

.ds-icon-btn { transition: all 0.15s; }
.ds-icon-btn:hover { background: var(--ds-surface-3); color: var(--ds-fg-3); }

/* Map regions — Leaflet */
.leaflet-container { background: #020617 !important; font-family: 'Montserrat', sans-serif !important; }
.leaflet-control-zoom a { background: #1e293b !important; color: #94a3b8 !important; border-color: #334155 !important; }
.leaflet-control-zoom a:hover { background: #334155 !important; color: #f1f5f9 !important; }
.map-tooltip-custom {
  background: rgba(15, 23, 42, 0.95) !important;
  backdrop-filter: blur(8px);
  border: 1px solid #334155 !important;
  border-radius: 10px !important;
  padding: 12px 16px !important;
  min-width: 220px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
  font-size: 12px;
  color: #e2e8f0;
}
.map-tooltip-custom .leaflet-tooltip-tip { display: none; }
.map-tooltip-row { display:flex; justify-content:space-between; padding:3px 0; }
.map-tooltip-label { color:#94a3b8; }
.map-tooltip-value { font-weight:700; color:#e2e8f0; font-variant-numeric:tabular-nums; }
@keyframes region-pulse {
  0%, 100% { stroke-opacity: 0.8; }
  50% { stroke-opacity: 1; stroke-width: 4; }
}
.leaflet-region-glow { animation: leaflet-glow 2s ease-in-out infinite; }
@keyframes leaflet-glow {
  0%, 100% { filter: drop-shadow(0 0 4px rgba(255,255,255,0.3)); }
  50% { filter: drop-shadow(0 0 12px rgba(255,255,255,0.6)); }
}
.map-region-label { background: none !important; border: none !important; box-shadow: none !important; }
.map-info-panel {
  position: absolute; top: 60px; left: 16px; z-index: 1000;
  width: 300px; max-height: calc(100% - 80px); overflow-y: auto;
  background: rgba(10, 15, 30, 0.92); backdrop-filter: blur(12px);
  border: 1px solid #334155; border-radius: 12px;
  padding: 0; pointer-events: auto;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  transition: opacity 0.25s, transform 0.25s;
}
.map-info-panel.hidden { opacity: 0; transform: translateX(-20px); pointer-events: none; }
.map-info-panel.visible { opacity: 1; transform: translateX(0); }
.map-info-row {
  opacity: 0; transform: translateY(8px);
  animation: mapInfoIn 0.35s ease-out forwards;
}
@keyframes mapInfoIn {
  to { opacity: 1; transform: translateY(0); }
}
.map-info-panel::-webkit-scrollbar { width: 4px; }
.map-info-panel::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

/* Compare tray */
.compare-tray {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 80;
  background: linear-gradient(180deg, var(--ds-surface-3) 0%, var(--ds-surface-2) 100%);
  border: 1px solid var(--ds-surface-4);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  animation: ds-fade-in 0.2s ease-out;
}

/* Sparkline baseline */
.sparkline { display: block; }

/* ============================================================================
   Print styles
   ============================================================================ */
@media print {
  @page { size: A3 landscape; margin: 14mm; }
  body { background: #fff !important; color: #0f172a !important; }
  ::-webkit-scrollbar { display: none; }
  #app { padding: 0 !important; }
  .no-print { display: none !important; }
  .print-only { display: block !important; }
  .hero-bar, .filter-bar { display: none !important; }
  .print-header {
    display: flex !important;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 12px;
    border-bottom: 2px solid #0f172a;
    margin-bottom: 12px;
  }
  .print-header h1 {
    font-family: var(--ds-font-display);
    font-size: 24px;
    font-weight: 800;
    color: #0f172a;
  }
  .print-header .meta { color: #475569; font-size: 11px; }
  table { width: 100%; font-size: 10px; page-break-inside: auto; }
  thead { display: table-header-group; }
  tr { page-break-inside: avoid; }
  tr, td, th { background: #fff !important; color: #0f172a !important; border-color: #cbd5e1 !important; }
  th { color: #475569 !important; }
  .print-tier-strong { color: #4D7F39 !important; }
  .print-tier-buy    { color: #3E7967 !important; }
  .print-tier-hold   { color: #E08A00 !important; }
  .print-tier-watch  { color: #F59700 !important; }
  .print-tier-avoid  { color: #CA1637 !important; }
  .top-grid, .map-section, .compare-tray, #detail-panel { display: none !important; }
}
.print-only { display: none; }
.print-header { display: none; }

/* ─────── Rotate-to-landscape notice ───────
   Demand Dashboard's hero grid + table + map all assume a wide
   viewport. On narrow + portrait phones the layout collapses badly,
   so we gate it behind the same rotate-prompt pattern Property Clock
   and Runway v Demand use. Inlined here because demand-score doesn't
   load common.css (matches existing pattern in this file). */
.rotate-notice{
  display:none;position:fixed;inset:0;z-index:99999;
  background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#082f49 100%);
  align-items:center;justify-content:center;
  padding:32px;text-align:center;
  color:#fff;font-family:'Montserrat',sans-serif;
}
[data-theme="light"] .rotate-notice{
  background:linear-gradient(135deg,#f0f9ff 0%,#e0e7ff 50%,#cffafe 100%);
  color:#1a2236;
}
.rotate-notice-inner{max-width:320px}
.rotate-notice svg{
  width:88px;height:88px;
  color:#FF8E63;
  margin:0 auto 22px;display:block;
  animation:rotate-notice-hint 2.6s cubic-bezier(0.65,0,0.35,1) infinite;
  transform-origin:center;
}
@keyframes rotate-notice-hint{
  0%,15%,100%{transform:rotate(0deg)}
  50%,65%    {transform:rotate(-90deg)}
}
@media (prefers-reduced-motion: reduce){
  .rotate-notice svg{animation:none;transform:rotate(-90deg)}
}
.rotate-notice h2{
  font-size:16px;font-weight:800;
  letter-spacing:2.5px;text-transform:uppercase;
  margin:0 0 10px;line-height:1.25;
}
.rotate-notice h2 em{color:#FF8E63;font-style:normal}
.rotate-notice p{
  font-size:13px;line-height:1.55;
  opacity:0.72;margin:0;font-weight:500;
}
@media (max-width: 900px) and (orientation: portrait){
  .rotate-notice{display:flex}
}

/* ─────── Live data loading overlay ───────
   Shown on page load while the demand scores are computed from Forge.
   Visible by default in HTML so it paints with the page;
   JS hides it after the first loadData() resolves (with min 3s
   visible to prevent flash on cache hits). */
.live-loading-overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center,
      rgba(15, 25, 34, 0.40) 0%,
      rgba(8, 16, 24, 0.72) 100%);
  backdrop-filter: blur(14px) saturate(120%);
  -webkit-backdrop-filter: blur(14px) saturate(120%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  opacity: 1;
  transition: opacity 0.45s ease;
  pointer-events: all;
}
.live-loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}
.live-loading-card {
  background: linear-gradient(160deg,
      rgba(28, 44, 60, 0.95) 0%,
      rgba(18, 30, 42, 0.95) 100%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 14px;
  padding: 28px 38px 26px;
  min-width: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  color: rgba(255, 255, 255, 0.92);
  font-family: 'Montserrat', system-ui, sans-serif;
  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.55),
    0 0 0 1px rgba(255, 142, 99, 0.06) inset;
  animation:
    live-card-enter 0.5s cubic-bezier(0.22, 1, 0.36, 1) both,
    live-card-float 4s ease-in-out 0.5s infinite;
}
.live-loading-dots {
  display: flex;
  gap: 8px;
  align-items: center;
  height: 14px;
}
.live-loading-dots span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #FF8E63;
  box-shadow: 0 0 10px rgba(255, 142, 99, 0.55);
  animation: live-dot-wave 1.2s ease-in-out infinite;
}
.live-loading-dots span:nth-child(2) { animation-delay: 0.15s; }
.live-loading-dots span:nth-child(3) { animation-delay: 0.30s; }
.live-loading-region {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: #FF8E63;
  line-height: 1.2;
  text-align: center;
  margin-top: 4px;
}
.live-loading-sub {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.45);
  text-align: center;
}
@keyframes live-card-enter {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0)     scale(1);    }
}
@keyframes live-card-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-4px); }
}
@keyframes live-dot-wave {
  0%, 60%, 100% { transform: translateY(0)   scale(1);    opacity: 0.5; }
  30%           { transform: translateY(-6px) scale(1.15); opacity: 1;   }
}
</style>
<style id="pp-os-skin">
/* ════════════════════════════════════════════════════════════════════════
   PERFORMANCE OS SKIN — Demand Score Dashboard (redesign Session 2 pilot)
   Presentation only. The tool's entire UI reads the --ds-* token layer, so
   the skin re-points that layer at the OS palette (shared/os-theme.css) and
   every component + JS-inline style follows. Deliberately UNCHANGED:
   the data language (houses blue / units violet, tier greens→reds,
   smooth/workforce dots, dark Leaflet map card) and every behaviour.
   Surfaces stay OPAQUE (OS-hued) because the tables rely on sticky
   cells occluding scrolled content — glass lives on the app bar,
   wallpaper and overlays instead.
   ════════════════════════════════════════════════════════════════════ */
:root{
  --ds-font-display:'Montserrat',system-ui,sans-serif;
  --ds-font-sans:'Montserrat',system-ui,sans-serif;

  --ds-canvas:transparent;
  --ds-surface-1:#161322;

<script>
/* ============================================================================
   CONFIG
   ============================================================================ */
/* embedded logo removed — the OS app bar owns branding (uniform header standard) */

/* ============================================================================
   STATE
   ============================================================================ */
let state = {
  tab: "Houses",
  sf: "All",
  tf: "All",
  mf: "All",           // market-type filter: "All" | "smooth" | "workforce"
  sortField: "demandScore",
  sortDir: "desc",
  search: "",
  selected: null,
  view: "table",        // "table" | "grid" | "map" | "compare"
  compare: [],          // array of market names (max 10)
  snapshots: [],        // all captured monthly snapshots (forge_demand_snapshots, non-rvd), newest first
  compareMonth: "live", // which month the compare view shows: "live" (uncaptured) or a version id "YYYY-MM"
  houseData: null,
  unitData: null,
  // Wage-growth + PP variable-rate values per property type. Mirrors
  // the V2 (Live Sheet) legend structure on the Runway v Demand side
  // — Houses and Units can carry different values. Sourced from the
  // bound Demand Dashboard sheet (cell locations TBC), pushed along
  // with the per-region runway data when the Push button fires.
  legend: { house: { year: null, rate: null }, unit: { year: null, rate: null } },
  loading: true,
  error: null,
  lastUpdated: null,
};

function setState(p) {
  Object.assign(state, typeof p === "function" ? p(state) : p);
  render();
}

/* ============================================================================
   MARKET TYPE CLASSIFICATION  (smooth / workforce)
   The Property Clock is the source of truth. At load we use the fallback
   sets below, then overwrite from the clock state (Supabase clock_state)
   in syncTypesFromClock().
   ============================================================================ */
function canonMarketName(s) {
  return String(s || "")
    .toUpperCase()
    .replace(/^GREATER\s+/, "")
    .replace(/\s*\(NSW\)\s*$/, "")
    .replace(/[-\s]+/g, " ")
    .trim();
}
// Fallback mirrors property-clock.html HR/UR arrays so tab-specific defaults
// are correct when the clock state is unreachable.
const FALLBACK_WORKFORCE = {
  houses: new Set(["CAIRNS","MACKAY","GLADSTONE","ROCKHAMPTON","ROCKINGHAM",
    "BUNDABERG","BUNBURY","PERTH","TOWNSVILLE","TAMWORTH"].map(canonMarketName)),
  units:  new Set(["CAIRNS","TAMWORTH","ROCKINGHAM","BUNBURY","TOWNSVILLE",
    "PERTH","ROCKHAMPTON","BUNDABERG","MACKAY","DARWIN","GLADSTONE"].map(canonMarketName)),
};
// Populated by syncTypesFromClock(); takes precedence over the fallback.
const CLOCK_TYPE = { houses: {}, units: {} };
function classifyMarket(name, propertyType) {
  const key = canonMarketName(name);
  const pt = propertyType === "units" ? "units" : "houses";
  if (CLOCK_TYPE[pt][key]) return CLOCK_TYPE[pt][key];
  return FALLBACK_WORKFORCE[pt].has(key) ? "workforce" : "smooth";
}

/* ============================================================================
   DEMAND SCORE ENGINE  ("the machine")
   Computes the Demand Score locally from 5 raw inputs — population, listings,
   adjusted vacancy rate, DOM, and 36-month rental growth — reproducing the
   monthly "Demand Score" spreadsheet's math EXACTLY (verified to the last
   decimal against the June-2026 House & Unit sheets across all 37 regions).
   This is what lets the dashboard compute the score itself instead of reading
   the sheet's pre-computed "Score v Benchmark" column, and it's the piece the
   Forge data points (SQM VR, SQM House/Unit rent, REA listings) will feed once
   they land — the formula never changes, only where the 5 inputs come from.

   Per region:
     F = listings / population * 1000            (listings per 1,000 people)
     H = VR% * F                                 (Supply Score)
     L = DOM * (1 - rentalGrowth)                (raw Demand Score)
     M = L * H                                   (Supply x Demand)
     N = grade(M)                                (Score Inversion, Grading lookup)
     O = clamp( ((N - Nbench)/Nbench)*100, -20, 80 )   (Score v Benchmark = Demand Score)
   Benchmark row uses fixed VR=3, DOM=45, rentalGrowth=0.1, and F = median of F
   over ALL supplied rows incl. National (matches the sheet's MEDIAN(F4:F40)).
   Grading table: grade(i) = 100 - 0.5*i; A-thresholds step 1 (0..20), 5 (20..100),
   10 (100..3740) — generates the sheet's 401-row table exactly.
   ============================================================================ */
const PP_DEMAND_ENGINE = (function () {
  const E1 = 1000;
  const BENCH = { vr: 3, dom: 45, rentGrowth: 0.1 };
  // Grading thresholds (column A of the sheet's "Grading" tab). grade = 100 - 0.5*index.
  const A = (function () {
    const a = [];
    for (let v = 0;  v <= 20;   v += 1)  a.push(v);   // idx 0..20
    for (let v = 25; v <= 100;  v += 5)  a.push(v);   // idx 21..36
    for (let v = 110; v <= 3740; v += 10) a.push(v);  // idx 37..400
    return a;
  })();
  function grade(M) {
    if (!(M > A[0])) return 100;                       // M <= 0 -> top grade
    let lo = 0, hi = A.length - 1, idx = 0;            // approximate VLOOKUP: largest A <= M
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (A[mid] <= M) { idx = mid; lo = mid + 1; } else hi = mid - 1; }
    return 100 - 0.5 * idx;
  }
  function median(arr) {
    const a = arr.filter(x => typeof x === "number" && isFinite(x)).sort((x, y) => x - y);
    const n = a.length; if (!n) return 0;
    return n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2;
  }
  /* rows: [{ population, listings, vr, dom, rentGrowth }] with rentGrowth as a
     decimal. Pass EVERY region incl. National so the benchmark median matches
     the sheet; drop National for display AFTER. Adds listingsPer1k, supplyScore,
     rawDS, scoreInversion, demandScore to each row (mutates + returns). */
  function compute(rows) {
    rows.forEach(r => {
      const pop = Number(r.population) || 0, list = Number(r.listings) || 0;
      r._F = pop > 0 ? (list / pop * E1) : 0;
      r._H = (Number(r.vr) || 0) * r._F;
      r._L = (Number(r.dom) || 0) * (1 - (Number(r.rentGrowth) || 0));
      r._M = r._L * r._H;
    });
    const Fb = median(rows.map(r => r._F));
    const Nb = grade((BENCH.dom * (1 - BENCH.rentGrowth)) * (BENCH.vr * Fb));
    rows.forEach(r => {
      const N = grade(r._M);
      r.listingsPer1k  = Math.round(r._F * 100) / 100;
      r.supplyScore    = Math.round(r._H * 100) / 100;
      r.rawDS          = Math.round(r._L * 10) / 10;
      r.scoreInversion = Math.round(N * 10) / 10;
      // Keep FULL precision — do NOT pre-round to 1dp. Rounding here then again at
      // display double-rounds (e.g. 50.45→50.5→51 instead of →50, vs the sheet's 50).
      r.demandScore    = Math.min(80, Math.max(-20, ((N - Nb) / Nb) * 100));
      delete r._F; delete r._H; delete r._L; delete r._M;
    });
    return rows;
  }
  return { compute, grade, median, BENCH, _A: A };
})();
try { window.PP_DEMAND_ENGINE = PP_DEMAND_ENGINE; } catch (e) {}

/* ============================================================================
   HELPERS
   ============================================================================ */
const fmt      = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? Math.round(n).toLocaleString() : String(n);
const fmtPrice = n => n >= 1e6 ? "$"+(n/1e6).toFixed(2)+"M" : n >= 1e3 ? "$"+Math.round(n/1e3)+"K" : "$"+n;

/*  2-D tier system — uses BOTH Demand Score (ds) and Runway (rw, decimal).
 *  Based on the 4-quadrant scatter model:
 *
 *  DS ≥ 25  │  High Demand / Low Runway   │  High Demand / High Runway
 *  (HIGH)   │  → Hold / Watch (yellow)    │  → Buy / Hold (blue)
 *  ─────────┼─────────────────────────────┼──────────────────────────────
 *  DS < 25  │  Low Demand / Low Runway    │  Low Demand / High Runway
 *  (LOW)    │  → Watch / Avoid (red)      │  → Buy / Strong Buy (green)
 *           │      RW below entry bar     │      RW at/above entry bar
 *  Entry bar = 40% for smooth markets, 70% for workforce (not a flat 60%).
 *
 *  Secondary axis: Possible Rental Growth (right y-axis on chart)
 *    DS 60+ ≈ 10%+,  DS 40 ≈ 5%+,  DS 25 ≈ CPI+,  DS 0 ≈ 0%,  DS < 0 ≈ negative
 */
const TIERS = {
  strong: { key:"strong", label:"Strong Buy", color:"#4D7F39", bg:"#ecfdf5", ring:"#a7f3d0" },
  buy:    { key:"buy",    label:"Buy",        color:"#3E7967", bg:"#f0fdfa", ring:"#99f6e4" },
  hold:   { key:"hold",   label:"Hold",       color:"#E08A00", bg:"#fffbeb", ring:"#fde68a" },
  watch:  { key:"watch",  label:"Watch",      color:"#F59700", bg:"#fff7ed", ring:"#fed7aa" },
  avoid:  { key:"avoid",  label:"Avoid",      color:"#CA1637", bg:"#fef2f2", ring:"#fecaca" },
};

/* Market ENTRY BARS (house methodology, same as Runway v Demand's axis + Market
   Compare): a market is "approved" for trading at 40% runway if SMOOTH, 70% if
   WORKFORCE. Replaces the old flat 60% line — which under-rated smooth markets
   and over-rated workforce ones. The runway is NORMALISED against the bar
   (nb = rw / bar; 1.0 = at the bar) so a single set of thresholds works for
   both types. NOTE: this only changes the VERDICT/quadrant labels — the demand
   score itself is unchanged, and Runway v Demand is a separate tool untouched. */
const ENTRY_BAR = { smooth: 0.40, workforce: 0.70 };
function getTier(ds, rw, type) {
  // rw may be undefined in scoreBar-only contexts; fall back to ds-only logic
  if (rw === undefined) {
    if (ds >= 40) return TIERS.strong;
    if (ds >= 25) return TIERS.buy;
    if (ds >= 15) return TIERS.hold;
    if (ds >= 5)  return TIERS.watch;
    return TIERS.avoid;
  }
  const nb = rw / ENTRY_BAR[type === "workforce" ? "workforce" : "smooth"];   // 1.0 = at the entry bar
  const highDemand = ds >= 25, approved = nb >= 1;

  if (!highDemand && approved) {
    // GREEN — demand yet to build, runway clears the bar → Strong Buy or Buy
    if (nb >= 1.5 || (nb >= 1.15 && ds >= 15)) return TIERS.strong;
    return TIERS.buy;
  }
  if (highDemand && approved) {
    // BLUE — strong demand above the bar → Strong Buy or Buy
    if (ds >= 45 && nb >= 1.25) return TIERS.strong;
    return TIERS.buy;
  }
  if (highDemand && !approved) {
    // YELLOW — demand there, runway below the bar → Hold or Watch
    if (nb >= 0.5) return TIERS.hold;
    return TIERS.watch;
  }
  // RED — neither
  if (ds < 0 || nb < 0.17) return TIERS.avoid;
  if (ds < 10 && nb < 0.5) return TIERS.avoid;
  return TIERS.watch;
}

function getQuadrant(ds, rw, type) {
  const bar = ENTRY_BAR[type === "workforce" ? "workforce" : "smooth"];
  const highDemand = ds >= 25, approved = (rw || 0) >= bar;
  if (highDemand && !approved) return { label:"High Demand / Low Runway", color:"#B87100", bg:"#fefce833" };
  if (highDemand && approved)  return { label:"High Demand / High Runway", color:"#318DD8", bg:"#318DD822" };
  if (!highDemand && !approved) return { label:"Low Demand / Low Runway", color:"#E72347", bg:"#E7234722" };
  return { label:"Low Demand / High Runway", color:"#22c55e", bg:"#22c55e22" };
}



/* ============================================================================
   DOM HELPER
   ============================================================================ */
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) Object.entries(props).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "className") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(c => {
    if (c == null || c === false) return;
    el.appendChild(typeof c === "string" || typeof c === "number"
      ? document.createTextNode(String(c)) : c);
  });
  return el;
}

function icon(name, size) {
  const s = size || 14;
  return h("i", { "data-lucide": name, style: { width: s+"px", height: s+"px" } });
}

/* ============================================================================
   PRIMITIVES
   ============================================================================ */
function scoreBar(value, runway, type) {
  const pct = Math.max(0, Math.min(100, ((value + 15) / 75) * 100));
  const tier = getTier(value, runway, type);
  return h("div", { style: { display:"flex", alignItems:"center", gap:"8px" } },
    h("div", { style: { width:"110px", height:"5px", borderRadius:"3px", background:"var(--ds-surface-3)", overflow:"hidden" } },
      h("div", { style: { width: pct+"%", height:"100%", borderRadius:"3px",
        background: `linear-gradient(90deg, ${tier.color}88, ${tier.color})`,
        transition:"width 0.4s" } })),
    h("span", { style: { fontSize:"13px", fontWeight:"700", color: tier.color,
      fontVariantNumeric:"tabular-nums", minWidth:"40px", textAlign:"right" } },
      value.toFixed(1))
  );
}

function delta(value, suffix = "", digits = 1) {
  const pos = value > 0;
  const color = pos ? "var(--ds-delta-pos)" : value < 0 ? "var(--ds-delta-neg)" : "var(--ds-delta-neutral)";
  return h("span", { style: {
    fontSize:"11px", fontWeight:"600", color,
    fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap"
  } }, (pos ? "+" : "") + value.toFixed(digits) + suffix);
}

function badge(tier) {
  return h("span", { style: {
    display:"inline-flex", alignItems:"center",
    fontSize:"9px", fontWeight:"700", letterSpacing:"0.06em",
    textTransform:"uppercase", padding:"3px 7px", borderRadius:"4px",
    color: tier.color, background: tier.bg, border: `1px solid ${tier.ring}`,
    whiteSpace:"nowrap"
  }, className: "print-tier-" + tier.key }, tier.label);
}

function pill(label, active, onClick) {
  return h("button", {
    className: "ds-pill" + (active ? " active" : ""),
    style: {
      padding:"5px 14px", borderRadius:"6px", border:"1px solid",
      cursor:"pointer", fontSize:"12px", fontWeight:"600",
      background: active ? "var(--ds-indigo-lav)" : "transparent",
      color:      active ? "var(--ds-indigo-ink)" : "var(--ds-fg-muted)",
      borderColor: active ? "var(--ds-selection)" : "var(--ds-surface-4)"
    },
    onClick
  }, label);
}

function sortHeader(label, field, align) {
  const { sortField: sF, sortDir: sD } = state;
  const active = sF === field;
  return h("th", {
    style: {
      padding:"10px 12px", textAlign: align || "left",
      cursor:"pointer", userSelect:"none",
      fontSize:"10px", fontWeight:"700", letterSpacing:"0.08em",
      textTransform:"uppercase",
      color: active ? "#a5b4fc" : "var(--ds-fg-dim)",
      whiteSpace:"nowrap",
      borderBottom:"1px solid var(--ds-surface-3)",

    },
    onClick: () => {
      if (state.sortField === field) setState({ sortDir: state.sortDir === "asc" ? "desc" : "asc" });
      else setState({ sortField: field, sortDir: "desc" });
    }
  }, label + (active ? (sD === "asc" ? "  ↑" : "  ↓") : ""));
}

/* ---------- Sparkline ----------
   Three data points: 0 → 3-month → 12-month price growth, drawn as
   line + filled area + end dot. The whole subtree is built in the
   SVG namespace (including the root <svg>) so the browser actually
   renders it as SVG — using document.createElement('svg') leaves
   the root in the HTML namespace and child shapes either don't
   render or render unreliably across browsers, which manifests as
   an apparently-empty Trend column. */
const SVG_NS = "http://www.w3.org/2000/svg";
function sparkline(m) {
  const pts = [0, m.priceGrowth3m || 0, m.priceGrowth12m || 0];
  const min = Math.min(...pts, 0);
  const max = Math.max(...pts, 0);
  const range = (max - min) || 1;
  const w = 56, hgt = 18, pad = 2;
  const stepX = (w - pad*2) / (pts.length - 1);
  const coords = pts.map((v, i) => [
    pad + i * stepX,
    pad + (hgt - pad*2) * (1 - (v - min) / range)
  ]);
  const last = pts[pts.length - 1];
  const color = last > 0 ? "var(--ds-delta-pos)" : last < 0 ? "var(--ds-delta-neg)" : "var(--ds-delta-neutral)";

  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", "sparkline");
  svg.setAttribute("width", w);
  svg.setAttribute("height", hgt);
  svg.setAttribute("viewBox", `0 0 ${w} ${hgt}`);

  // zero baseline
  const zeroY = pad + (hgt - pad*2) * (1 - (0 - min) / range);
  const baseline = document.createElementNS(SVG_NS, "line");
  baseline.setAttribute("x1", pad); baseline.setAttribute("x2", w - pad);
  baseline.setAttribute("y1", zeroY); baseline.setAttribute("y2", zeroY);
  baseline.setAttribute("stroke", "#334155"); baseline.setAttribute("stroke-dasharray", "1,2");
  svg.appendChild(baseline);
  // area
  const area = document.createElementNS(SVG_NS, "path");
  const pathD = coords.map((c,i) => (i===0 ? "M" : "L") + c[0] + " " + c[1]).join(" ");
  area.setAttribute("d", pathD + ` L ${w-pad} ${zeroY} L ${pad} ${zeroY} Z`);
  area.setAttribute("fill", color); area.setAttribute("fill-opacity", "0.18");
  svg.appendChild(area);
  // line
  const line = document.createElementNS(SVG_NS, "path");
  line.setAttribute("d", pathD);
  line.setAttribute("stroke", color); line.setAttribute("stroke-width", "1.4");
  line.setAttribute("fill", "none"); line.setAttribute("stroke-linecap", "round");
  line.setAttribute("stroke-linejoin", "round");
  svg.appendChild(line);
  // end dot
  const [ex, ey] = coords[coords.length - 1];
  const dot = document.createElementNS(SVG_NS, "circle");
  dot.setAttribute("cx", ex); dot.setAttribute("cy", ey); dot.setAttribute("r", "2");
  dot.setAttribute("fill", color);
  svg.appendChild(dot);
  return svg;
}

/* ============================================================================
   AUSTRALIA MAP

  "Launceston":[-41.43,147.14,20],"Bunbury":[-33.33,115.64,20],
  "Mildura":[-34.19,142.15,25],"Wodonga":[-36.12,146.89,16],
  "Ipswich":[-27.62,152.76,22],"Gladstone":[-23.85,151.27,20],
  "Rockingham":[-32.28,115.74,18],"Mandurah":[-32.53,115.72,18],
  "Central Coast":[-33.43,151.34,22],"Central Coast (NSW)":[-33.43,151.34,22],
  "Hervey Bay":[-25.29,152.84,18]
};
// Keep backward compat alias
const MARKET_LATLNG = Object.fromEntries(Object.entries(MARKET_GEO).map(([k,[a,b]])=>[k,[a,b]]));

let leafletMap = null;
let mapCircles = [];   // {circle, label, market}
let mapContainer = null;
let mapCurrentTab = null;
let mapSavedCenter = null;
let mapSavedZoom = null;

function australiaMap(allMarkets, filteredMarkets, accentColor) {
  const filteredNames = new Set(filteredMarkets.map(m => m.name));
  const hasFilter = filteredNames.size < allMarkets.length;

  const container = h("div", { className: "map-section", style: {
    background: "#020617",
    border: "1px solid var(--ds-surface-3)",
    borderRadius: "12px",
    padding: "0",
    marginTop: "12px",
    marginBottom: "20px",
    position: "relative",
    overflow: "hidden"
  } });

  // Header
  const header = h("div", { style: {
    display:"flex", alignItems:"center", justifyContent:"space-between",
    padding:"14px 20px", background:"rgba(15,23,42,0.8)", borderBottom:"1px solid #1e293b",
    position:"relative", zIndex:"1000"
  } });
  header.appendChild(h("div", { style: { display:"flex", alignItems:"center", gap:"8px" } },
    h("span", { style: {
      display:"inline-flex", alignItems:"center", gap:"6px",
      color: accentColor, fontSize:"11px", fontWeight:"700",
      letterSpacing:"0.12em", textTransform:"uppercase"
    } }, icon("map", 12), "Market Regions")));

  const legend = h("div", { style: { display:"flex", alignItems:"center", gap:"10px", fontSize:"9px",
    fontWeight:"700", letterSpacing:"0.06em", textTransform:"uppercase", color:"var(--ds-fg-dim)" } });
  [["#22c55e","LD/HR"],["#318DD8","HD/HR"],["#B87100","HD/LR"],["#E72347","LD/LR"]].forEach(([c,l]) => {
    legend.appendChild(h("span", { style: { display:"inline-flex", alignItems:"center", gap:"4px" } },
      h("span", { style: { width:"10px", height:"10px", borderRadius:"2px", background:c, opacity:"0.7" } }), l));
  });
  const filterBadge = h("span", { id:"map-filter-badge", style: { color:accentColor, marginLeft:"6px" } });
  if (hasFilter) filterBadge.textContent = "\u00b7 " + filteredNames.size + " highlighted";
  legend.appendChild(filterBadge);
  header.appendChild(legend);
  container.appendChild(header);

  // Map div
  const mapDiv = h("div", { id: "leaflet-map-" + Date.now(), style: {
    width: "100%", height: "700px", background: "#020617"
  } });
  container.appendChild(mapDiv);

  // Left-side info panel for map clicks
  const infoPanel = h("div", { className: "map-info-panel hidden" });
  container.appendChild(infoPanel);

  function showMapInfo(m) {
    const tier = getTier(m.demandScore, m.runway, m.marketType);
    const quad = getQuadrant(m.demandScore, m.runway, m.marketType);
    infoPanel.innerHTML = "";
    infoPanel.className = "map-info-panel visible";

    const rows = [];
    let delay = 0;
    const addRow = (html) => { rows.push({ html, delay }); delay += 60; };

    // Header
    addRow(
      '<div style="padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start">' +
        '<div>' +
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap">' +
            '<span style="font-size:11px;font-weight:700;color:' + accentColor + ';letter-spacing:0.06em">' + m.state + '</span>' +
            '<span style="font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;background:' + tier.bg + ';color:' + tier.color + ';border:1px solid ' + tier.ring + '">' + tier.label + '</span>' +
          '</div>' +
          '<div style="font-size:22px;font-weight:800;color:#f1f5f9;font-family:var(--ds-font-display);line-height:1.1">' + m.name + '</div>' +
        '</div>' +
        '<button onclick="document.querySelector(\'.map-info-panel\').className=\'map-info-panel hidden\'" style="background:none;border:1px solid #334155;color:#64748b;cursor:pointer;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none">✕</button>' +
      '</div>'
    );

    // Quadrant badge
    addRow(
      '<div style="padding:0 16px 12px">' +
        '<span style="font-size:9px;font-weight:600;padding:3px 8px;border-radius:4px;background:' + quad.bg + ';color:' + quad.color + ';border:1px solid ' + quad.color + '33;display:inline-block">' + quad.label + '</span>' +
      '</div>'
    );

    // Score + Runway hero
    addRow(
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 12px">' +
        '<div style="background:#1e293b;border-radius:8px;padding:12px;text-align:center">' +
          '<div style="font-size:9px;color:#94a3b8;font-weight:600;margin-bottom:2px">DEMAND SCORE</div>' +
          '<div style="font-size:28px;font-weight:800;color:' + tier.color + ';line-height:1">' + m.demandScore.toFixed(1) + '</div>' +
          '<div style="font-size:10px;font-weight:600;color:' + (m.dsDiff > 0 ? '#71B357' : m.dsDiff < 0 ? '#E72347' : '#64748b') + '">' + (m.dsDiff > 0 ? '+' : '') + m.dsDiff.toFixed(1) + ' vs prev</div>' +
        '</div>' +
        '<div style="background:#1e293b;border-radius:8px;padding:12px;text-align:center">' +
          '<div style="font-size:9px;color:#94a3b8;font-weight:600;margin-bottom:2px">RUNWAY</div>' +
          '<div style="font-size:28px;font-weight:800;color:' + (m.runway > 0.5 ? '#71B357' : m.runway > 0.2 ? '#FFC870' : '#E72347') + ';line-height:1">' + (m.runway * 100).toFixed(2) + '%</div>' +
          '<div style="font-size:10px;font-weight:600;color:#64748b">#' + m.dsRank + ' of 36</div>' +
        '</div>' +
      '</div>'
    );

    // Metric rows
    const metrics = [
      ["DOM", m.dom + "d"],
      ["Median Price", m.medianPrice ? fmtPrice(m.medianPrice) : "—"],
      ["12mo Growth", (m.priceGrowth12m > 0 ? "+" : "") + m.priceGrowth12m.toFixed(1) + "%"],
      ["3mo Growth", (m.priceGrowth3m > 0 ? "+" : "") + m.priceGrowth3m.toFixed(1) + "%"],
      ["Weekly Rent", "$" + m.weeklyRent],
      ["Rental Growth 36m", m.rentalGrowth36m.toFixed(2) + "%"],
      ["Population", fmt(m.population)],
      ["Listings", fmt(m.listings)],
      ["Listings/1K", m.listingsPer1k.toFixed(2)],
      ["Supply Score", m.supplyScore.toFixed(2)],
      ["Adjusted VR", m.adjustedVR.toFixed(2) + "%"],
    ];

    metrics.forEach(([label, value], i) => {
      const isLast = i === metrics.length - 1;
      addRow(
        '<div style="display:flex;justify-content:space-between;padding:7px 16px;border-bottom:' + (isLast ? 'none' : '1px solid #1e293b') + '">' +
          '<span style="font-size:12px;color:#94a3b8">' + label + '</span>' +
          '<span style="font-size:12px;font-weight:700;color:#e2e8f0;font-variant-numeric:tabular-nums">' + value + '</span>' +
        '</div>'
      );
    });

    // Bottom padding
    addRow('<div style="height:8px"></div>');

    // Render with staggered animation
    rows.forEach(({ html, delay }) => {
      const div = document.createElement("div");
      div.className = "map-info-row";
      div.style.animationDelay = delay + "ms";
      div.innerHTML = html;
      infoPanel.appendChild(div);
    });
  }

  // Expose so top-card clicks can trigger the same left-side panel as a map click.
  // A fresh reference is captured on every render of the map section.
  window._pp_showMapInfo = showMapInfo;

  mapContainer = container;

  // Init Leaflet after DOM insertion
  setTimeout(() => {
    const map = L.map(mapDiv, {
      center: mapSavedCenter || [-27, 134],
      zoom: mapSavedZoom || 5,
      minZoom: 4,
      maxZoom: 13,
      scrollWheelZoom: true,
      zoomControl: true
    });
    if (!mapSavedCenter) map.fitBounds([[-44, 112], [-10, 155]], { padding: [20, 20], animate: false });

    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: '\u00a9 <a href="https://carto.com/">CARTO</a>',
      subdomains: "abcd",
      maxZoom: 19
    }).addTo(map);

    leafletMap = map;
    mapCircles = [];

    allMarkets.forEach(m => {
      const geo = MARKET_GEO[m.name];
      if (!geo) return;
      const [lat, lng, radius] = geo;
      const tier = getTier(m.demandScore, m.runway, m.marketType);
      const quad = getQuadrant(m.demandScore, m.runway, m.marketType);
      const isActive = filteredNames.has(m.name);
      const isDimmed = hasFilter && !isActive;

      const circle = L.circle([lat, lng], {
        radius: radius * 1000,
        fillColor: tier.color,
        fillOpacity: isDimmed ? 0.08 : isActive && hasFilter ? 0.55 : 0.3,
        color: isDimmed ? "#1e293b" : isActive && hasFilter ? "#f1f5f9" : tier.color,
        weight: isDimmed ? 0.5 : isActive && hasFilter ? 2.5 : 1,
      }).addTo(map);

      const tipHtml =
        '<div class="map-tooltip-custom">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
            '<span style="font-size:14px;font-weight:800;color:#f1f5f9">' + m.name + '</span>' +
            '<span style="font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;background:' + tier.bg + ';color:' + tier.color + ';border:1px solid ' + tier.ring + '">' + tier.label + '</span>' +
          '</div>' +
          '<div style="font-size:9px;font-weight:600;padding:2px 6px;border-radius:3px;background:' + quad.bg + ';color:' + quad.color + ';display:inline-block;margin-bottom:8px;border:1px solid ' + quad.color + '33">' + quad.label + '</div>' +
          '<div class="map-tooltip-row"><span class="map-tooltip-label">Demand Score</span><span class="map-tooltip-value" style="color:' + tier.color + '">' + m.demandScore.toFixed(1) + '</span></div>' +
          '<div class="map-tooltip-row"><span class="map-tooltip-label">Runway</span><span class="map-tooltip-value">' + (m.runway * 100).toFixed(2) + '%</span></div>' +
          '<div class="map-tooltip-row"><span class="map-tooltip-label">DOM</span><span class="map-tooltip-value">' + m.dom + 'd</span></div>' +
          '<div class="map-tooltip-row"><span class="map-tooltip-label">Median Price</span><span class="map-tooltip-value">' + (m.medianPrice ? fmtPrice(m.medianPrice) : "\u2014") + '</span></div>' +
          '<div class="map-tooltip-row"><span class="map-tooltip-label">Rent/wk</span><span class="map-tooltip-value">$' + m.weeklyRent + '</span></div>' +
          '<div class="map-tooltip-row"><span class="map-tooltip-label">Rental Growth 36m</span><span class="map-tooltip-value">' + m.rentalGrowth36m.toFixed(2) + '%</span></div>' +
          '<div class="map-tooltip-row"><span class="map-tooltip-label">Rank</span><span class="map-tooltip-value">#' + m.dsRank + '</span></div>' +
        '</div>';

      circle.bindTooltip(tipHtml, { className:"map-tooltip-custom", direction:"right", offset:[10,0], sticky:true });

      circle.on("mouseover", function() {
        this.setStyle({ fillOpacity: isDimmed ? 0.3 : 0.6, weight: 3, color: "#f1f5f9" });
        this.bringToFront();
      });
      circle.on("mouseout", function() {
        const fn = filteredNames, hf = hasFilter, ia = fn.has(m.name), dm = hf && !ia;
        this.setStyle({
          fillOpacity: dm ? 0.08 : ia && hf ? 0.55 : 0.3,
          weight: dm ? 0.5 : ia && hf ? 2.5 : 1,
          color: dm ? "#1e293b" : ia && hf ? "#f1f5f9" : tier.color
        });
      });
      circle.on("click", function() { showMapInfo(m); });

      // Label
      let label = null;
      const labelIcon = L.divIcon({
        className: "map-region-label",
        html: '<div style="text-align:center;pointer-events:none;white-space:nowrap;font-family:Montserrat,sans-serif;' +
          (isDimmed ? 'opacity:0.12;' : '') + '">' +
          '<div style="font-size:11px;font-weight:700;color:#f1f5f9;text-shadow:0 0 4px #0f172a,0 0 8px #0f172a,0 0 2px #0f172a">' + m.name + '</div>' +
          '<div style="font-size:9px;font-weight:700;color:' + tier.color + ';text-shadow:0 0 4px #0f172a,0 0 8px #0f172a">' + m.demandScore.toFixed(1) + '</div>' +
        '</div>',
        iconSize: [0, 0],
        iconAnchor: [0, 8]
      });
      label = L.marker([lat, lng], { icon: labelIcon, interactive: false }).addTo(map);

      mapCircles.push({ circle, label, market: m });
    });

    if (hasFilter) {
      mapCircles.forEach(({circle, market}) => {
        if (filteredNames.has(market.name)) circle.bringToFront();
      });
    }
  }, 50);

  return container;
}


/* ============================================================================
   DETAIL PANEL
   ============================================================================ */
function detailPanel() {
  const mk = state.selected;
  if (!mk) return null;
  const tier = getTier(mk.demandScore, mk.runway, mk.marketType);
  const pt = state.tab;
  const ac = pt === "Houses" ? "var(--ds-houses)" : "var(--ds-units)";
  const acChipBg = pt === "Houses" ? "var(--ds-houses-bg)" : "var(--ds-units-bg)";
  const acChipFg = pt === "Houses" ? "var(--ds-houses-2)" : "var(--ds-units-2)";

  const metrics = [
    { l:"Population",          v: fmt(mk.population) },
    { l:"Active Listings",     v: fmt(mk.listings) },
    { l:"Listings / 1K Pop",   v: mk.listingsPer1k.toFixed(2) },
    { l:"Adjusted Vacancy",    v: mk.adjustedVR.toFixed(2) + "%" },
    { l:"Supply Score",        v: mk.supplyScore.toFixed(2) },
    { l: pt === "Houses" ? "DOM (Houses)" : "DOM (Units)", v: mk.dom + "d" },
    { l:"36mo Rental Growth",  v: mk.rentalGrowth36m.toFixed(2) + "%" },
    { l:"Weekly Rent",         v: "$" + mk.weeklyRent },
    { l:"Median Price",        v: mk.medianPrice ? fmtPrice(mk.medianPrice) : "N/A" },
    { l:"12mo Price Growth",   v: mk.priceGrowth12m.toFixed(1) + "%" },
    { l:"3mo Price Growth",    v: mk.priceGrowth3m.toFixed(1) + "%" },
    { l:"Runway",              v: (mk.runway * 100).toFixed(2) + "%" },
  ];

  const inCompare = state.compare.includes(mk.name);

  return h("div", {
    id: "detail-panel",
    className: "no-print",
    style: { position:"fixed", inset:"0", zIndex:"100", display:"flex", justifyContent:"flex-end" },
    onClick: () => setState({ selected: null })
  },
    h("div", { style: { position:"absolute", inset:"0", background:"rgba(0,0,0,0.6)", backdropFilter:"blur(4px)" } }),
    h("div", {
      style: {
        position:"relative", width:"420px", maxWidth:"90vw", height:"100%",
        overflowY:"auto",
        background:"linear-gradient(180deg, var(--ds-surface-2) 0%, var(--ds-indigo-deep) 100%)",
        padding:"32px", boxShadow:"-8px 0 40px rgba(0,0,0,0.5)",
        animation:"ds-slide-in 0.25s ease-out"
      },
      onClick: e => e.stopPropagation()
    },
      // close
      h("button", {
        className:"ds-icon-btn",
        style: { position:"absolute", top:"16px", right:"16px", background:"none",
          border:"1px solid var(--ds-surface-3)", color:"var(--ds-fg-dim)",
          cursor:"pointer", width:"28px", height:"28px", borderRadius:"6px",
          display:"inline-flex", alignItems:"center", justifyContent:"center" },
        onClick: () => setState({ selected: null })
      }, icon("x", 14)),

      // header
      h("div", { style:{ marginBottom:"24px" } },
        h("div", { style:{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"10px", flexWrap:"wrap" } },
          h("span", { style:{ fontSize:"11px", fontWeight:"700", color:ac, letterSpacing:"0.06em" } }, mk.state),
          h("span", { style:{
            fontSize:"10px", fontWeight:"700", padding:"2px 8px", borderRadius:"4px",
            background:acChipBg, color:acChipFg, letterSpacing:"0.06em", textTransform:"uppercase"
          } }, pt),
          badge(tier),
          h("span", { style:{ fontSize:"11px", color:"var(--ds-fg-dim)" } }, `#${mk.dsRank} of 36`)
        ),
        h("div", { style:{
          fontSize:"10px", fontWeight:"600", padding:"4px 10px", borderRadius:"5px", marginBottom:"10px",
          background: getQuadrant(mk.demandScore, mk.runway, mk.marketType).bg,
          color: getQuadrant(mk.demandScore, mk.runway, mk.marketType).color,
          border: `1px solid ${getQuadrant(mk.demandScore, mk.runway, mk.marketType).color}33`,
          display:"inline-block"
        } }, getQuadrant(mk.demandScore, mk.runway, mk.marketType).label),
        h("h2", { style:{
          fontSize:"28px", fontWeight:"800", color:"var(--ds-fg-2)",
          fontFamily:"var(--ds-font-display)", lineHeight:"1.1"
        } }, mk.name)

      h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px", marginBottom:"20px" } },

          h("div", { style:{ fontSize:"11px", color:"var(--ds-fg-muted)", marginBottom:"4px",
            fontWeight:"700", letterSpacing:"0.06em", textTransform:"uppercase" } }, "Demand Score"),
          h("div", { style:{ fontSize:"32px", fontWeight:"800", color:tier.color,
            fontVariantNumeric:"tabular-nums", lineHeight:"1" } }, mk.demandScore.toFixed(1)),
          h("div", { style:{ marginTop:"4px" } }, delta(mk.dsDiff, " vs prev"))),
        h("div", { style:{ background:"var(--ds-surface-3)", borderRadius:"10px", padding:"16px", textAlign:"center" } },
          h("div", { style:{ fontSize:"11px", color:"var(--ds-fg-muted)", marginBottom:"4px",
            fontWeight:"700", letterSpacing:"0.06em", textTransform:"uppercase" } }, "Runway"),
          h("div", { style:{ fontSize:"32px", fontWeight:"800",

            (mk.runway * 100).toFixed(2) + "%"),

      // actions
      h("div", { style:{ fontSize:"10px", fontWeight:"700", color:"var(--ds-fg-dim)", letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:"6px" } }, "Compare"),
      h("div", { style:{ display:"flex", gap:"8px", marginBottom:"24px" } },
        h("button", {
          className:"ds-icon-btn",
          style:{
            flex:"1", padding:"9px 12px", borderRadius:"8px",
            border:`1px solid ${inCompare ? "var(--ds-selection)" : "var(--ds-surface-4)"}`,
            background: inCompare ? "var(--ds-indigo-deep)" : "transparent",
            color: inCompare ? "var(--ds-indigo-lav)" : "var(--ds-fg-muted)",
            fontSize:"12px", fontWeight:"700", letterSpacing:"0.04em",
            cursor:"pointer", display:"inline-flex", alignItems:"center", justifyContent:"center", gap:"6px"
          },
          onClick: () => toggleCompare(mk.name)
        }, icon(inCompare ? "check" : "plus", 14),
           inCompare ? "In compare" : (state.compare.length >= 10 ? "Compare full" : "Compare"))
      ),

      // metrics
      h("div", { style:{ background:"var(--ds-surface-3)", borderRadius:"10px", padding:"16px", marginBottom:"16px" } },
        h("div", { style:{ display:"flex", alignItems:"center", gap:"6px", marginBottom:"12px",
          fontSize:"11px", color:"var(--ds-fg-muted)", fontWeight:"700", letterSpacing:"0.06em", textTransform:"uppercase" } },
          icon("bar-chart-2", 12), "Market Metrics"),
        ...metrics.map((m, i) => h("div", {
          style:{ display:"flex", justifyContent:"space-between", padding:"7px 0",
            borderBottom: i < metrics.length - 1 ? "1px solid var(--ds-surface-4)" : "none" }
        },
          h("span", { style:{ fontSize:"13px", color:"var(--ds-fg-muted)" } }, m.l),
          h("span", { style:{ fontSize:"13px", fontWeight:"700", color:"var(--ds-fg-3)",
            fontVariantNumeric:"tabular-nums" } }, m.v)))
      ),

      // MoM
      h("div", { style:{ background:"var(--ds-surface-3)", borderRadius:"10px", padding:"16px" } },
        h("div", { style:{ display:"flex", alignItems:"center", gap:"6px", marginBottom:"12px",
          fontSize:"11px", color:"var(--ds-fg-muted)", fontWeight:"700", letterSpacing:"0.06em", textTransform:"uppercase" } },
          icon("trending-up", 12), "Month on Month"),
        ...[
          { l:"Demand Score Δ",   v: delta(mk.dsDiff) },

}

function toggleCompare(name) {
  const idx = state.compare.indexOf(name);
  let next;
  if (idx >= 0) next = state.compare.filter(n => n !== name);
  else if (state.compare.length >= 10) next = [...state.compare.slice(1), name];
  else next = [...state.compare, name];
  setState({ compare: next });
}

      h("div", { style:{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"6px" } },

          display:"inline-flex", alignItems:"center", gap:"6px",
          fontSize:"11px", fontWeight:"700", letterSpacing:"0.12em",
          textTransform:"uppercase", color: ac

      h("h2", { style: {
        fontSize:"24px", fontWeight:"800", fontFamily:"var(--ds-font-display)",

      h("table", { style: { width:"100%", fontSize:"13px" } },

            ...items.map(m => {
              const tier = getTier(m.demandScore, m.runway, m.marketType);
              return h("th", { style: { textAlign:"right", padding:"8px 12px 10px",
                fontSize:"12px", fontWeight:"800", color:"var(--ds-fg-1)",
                borderBottom:"1px solid var(--ds-surface-4)", whiteSpace:"nowrap" } },

                h("div", { style:{ fontSize:"9px", fontWeight:"600", color:tier.color, marginTop:"2px" } }, tier.label)
              );
            })
          )
        ),
        h("tbody", {},
          ...metrics.map((r, i) => {
            const vals = items.map(m => getVal(m, r));

            // Determine best value
            let bestIdx = -1;
            if (r.kind !== "text" && r.kind !== "delta") {
              const nums = vals.map(v => typeof v === "number" ? v : NaN);
              if (nums.some(n => !isNaN(n))) {
                const higherWins = r.kind === "score-high" || r.kind === "num-high";
                const best = higherWins ? Math.max(...nums.filter(n => !isNaN(n))) : Math.min(...nums.filter(n => !isNaN(n)));
                bestIdx = nums.indexOf(best);
                // Only highlight if values differ
                if (nums.every(n => n === nums[0])) bestIdx = -1;
              }
            }

            return h("tr", {
              style: { background: i % 2 === 0 ? "var(--ds-surface-2)" : "var(--ds-surface-1)" }
            },
              h("td", { style: {
                padding:"8px 12px", fontSize:"11px", color:"var(--ds-fg-muted)",

                position:"sticky", left:"0",

                zIndex:"1", whiteSpace:"nowrap"
              } }, r.l),
              ...vals.map((v, j) => cell(v, j === bestIdx, r.kind, r.fmt))
            );
          })
        )
      )
    )
  );
}

/* ============================================================================
   FILTER
   ============================================================================ */
function getFiltered() {
  const markets = state.tab === "Houses" ? state.houseData : state.unitData;
  if (!markets) return [];
  return markets.filter(m => {
    if (state.sf !== "All" && m.state !== state.sf) return false;
    if (state.tf !== "All" && getTier(m.demandScore, m.runway, m.marketType).label !== state.tf) return false;
    if (state.mf !== "All" && m.marketType !== state.mf) return false;
    if (state.search && !m.name.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  }).sort((a, b) => {
    const av = a[state.sortField], bv = b[state.sortField];
    if (typeof av === "string") return state.sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    return state.sortDir === "asc" ? av - bv : bv - av;
  });
}
