<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy &mdash; Performance Property</title>
<link rel="icon" href="../assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
<!-- OS chrome: mode/period/shade + legacy data-theme bridge -->
<script src="../shared/os-chrome.js?v=ea374003"></script>
<link rel="stylesheet" href="../shared/os-theme.css?v=bcea6d52"/>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   PERFORMANCE ACADEMY — the staff learning tool.
   A shelf of "videotape" volumes; each volume is chapters of scenes: plain
   text, infographics, PLAYABLE charts that pause on beats, and quizzes.
   Course content lives in the academy_* tables (mig 121) and is fetched at
   runtime behind auth — the narrative is proprietary and this repo is public,
   so NO course text ships in this file. Charts use the SAME maths and
   thresholds as the live tools (shared/academy-math.js, runway-calc.js,
   vr-forecast-calc.js, market-clock.js) so a learner sees the dashboard's
   numbers, not approximations.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --ac-teal:#00A0B4; --ac-deep:#171B24; --ac-blue:#54A6DE; --ac-euc:#3E7967; --ac-yel:#FFA91F; --ac-green:#71B357; --ac-red:#E72347;
  --ac-panel:#fbfcfd; --ac-panel-ink:#1c2230; --ac-panel-mut:#63666A; --ac-panel-line:rgba(0,0,0,.08);
  --ac-smooth:#0C186E; --ac-workforce:#ED5A75;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat',system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit}
.ac-wrap{max-width:1180px;margin:0 auto;padding:22px 22px 28px}
.ac-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.ac-crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);flex:1;min-width:200px}
.ac-crumbs b{color:var(--tx)}
.ac-crumbs a{color:var(--ac-teal);text-decoration:none;font-weight:700;cursor:pointer}
.ac-btn{appearance:none;border:1px solid var(--brd);background:var(--field);color:var(--tx);border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s}
.ac-btn:hover{border-color:var(--ac-teal)}
.ac-btn.primary{background:var(--ac-teal);border-color:var(--ac-teal);color:#fff}
.ac-btn.ghost{background:transparent}
.ac-btn:disabled{opacity:.45;cursor:default}
.ac-pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--ac-teal);color:#fff}

/* ── shelf ────────────────────────────────────────────────────────────── */
.ac-shelf h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-0.01em}
.ac-shelf .sub{margin:6px 0 18px;font-size:13px;color:var(--mut);max-width:760px;line-height:1.55}
.ac-stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.ac-stat{background:var(--win);border:1px solid var(--win-brd);border-radius:12px;padding:12px 16px;min-width:170px}
.ac-stat .n{font-size:22px;font-weight:800;line-height:1}
.ac-stat .l{font-size:11.5px;color:var(--mut);margin-top:4px}
.ac-group{margin-bottom:30px}
.ac-group h2{margin:0 0 4px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ac-group .hint{margin:0 0 14px;font-size:12.5px;color:var(--mut)}
.ac-tapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:18px}
/* a cassette case: dark shell (an object — the same in both themes), paper label, two reels */
.ac-tape{appearance:none;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 12px 12px 20px;text-align:left;color:#F4F6F8;cursor:pointer;position:relative;
  background:linear-gradient(180deg,#242b38,#171b24);box-shadow:0 14px 30px rgba(0,0,0,.32);transition:transform .18s ease,box-shadow .18s ease}
.ac-tape:hover{transform:translateY(-3px);box-shadow:0 20px 38px rgba(0,0,0,.4)}
.ac-tape .spine{position:absolute;left:0;top:0;bottom:0;width:9px;border-radius:10px 0 0 10px;background:var(--accent,#00A0B4)}
.ac-tape .lbl{background:#F6F1E7;color:#171B24;border-radius:6px;padding:10px 12px 9px;min-height:86px;display:flex;flex-direction:column;gap:3px;position:relative}
.ac-tape .lbl .vol{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#63666A}
.ac-tape .lbl .t{font-size:14.5px;font-weight:800;line-height:1.25}
.ac-tape .lbl .s{font-size:11px;color:#4A5160;line-height:1.4;margin-top:2px}
.ac-tape .lbl .mins{position:absolute;right:10px;top:9px;font-size:10.5px;font-weight:700;color:#63666A}
.ac-tape .win{display:flex;justify-content:space-between;align-items:center;padding:7px 22px;background:#0d1016;border-radius:6px;margin-top:10px;border:1px solid rgba(255,255,255,.06)}
.ac-tape .reel{width:34px;height:34px;border-radius:50%;border:7px solid #3a4150;background:#0d1016;position:relative}
.ac-tape .reel::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#1d2330}
.ac-tape .tapebar{flex:1;height:3px;background:#3a4150;margin:0 10px}
.ac-tape .ring{position:absolute;right:12px;bottom:14px;width:34px;height:34px}
.ac-tape .ring text{font-size:9px;font-weight:800;fill:#F4F6F8}
.ac-tape .new{position:absolute;right:12px;top:-8px}
.ac-tape .ico{position:absolute;left:24px;bottom:16px;font-size:16px}
.ac-empty{padding:40px 20px;text-align:center;color:var(--mut);font-size:13px}

/* ── tape view ─────────────────────────────────────────────────────────── */
.ac-tapeview{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.ac-tapeview{grid-template-columns:1fr}}
.ac-side{background:var(--win);border:1px solid var(--win-brd);border-radius:16px;padding:18px;position:sticky;top:12px}
.ac-side .vol{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ac-teal)}
.ac-side h2{margin:4px 0 6px;font-size:19px;font-weight:800;line-height:1.25}
.ac-side .sum{font-size:12.5px;color:var(--mut);line-height:1.55;margin-bottom:12px}
.ac-prog{height:6px;border-radius:999px;background:var(--field);overflow:hidden;margin:6px 0 14px}
.ac-prog .fill{height:100%;background:var(--ac-teal);transition:width .3s}
.ac-chaps{display:flex;flex-direction:column;gap:6px}
.ac-chap{appearance:none;border:1px solid var(--brd);background:var(--field);color:var(--tx);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:12.5px;font-weight:600}
.ac-chap:hover{border-color:var(--ac-teal)}
.ac-chap.on{border-color:var(--ac-teal);background:rgba(0,160,180,.12)}
.ac-chap .num{width:22px;height:22px;border-radius:50%;background:var(--glass-hi);display:grid;place-items:center;font-size:10.5px;font-weight:800;flex:none}
.ac-chap.done .num{background:var(--ac-green);color:#fff}
.ac-chap .ttl{flex:1;line-height:1.3}
.ac-chap .sc{font-size:10.5px;color:var(--mut);font-weight:700}

/* ── player ────────────────────────────────────────────────────────────── */
.ac-player{background:var(--win);border:1px solid var(--win-brd);border-radius:16px;padding:26px 30px 18px;min-height:560px;display:flex;flex-direction:column}
.ac-player .kick{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.ac-scene{flex:1}
.ac-scene h2{margin:0 0 14px;font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-0.01em}
.ac-body{font-size:15.5px;line-height:1.7;max-width:760px}
.ac-body p{margin:0 0 14px}
.ac-body ul{margin:0 0 14px 20px;padding:0}
.ac-body li{margin:4px 0}
.ac-body h3{margin:18px 0 8px;font-size:15px;font-weight:800;letter-spacing:.02em}
.ac-callout{border-left:4px solid var(--ac-teal);background:rgba(0,160,180,.09);border-radius:0 10px 10px 0;padding:12px 16px;margin:0 0 14px;font-size:14.5px;line-height:1.6}
.ac-term{border-bottom:1.5px dotted var(--ac-teal);cursor:help;color:inherit}
/* sticky so Back / Next stay in reach on a laptop while a tall chart scene scrolls */
.ac-bar{display:flex;align-items:center;gap:10px;margin:22px -30px -18px;padding:12px 30px 14px;border-top:1px solid var(--brd-soft);position:sticky;bottom:0;background:var(--flat);border-radius:0 0 16px 16px;z-index:2}
.ac-dots{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.ac-dots span{width:8px;height:8px;border-radius:50%;background:var(--field);border:1px solid var(--brd);cursor:pointer}
.ac-dots span.on{background:var(--ac-teal);border-color:var(--ac-teal)}
.ac-dots span.seen{background:var(--mut)}
.ac-cap{font-size:12.5px;color:var(--mut);line-height:1.55;margin-top:10px}
.ac-note{font-size:11.5px;color:var(--mut);line-height:1.5;margin-top:8px}

/* charts sit on a light panel in both themes — the live Runway v Demand chart does the same */
.ac-chart{background:var(--ac-panel);color:var(--ac-panel-ink);border-radius:12px;border:1px solid var(--ac-panel-line);position:relative;overflow:hidden}
.ac-chart svg{display:block;width:100%;height:auto}
.ac-chart .month{position:absolute;right:16px;top:10px;font-size:13px;font-weight:800;color:var(--ac-panel-mut);letter-spacing:.02em}
.ac-ctl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.ac-ctl .scrub{flex:1;position:relative;min-width:220px;height:28px;display:flex;align-items:center}
.ac-ctl input[type=range]{width:100%;accent-color:var(--ac-teal);margin:0}
.ac-ctl .marks{position:absolute;left:8px;right:8px;top:0;height:8px;pointer-events:none}
.ac-ctl .marks span{position:absolute;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ac-yel);border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.ac-ctl .marks span.seen{background:var(--ac-teal)}
.ac-ctl select{background:var(--flat);color:var(--tx);border:1px solid var(--brd);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700}
.ac-ctl .lbl{font-size:12.5px;font-weight:800;min-width:78px;text-align:right}
.ac-beat{position:absolute;left:16px;bottom:16px;max-width:420px;background:rgba(23,27,36,.94);color:#F4F6F8;border-radius:12px;padding:14px 16px 12px;box-shadow:0 14px 30px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);font-size:13px;line-height:1.55;z-index:3}
.ac-beat .at{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ac-yel)}
.ac-beat .t{font-size:15px;font-weight:800;margin:3px 0 6px}
.ac-beat p{margin:0 0 8px}
.ac-beat .ac-term{border-bottom-color:#7ed3dc}
.ac-beat .go{margin-top:6px;display:flex;gap:8px;align-items:center}
.ac-beat .go .ac-btn{background:var(--ac-teal);border-color:var(--ac-teal);color:#fff}
.ac-beat .go small{color:#C6CCD6}
.ac-side-panel{background:var(--win);border:1px solid var(--win-brd);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.55}
.ac-side-panel .h{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.ac-side-panel .big{font-size:20px;font-weight:800;margin:4px 0 6px}
.ac-lights{display:inline-flex;gap:5px;vertical-align:middle;margin-left:6px}
.ac-lights i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.ac-lights i.GREEN{background:#71B357}.ac-lights i.ORANGE{background:#FFA91F}.ac-lights i.RED{background:#E72347}
.ac-two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.ac-two{grid-template-columns:1fr}}
.ac-ctrls{display:flex;flex-direction:column;gap:12px}
.ac-ctrls label{font-size:12px;font-weight:700;color:var(--mut);display:flex;justify-content:space-between}
.ac-ctrls label b{color:var(--tx)}
.ac-ctrls input[type=range]{width:100%;accent-color:var(--ac-teal)}
.ac-kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:13px}
.ac-kv .k{color:var(--mut)}
.ac-kv .v{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.ac-meter{height:18px;border-radius:999px;background:var(--field);position:relative;overflow:visible;margin:8px 0 22px}
.ac-meter .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ED5A75,#FFA91F 45%,#71B357 60%,#4DB648)}
.ac-meter .mark{position:absolute;top:-4px;width:2px;height:26px;background:var(--tx)}
.ac-meter .mark small{position:absolute;top:28px;left:-20px;width:44px;text-align:center;font-size:10px;font-weight:800;color:var(--mut)}
.ac-box{background:var(--win);border:1px solid var(--win-brd);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.5}
.ac-box .n{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.ac-box .l{color:var(--mut);font-size:11.5px}
.ac-flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:stretch}
.ac-arrow{display:grid;place-items:center;color:var(--mut);font-size:20px}
.ac-quiz .q{background:var(--win);border:1px solid var(--win-brd);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.ac-quiz .q .qt{font-weight:800;font-size:14.5px;margin-bottom:8px;line-height:1.4}
.ac-quiz .opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:13.5px;line-height:1.45;border:1px solid transparent}
.ac-quiz .opt:hover{background:var(--field)}
.ac-quiz .opt.ok{border-color:var(--ac-green);background:rgba(113,179,87,.14)}
.ac-quiz .opt.bad{border-color:var(--ac-red);background:rgba(231,35,71,.12)}
.ac-quiz .why{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.5;padding-left:2px}
.ac-quiz .score{font-size:16px;font-weight:800;margin:6px 0 10px}
.ac-compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:900px){.ac-compare{grid-template-columns:1fr}}
.ac-compare>div{background:var(--win);border:1px solid var(--win-brd);border-radius:12px;padding:16px 18px}
.ac-compare h2{font-size:18px}

/* glossary popover + drawer */
.ac-pop{position:fixed;z-index:99999;max-width:360px;background:#0f172a;color:#e6edf7;border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid rgba(148,163,184,.28);pointer-events:auto}
.ac-pop b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7ed3dc;margin-bottom:4px}
.ac-pop .also{margin-top:6px;font-size:11px;color:#C6CCD6}
.ac-drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--flat);border-left:1px solid var(--brd);box-shadow:var(--shadow-big);z-index:9999;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s var(--ease)}
.ac-drawer.open{transform:none}
.ac-drawer .hd{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.ac-drawer .hd h3{margin:0;flex:1;font-size:16px;font-weight:800}
.ac-drawer input{margin:0 18px 10px;padding:9px 12px;border-radius:9px;border:1px solid var(--brd);background:var(--field);color:var(--tx);font:600 13px 'Montserrat',sans-serif}
.ac-drawer .list{overflow:auto;padding:0 18px 90px}
.ac-drawer .term{padding:10px 0;border-bottom:1px solid var(--brd-soft)}
.ac-drawer .term b{display:block;font-size:13px}
.ac-drawer .term div{font-size:12.5px;color:var(--tx2);line-height:1.5;margin-top:2px}
.ac-drawer .term small{color:var(--mut);font-size:11px}

/* the logo closes every page, bottom-right, AFTER the content — never under it */
.ac-logo{max-width:1180px;margin:0 auto;padding:0 22px 18px;display:flex;justify-content:flex-end}
.ac-logo img{height:22px;display:block;opacity:.9}
.ac-logo .lt{display:none}
[data-theme="light"] .ac-logo .dk{display:none}
[data-theme="light"] .ac-logo .lt{display:block}
.ac-err{padding:18px;border-radius:12px;background:rgba(231,35,71,.1);border:1px solid rgba(231,35,71,.35);font-size:13px;line-height:1.5}
.ac-loading{padding:40px;text-align:center;color:var(--mut);font-size:13px}
@media (prefers-reduced-motion: reduce){.ac-tape,.ac-drawer{transition:none}}
</style>
</head>
<body>

<div class="ac-wrap" id="acApp"><div class="ac-loading">Loading the Academy…</div></div>

<div class="ac-logo" aria-hidden="true">
  <img class="dk" src="../assets/Reports/logo-color.png" alt="Performance Property"/>
  <img class="lt" src="../assets/Reports/logo-color-black.png" alt="Performance Property"/>
</div>
<div class="ac-pop" id="acPop" hidden></div>
<aside class="ac-drawer" id="acDrawer" aria-label="Glossary">
  <div class="hd"><h3>Glossary</h3><button class="ac-btn ghost" id="acDrawerClose">Close</button></div>
  <input id="acDrawerSearch" placeholder="Search a term…" autocomplete="off"/>
  <div class="list" id="acDrawerList"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="../shared/supabase-client.js?v=afefc0c4"></script>
<script src="../shared/tool-registry.js?v=92a5b7bf"></script>
<script src="../shared/desktop-pins.js?v=e2416017"></script>
<script src="../shared/auth.js?v=7dce203e"></script>
<script src="../shared/auth-gate.js?v=003cdc01"></script>
<script src="../shared/pp-telemetry.js?v=a1e39d4f"></script>
<script src="../shared/fit-screen.js?v=1ea58579"></script>
<script src="../shared/market-clock.js?v=233acefc"></script>
<script src="../shared/runway-calc.js?v=216fb1a0"></script>
<script src="../shared/vr-forecast-calc.js?v=819331db"></script>
<script src="../shared/academy-math.js?v=f844a82f"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js" integrity="sha384-su5kReKyYlIFrI62mbQRKXHzFobMa7BHp1cK6julLPbnYcCW9NIZKJiTODjLPeDh" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
'use strict';
PP_OS.initChrome({ name: 'Academy', section: 'vault', backHref: '../',
  actions: [{ id: 'acGlossaryBtn', label: 'Glossary', title: 'Every term, in plain words' }] });

var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = window.PP_escapeHtml || function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var AM = window.AcademyMath, RC = window.RunwayCalc, VC = window.VrForecastCalc;
var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
var MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var monLabel = function (ym) { var m = String(ym).match(/^(\d{4})-(\d{2})/); return m ? MONS[+m[2] - 1] + ' ' + m[1] : String(ym); };
var fmtPct = function (v, d) { return (v == null || isNaN(v)) ? '—' : (v * 100).toFixed(d == null ? 0 : d) + '%'; };
var fmtInt = function (v) { return (v == null || isNaN(v)) ? '—' : Math.round(v).toLocaleString('en-AU'); };
var fmtMoney = function (v) { if (v == null || isNaN(v)) return '—'; v = +v; return v >= 1e6 ? '$' + (v / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M' : '$' + Math.round(v / 1000) + 'K'; };
var fmtMoneyFull = function (v) { return (v == null || isNaN(v)) ? '—' : '$' + Math.round(v).toLocaleString('en-AU'); };
var slugify = function (s) { return String(s || '').trim().toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); };
var parseNum = function (v) { if (typeof v === 'number') return v; var n = +String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''); return isFinite(n) ? n : null; };

/* market type (smooth | workforce) per slug, from the Property Clock's markers */

}
async function targetRate() { var cfg = await getRunwayCfg(); var r = cfg.rates && cfg.rates.forecast && +cfg.rates.forecast.rate; return (r && r > 0.01 && r < 0.15) ? r : 0.0489; }

  state.user = u; state.writer = (typeof isAdmin === 'function') && isAdmin();

function chaptersOf(slug) { return state.chapters.filter(function (c) { return c.volume_slug === slug; }).sort(function (a, b) { return a.sort - b.sort; }); }

/* ── markdown-lite + glossary ──────────────────────────────────────────── */
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function (_, term, shown) { var t = term.trim(); var known = !!state.glossary[t.toLowerCase()]; return known ? '<span class="ac-term" data-term="' + esc(t) + '">' + esc(shown || t) + '</span>' : esc(shown || t); });
  return s;
}
function md(text) {
  var blocks = String(text || '').replace(/\r\n/g, '\n').split(/\n\s*\n/);
  return blocks.map(function (b) {
    var lines = b.split('\n').filter(function (l) { return l.trim().length; });
    if (!lines.length) return '';
    if (lines.every(function (l) { return /^\s*-\s+/.test(l); })) return '<ul>' + lines.map(function (l) { return '<li>' + inline(l.replace(/^\s*-\s+/, '')) + '</li>'; }).join('') + '</ul>';
    if (/^\s*>\s?/.test(lines[0])) return '<div class="ac-callout">' + inline(lines.map(function (l) { return l.replace(/^\s*>\s?/, ''); }).join(' ')) + '</div>';
    if (/^\s*##\s+/.test(lines[0])) return '<h3>' + inline(lines[0].replace(/^\s*##\s+/, '')) + '</h3>' + (lines.length > 1 ? '<p>' + inline(lines.slice(1).join(' ')) + '</p>' : '');
    return '<p>' + inline(lines.join(' ')) + '</p>';
  }).join('');
}
var popTimer = null;
function zoomFactor() { return parseFloat(getComputedStyle(document.documentElement).zoom) || 1; }
function showPop(el, term) {
  var g = state.glossary[String(term).toLowerCase()]; if (!g) return;
  var pop = $('#acPop'); pop.hidden = false;
  pop.innerHTML = '<b>' + esc(g.term) + '</b>' + esc(g.definition) + ((g.see_also || []).length ? '<div class="also">See also: ' + g.see_also.map(esc).join(' · ') + '</div>' : '');
  var z = zoomFactor(), r = el.getBoundingClientRect(), vw = window.innerWidth / z, vh = window.innerHeight / z;
  var x = r.left / z, y = r.bottom / z + 8;
  pop.style.left = '0px'; pop.style.top = '0px';
  var pw = pop.offsetWidth, ph = pop.offsetHeight;
  if (x + pw > vw - 8) x = Math.max(4, vw - pw - 8);
  if (y + ph > vh - 8) y = r.top / z - ph - 8;
  pop.style.left = x + 'px'; pop.style.top = Math.max(4, y) + 'px';
}
function hidePop() { var pop = $('#acPop'); if (pop) pop.hidden = true; }
function bindTerms(root) {
  root.querySelectorAll('.ac-term').forEach(function (el) {
    el.addEventListener('mouseenter', function () { clearTimeout(popTimer); showPop(el, el.dataset.term); });
    el.addEventListener('mouseleave', function () { popTimer = setTimeout(hidePop, 220); });
    el.addEventListener('click', function (e) { e.stopPropagation(); showPop(el, el.dataset.term); });
  });
}
document.addEventListener('click', function (e) { if (!e.target.closest('.ac-pop') && !e.target.closest('.ac-term')) hidePop(); });
var pop = $('#acPop'); pop.addEventListener('mouseenter', function () { clearTimeout(popTimer); }); pop.addEventListener('mouseleave', function () { popTimer = setTimeout(hidePop, 220); });
function openDrawer() { hidePop(); $('#acDrawer').classList.add('open'); renderDrawer(''); setTimeout(function () { $('#acDrawerSearch').focus(); }, 60); }
function renderDrawer(q) {

  $('#acDrawerList').innerHTML = list.length ? list.map(function (g) { return '<div class="term"><b>' + esc(g.term) + '</b><div>' + esc(g.definition) + '</div>' + ((g.see_also || []).length ? '<small>See also: ' + g.see_also.map(esc).join(' · ') + '</small>' : '') + '</div>'; }).join('') : '<div class="ac-empty">No term matches.</div>';

/* ── routing ───────────────────────────────────────────────────────────── */
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  var h = location.hash.replace(/^#\/?/, '');
  var parts = h.split('/').filter(Boolean);
  destroyPlayer();
  if (parts[0] === 'v' && parts[1]) {
    state.vol = state.volumes.find(function (v) { return v.slug === parts[1]; }) || null;
    if (!state.vol) { state.view = 'shelf'; return render(); }
    var cs = chaptersOf(state.vol.slug);
    state.chap = parts[2] ? (cs.find(function (c) { return c.id === parts[2]; }) || null) : null;
    state.scene = Math.max(0, parseInt(parts[3] || '0', 10) || 0);
    state.view = state.chap ? 'player' : 'tape';
  } else { state.view = 'shelf'; state.vol = null; state.chap = null; state.scene = 0; }
  render();
}
window.addEventListener('hashchange', route);

/* ── render: shelf ─────────────────────────────────────────────────────── */
var GROUP_ORDER = ['Foundations', 'Case studies', 'Regions', 'Behind the numbers'];
var GROUP_HINT = { 'Foundations': 'Start here — the ideas every other volume builds on', 'Case studies': 'Real markets, real months, what the tools showed and what the team did', 'Regions': 'One tape per market, generated from its own data', 'Behind the numbers': 'Where the numbers come from and how to read the tools' };
function ringSvg(pct) { var r = 14, c = 2 * Math.PI * r; return '<svg class="ring" viewBox="0 0 34 34"><circle cx="17" cy="17" r="' + r + '" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/><circle cx="17" cy="17" r="' + r + '" fill="none" stroke="#00A0B4" stroke-width="3" stroke-dasharray="' + (c * pct).toFixed(1) + ' ' + c.toFixed(1) + '" stroke-linecap="round" transform="rotate(-90 17 17)"/><text x="17" y="21" text-anchor="middle">' + Math.round(pct * 100) + '%</text></svg>'; }

      '<div class="ac-stats">' +

  mountScene(s, $('#acScene'));

/* ── scenes ────────────────────────────────────────────────────────────── */
async function mountScene(s, host) {
  try {
    if (!s) { host.innerHTML = '<div class="ac-empty">Nothing here yet.</div>'; return; }
    if (s.type === 'text') host.innerHTML = '<h2>' + esc(s.title || '') + '</h2><div class="ac-body">' + md(s.body) + '</div>';
    else if (s.type === 'infographic') await mountInfographic(s, host);
    else if (s.type === 'chart-play') await mountChartPlay(s, host);
    else if (s.type === 'quiz') mountQuiz(s, host);
    else if (s.type === 'compare') await mountCompare(s, host);
    else host.innerHTML = '<div class="ac-err">Unknown scene type “' + esc(s.type) + '”.</div>';
    bindTerms(host);
  } catch (e) { host.innerHTML = '<div class="ac-err"><b>This scene could not load.</b><br>' + esc(e && e.message || e) + '</div>'; }
}
async function mountCompare(s, host) {
  host.innerHTML = '<div class="ac-compare"><div id="acCmpL"></div><div id="acCmpR"></div></div>' + (s.caption ? '<div class="ac-cap">' + inline(s.caption) + '</div>' : '');
  await mountScene(s.left, $('#acCmpL')); await mountScene(s.right, $('#acCmpR'));
}

/* quiz — passes at 80%; a pass completes the chapter */

    return '<div class="q" data-q="' + qi + '"><div class="qt">' + (qi + 1) + '. ' + inline(q.q) + '</div>' + (q.options || []).map(function (o, oi) { return '<label class="opt"><input type="radio" name="q' + qi + '" value="' + oi + '"><span>' + inline(o) + '</span></label>'; }).join('') + '<div class="why" hidden></div></div>';
  }).join('') + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="ac-btn primary" id="acQuizGo">Check my answers</button><span class="score" id="acQuizScore"></span></div></div>';
  $('#acQuizGo').addEventListener('click', async function () {
    var right = 0;
    qs.forEach(function (q, qi) {

/* the dial with a hand that walks between the beats' hours */
async function buildClockPlay(s, host, note) {

  beats.forEach(function (b, i) { b._frame = i; });
  host.innerHTML = '<div class="month" id="acMonth"></div><div class="ac-two" style="padding:12px"><div id="acClockHost" style="position:relative"></div><div class="ac-side-panel" id="acClockPanel" style="background:#fff;color:#1c2230;border-color:rgba(0,0,0,.08)"></div></div>';
  var dialHost = $('#acClockHost', host);
  await window.PP_MARKET_CLOCK.render(dialHost, { title: 'Market Position Clock' });
  var V = window.PP_MARKET_CLOCK.VIEW, cx = V.cx, cy = V.cy;
  var over = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); over.setAttribute('viewBox', '0 0 ' + V.w + ' ' + V.h); over.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none';
  over.innerHTML = '<line id="acHand" x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="' + (cy - 215) + '" stroke="#171B24" stroke-width="7" stroke-linecap="round"/><circle id="acTip" cx="' + cx + '" cy="' + (cy - 215) + '" r="13" fill="#fff" stroke="#171B24" stroke-width="5"/><circle cx="' + cx + '" cy="' + cy + '" r="9" fill="#171B24"/>';
  dialHost.appendChild(over);
  var hand = $('#acHand', over), tip = $('#acTip', over), panel = $('#acClockPanel', host);
  var current = beats[0].hour;
  function setHour(h) { var deg = ((h % 12) * 30); var a = (deg - 90) * Math.PI / 180; var x2 = cx + 215 * Math.cos(a), y2 = cy + 215 * Math.sin(a); hand.setAttribute('x2', x2); hand.setAttribute('y2', y2); tip.setAttribute('cx', x2); tip.setAttribute('cy', y2); }
  function draw(i) {

    d3.select({}).transition().duration(700).tween('hand', function () { var ip = d3.interpolateNumber(current, b.hour); return function (t) { setHour(ip(t)); }; }).on('end', function () { current = b.hour; });

  return { frames: beats.map(function (b, i) { return { key: String(i), label: b.at === 'now' ? 'Today' : (/^\d{4}-\d{2}/.test(b.at) ? monLabel(b.at) : String(b.at)) }; }), draw: draw, highlight: function () {}, clearHighlight: function () {} };
}
