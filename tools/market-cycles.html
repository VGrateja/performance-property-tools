<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Cycles &mdash; Performance Property</title>
<link rel="icon" href="../assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../shared/os-chrome.js?v=ea374003"></script>
<link rel="stylesheet" href="../shared/os-theme.css?v=bcea6d52"/>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   MARKET CYCLES — two charts for the client presentation (Saskia, 2026-11-17).

     ?view=falls    the current fall in five-capital home values beside the five
                    biggest falls since 1980, each from its own peak (= 100)
     ?view=growth   "Rolling capital growth": which capital's house (or unit) prices
                    have grown fastest, year by year: rolling 10 or 7.5 years, or
                    since each capital's first record; as a yearly rate or the total

   ?embed=1 draws one chart at 1280 x 720 with no app bar, for a slide
   (Presentation > Add embed). ?theme=light|dark picks the ground; an embed is
   dark unless told otherwise, the page itself follows the OS shade.

   Reads only:
     forge_cotality    row cl_capital_history — the eight capitals, monthly
                       January 1980 to June 2018 (scripts/build-cl-capital-history.mjs)
     forge_cl_suburbs  level `capital` — the same figures from July 2018, so a
                       new Cotality month shows here with no further step
   Everything drawn is worked out in the page from those two.
   ═══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:transparent;color:var(--tx);min-height:100vh;font-family:'Montserrat','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font-family:inherit}

.cy-page{max-width:1320px;margin:0 auto;padding:18px 20px 40px}
.cy-tabs{display:flex;gap:8px;margin:0 0 14px}
.cy-tab{padding:8px 16px;border-radius:999px;border:1px solid var(--line,rgba(255,255,255,.14));background:transparent;color:var(--tx2);font-size:13px;font-weight:600;cursor:pointer}
.cy-tab.on{background:#00A0B4;border-color:#00A0B4;color:#fff}

/* the slide: every colour below is one of these tokens, light and dark */
.cy{--bg:#171B24;--ink:#FFFFFF;--ink2:#C9CFDA;--mut:#8F98A8;--rule:rgba(255,255,255,.14);--grid:rgba(255,255,255,.08);--tile:rgba(255,255,255,.05);--tileline:rgba(255,255,255,.12);
  --hot:#FFA91F;--teal:#00A0B4;--buy:#7E8CF1;--buyink:#171B24;
  --c1:#54A6DE;--c2:#C77DD6;--c3:#5DAC96;--c4:#F08FA3;--c5:#8FA3BF;
  /* one colour per capital (2026-11-18): a step of the brand's own tone ramps for each, chosen as the eight that sit
     furthest apart on this ground. Every bar and strip cell also carries the capital's name, so colour never works alone. */
  --syd:#98C6EB;--mel:#00A3CC;--bne:#CA1637;--adl:#AB36AB;--per:#88C072;--hba:#3E7967;--drw:#F59700;--cbr:#5A6BED;
  position:relative;width:1280px;height:720px;background:var(--bg);color:var(--ink);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;padding:30px 44px 18px}
.cy[data-ground="light"]{--bg:#FFFFFF;--ink:#171B24;--ink2:#3F4650;--mut:#63666A;--rule:rgba(23,27,36,.16);--grid:rgba(23,27,36,.08);--tile:rgba(23,27,36,.035);--tileline:rgba(23,27,36,.12);
  --hot:#D98600;--teal:#00869A;--buy:#233AE7;--buyink:#FFFFFF;
  --c1:#2B7CB5;--c2:#9A2E9A;--c3:#3E7967;--c4:#C4183A;--c5:#63666A;
  --syd:#318DD8;--mel:#00627A;--bne:#810E23;--adl:#AB36AB;--per:#4D7F39;--hba:#5DAC96;--drw:#E08A00;--cbr:#233AE7}
.cy-fit{transform-origin:top left}
body.embed-mode{overflow:hidden;background:transparent}
body.embed-mode .appbar{display:none!important}
body.embed-mode .cy-page{max-width:none;margin:0;padding:0}
body.embed-mode .cy-tabs{display:none}
body.embed-mode .cy{border-radius:0}

.cy-eyebrow{font-size:13px;font-weight:600;color:var(--teal)}
.cy h1{margin:5px 0 0;font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.012em;text-wrap:balance}
.cy-titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.cy-titlerow .cy-buykey{margin-bottom:6px}
.cy-buykey{display:inline-flex;align-items:center;gap:8px;flex:none;font-size:12px;font-weight:500;color:var(--ink2)}
.cy-buykey i{font-style:normal;background:var(--buy);color:var(--buyink);font-size:11px;font-weight:700;line-height:1;padding:4px 8px;border-radius:999px}
.cy-key{margin:8px 0 0;font-size:14.5px;line-height:1.4;font-weight:600;color:var(--hot)}
.cy-body{flex:1;min-height:0;display:flex;gap:26px;margin-top:14px}
.cy-chart{flex:1;min-width:0;position:relative}
.cy-chart>div:first-child{position:absolute;inset:0}
.cy-foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:28px;font-size:10px;line-height:1.5;color:var(--mut)}
.cy-foot img{height:22px;display:block;flex:none}
.cy-foot div{text-wrap:balance}
.cy-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink2);background:var(--bg);z-index:5;text-align:center;padding:40px}

/* falls: the legend on the right, the three-month pace below */
.cy-legend{width:232px;flex:none;display:flex;flex-direction:column;justify-content:center;gap:11px}
.cy-leg{display:grid;grid-template-columns:22px 1fr;column-gap:10px;align-items:start}
.cy-leg i{height:3px;border-radius:2px;margin-top:9px;display:block}
.cy-leg b{font-size:14px;font-weight:700;color:var(--ink)}
.cy-leg b span{font-weight:600;color:var(--ink2);margin-left:7px;font-variant-numeric:tabular-nums}
.cy-leg small{display:block;font-size:11px;color:var(--mut);margin-top:1px;white-space:nowrap}
.cy-leg.hot{margin-top:2px;padding-top:12px;border-top:1px solid var(--rule)}
.cy-leg.hot i{height:5px;margin-top:8px}
.cy-leg.hot b,.cy-leg.hot b span{color:var(--hot)}
.cy-pacerow{display:flex;align-items:stretch;gap:10px;margin-top:12px}
.cy-pacehead{flex:none;width:200px;display:flex;flex-direction:column;justify-content:center;font-size:11.5px;line-height:1.3;font-weight:600;color:var(--ink2)}
.cy-pacehead span{display:block;font-weight:500;color:var(--mut)}
.cy-pace{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cy-pace div{background:var(--tile);border:1px solid var(--tileline);border-radius:9px;padding:7px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cy-pace small{font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap}
.cy-pace b{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cy-pace .all{border-color:var(--hot)}
.cy-pace .all small,.cy-pace .all b{color:var(--hot)}

/* growth: controls, the big year, who led when */
.cy-ctl{display:flex;align-items:center;gap:12px;margin-top:12px}
.cy-seg{display:inline-flex;border:1px solid var(--tileline);border-radius:999px;padding:3px;flex:none}
.cy-seg button{border:0;background:transparent;color:var(--ink2);font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer}
.cy-seg button.on{background:var(--teal);color:#fff}
.cy-seg button:focus-visible,.cy-play:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cy-ctl label{font-size:12px;font-weight:600;color:var(--mut);flex:none;margin-right:-4px}
.cy-play{width:36px;height:36px;border-radius:50%;border:0;background:var(--teal);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cy-play svg{width:14px;height:14px}
.cy-range{flex:1;accent-color:var(--teal);min-width:0}
.cy-year{position:absolute;right:76px;bottom:34px;font-size:84px;font-weight:800;line-height:1;color:var(--ink);opacity:.13;font-variant-numeric:tabular-nums;pointer-events:none}
.cy-striphead{margin-top:10px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.cy-strip{display:grid;gap:2px;margin-top:6px}
.cy-strip div{height:24px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:center}
.cy-strip div.now{outline:2px solid var(--ink);outline-offset:1px}
.cy-stripyears{display:grid;gap:2px;margin-top:4px;font-size:9.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.cy-stripyears span{text-align:center}
</style>
</head>
<body>
<div class="cy-page">
  <div class="cy-tabs" role="tablist">
    <button class="cy-tab" data-view="falls" role="tab">The biggest falls</button>
    <button class="cy-tab" data-view="growth" role="tab">Rolling capital growth</button>
  </div>
  <div class="cy-fit" id="cyFit">
    <section class="cy" id="cy" data-ground="dark">
      <div class="cy-msg" id="cyMsg">Loading the capital city figures…</div>

      <!-- ── view: falls ── -->
      <div id="vFalls" hidden style="display:contents">
        <div class="cy-eyebrow">Home values · five capital cities</div>
        <h1 id="fTitle">How this fall compares with the five biggest since 1980</h1>
        <div class="cy-key" id="fKey"></div>
        <div class="cy-body">
          <div class="cy-chart"><div id="fChart"></div></div>
          <div class="cy-legend" id="fLegend"></div>
        </div>
        <div class="cy-pacerow">
          <div class="cy-pacehead">Pace over the last 3 months<span id="fPaceAsAt"></span></div>
          <div class="cy-pace" id="fPace"></div>
        </div>
        <div class="cy-foot"><div id="fFoot"></div><img alt="Performance Property" id="fLogo"></div>
      </div>

      <!-- ── view: growth ── -->
      <div id="vGrowth" hidden style="display:contents">
        <div class="cy-eyebrow" id="gEyebrow">House prices · eight capital cities</div>
        <div class="cy-titlerow"><h1>Rolling capital growth</h1><span class="cy-buykey" id="gBuyKey"><i>Buying</i>Where Performance Property was buying that year</span></div>
        <div class="cy-ctl">
          <div class="cy-seg" id="gType" role="group" aria-label="Property type"><button type="button" data-type="H" class="on">House</button><button type="button" data-type="U">Unit</button></div>
          <div class="cy-seg" id="gSeg" role="group" aria-label="Period"><button type="button" data-mode="roll" class="on">10 years</button><button type="button" data-mode="roll75">7.5 years</button><button type="button" data-mode="long">Long term</button></div>
          <div class="cy-seg" id="gMeasure" role="group" aria-label="Growth shown"><button type="button" data-total="0" class="on">Yearly</button><button type="button" data-total="1">Total</button></div>
          <button class="cy-play" id="gPlay" type="button" aria-label="Play"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="gPlayIcon" d="M4.5 3 13 8l-8.5 5Z" fill="currentColor"/></svg></button>
          <input class="cy-range" id="gRange" type="range" min="0" max="0" step="1" value="0" aria-label="Year">
          <label id="gSpeedLabel">Speed</label>
          <div class="cy-seg" id="gSpeed" role="group" aria-labelledby="gSpeedLabel"><button type="button" data-speed="slow">Slow</button><button type="button" data-speed="normal">Normal</button><button type="button" data-speed="fast">Fast</button></div>
        </div>
        <div class="cy-body">
          <div class="cy-chart"><div id="gChart"></div><div class="cy-year" id="gYear"></div></div>
        </div>
        <div class="cy-striphead">Who led each year</div>
        <div class="cy-strip" id="gStrip"></div>
        <div class="cy-stripyears" id="gStripYears"></div>
        <div class="cy-foot"><div id="gFoot"></div><img alt="Performance Property" id="gLogo"></div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" integrity="sha384-o5uz97et3bErHvpKfD4Jz4n0JfhJDWABFuF4NP+iEEDxE1VwMWJ19QGR0lqFZnr6" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="../shared/supabase-client.js?v=afefc0c4"></script>
<script src="../shared/tool-registry.js?v=05b9ad3e"></script>
<script src="../shared/desktop-pins.js?v=e2416017"></script>
<script src="../shared/auth.js?v=9415a2d5"></script>
<script src="../shared/auth-gate.js?v=e03d60b7"></script>
<script src="../shared/pp-telemetry.js?v=a1e39d4f"></script>
<script>
const QS = new URLSearchParams(location.search), EMBED = QS.get('embed') === '1';
if (EMBED) document.body.classList.add('embed-mode'); else PP_OS.initChrome({ name: 'Market Cycles', section: 'vault', backHref: '../' });
let VIEW = QS.get('view') === 'growth' ? 'growth' : 'falls';
const $ = s => document.querySelector(s);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const CITIES = ['Sydney', 'Melbourne', 'Brisbane', 'Adelaide', 'Perth', 'Hobart', 'Darwin', 'Canberra'];
const CODE = { Sydney: 'SYD', Melbourne: 'MEL', Brisbane: 'BNE', Adelaide: 'ADL', Perth: 'PER', Hobart: 'HBA', Darwin: 'DRW', Canberra: 'CBR' };
const FIVE = CITIES.slice(0, 5);
const CITY_TOKEN = { Sydney: '--syd', Melbourne: '--mel', Brisbane: '--bne', Adelaide: '--adl', Perth: '--per', Hobart: '--hba', Darwin: '--drw', Canberra: '--cbr' };   /* one colour per capital */

/* ── the ground: ?theme wins; an embed is dark; the page follows the OS shade ── */
const ground = () => { const t = QS.get('theme'); return t === 'light' || t === 'dark' ? t : EMBED ? 'dark' : (document.documentElement.dataset.shade === 'light' ? 'light' : 'dark'); };
const tok = n => getComputedStyle($('#cy')).getPropertyValue(n).trim();
const cityCol = c => tok(CITY_TOKEN[c]);
/* the ink that reads on a fill: dark on a light colour, white on a dark one */
const inkOn = hex => { const [r, g, b] = [1, 3, 5].map(i => { const v = parseInt(hex.slice(i, i + 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.2 ? '#171B24' : '#FFFFFF'; };
const LOGO = { dark: '../assets/logos/pp-logo-inverted.png', light: '../assets/logos/pp-logo-standard.png' };

/* ── months ── */
const addM = (m, n) => { let y = +m.slice(0, 4), k = +m.slice(5, 7) - 1 + n; y += Math.floor(k / 12); k = ((k % 12) + 12) % 12; return y + '-' + String(k + 1).padStart(2, '0'); };
const between = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));
const monLabel = m => MON[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4), monthLabel = m => MONTH[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4);
const num = v => (v == null || v === '' || !isFinite(+v) || +v <= 0) ? null : +v;
/* "Sydney, Melbourne and Brisbane from 1980, Perth from 1983": places grouped by the year each one starts */
const sinceWords = pairs => { const by = {}; pairs.forEach(([c, y]) => { if (y) (by[y] = by[y] || []).push(c); }); return Object.keys(by).sort().map(y => by[y].length > 1 ? by[y].slice(0, -1).join(', ') + ' and ' + by[y][by[y].length - 1] + ' from ' + y : by[y][0] + ' from ' + y).join(', '); };
const pct = (v, d = 1) => (v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(d) + '%';

/* ═════════════════════════════ data ═════════════════════════════
   S[city][H|U][month] = { avm, n, med12 }: the history row to June 2018, the Forge's capital rows after. */
const S = {}; let MONTHS = [];
async function pageAll(build){ const rows = []; for (let from = 0; ; from += 1000) { const { data, error } = await build().range(from, from + 999); if (error) throw error; rows.push(...(data || [])); if (!data || data.length < 1000) break; } return rows; }
async function load(){
  await sb.auth.getSession();
  const [hist, live] = await Promise.all([
    sb.from('forge_cotality').select('data').eq('id', 'cl_capital_history').maybeSingle(),
    pageAll(() => sb.from('forge_cl_suburbs').select('month,name,ptype,avm:metrics->avm,med12:metrics->med12,props:metrics->props').eq('level', 'capital').order('month').order('name').order('ptype').order('state')),
  ]);
  if (hist.error) throw hist.error;
  if (!hist.data || !hist.data.data || !hist.data.data.cities) throw new Error('The capital city history is not in the Forge yet.');
  const H = hist.data.data, put = (city, pt, m, v) => { ((S[city] = S[city] || {})[pt] = S[city][pt] || {})[m] = v; };
  for (const city of CITIES) for (const pt of ['H', 'U']) {
    const leg = H.cities[city] && H.cities[city][pt]; if (!leg) continue;
    leg.avm.forEach((_, i) => put(city, pt, addM(H.from, i), { avm: num(leg.avm[i]), n: num(leg.n[i]), med12: num(leg.med12[i]) }));
  }
  for (const r of live) { const city = /hobart/i.test(r.name) ? 'Hobart' : r.name; if (CITIES.includes(city) && (r.ptype === 'H' || r.ptype === 'U')) put(city, r.ptype, r.month, { avm: num(r.avm), n: num(r.props), med12: num(r.med12) }); }
  /* July 2018 is the first month of the Forge's own files, and its estimated values sit well off the months
     either side (Sydney houses 986k, 1,098k, 974k). Bridge that one month so it cannot pass for a peak. */
  for (const city of CITIES) for (const pt of ['H', 'U']) { const L = S[city] && S[city][pt]; if (L && L['2018-06'] && L['2018-07'] && L['2018-08'] && L['2018-06'].avm && L['2018-08'].avm) L['2018-07'].avm = Math.sqrt(L['2018-06'].avm * L['2018-08'].avm); }
  MONTHS = [...new Set(Object.values(S).flatMap(c => Object.values(c).flatMap(p => Object.keys(p))))].sort();
}

/* A value index over some city-and-type legs: each month moves by the legs' growth in estimated value,
   each weighted by its value x dwellings the month before. A leg with no figure yet has no weight. */
function chain(legs){
  const out = {}; let level = 100; out[MONTHS[0]] = level;
  for (let i = 1; i < MONTHS.length; i++) {
    let w = 0, g = 0;
    for (const [city, pt] of legs) { const a = S[city][pt][MONTHS[i - 1]], b = S[city][pt][MONTHS[i]]; if (!a || !b || !a.avm || !b.avm || !a.n) continue; const k = a.avm * a.n; w += k; g += k * (b.avm / a.avm); }
    if (w > 0) level *= g / w; out[MONTHS[i]] = level;
  }
  return out;
}

/* ═════════════════════════════ view: falls ═════════════════════════════ */
function falls(){
  const idx = chain(FIVE.flatMap(c => [[c, 'H'], [c, 'U']])), eps = [];
  let peak = MONTHS[0], trough = null;
  for (const m of MONTHS) {
    if (idx[m] >= idx[peak]) { if (trough) eps.push({ peak, trough, fall: 1 - idx[trough] / idx[peak], back: m }); peak = m; trough = null; }
    else if (!trough || idx[m] < idx[trough]) trough = m;
  }
  const open = trough ? { peak, trough, fall: 1 - idx[trough] / idx[peak], back: null } : null;
  /* 1980 itself is left out: with a series that starts in January 1980 its first months are a start, not a peak */
  const top = eps.filter(e => e.peak >= '1981-01').sort((a, b) => b.fall - a.fall).slice(0, 5);
  const path = e => {                                               /* [months since peak, index] until back at the peak, 30 months at most */
    const i0 = MONTHS.indexOf(e.peak), pts = [];
    for (let k = 0; k <= 30 && i0 + k < MONTHS.length; k++) {
      const v = idx[MONTHS[i0 + k]] / idx[e.peak] * 100;
      if (k > 0 && v >= 100) { const p = pts[pts.length - 1]; pts.push([+(p[0] + (100 - p[1]) / (v - p[1])).toFixed(2), 100]); break; }
      pts.push([k, +v.toFixed(2)]);
    }
    return pts;
  };
  const name = e => { const a = e.peak.slice(0, 4), b = (e.back === null ? e.trough : e.trough).slice(0, 4); return a === b ? a : a + '–' + b.slice(2); };
  return { idx, top: top.map(e => ({ ...e, name: name(e), pts: path(e), toTrough: between(e.peak, e.trough), toBack: between(e.peak, e.back) })),
    now: open && open.fall >= 0.005 ? { ...open, name: open.peak.slice(0, 4), pts: path(open), months: between(open.peak, MONTHS[MONTHS.length - 1]) } : null };
}
let fChart = null;
function drawFalls(){
  const F = falls(), last = MONTHS[MONTHS.length - 1], cols = ['--c1', '--c2', '--c3', '--c4', '--c5'].map(tok), hot = tok('--hot'), ink2 = tok('--ink2'), mut = tok('--mut'), grid = tok('--grid'), rule = tok('--rule');
  const now = F.now, at = (e, k) => { const p = e.pts.find(x => x[0] >= k); return p ? p[1] : null; };
  /* the one line under the title follows the data, and carries what three tiles used to say */
  const mo = n => n + (n === 1 ? ' month' : ' months'), backs = F.top.map(e => e.toBack);
  const regained = 'All five were back at their peak within ' + Math.min(...backs) + ' to ' + Math.max(...backs) + ' months.';
  if (now) {
    /* a quarter of a point either way is a tie, not a ranking */
    const here = now.pts[now.pts.length - 1][1], stage = F.top.map(e => [e, at(e, now.months)]).filter(x => x[1] != null);
    const deeper = stage.filter(x => x[1] < here - 0.25).map(x => x[0]), level = stage.filter(x => Math.abs(x[1] - here) <= 0.25).map(x => x[0]);
    const down = 'Down ' + pct(-now.fall).replace('−', '') + ' in ' + mo(now.months);
    $('#fTitle').textContent = 'How the ' + now.name + ' fall compares with the five biggest since 1980';
    $('#fKey').textContent = (deeper.length ? down + '. Only ' + deeper.map(e => e.name).join(' and ') + ' had fallen further at the same stage.'
      : level.length ? down + ', as far as ' + level.map(e => e.name).join(' and ') + ' at the same stage.' : down + ', further than any of the five at the same stage.') + ' ' + regained;
  } else {
    $('#fTitle').textContent = 'The five biggest falls in capital city home values since 1980';
    $('#fKey').textContent = 'Values are at or near their peak in ' + monthLabel(last) + '. ' + regained;
  }
  const lo = Math.min(...F.top.concat(now ? [now] : []).flatMap(e => e.pts.map(p => p[1])));
  const series = F.top.map((e, i) => ({ name: e.name, type: 'line', data: e.pts, showSymbol: false, smooth: 0.25, lineStyle: { width: 2.25, color: cols[i] }, itemStyle: { color: cols[i] }, emphasis: { focus: 'series' }, z: 2, animationDuration: 1400, animationDelay: i * 250 }));
  if (now) series.push({ name: now.name, type: 'line', data: now.pts, showSymbol: true, symbol: 'circle', symbolSize: (v, p) => p.dataIndex === now.pts.length - 1 ? 12 : 0, smooth: 0.15, lineStyle: { width: 5, color: hot, cap: 'round' }, itemStyle: { color: hot, borderColor: tok('--bg'), borderWidth: 2 }, z: 5, animationDuration: 1600, animationDelay: 1500,
    endLabel: { show: true, formatter: () => now.name + ': ' + pct(-now.fall) + ' so far', color: hot, fontFamily: 'Montserrat', fontWeight: 700, fontSize: 15, offset: [8, 14], textBorderColor: tok('--bg'), textBorderWidth: 4 } });
  $('#fLegend').innerHTML = F.top.map((e, i) => '<div class="cy-leg"><i style="background:' + cols[i] + '"></i><div><b>' + e.name + '<span>' + pct(-e.fall) + '</span></b><small>Low at ' + mo(e.toTrough) + ' · back in ' + e.toBack + '</small></div></div>').join('')
    + (now ? '<div class="cy-leg hot"><i style="background:' + hot + '"></i><div><b>' + now.name + '<span>' + pct(-now.fall) + '</span></b><small>' + mo(now.months) + ' in, to ' + monLabel(last) + '</small></div></div>' : '');
  /* three months, as a yearly rate: each capital's own houses and units, then the five together */
  const rate = legs => { const x = chain(legs), a = x[addM(last, -3)], b = x[last]; return a && b ? Math.pow(b / a, 4) - 1 : null; };
  $('#fPace').innerHTML = FIVE.map(c => [c, rate([[c, 'H'], [c, 'U']])]).concat([['Five capitals', rate(FIVE.flatMap(c => [[c, 'H'], [c, 'U']]))]])
    .map(([n, v], i) => '<div' + (i === 5 ? ' class="all"' : '') + '><small>' + n + '</small><b>' + (v == null ? '' : pct(v)) + '</b></div>').join('');
  $('#fPaceAsAt').textContent = 'as a yearly rate, to ' + monLabel(last);
  /* only the capitals that join after the series starts need saying */
  const starts = FIVE.map(c => [c, (MONTHS.find(m => S[c].H[m] && S[c].H[m].avm) || '').slice(0, 4)]), firstYear = starts.map(x => x[1]).filter(Boolean).sort()[0], later = starts.filter(x => x[1] && x[1] !== firstYear);
  $('#fFoot').textContent = 'Median estimated value of all dwellings, weighted by dwelling numbers, to ' + monthLabel(last) + '.' + (later.length ? ' ' + sinceWords(later) + '.' : '')
    + ' Source: Cotality. Analysis: Performance Property. © ' + new Date().getFullYear() + ' PPA Services Pty Ltd';
  if (!fChart) fChart = echarts.init($('#fChart'), null, { renderer: 'svg' }); else fChart.resize();
  fChart.setOption({
    animation: QS.get('still') !== '1', textStyle: { fontFamily: 'Montserrat' },
    grid: { left: 44, right: now && now.months > 20 ? 150 : 26, top: 30, bottom: 46 },   /* room on the right only once the current fall's label runs out there */
    tooltip: { trigger: 'axis', backgroundColor: tok('--bg'), borderColor: rule, textStyle: { color: tok('--ink'), fontFamily: 'Montserrat', fontSize: 12 },
      formatter: ps => 'Month ' + Math.round(ps[0].value[0]) + '<br>' + ps.map(p => p.marker + ' ' + p.seriesName + ': ' + pct(p.value[1] / 100 - 1)).join('<br>') },
    xAxis: { type: 'value', min: 0, max: 30, interval: 6, name: 'Months since the peak', nameLocation: 'middle', nameGap: 28, nameTextStyle: { color: mut, fontSize: 11, fontWeight: 600 }, axisLine: { lineStyle: { color: rule } }, axisTick: { show: false }, axisLabel: { color: mut, fontSize: 11 }, splitLine: { show: false } },
    yAxis: { type: 'value', min: Math.floor(lo / 2) * 2 - 2, max: 100, interval: 2, name: 'Peak = 100', nameLocation: 'end', nameGap: 12, nameTextStyle: { color: mut, fontSize: 11, fontWeight: 600, align: 'left', padding: [0, 0, 0, -30] }, axisLabel: { color: mut, fontSize: 11 }, splitLine: { lineStyle: { color: grid } }, axisLine: { show: false }, axisTick: { show: false } },
    series: series.concat([{ type: 'line', data: [[0, 100], [30, 100]], showSymbol: false, silent: true, lineStyle: { width: 1, color: ink2, type: [4, 4] }, tooltip: { show: false }, animation: false, z: 1 }]),
  }, true);
}

/* ═════════════════════════════ view: growth ═════════════════════════════
   Houses, 12-month median sale price. roll / roll75: the 10 or 7.5 years to each December (7.5 is the middle of
   the firm's 6 to 9 year holding period). long: from the capital's first median on record, once there are 8 years
   of it (the Suburb Scoring rule). Shown as a yearly compounding rate, or as the total growth over the window;
   total is not offered for long, where every capital's period has a different length.
   ?mode=roll|roll75|long and ?growth=total preset them for a slide. */
const WINDOWS = { roll: 120, roll75: 90 };   /* months */
/* Play starts here when pressed at the end: 2007 is the last national crash before this one, the story the chart
   is shown to tell. Earlier years stay on the slider, and Play from any other year carries on from that year. */
const START_YEAR = 2007;
/* Where the firm was buying, by calendar year, [first, last] with null = still buying (research lead, 2026-11-19;
   the 2014 and 2015 starts are the director's words in the review of this chart). Hold and sell years are to come:
   they will be further tags beside the same figure. */
const BUYING = { Sydney: [[2014, 2014]], Adelaide: [[2015, 2021]], Brisbane: [[2015, 2022]], Perth: [[2019, 2025]], Melbourne: [[2025, null]], Darwin: [[2025, null]] };
const buyingIn = (c, y) => (BUYING[c] || []).some(([a, b]) => y >= a && (b == null || y <= b));
let gMode = ['roll', 'roll75', 'long'].includes(QS.get('mode')) ? QS.get('mode') : 'roll', gFrames = [], gAt = 0, gTimer = null, gChart = null;
let gTotal = QS.get('growth') === 'total' && gMode !== 'long';
let gType = QS.get('type') === 'unit' ? 'U' : 'H';   /* houses or units; ?type=unit presets it for a slide */
/* how long each year stays up when playing; ?speed=slow|normal|fast presets it for a slide.
   Fast is what Normal was (0.9 s) and Normal sits between it and Slow; the old 0.45 s was too quick to follow. */
const SPEEDS = { slow: 2400, normal: 1500, fast: 900 };
let gSpeed = SPEEDS[QS.get('speed')] ? QS.get('speed') : 'normal';
function frames(mode, total, type = gType){
  const last = MONTHS[MONTHS.length - 1], med = (c, m) => { const r = ((S[c] || {})[type] || {})[m]; return r ? r.med12 : null; };
  const first = {}; CITIES.forEach(c => { first[c] = MONTHS.find(m => med(c, m) != null) || null; });
  const stops = []; for (let y = 1990; y < +last.slice(0, 4); y++) stops.push(y + '-12'); if (stops[stops.length - 1] !== last) stops.push(last);
  const w = WINDOWS[mode];   /* undefined for long */
  return stops.map(m => {
    const v = {}; CITIES.forEach(c => {
      const a = w ? addM(m, -w) : first[c], n = a ? between(a, m) : 0, p0 = a ? med(c, a) : null, p1 = med(c, m);
      v[c] = p0 && p1 && n >= (w || 96) ? (total && w ? p1 / p0 - 1 : Math.pow(p1 / p0, 12 / n) - 1) : null;
    });
    const lead = CITIES.filter(c => v[c] != null).sort((a, b) => v[b] - v[a])[0] || null;
    return { m, label: m.slice(5) === '12' ? m.slice(0, 4) : monLabel(m), v, lead };
  }).filter(f => f.lead);
}
function barsFor(f){ const y = +f.m.slice(0, 4); return CITIES.map(c => ({ value: f.v[c] == null ? 0 : +(f.v[c] * 100).toFixed(4), none: f.v[c] == null, buying: f.v[c] != null && buyingIn(c, y), itemStyle: { color: cityCol(c), opacity: f.v[c] == null ? 0 : 1, borderRadius: [0, 5, 5, 0] } })); }
function showFrame(i, quick){
  gAt = Math.max(0, Math.min(gFrames.length - 1, i)); const f = gFrames[gAt];
  /* the bars and their re-ordering take most of the time a year is up, so a slow run glides instead of waiting */
  const glide = quick ? 0 : Math.round(SPEEDS[gSpeed] * 0.72);
  gChart.setOption({ animationDurationUpdate: glide, yAxis: { animationDurationUpdate: Math.round(glide * 0.8) }, series: [{ data: barsFor(f) }] });
  $('#gYear').textContent = f.label; $('#gRange').value = gAt;
  document.querySelectorAll('#gStrip div').forEach((d, k) => d.classList.toggle('now', k === gAt));
}
function drawGrowth(){
  const w = WINDOWS[gMode], total = gTotal && !!w, span = w ? (w / 12) + ' years' : '';
  gFrames = frames(gMode, total, gType);
  const what = gType === 'U' ? 'unit' : 'house';
  const ink = tok('--ink'), mut = tok('--mut'), grid = tok('--grid'), hi = Math.max(...gFrames.flatMap(f => Object.values(f.v).filter(x => x != null))) * 100, lo = Math.min(0, ...gFrames.flatMap(f => Object.values(f.v).filter(x => x != null))) * 100;
  const n = gFrames.length, cols = 'repeat(' + n + ',1fr)';
  $('#gStrip').style.gridTemplateColumns = cols; $('#gStripYears').style.gridTemplateColumns = cols;
  const fill = {}; CITIES.forEach(c => { const bg = cityCol(c); fill[c] = 'background:' + bg + ';color:' + inkOn(bg); });
  $('#gStrip').innerHTML = gFrames.map(f => '<div style="' + fill[f.lead] + '" title="' + f.label + ': ' + f.lead + ' ' + pct(f.v[f.lead]) + '">' + CODE[f.lead] + '</div>').join('');
  $('#gStripYears').innerHTML = gFrames.map((f, k) => '<span>' + (k === n - 1 || +f.m.slice(0, 4) % 5 === 0 ? "'" + f.m.slice(2, 4) : '') + '</span>').join('');
  $('#gRange').max = n - 1;
  $('#gEyebrow').textContent = what[0].toUpperCase() + what.slice(1) + ' prices · eight capital cities';
  document.querySelectorAll('#gType button').forEach(x => { const on = x.dataset.type === gType; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  $('#gFoot').textContent = '12-month median sale price of ' + what + 's. A capital appears once it has ' + (w ? span : '8 years') + ' of sales on record.'
    + ' Source: Cotality. Analysis: Performance Property. © ' + new Date().getFullYear() + ' PPA Services Pty Ltd';
  document.querySelectorAll('#gMeasure button').forEach(x => { const on = (x.dataset.total === '1') === total; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); if (x.dataset.total === '1') { x.disabled = !w; x.title = w ? '' : 'Total growth needs the same period for every capital'; } });
  if (!gChart) gChart = echarts.init($('#gChart'), null, { renderer: 'canvas' }); else gChart.resize();
  /* a yearly rate runs to about 15%, a total to a few hundred: the axis steps and the bar figures follow */
  const step = hi > 60 ? 50 : hi > 30 ? 10 : 3;
  gChart.setOption({
    textStyle: { fontFamily: 'Montserrat' }, grid: { left: 96, right: 124, top: 8, bottom: 26 },   /* right: room for a figure and its Buying tag past the longest bar */
    xAxis: { type: 'value', min: total ? Math.floor(lo / 10) * 10 : Math.floor(lo), max: Math.ceil((hi + 0.5) / step) * step, axisLabel: { color: mut, fontSize: 11, formatter: v => v + '%', showMinLabel: lo >= 0 }, splitLine: { lineStyle: { color: grid } }, axisLine: { show: false }, axisTick: { show: false } },
    yAxis: { type: 'category', inverse: true, data: CITIES, animationDuration: 300, animationDurationUpdate: 500, axisLine: { show: false }, axisTick: { show: false },
      axisLabel: { color: ink, fontSize: 14, fontWeight: 600, fontFamily: 'Montserrat' } },
    series: [{ type: 'bar', realtimeSort: true, barMaxWidth: 36, data: barsFor(gFrames[gFrames.length - 1]),
      label: { show: true, position: 'right', valueAnimation: true, color: ink, fontFamily: 'Montserrat', fontWeight: 700, fontSize: 14, formatter: p => p.data.none ? '' : p.value.toFixed(total ? 0 : 1) + '%' + (p.data.buying ? '  {buy|Buying}' : ''),
        rich: { buy: { backgroundColor: tok('--buy'), color: tok('--buyink'), fontFamily: 'Montserrat', fontSize: 11, fontWeight: 700, height: 18, lineHeight: 18, padding: [1, 8, 0, 8], borderRadius: 9, verticalAlign: 'middle' } } } }],
    animationDuration: 0, animationDurationUpdate: 650, animationEasing: 'linear', animationEasingUpdate: 'linear',
  }, true);
  showFrame(n - 1, true);
}
function play(on){
  clearInterval(gTimer); gTimer = null;
  $('#gPlayIcon').setAttribute('d', on ? 'M4 3h3v10H4zM9 3h3v10H9z' : 'M4.5 3 13 8l-8.5 5Z'); $('#gPlay').setAttribute('aria-label', on ? 'Pause' : 'Play');
  if (!on) return;
  if (gAt >= gFrames.length - 1) showFrame(Math.max(0, gFrames.findIndex(f => +f.m.slice(0, 4) >= START_YEAR)), true);
  gTimer = setInterval(() => { if (gAt >= gFrames.length - 1) { play(false); return; } showFrame(gAt + 1); }, SPEEDS[gSpeed]);
}
/* a new speed takes effect on the next year, from where the run is, without sending it back to the start */
function setSpeed(s){
  if (!SPEEDS[s]) return; gSpeed = s;
  document.querySelectorAll('#gSpeed button').forEach(x => { const on = x.dataset.speed === s; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  if (gTimer) play(true);
}

/* ═════════════════════════════ page ═════════════════════════════ */
function fit(){
  const host = $('#cyFit'), avail = EMBED ? Math.min(innerWidth / 1280, innerHeight / 720) : Math.min(1, ($('.cy-page').clientWidth - 40) / 1280);
  host.style.transform = 'scale(' + avail + ')'; host.style.height = (720 * avail) + 'px'; host.style.width = '1280px';
}
function show(view){
  VIEW = view; play(false);
  document.querySelectorAll('.cy-tab').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  $('#vFalls').hidden = view !== 'falls'; $('#vGrowth').hidden = view !== 'growth';
  if (view === 'falls') drawFalls(); else drawGrowth();
}
function paint(){
  const g = ground(); $('#cy').dataset.ground = g; $('#fLogo').src = LOGO[g]; $('#gLogo').src = LOGO[g];
  if (MONTHS.length) show(VIEW);
}
document.querySelectorAll('.cy-tab').forEach(b => b.addEventListener('click', () => show(b.dataset.view)));
$('#gSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; gMode = b.dataset.mode; document.querySelectorAll('#gSeg button').forEach(x => x.classList.toggle('on', x === b)); play(false); drawGrowth(); });
$('#gType').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; gType = b.dataset.type; play(false); drawGrowth(); });
$('#gMeasure').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; gTotal = b.dataset.total === '1'; play(false); drawGrowth(); });
$('#gPlay').addEventListener('click', () => play(!gTimer));
$('#gSpeed').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSpeed(b.dataset.speed); });
setSpeed(gSpeed);
$('#gRange').addEventListener('input', e => { play(false); showFrame(+e.target.value, true); });
addEventListener('resize', () => { fit(); if (fChart) fChart.resize(); if (gChart) gChart.resize(); });
new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-shade'] });
fit();
(async () => {
  try {
    await load();
    document.querySelectorAll('#gSeg button').forEach(x => x.classList.toggle('on', x.dataset.mode === gMode));
    $('#cyMsg').hidden = true; paint();
    if (QS.get('play') === '1' && VIEW === 'growth') setTimeout(() => play(true), 600);
  } catch (e) {
    $('#cyMsg').textContent = 'The capital city figures could not be loaded. ' + (e && e.message ? e.message : '');
  }
})();
</script>
