<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Cycles &mdash; Performance Property</title>
<link rel="icon" href="../assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../shared/os-chrome.js?v=ea374003"></script>
<link rel="stylesheet" href="../shared/os-theme.css?v=bcea6d52"/>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   MARKET CYCLES — two charts for the client presentation (Saskia, 2026-11-17).

     ?view=falls    the current fall in five-capital home values beside the five
                    biggest falls since 1980, each from its own peak (= 100)
     ?view=growth   "Rolling capital growth": which capital's house (or unit) prices
                    have grown fastest, year by year: rolling 7.5, 9 or 10 years, a
                    custom period, or since each capital's first record; as a
                    yearly rate or the total
     &skip=2022     leaves out the fall that peaked in that year (comma list allowed);
                    the rest keep their places and the words count what is left.
                    Without the parameter 2022 is left out (owner, 2026-11-25);
                    &skip=none shows all five

   ?embed=1 draws one chart at 1280 x 720 with no app bar, for a slide
   (Presentation > Add embed). ?theme=light|dark picks the ground; an embed is
   dark unless told otherwise, the page itself follows the OS shade.

   Reads only:
     forge_cotality    row cl_capital_history — the eight capitals, monthly
                       January 1980 to June 2018 (scripts/build-cl-capital-history.mjs)
     forge_cl_suburbs  level `capital` — the same figures from July 2018, so a
                       new Cotality month shows here with no further step
   Everything drawn is worked out in the page from those two.
   ═══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:transparent;color:var(--tx);min-height:100vh;font-family:'Montserrat','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font-family:inherit}

.cy-page{max-width:1320px;margin:0 auto;padding:18px 20px 40px}
.cy-tabs{display:flex;gap:8px;margin:0 0 14px}
.cy-tab{padding:8px 16px;border-radius:999px;border:1px solid var(--line,rgba(255,255,255,.14));background:transparent;color:var(--tx2);font-size:13px;font-weight:600;cursor:pointer}
.cy-tab.on{background:#00A0B4;border-color:#00A0B4;color:#fff}

/* the slide: every colour below is one of these tokens, light and dark */
.cy{--bg:#171B24;--ink:#FFFFFF;--ink2:#C9CFDA;--mut:#8F98A8;--rule:rgba(255,255,255,.14);--grid:rgba(255,255,255,.08);--tile:rgba(255,255,255,.05);--tileline:rgba(255,255,255,.12);
  --hot:#FFA91F;--teal:#00A0B4;
  --c1:#54A6DE;--c2:#C77DD6;--c3:#5DAC96;--c4:#F08FA3;--c5:#8FA3BF;
  /* one colour per capital (2026-11-18): a step of the brand's own tone ramps for each, chosen as the eight that sit
     furthest apart on this ground. Every bar and strip cell also carries the capital's name, so colour never works alone. */
  --syd:#98C6EB;--mel:#00A3CC;--bne:#CA1637;--adl:#AB36AB;--per:#88C072;--hba:#3E7967;--drw:#F59700;--cbr:#5A6BED;
  position:relative;width:1280px;height:720px;background:var(--bg);color:var(--ink);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;padding:30px 44px 18px}
.cy[data-ground="light"]{--bg:#FFFFFF;--ink:#171B24;--ink2:#3F4650;--mut:#63666A;--rule:rgba(23,27,36,.16);--grid:rgba(23,27,36,.08);--tile:rgba(23,27,36,.035);--tileline:rgba(23,27,36,.12);
  --hot:#D98600;--teal:#00869A;
  --c1:#2B7CB5;--c2:#9A2E9A;--c3:#3E7967;--c4:#C4183A;--c5:#63666A;
  --syd:#318DD8;--mel:#00627A;--bne:#810E23;--adl:#AB36AB;--per:#4D7F39;--hba:#5DAC96;--drw:#E08A00;--cbr:#233AE7}
.cy-fit{transform-origin:top left}
body.embed-mode{overflow:hidden;background:transparent}
body.embed-mode .appbar{display:none!important}
body.embed-mode .cy-page{max-width:none;margin:0;padding:0}
body.embed-mode .cy-tabs{display:none}
body.embed-mode .cy{border-radius:0}

.cy-eyebrow{font-size:13px;font-weight:600;color:var(--teal)}
.cy h1{margin:5px 0 0;font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.012em;text-wrap:balance}
.cy-titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.cy-key{margin:8px 0 0;font-size:14.5px;line-height:1.4;font-weight:600;color:var(--hot)}
.cy-body{flex:1;min-height:0;display:flex;gap:26px;margin-top:14px}
.cy-chart{flex:1;min-width:0;position:relative}
.cy-chart>div:first-child{position:absolute;inset:0}
.cy-foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:28px;font-size:10px;line-height:1.5;color:var(--mut)}
.cy-foot img{height:22px;display:block;flex:none}
.cy-foot div{text-wrap:balance}
.cy-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink2);background:var(--bg);z-index:5;text-align:center;padding:40px}

/* falls: the legend on the right, the three-month pace below */
.cy-legend{width:232px;flex:none;display:flex;flex-direction:column;justify-content:center;gap:11px}
.cy-leg{display:grid;grid-template-columns:22px 1fr;column-gap:10px;align-items:start}
.cy-leg i{height:3px;border-radius:2px;margin-top:9px;display:block}
.cy-leg b{font-size:14px;font-weight:700;color:var(--ink)}
.cy-leg b span{font-weight:600;color:var(--ink2);margin-left:7px;font-variant-numeric:tabular-nums}
.cy-leg small{display:block;font-size:11px;color:var(--mut);margin-top:1px;white-space:nowrap}
.cy-leg small.rt{margin-top:2px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cy-leg small.dx{margin-top:2px;color:var(--hot);opacity:.7;font-variant-numeric:tabular-nums}
.cy-legkey{font-size:10.5px;line-height:1.35;color:var(--mut);margin-top:-2px}
.cy-leg.hot{margin-top:2px;padding-top:12px;border-top:1px solid var(--rule)}
.cy-leg.hot i{height:5px;margin-top:8px}
.cy-leg.hot b,.cy-leg.hot b span{color:var(--hot)}
.cy-pacerow{display:flex;align-items:stretch;gap:10px;margin-top:12px}
.cy-pacehead{flex:none;width:200px;display:flex;flex-direction:column;justify-content:center;font-size:11.5px;line-height:1.3;font-weight:600;color:var(--ink2)}
.cy-pacehead span{display:block;font-weight:500;color:var(--mut)}
.cy-pace{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cy-pace div{background:var(--tile);border:1px solid var(--tileline);border-radius:9px;padding:7px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cy-pace small{font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap}
.cy-pace b{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cy-pace .all{border-color:var(--hot)}
.cy-pace .all small,.cy-pace .all b{color:var(--hot)}

/* growth: controls, the big year, who led when */
.cy-ctl{display:flex;align-items:center;gap:12px;margin-top:12px}
.cy-ctl + .cy-ctl{margin-top:8px}
.cy-custom{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:12px;font-weight:600;color:var(--ink2)}
.cy-custom[hidden]{display:none}
.cy-custom input{width:56px;height:30px;box-sizing:border-box;border:1px solid var(--tileline);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:12px;font-weight:700;text-align:center;padding:0 8px}
.cy-custom input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.cy-custom input[aria-invalid="true"]{border-color:var(--hot);color:var(--hot)}
.cy-seg{display:inline-flex;border:1px solid var(--tileline);border-radius:999px;padding:3px;flex:none}
.cy-seg button{border:0;background:transparent;color:var(--ink2);font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer}
.cy-seg button.on{background:var(--teal);color:#fff}
.cy-seg button:focus-visible,.cy-play:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cy-ctl label{font-size:12px;font-weight:600;color:var(--mut);flex:none;margin-right:-4px}
.cy-play{width:36px;height:36px;border-radius:50%;border:0;background:var(--teal);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cy-play svg{width:14px;height:14px}
.cy-track{flex:1;min-width:0;position:relative;height:36px}
.cy-range{position:absolute;left:0;right:0;top:0;width:100%;height:18px;margin:0;accent-color:var(--teal)}
/* one label per year under the play line: the year on screen is lit, any year jumps there. Each sits under the
   thumb's centre for its frame: 8px in from either end (the 16px thumb), evenly between. */
.cy-ticks{position:absolute;left:0;right:0;top:19px;height:16px}
.cy-ticks button{position:absolute;top:0;transform:translateX(-50%);border:0;background:transparent;color:var(--mut);font:inherit;font-size:9.5px;font-weight:600;line-height:16px;padding:0 2px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.cy-ticks button:hover{color:var(--ink)}
.cy-ticks button.now{background:var(--teal);color:#fff;padding:0 5px}
.cy-ticks button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.cy-year{position:absolute;right:76px;bottom:34px;font-size:84px;font-weight:800;line-height:1;color:var(--ink);opacity:.13;font-variant-numeric:tabular-nums;pointer-events:none}
.cy-striphead{margin-top:10px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.cy-strip{display:grid;gap:2px;margin-top:6px}
.cy-strip div{height:24px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:center}
.cy-strip div.now{outline:2px solid var(--ink);outline-offset:1px}
.cy-stripyears{display:grid;gap:2px;margin-top:4px;font-size:9.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.cy-stripyears span{text-align:center}
</style>
</head>
<body>
<div class="cy-page">
  <div class="cy-tabs" role="tablist">
    <button class="cy-tab" data-view="falls" role="tab">The biggest falls</button>
    <button class="cy-tab" data-view="growth" role="tab">Rolling capital growth</button>
  </div>
  <div class="cy-fit" id="cyFit">
    <section class="cy" id="cy" data-ground="dark">
      <div class="cy-msg" id="cyMsg">Loading the capital city figures…</div>

      <!-- ── view: falls ── -->
      <div id="vFalls" hidden style="display:contents">
        <div class="cy-eyebrow">Home values · five capital cities</div>
        <h1 id="fTitle">How this fall compares with the five biggest since 1980</h1>
        <div class="cy-key" id="fKey"></div>
        <div class="cy-body">
          <div class="cy-chart"><div id="fChart"></div></div>
          <div class="cy-legend" id="fLegend"></div>
        </div>
        <div class="cy-pacerow">
          <div class="cy-pacehead">Pace over the last 3 months<span id="fPaceAsAt"></span></div>
          <div class="cy-pace" id="fPace"></div>
        </div>
        <div class="cy-foot"><div id="fFoot"></div><img alt="Performance Property" id="fLogo"></div>
      </div>

      <!-- ── view: growth ── -->
      <div id="vGrowth" hidden style="display:contents">
        <div class="cy-eyebrow" id="gEyebrow">House prices · eight capital cities</div>
        <div class="cy-titlerow"><h1>Rolling capital growth</h1></div>
        <div class="cy-ctl">
          <div class="cy-seg" id="gType" role="group" aria-label="Property type"><button type="button" data-type="H" class="on">House</button><button type="button" data-type="U">Unit</button></div>
          <div class="cy-seg" id="gSeg" role="group" aria-label="Period"><button type="button" data-mode="roll75">7.5 years</button><button type="button" data-mode="roll9" class="on">9 years</button><button type="button" data-mode="roll">10 years</button><button type="button" data-mode="long">Long term</button><button type="button" data-mode="custom">Custom</button></div>
          <span class="cy-custom" id="gCustom" hidden><input id="gYears" type="text" inputmode="decimal" autocomplete="off" value="10" aria-label="Custom period in years, 1 to 30" title="Any period from 1 to 30 years. Press Enter to apply">years</span>
          <div class="cy-seg" id="gMeasure" role="group" aria-label="Growth shown"><button type="button" data-total="0">Yearly</button><button type="button" data-total="1" class="on">Total capital growth</button></div>
        </div>
        <div class="cy-ctl">
          <button class="cy-play" id="gPlay" type="button" aria-label="Play"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="gPlayIcon" d="M4.5 3 13 8l-8.5 5Z" fill="currentColor"/></svg></button>
          <div class="cy-track"><input class="cy-range" id="gRange" type="range" min="0" max="0" step="1" value="0" aria-label="Year"><div class="cy-ticks" id="gTicks" role="group" aria-label="Jump to a year"></div></div>
          <label id="gSpeedLabel">Speed</label>
          <div class="cy-seg" id="gSpeed" role="group" aria-labelledby="gSpeedLabel"><button type="button" data-speed="slow">Slow</button><button type="button" data-speed="normal">Normal</button><button type="button" data-speed="fast">Fast</button></div>
        </div>
        <div class="cy-body">
          <div class="cy-chart"><div id="gChart"></div><div class="cy-year" id="gYear"></div></div>
        </div>
        <div class="cy-striphead">Who led each year</div>
        <div class="cy-strip" id="gStrip"></div>
        <div class="cy-stripyears" id="gStripYears"></div>
        <div class="cy-foot"><div id="gFoot"></div><img alt="Performance Property" id="gLogo"></div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" integrity="sha384-o5uz97et3bErHvpKfD4Jz4n0JfhJDWABFuF4NP+iEEDxE1VwMWJ19QGR0lqFZnr6" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="../shared/supabase-client.js?v=afefc0c4"></script>
<script src="../shared/tool-registry.js?v=717584c8"></script>
<script src="../shared/desktop-pins.js?v=e2416017"></script>
<script src="../shared/auth.js?v=9415a2d5"></script>
<script src="../shared/auth-gate.js?v=d932af86"></script>
<script src="../shared/pp-telemetry.js?v=a1e39d4f"></script>
<script>
const QS = new URLSearchParams(location.search), EMBED = QS.get('embed') === '1';
if (EMBED) document.body.classList.add('embed-mode'); else PP_OS.initChrome({ name: 'Market Cycles', section: 'vault', backHref: '../' });
let VIEW = QS.get('view') === 'growth' ? 'growth' : 'falls';
const $ = s => document.querySelector(s);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const CITIES = ['Sydney', 'Melbourne', 'Brisbane', 'Adelaide', 'Perth', 'Hobart', 'Darwin', 'Canberra'];
const CODE = { Sydney: 'SYD', Melbourne: 'MEL', Brisbane: 'BNE', Adelaide: 'ADL', Perth: 'PER', Hobart: 'HBA', Darwin: 'DRW', Canberra: 'CBR' };
const FIVE = CITIES.slice(0, 5);
/* peak years left out of the falls (owner, 2026-11-24); by default 2022 (owner, 2026-11-25: "make sure 2022 is removed"); ?skip=none keeps all */
const SKIP = QS.has('skip') ? (QS.get('skip') || '').split(',').map(s => s.trim()).filter(s => /^\d{4}$/.test(s)) : ['2022'];
const COUNT = ['no', 'one', 'two', 'three', 'four', 'five'];
const CITY_TOKEN = { Sydney: '--syd', Melbourne: '--mel', Brisbane: '--bne', Adelaide: '--adl', Perth: '--per', Hobart: '--hba', Darwin: '--drw', Canberra: '--cbr' };   /* one colour per capital */

/* ── the ground: ?theme wins; an embed is dark; the page follows the OS shade ── */
const ground = () => { const t = QS.get('theme'); return t === 'light' || t === 'dark' ? t : EMBED ? 'dark' : (document.documentElement.dataset.shade === 'light' ? 'light' : 'dark'); };
const tok = n => getComputedStyle($('#cy')).getPropertyValue(n).trim();
const cityCol = c => tok(CITY_TOKEN[c]);
/* the ink that reads on a fill: dark on a light colour, white on a dark one */
const inkOn = hex => { const [r, g, b] = [1, 3, 5].map(i => { const v = parseInt(hex.slice(i, i + 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.2 ? '#171B24' : '#FFFFFF'; };
const LOGO = { dark: '../assets/logos/pp-logo-inverted.png', light: '../assets/logos/pp-logo-standard.png' };

/* ── months ── */
const addM = (m, n) => { let y = +m.slice(0, 4), k = +m.slice(5, 7) - 1 + n; y += Math.floor(k / 12); k = ((k % 12) + 12) % 12; return y + '-' + String(k + 1).padStart(2, '0'); };
const between = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));
const monLabel = m => MON[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4), monthLabel = m => MONTH[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4);
const num = v => (v == null || v === '' || !isFinite(+v) || +v <= 0) ? null : +v;
/* "Sydney, Melbourne and Brisbane from 1980, Perth from 1983": places grouped by the year each one starts */
const sinceWords = pairs => { const by = {}; pairs.forEach(([c, y]) => { if (y) (by[y] = by[y] || []).push(c); }); return Object.keys(by).sort().map(y => by[y].length > 1 ? by[y].slice(0, -1).join(', ') + ' and ' + by[y][by[y].length - 1] + ' from ' + y : by[y][0] + ' from ' + y).join(', '); };
const pct = (v, d = 1) => (v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(d) + '%';

/* ═════════════════════════════ data ═════════════════════════════
   S[city][H|U][month] = { avm, n, med12 }: the history row to June 2018, the Forge's capital rows after. */
const S = {}; let MONTHS = [];
/* CASH: the RBA cash rate at the end of each month, as the Forge holds it (rdp_raw_series rba/cash_rate/M, from
   January 1990). The falls legend shows it at each fall's peak and at its turn (the low). Mid-1989 is before that
   series; the RBA puts it at about 18% ("cash rates reaching 18 per cent in mid 1989", Annual Report 1991). Owner,
   20 Nov 2026. */
let CASH = {};
const cashAt = m => CASH[m] != null ? pct(CASH[m], 2) : m >= '1989-01' && m < '1990-01' ? 'about 18%' : null;
/* Cotality's Daily Home Value Index, five capitals + aggregate, month-ends + latest day (scripts/ingest-cotality-daily-hvi.mjs) */
let DAILY = null;
const lastDayOf = ym => new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).toISOString().slice(0, 10);
const dayLabel = d => (+d.slice(8, 10)) + ' ' + MON[+d.slice(5, 7) - 1] + ' ' + d.slice(0, 4);
async function pageAll(build){ const rows = []; for (let from = 0; ; from += 1000) { const { data, error } = await build().range(from, from + 999); if (error) throw error; rows.push(...(data || [])); if (!data || data.length < 1000) break; } return rows; }
async function load(){
  await sb.auth.getSession();
  const [hist, live, cash, daily] = await Promise.all([
    sb.from('forge_cotality').select('data').eq('id', 'cl_capital_history').maybeSingle(),
    pageAll(() => sb.from('forge_cl_suburbs').select('month,name,ptype,avm:metrics->avm,med12:metrics->med12,props:metrics->props').eq('level', 'capital').order('month').order('name').order('ptype').order('state')),
    /* the charts draw without it: the legend then leaves the rate line out */
    pageAll(() => sb.from('rdp_raw_series').select('period,value').eq('source', 'rba').eq('metric', 'cash_rate').eq('freq', 'M').order('period')).catch(() => []),
    /* the same: without it the 2026 line simply stops at the Forge's last month */
    sb.from('forge_cotality').select('data').eq('id', 'cl_daily_hvi').maybeSingle().then(r => r, () => ({})),
  ]);
  CASH = Object.fromEntries(cash.filter(r => r.value != null).map(r => [String(r.period).slice(0, 7), +r.value]));
  DAILY = (daily && daily.data && daily.data.data) || null;
  if (hist.error) throw hist.error;
  if (!hist.data || !hist.data.data || !hist.data.data.cities) throw new Error('The capital city history is not in the Forge yet.');
  const H = hist.data.data, put = (city, pt, m, v) => { ((S[city] = S[city] || {})[pt] = S[city][pt] || {})[m] = v; };
  for (const city of CITIES) for (const pt of ['H', 'U']) {
    const leg = H.cities[city] && H.cities[city][pt]; if (!leg) continue;
    leg.avm.forEach((_, i) => put(city, pt, addM(H.from, i), { avm: num(leg.avm[i]), n: num(leg.n[i]), med12: num(leg.med12[i]) }));
  }
  for (const r of live) { const city = /hobart/i.test(r.name) ? 'Hobart' : r.name; if (CITIES.includes(city) && (r.ptype === 'H' || r.ptype === 'U')) put(city, r.ptype, r.month, { avm: num(r.avm), n: num(r.props), med12: num(r.med12) }); }
  /* July 2018 is the first month of the Forge's own files, and its estimated values sit well off the months
     either side (Sydney houses 986k, 1,098k, 974k). Bridge that one month so it cannot pass for a peak. */

function show(view){
  VIEW = view; play(false);
  document.querySelectorAll('.cy-tab').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  $('#vFalls').hidden = view !== 'falls'; $('#vGrowth').hidden = view !== 'growth';
  if (view === 'falls') drawFalls(); else drawGrowth();
}
function paint(){
  const g = ground(); $('#cy').dataset.ground = g; $('#fLogo').src = LOGO[g]; $('#gLogo').src = LOGO[g];
  if (MONTHS.length) show(VIEW);
}
document.querySelectorAll('.cy-tab').forEach(b => b.addEventListener('click', () => show(b.dataset.view)));
$('#gSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  /* Custom starts from the period on screen, so the chart does not jump until a new figure is typed */
  if (b.dataset.mode === 'custom' && gMode !== 'custom' && WINDOWS[gMode]) gCustom = Math.round(WINDOWS[gMode] / 12 * 10) / 10;
  gMode = b.dataset.mode; play(false); drawGrowth();
  if (gMode === 'custom') { const i = $('#gYears'); i.focus(); i.select(); } });
/* a custom period: 1 to 30 years, to one decimal; anything else is refused and the box goes back to the last good figure */
function applyYears(){
  const i = $('#gYears'), v = Math.round(parseFloat(String(i.value).replace(',', '.')) * 10) / 10;
  if (!yearsOk(v)) { i.setAttribute('aria-invalid', 'true'); i.value = fmtYears(gCustom); setTimeout(() => i.removeAttribute('aria-invalid'), 1500); return; }
  i.removeAttribute('aria-invalid'); i.value = fmtYears(v);
  if (v === gCustom && gMode === 'custom') return;
  gCustom = v; gMode = 'custom'; play(false); drawGrowth();
}
$('#gYears').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyYears(); } else if (e.key === 'Escape') { e.target.value = fmtYears(gCustom); e.target.blur(); } });
$('#gYears').addEventListener('change', applyYears);
$('#gType').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; gType = b.dataset.type; play(false); drawGrowth(); });
$('#gMeasure').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; gTotal = b.dataset.total === '1'; play(false); drawGrowth(); });
$('#gPlay').addEventListener('click', () => play(!gTimer));
$('#gSpeed').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSpeed(b.dataset.speed); });
setSpeed(gSpeed);
$('#gRange').addEventListener('input', e => { play(false); showFrame(+e.target.value, true); });
$('#gTicks').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; play(false); showFrame(+b.dataset.k, true); });
addEventListener('resize', () => { fit(); if (fChart) fChart.resize(); if (gChart) gChart.resize(); });
new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-shade'] });
fit();
(async () => {
  try {
    await load();
    document.querySelectorAll('#gSeg button').forEach(x => x.classList.toggle('on', x.dataset.mode === gMode));
    $('#cyMsg').hidden = true; paint();
    if (QS.get('play') === '1' && VIEW === 'growth') setTimeout(() => play(true), 600);
  } catch (e) {
    $('#cyMsg').textContent = 'The capital city figures could not be loaded. ' + (e && e.message ? e.message : '');
  }
})();
</script>
</body>
</html>
