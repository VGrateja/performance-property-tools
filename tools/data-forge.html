<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Data Forge — Performance Property</title>
<link rel="icon" href="../assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="../shared/theme.js"></script>
<script src="../shared/fit-screen.js"></script>
<!-- SheetJS: in-browser .xlsx parsing — the CoreLogic file never leaves the browser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{ --pp-cyan:#00b6cb; }
  #dfApp{ max-width:1280px; margin:0 auto; padding:64px 22px 60px; }
  .df-head h1{ font-family:'Montserrat',sans-serif; font-size:1.5rem; font-weight:800; margin:0; color:var(--text); letter-spacing:-.01em; }
  .df-head .sub{ font-size:.82rem; color:var(--muted); margin-top:3px; }
  .df-stage{ display:inline-block; margin-top:8px; font-size:.64rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--pp-cyan); border:1px solid var(--border); border-radius:20px; padding:3px 11px; }

  .df-drop{ border:1.5px dashed var(--border); border-radius:12px; padding:26px; text-align:center; color:var(--muted); font-size:.85rem; cursor:pointer; transition:all .16s; margin:18px 0; background:var(--panel); }
  .df-drop:hover, .df-drop.over{ border-color:var(--pp-cyan); color:var(--pp-cyan); background:rgba(0,182,203,.05); }
  .df-drop strong{ color:var(--pp-cyan); }

  .df-card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:18px; }
  .df-card h2{ font-family:'Montserrat',sans-serif; font-size:.78rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--pp-cyan); margin:0 0 12px; }
  .df-card h2 .count{ color:var(--muted); font-weight:700; letter-spacing:0; text-transform:none; margin-left:8px; }

  .df-map{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
  .df-map .m{ border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--panel2); }
  .df-map .m .col{ font-size:.66rem; font-weight:800; color:var(--pp-cyan); }
  .df-map .m .lbl{ font-size:.8rem; font-weight:700; color:var(--text); }
  .df-map .m .hdr{ font-size:.68rem; color:var(--muted); margin-top:2px; }

  .df-tablewrap{ overflow-x:auto; border:1px solid var(--border); border-radius:10px; }
  table.df-table{ border-collapse:collapse; width:100%; font-size:.8rem; }
  .df-table th, .df-table td{ padding:7px 12px; border-bottom:1px solid var(--border); white-space:nowrap; text-align:left; }
  .df-table thead th{ position:sticky; top:0; background:var(--panel2); color:var(--text); font-weight:800; font-size:.7rem; letter-spacing:.04em; text-transform:uppercase; }
  .df-table tbody tr:hover{ background:var(--panel2); }
  .df-table td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .df-table td.region{ font-weight:700; color:var(--text); }
  .df-table .type-H{ color:var(--accent); font-weight:700; }
  .df-table .type-U{ color:var(--muted); font-weight:700; }

  .df-qc{ display:flex; flex-wrap:wrap; gap:10px; }
  .df-pill{ font-size:.74rem; font-weight:700; border:1px solid var(--border); border-radius:8px; padding:7px 12px; background:var(--panel2); color:var(--text); }
  .df-pill.ok{ border-color:rgba(34,197,94,.5); }
  .df-pill.warn{ border-color:#ef4444; color:#ef4444; }
  .df-miss{ margin-top:10px; font-size:.78rem; color:#ef4444; }
  .df-miss b{ color:var(--text); }
  .df-empty{ color:var(--muted); font-style:italic; }
  .df-note{ font-size:.74rem; color:var(--muted); margin-top:10px; }

  /* Floating nav — same pill vocabulary as the other tools. */
  .pp-toolnav{ position:fixed; top:16px; left:16px; z-index:1000; display:flex; gap:8px; align-items:center; }
  #pp-back-to-hub{ display:inline-flex; align-items:center; gap:8px; padding:9px 14px 9px 10px; background:rgba(15,23,42,.85); border:1px solid rgba(71,85,105,.5); border-radius:10px; color:#e2e8f0; font-family:'Montserrat',sans-serif; font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; white-space:nowrap; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:all .15s ease; }
  #pp-back-to-hub:hover{ background:rgba(30,41,59,.95); border-color:rgba(148,163,184,.5); color:#f8fafc; transform:translateX(-1px); }
  #pp-back-to-hub svg{ width:14px; height:14px; }
  [data-theme="light"] #pp-back-to-hub{ background:rgba(255,255,255,.85); border-color:rgba(31,40,63,.18); color:#1a2236; }
</style>
</head>
<body>
<nav class="pp-toolnav">
  <a id="pp-back-to-hub" href="../index.html" title="Back to hub">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span>Back to Hub</span>
  </a>
</nav>

<div id="dfApp">
  <div class="df-head">
    <h1>Data Forge</h1>
    <div class="sub">Gather &amp; filter source data for the online reports. The file is parsed in your browser — nothing is uploaded.</div>
    <div class="df-stage">Stage 1 · Import &amp; filter (CoreLogic)</div>
  </div>

  <div class="df-drop" id="dfDrop">
    <input type="file" id="dfFile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden/>
    📊 <strong>Drop the CoreLogic .xlsx here</strong> (or click)<br/>
    keeps only columns A, B, C, H, Q, AK, AO — all capital cities + the 28 LGA regions.
  </div>

  <div id="dfOut"></div>
</div>

<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 'A'->0, 'H'->7, 'Q'->16, 'AK'->36, 'AO'->40
function colToIdx(letter){ let n=0; for (const ch of letter.toUpperCase()) n = n*26 + (ch.charCodeAt(0)-64); return n-1; }
function normalizeName(s){ return String(s).toLowerCase().replace(/\(.*?\)/g,'').replace(/[-/]/g,' ').replace(/\s+/g,' ').trim(); }

// State codes, tolerant of "Tas." / "Vic." / full names.
const STATE_CANON = { NEWSOUTHWALES:'NSW', VICTORIA:'VIC', QUEENSLAND:'QLD', WESTERNAUSTRALIA:'WA', TASMANIA:'TAS', SOUTHAUSTRALIA:'SA', NORTHERNTERRITORY:'NT', AUSTRALIANCAPITALTERRITORY:'ACT' };
function normState(s){ const u = String(s).toUpperCase().replace(/[^A-Z]/g,''); return STATE_CANON[u] || u; }
function nameTokens(s){ return normalizeName(s).split(' ').filter(Boolean); }
// True if the target name appears as a consecutive run in the file name — so the
// file's full LGA name ("Greater Bendigo", "Port Macquarie-Hastings") matches our
// short target ("Bendigo", "Port Macquarie") without hardcoding each spelling.
function nameMatches(fileName, targetName){
  const f = nameTokens(fileName), t = nameTokens(targetName);
  if (!t.length || f.length < t.length) return false;
  for (let i=0; i+t.length<=f.length; i++){
    let all=true; for (let j=0;j<t.length;j++){ if (f[i+j]!==t[j]){ all=false; break; } }
    if (all) return true;
  }
  return false;
}
// Match a file row (state from col A, name from col B) to one of the 28 targets.
// State must agree, so Central Coast (NSW) is kept but Central Coast (Tas.) isn't.
function matchTarget(stateCell, nameCell){
  const st = normState(stateCell);
  return LGA_TARGETS.find(([n,s]) => normState(s)===st && nameMatches(nameCell, n)) || null;
}

// The 7 kept columns + the friendly label we show. The file's own header text is
// displayed alongside (read from the header row) so the mapping is verifiable.
const KEEP = [
  { l:'A',  label:'State',                 num:false },
  { l:'B',  label:'Region / City',         num:false, region:true },
  { l:'C',  label:'Type',                  num:false, type:true },
  { l:'H',  label:'# sales (12mo)',        num:true },
  { l:'Q',  label:'Median price (3mo)',    num:true },
  { l:'AK', label:'# listings (1mo)',      num:true },
  { l:'AO', label:'Median days on mkt',    num:true },
];

// 28 LGA regions to keep (capitals come through their own tab, unfiltered).
const LGA_TARGETS = [
  ['Mackay','QLD'],['Bundaberg','QLD'],['Ipswich','QLD'],['Rockhampton','QLD'],['Gladstone','QLD'],
  ['Cairns','QLD'],['Townsville','QLD'],['Sunshine Coast','QLD'],['Toowoomba','QLD'],['Gold Coast','QLD'],
  ['Albury','NSW'],['Central Coast','NSW'],['Coffs Harbour','NSW'],['Orange','NSW'],['Port Macquarie','NSW'],
  ['Newcastle','NSW'],['Tamworth','NSW'],['Wagga Wagga','NSW'],['Wollongong','NSW'],
  ['Ballarat','VIC'],['Bendigo','VIC'],['Geelong','VIC'],['Wodonga','VIC'],['Mildura','VIC'],
  ['Mandurah','WA'],['Rockingham','WA'],['Bunbury','WA'],['Launceston','TAS'],
];

const drop = document.getElementById('dfDrop'), fileInput = document.getElementById('dfFile');
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) importXlsx(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) importXlsx(fileInput.files[0]); });

function findSheet(wb, terms){ return wb.SheetNames.find(n => { const ln = n.toLowerCase(); return terms.every(t => ln.includes(t)); }); }

// Locate the header row (CoreLogic exports sometimes carry a title row or two above it).
function findHeaderRow(rows){
  for (let i=0; i<Math.min(rows.length,12); i++){
    const cells = (rows[i]||[]).map(c => String(c).trim().toLowerCase());
    if (cells.includes('property type') || cells.includes('state') || cells.includes('capital city') || cells.includes('lga')) return i;
  }
  return 0;
}

// Extract kept columns + filtered rows from one tab.
function processTab(ws, mode){
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' });
  const hr = findHeaderRow(rows);
  const headers = KEEP.map(k => String((rows[hr]||[])[colToIdx(k.l)] || '').trim());
  const out = []; const matched = new Set();
  for (let i=hr+1; i<rows.length; i++){
    const r = rows[i] || [];
    const name = String(r[colToIdx('B')] || '').trim();
    if (!name) continue;                                   // skip blank/spacer rows
    if (mode === 'lga'){
      const tgt = matchTarget(r[colToIdx('A')], name);     // name + state; tolerant of full "Greater …" LGA names
      if (!tgt) continue;
      matched.add(normalizeName(tgt[0]) + '|' + normState(tgt[1]));
    }
    out.push(KEEP.map(k => String(r[colToIdx(k.l)] ?? '').trim()));
  }
  return { headers, rows: out, matched };
}

async function importXlsx(file){
  const out = document.getElementById('dfOut');
  if (!window.XLSX){ out.innerHTML = card('Error', '<div class="df-empty">Spreadsheet reader failed to load — check your connection and reload.</div>'); return; }
  out.innerHTML = '<div class="df-note">Reading ' + esc(file.name) + ' …</div>';
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    const wb = XLSX.read(buf, { type:'array' });
    const capName = findSheet(wb, ['market trends','capital']);
    const lgaName = findSheet(wb, ['market trends','lga']);

    let html = '';
    const tabsNote = 'Tabs found: ' + wb.SheetNames.map(esc).join(', ');
    html += card('Workbook', '<div class="df-note" style="margin-top:0">' + tabsNote + '</div>' + mappingHtml(capName ? processTab(wb.Sheets[capName],'cap').headers : (lgaName ? processTab(wb.Sheets[lgaName],'lga').headers : KEEP.map(()=>''))));

    if (capName){
      const cap = processTab(wb.Sheets[capName], 'cap');
      const cities = new Set(cap.rows.map(r => r[1].toLowerCase())).size;
      html += card('Capital Cities <span class="count">' + cap.rows.length + ' rows · ' + cities + ' cities (House + Unit)</span>', tableHtml(cap.rows));
    } else {
      html += card('Capital Cities', '<div class="df-empty">No “Market Trends (CapitalCities)” tab found.</div>');
    }

    if (lgaName){
      const lga = processTab(wb.Sheets[lgaName], 'lga');
      const missing = LGA_TARGETS.filter(([n,s]) => !lga.matched.has(normalizeName(n) + '|' + normState(s)));
      let qc = '<div class="df-qc">'
        + '<span class="df-pill ' + (missing.length ? 'warn' : 'ok') + '">' + lga.matched.size + ' / ' + LGA_TARGETS.length + ' regions matched</span>'
        + '<span class="df-pill">' + lga.rows.length + ' rows kept</span></div>';
      if (missing.length) qc += '<div class="df-miss"><b>Not found in file:</b> ' + missing.map(([n,s]) => esc(n + ' (' + s + ')')).join(', ') + '</div>';
      html += card('Regional LGAs <span class="count">filtered to the 28 target regions</span>', qc + '<div style="height:12px"></div>' + tableHtml(lga.rows));
    } else {
      html += card('Regional LGAs', '<div class="df-empty">No “Market Trends (LGA)” tab found.</div>');
    }

    out.innerHTML = html;
  } catch(err){
    console.warn('xlsx import failed', err);
    out.innerHTML = card('Error', '<div class="df-empty">Could not read that file: ' + esc(err.message || err) + '</div>');
  }
}

function card(title, body){ return '<div class="df-card"><h2>' + title + '</h2>' + body + '</div>'; }

function mappingHtml(fileHeaders){
  return '<div style="height:12px"></div><div class="df-map">' + KEEP.map((k,i) =>
    '<div class="m"><div class="col">Col ' + k.l + '</div><div class="lbl">' + esc(k.label) + '</div>'
    + '<div class="hdr">' + (fileHeaders[i] ? esc(fileHeaders[i]) : '—') + '</div></div>'
  ).join('') + '</div>';
}

function tableHtml(rows){
  if (!rows.length) return '<div class="df-empty">No matching rows.</div>';
  const head = '<tr>' + KEEP.map(k => '<th>' + esc(k.label) + '</th>').join('') + '</tr>';
  const body = rows.map(r => '<tr>' + r.map((v,ci) => {
    const k = KEEP[ci];
    if (k.type){ const t = v.toUpperCase(); return '<td><span class="type-' + (t==='H'||t==='U'?t:'') + '">' + esc(t==='H'?'House':t==='U'?'Unit':v) + '</span></td>'; }
    if (k.region) return '<td class="region">' + esc(v) + '</td>';
    return '<td class="' + (k.num?'num':'') + '">' + esc(v) + '</td>';
  }).join('') + '</tr>').join('');
  return '<div class="df-tablewrap"><table class="df-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}
</script>
</body>
</html>
