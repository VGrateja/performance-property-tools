<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Present-Chart Lab — Performance Property</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<!--
  PREVIEW / DEV HARNESS for the Phase-3 presentation chart engine
  (shared/present-charts.js). Standalone + sample data (NO login, NO
  Supabase) so the billboard look + click-to-build animation can be
  reviewed before wiring the engine into the real presentation tool.
  Not linked from the hub. Open it directly: /tools/present-chart-lab.html
  Drive a chart with the Build button, the → arrow key, or click the slide.
-->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="../shared/present-charts.js?v=4cca4674"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b1020; color: #e8ecf6;
    font-family: 'Montserrat', system-ui, sans-serif;
    min-height: 100vh; padding: 28px;
  }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: .3px; margin: 0 0 4px; }
  .sub { color: rgba(232,236,246,0.6); font-size: 13px; margin-bottom: 20px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
  .toolbar select, .toolbar button {
    font: inherit; font-size: 14px; font-weight: 600;
    color: #e8ecf6; background: rgba(92,200,224,0.16);
    border: 1px solid rgba(92,200,224,0.45); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; transition: background .15s ease;
  }
  .toolbar button:hover, .toolbar select:hover { background: rgba(92,200,224,0.3); }
  .toolbar .primary { background: linear-gradient(135deg,#5cc8e0,#0083A3); color: #06121a; border-color: transparent; }
  .toolbar .step { margin-left: auto; color: rgba(232,236,246,0.7); font-size: 13px; }
  /* 16:9 "slide" stage (1280x720 — the real slide size), WHITE like a
     real slide so the light-theme charts preview accurately. The chart
     fills the stage here; on a real slide it'll be a resizable element you
     size down to leave room for a header / description / logo. */
  .stage {
    width: 100%; max-width: 1100px; aspect-ratio: 16 / 9;
    background: radial-gradient(ellipse at center, #f4f8ff 0%, #ffffff 70%);
    border: 1px solid rgba(10,21,32,0.10); border-radius: 16px;
    overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    position: relative; cursor: pointer;
  }
  .hint { margin-top: 14px; color: rgba(232,236,246,0.5); font-size: 12.5px; }
  kbd { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); border-radius: 5px; padding: 1px 6px; font-size: 12px; }
</style>
</head>
<body>
  <h1>Present-Chart Lab</h1>
  <div class="sub">Preview of the slide chart engine — billboard styling + click-to-build animation. Sample data only.</div>

  <div class="toolbar">
    <select id="pick" title="Choose an example chart"></select>
    <button id="build" class="primary" type="button">Build ▶ (→)</button>
    <button id="play" type="button">Autoplay</button>
    <button id="reset" type="button">Reset</button>
    <span class="step" id="stepLabel">step 0 / 0</span>
  </div>

  <div class="stage" id="stage"></div>
  <div class="hint">Click the slide, press <kbd>→</kbd>, or hit <strong>Build</strong> to reveal the next piece — same as a presenter clicking through. <kbd>←</kbd> steps back.</div>

<script>
/* ─── Sample specs (stand-ins for what the real cached report data will
   produce). Each mirrors a common report chart shape. ─── */
const YEARS = (function () { const a = []; for (let y = 2008; y <= 2025; y++) a.push(String(y)); return a; })();
const HOUSE = [520,505,540,560,575,600,665,760,880,910,905,940,1050,1180,1120,1190,1240,1320].map(v => v*1000);
const UNIT  = [430,425,445,460,470,485,520,575,640,660,655,675,720,775,745,780,805,840].map(v => v*1000);

const SAMPLES = {
  'line-median': {
    label: 'Median price — house vs unit (multi-line)',
    spec: {
      type: 'multiLine', unit: 'aud',
      title: 'Sydney median price', subtitle: 'House vs unit · 2008–2025',
      data: { x: YEARS, series: [ { name: 'House', values: HOUSE }, { name: 'Unit', values: UNIT } ] },
    },
  },
  'line-single': {
    label: 'Vacancy rate (single line)',
    spec: {
      type: 'line', unit: 'pct',
      title: 'Rental vacancy rate', subtitle: 'Sydney · 2008–2025',
      data: { x: YEARS, series: [ { name: 'Vacancy', values: [2.1,2.4,1.8,1.5,1.9,2.2,2.0,1.7,1.9,2.3,3.0,2.7,2.4,1.6,1.0,1.2,1.4,1.3] } ] },
    },
  },
  'bignum': {
    label: 'Headline stat (count-up)',
    spec: { type: 'bigNumber', unit: 'pct', value: 8.25, title: 'Peak 5-year average return', subtitle: 'Reached July 2008' },
  },
  'bars-growth': {
    label: '5-year growth by city (bars)',
    spec: {
      type: 'bars', unit: 'pct',
      title: '5-year capital growth', subtitle: 'Houses · by capital city',
      data: { x: ['Brisbane','Adelaide','Perth','Sydney','Melbourne'], values: [62, 58, 71, 44, 39] },
    },
  },
};

const $stage = document.getElementById('stage');
const $pick = document.getElementById('pick');
const $step = document.getElementById('stepLabel');
let ctrl = null;

Object.keys(SAMPLES).forEach(k => {
  const o = document.createElement('option'); o.value = k; o.textContent = SAMPLES[k].label; $pick.appendChild(o);
});

function syncLabel() {
  if (!ctrl) { $step.textContent = 'step 0 / 0'; return; }
  $step.textContent = 'step ' + ctrl.index + ' / ' + ctrl.steps + (ctrl.isComplete() ? ' · done' : '');
}
function load(key) {
  if (ctrl) ctrl.dispose();
  ctrl = window.PresentChart.create($stage, SAMPLES[key].spec);
  syncLabel();
}
function build() { if (ctrl) { ctrl.next(); syncLabel(); } }

document.getElementById('build').addEventListener('click', build);
document.getElementById('reset').addEventListener('click', () => { if (ctrl) { ctrl.reset(); syncLabel(); } });
document.getElementById('play').addEventListener('click', () => { if (ctrl) { ctrl.play(); const t = setInterval(syncLabel, 200); setTimeout(() => clearInterval(t), 12000); } });
$pick.addEventListener('change', () => load($pick.value));
$stage.addEventListener('click', build);
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowRight') { ev.preventDefault(); build(); }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); if (ctrl) { ctrl.prev(); syncLabel(); } }
});
window.addEventListener('resize', () => { if (ctrl) ctrl.resize(); });

load($pick.value);
</script>
</body>
</html>
