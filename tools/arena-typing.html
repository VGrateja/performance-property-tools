<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Test — Performance Property Arena</title>
<link rel="icon" href="../assets/logo.png" type="image/png"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/common.css"/>
<script src="../shared/theme.js"></script>
<style>
  /* ─── Typing test page ─── monkeytype-inspired layout. The whole
     page is a focusable surface; the user just starts typing and
     the hidden input captures keystrokes. */

  body{ margin:0; min-height:100vh; }
  #typingView{
    display:flex; flex-direction:column; min-height:100vh;
    background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 50%, #082f49 100%);
    color:#e9eef7;
  }
  [data-theme="light"] #typingView{
    background: linear-gradient(160deg, #f0f9ff 0%, #e0e7ff 50%, #cffafe 100%);
    color:#0a1520;
  }

  /* Top-left back-to-hub pill — same pattern every other tool uses. */
  #pp-back-to-hub{
    position:fixed; top:16px; left:16px; z-index:10000;
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 14px 9px 10px;
    background:rgba(15,23,42,.85);
    border:1px solid rgba(71,85,105,.5);
    border-radius:10px;
    color:#e2e8f0;
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    font-size:13px; font-weight:600; letter-spacing:.01em;
    text-decoration:none; cursor:pointer;
    white-space:nowrap;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:all .15s ease;
  }
  #pp-back-to-hub:hover{
    background:rgba(30,41,59,.95);
    border-color:rgba(148,163,184,.5);
    color:#f8fafc;
    transform:translateX(-1px);
  }
  #pp-back-to-hub svg{ width:14px; height:14px; }
  [data-theme="light"] #pp-back-to-hub{
    background:rgba(255,255,255,.85);
    border-color:rgba(31,40,63,.18);
    color:#1a2236;
  }
  [data-theme="light"] #pp-back-to-hub:hover{
    background:rgba(255,255,255,.97);
    border-color:rgba(0,182,203,.55);
    color:#0a1520;
  }

  /* Back-to-Arena pill — sits next to back-to-hub so both navs are
     reachable in one glance. */
  #pp-back-to-arena{
    position:fixed; top:16px; left:160px; z-index:10000;
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 14px;
    background:rgba(15,23,42,.85);
    border:1px solid rgba(71,85,105,.5);
    border-radius:10px;
    color:#e2e8f0;
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    font-size:12.5px; font-weight:600; letter-spacing:.01em;
    text-decoration:none; cursor:pointer;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:all .15s ease;
  }
  #pp-back-to-arena:hover{
    background:rgba(30,41,59,.95);
    border-color:rgba(148,163,184,.5);
    color:#f8fafc;
  }
  [data-theme="light"] #pp-back-to-arena{
    background:rgba(255,255,255,.85);
    border-color:rgba(31,40,63,.18);
    color:#1a2236;
  }
  [data-theme="light"] #pp-back-to-arena:hover{
    background:rgba(255,255,255,.97);
    border-color:rgba(0,182,203,.55);
  }

  .typing-inner{
    flex:1; display:flex; flex-direction:column; align-items:center;
    padding:80px 20px 40px; max-width:1100px; margin:0 auto; width:100%;
  }

  /* ─── Mode bar ─── pill-shaped row of segmented buttons for time
     and word list. Active option is filled with the accent colour. */
  .typing-modebar{
    display:flex; flex-wrap:wrap; gap:6px;
    padding:6px;
    background:rgba(15,23,42,0.55);
    border:1px solid rgba(0,182,203,0.25);
    border-radius:99px;
    margin-bottom:48px;
    backdrop-filter:blur(10px) saturate(140%);
    -webkit-backdrop-filter:blur(10px) saturate(140%);
  }
  [data-theme="light"] .typing-modebar{
    background:rgba(255,255,255,0.78);
    border-color:rgba(0,182,203,0.30);
    box-shadow:0 4px 14px rgba(31,40,63,0.06);
  }
  .typing-modebar-group{
    display:flex; gap:2px; padding:2px;
  }
  .typing-modebar-divider{
    width:1px; align-self:stretch;
    background:rgba(255,255,255,0.12);
    margin:6px 6px;
  }
  [data-theme="light"] .typing-modebar-divider{
    background:rgba(31,40,63,0.14);
  }
  .typing-mode-btn{
    appearance:none; -webkit-appearance:none;
    border:0; background:transparent;
    padding:7px 14px;
    border-radius:99px;
    font-family:'Montserrat',sans-serif;
    font-weight:700; font-size:11.5px;
    letter-spacing:1.2px; text-transform:uppercase;
    color:inherit; opacity:.6;
    cursor:pointer;
    transition:opacity .15s ease, background .15s ease, color .15s ease;
  }
  .typing-mode-btn:hover{ opacity:.9; }
  .typing-mode-btn.is-active{
    background:rgba(0,182,203,0.25);
    color:#00b6cb;
    opacity:1;
  }
  [data-theme="light"] .typing-mode-btn.is-active{
    background:rgba(0,182,203,0.18);
    color:#0a7889;
  }

  /* ─── Live stats row ─── */
  .typing-stats{
    display:flex; gap:48px; margin-bottom:32px;
    font-family:'Roboto Mono',monospace;
    height:48px; align-items:center;
    visibility:hidden;          /* shown once typing starts */
  }
  .typing-stats.is-on{ visibility:visible; }
  .typing-stat{
    display:flex; flex-direction:column; align-items:center;
  }
  .typing-stat-label{
    font-family:'Montserrat',sans-serif;
    font-weight:700; font-size:9.5px;
    letter-spacing:1.6px; text-transform:uppercase;
    opacity:.55; margin-bottom:3px;
  }
  .typing-stat-value{
    font-size:30px; font-weight:500;
    color:#00b6cb;
    line-height:1;
  }

  /* ─── Word feed ─── three-line viewport of words. The whole
     paragraph is rendered, but we shift it up by `--feed-shift` lines
     so the active row stays in the middle. Out-of-focus state blurs
     the text and shows a "click here" prompt. */
  .typing-feed-wrap{
    position:relative;
    width:100%;
    max-width:1000px;
    overflow:hidden;
    margin-bottom:14px;
    cursor:text;
  }
  .typing-feed-wrap.is-blurred .typing-feed{ filter:blur(5px); opacity:.5; }
  .typing-feed-wrap.is-blurred .typing-feed-prompt{ opacity:1; pointer-events:auto; }

  .typing-feed-prompt{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Montserrat',sans-serif;
    font-weight:700; font-size:13px;
    letter-spacing:1.4px; text-transform:uppercase;
    color:rgba(255,255,255,0.85);
    background:rgba(15,23,42,0.10);
    backdrop-filter:blur(2px);
    opacity:0; pointer-events:none;
    transition:opacity .18s ease;
    border-radius:8px;
    z-index:2;
  }
  [data-theme="light"] .typing-feed-prompt{ color:rgba(10,21,32,0.85); }

  .typing-feed{
    --feed-shift: 0;
    font-family:'Roboto Mono',monospace;
    font-size:26px;
    line-height:1.6;
    transform:translateY(calc(var(--feed-shift) * -1.6em));
    transition:transform .14s ease;
    color:rgba(255,255,255,0.40);
  }
  [data-theme="light"] .typing-feed{ color:rgba(10,21,32,0.45); }

  .typing-word{
    display:inline-block; margin-right:0.55em;
    border-bottom:2px solid transparent;
  }
  .typing-word.has-error{
    border-bottom-color:rgba(248,113,113,0.55);
  }
  /* Each char is its own span so we can colour by correctness. */
  .typing-char{ position:relative; }
  .typing-char.is-correct{ color:rgba(255,255,255,0.95); }
  [data-theme="light"] .typing-char.is-correct{ color:rgba(10,21,32,0.92); }
  .typing-char.is-wrong{
    color:#f87171;
    text-decoration:underline;
    text-decoration-color:rgba(248,113,113,0.7);
  }
  /* Extra characters typed past the word's end (overflow). */
  .typing-char.is-extra{
    color:#fbbf24;
    text-decoration:underline;
    text-decoration-color:rgba(251,191,36,0.6);
  }

  /* Blinking caret on the next character to type. We add it as a
     pseudo-element so it doesn't shift layout. */
  .typing-char.is-cursor::before{
    content:''; position:absolute;
    left:-1px; top:0.05em;
    width:2px; height:1em;
    background:#00b6cb;
    animation:typing-caret 1s steps(1) infinite;
  }
  /* Cursor sitting at the end of a word (or end of feed). */
  .typing-word.is-cursor-end::after{
    content:''; display:inline-block;
    width:2px; height:1em;
    background:#00b6cb;
    margin-left:1px;
    vertical-align:-0.16em;
    animation:typing-caret 1s steps(1) infinite;
  }
  @keyframes typing-caret{ 50%{ opacity:0; } }

  /* Hidden input that catches keystrokes. We could rely on a
     keydown listener on the document, but a real <input> works
     better with mobile keyboards / IMEs / paste-blocking. */
  .typing-input{
    position:absolute; left:-9999px; top:0;
    width:1px; height:1px; opacity:0;
  }

  /* ─── Action row under the feed ─── restart button + tab hint. */
  .typing-actions{
    display:flex; gap:18px; align-items:center; margin-top:18px;
  }
  .typing-restart{
    appearance:none; -webkit-appearance:none;
    border:1px solid rgba(0,182,203,0.45);
    background:rgba(0,182,203,0.10);
    color:#00b6cb;
    padding:8px 18px;
    border-radius:99px;
    font-family:'Montserrat',sans-serif;
    font-weight:700; font-size:11px;
    letter-spacing:1.6px; text-transform:uppercase;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .typing-restart:hover{
    background:rgba(0,182,203,0.20);
    border-color:rgba(0,182,203,0.75);
  }
  .typing-hint{
    font-family:'Montserrat',sans-serif;
    font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase;
    opacity:.45;
  }
  .typing-hint kbd{
    display:inline-block;
    padding:2px 6px;
    border:1px solid rgba(255,255,255,0.20);
    border-radius:4px;
    font-family:'Roboto Mono',monospace;
    font-size:10.5px; letter-spacing:0;
    margin:0 2px;
    background:rgba(15,23,42,0.40);
  }
  [data-theme="light"] .typing-hint kbd{
    background:rgba(255,255,255,0.85);
    border-color:rgba(31,40,63,0.16);
  }

  /* ─── Result panel ─── shown after the timer hits zero. Replaces
     the live feed; click "Try again" to spin up a fresh test. */
  .typing-results{
    display:none;
    width:100%; max-width:920px;
    padding:32px 28px;
    background:rgba(15,23,42,0.60);
    border:1px solid rgba(0,182,203,0.30);
    border-radius:14px;
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    margin-bottom:40px;
  }
  .typing-results.is-on{ display:block; }
  [data-theme="light"] .typing-results{
    background:rgba(255,255,255,0.85);
    border-color:rgba(0,182,203,0.35);
    box-shadow:0 8px 28px rgba(31,40,63,0.10);
  }
  .typing-results-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
    margin-bottom:18px;
  }
  @media (max-width:640px){
    .typing-results-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  .typing-result-cell{
    display:flex; flex-direction:column; gap:4px;
  }
  .typing-result-label{
    font-family:'Montserrat',sans-serif;
    font-weight:700; font-size:9.5px;
    letter-spacing:1.6px; text-transform:uppercase;
    opacity:.55;
  }
  .typing-result-value{
    font-family:'Roboto Mono',monospace;
    font-size:34px; line-height:1; font-weight:500;
    color:#00b6cb;
  }
  .typing-result-sub{
    font-family:'Montserrat',sans-serif;
    font-size:10.5px; opacity:.55;
    margin-top:2px;
  }
  .typing-results-meta{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:12px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,0.10);
    font-family:'Montserrat',sans-serif;
    font-size:11px; letter-spacing:1.2px; text-transform:uppercase;
    opacity:.65;
  }
  [data-theme="light"] .typing-results-meta{ border-top-color:rgba(31,40,63,0.10); }

  /* Save-state pill (saving / saved / error). */
  .typing-save-state{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px;
    border-radius:99px;
    font-family:'Montserrat',sans-serif;
    font-weight:700; font-size:10px;
    letter-spacing:1.4px; text-transform:uppercase;
    background:rgba(15,23,42,0.50);
    border:1px solid rgba(255,255,255,0.18);
  }
  .typing-save-state.is-saving{ color:#fbbf24; border-color:rgba(251,191,36,0.50); }
  .typing-save-state.is-saved{ color:#34d399; border-color:rgba(52,211,153,0.50); }
  .typing-save-state.is-error{ color:#f87171; border-color:rgba(248,113,113,0.50); }
  [data-theme="light"] .typing-save-state{ background:rgba(255,255,255,0.85); border-color:rgba(31,40,63,0.18); }

  /* ─── Leaderboard ─── compact table next to / below the feed.
     Filtered to currently-selected mode + word list. */
  .typing-board-wrap{
    width:100%; max-width:920px;
    margin-top:32px;
  }
  .typing-board-head{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:8px;
    margin-bottom:10px;
  }
  .typing-board-title{
    font-family:'Montserrat',sans-serif;
    font-weight:800; font-size:11.5px;
    letter-spacing:2px; text-transform:uppercase;
    opacity:.85;
    margin:0;
  }
  .typing-board-sub{
    font-family:'Montserrat',sans-serif;
    font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase;
    opacity:.50;
  }
  .typing-board{
    width:100%;
    border-collapse:collapse;
    background:rgba(15,23,42,0.40);
    border:1px solid rgba(0,182,203,0.18);
    border-radius:10px;
    overflow:hidden;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  [data-theme="light"] .typing-board{
    background:rgba(255,255,255,0.78);
    border-color:rgba(0,182,203,0.25);
  }
  .typing-board th, .typing-board td{
    padding:9px 14px;
    text-align:left;
    font-family:'Roboto',sans-serif;
    font-size:13px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  [data-theme="light"] .typing-board th,
  [data-theme="light"] .typing-board td{ border-bottom-color:rgba(31,40,63,0.06); }
  .typing-board th{
    font-family:'Montserrat',sans-serif;
    font-weight:700; font-size:10px;
    letter-spacing:1.4px; text-transform:uppercase;
    opacity:.55;
    background:rgba(15,23,42,0.30);
  }
  [data-theme="light"] .typing-board th{ background:rgba(31,40,63,0.04); }
  .typing-board tr:last-child td{ border-bottom:0; }
  .typing-board td.col-rank{ width:60px; opacity:.55; }
  .typing-board td.col-wpm{ font-family:'Roboto Mono',monospace; font-weight:700; color:#00b6cb; }
  .typing-board td.col-acc{ font-family:'Roboto Mono',monospace; opacity:.85; }
  .typing-board tr.is-self td{ background:rgba(0,182,203,0.10); }
  [data-theme="light"] .typing-board tr.is-self td{ background:rgba(0,182,203,0.08); }
  .typing-board-empty{
    padding:18px 14px; text-align:center;
    font-family:'Montserrat',sans-serif;
    font-size:11px; letter-spacing:1.2px; text-transform:uppercase;
    opacity:.45;
  }
</style>
</head>
<body>
<!-- Auth scripts: Supabase + auth-gate.js (which redirects unauthenticated
     users back to the hub login). The Arena allowlist check is the inline
     <script> at the bottom — same pattern as arena.html. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase-client.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/auth-gate.js"></script>

<div id="typingView">
  <a id="pp-back-to-hub" href="../index.html" title="Back to hub"
     onclick="event.preventDefault(); if (typeof navigateToHub === 'function') { navigateToHub(); } else { location.href = '../index.html'; }">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    <span>Back to Hub</span>
  </a>
  <a id="pp-back-to-arena" href="arena.html" title="Back to Arena">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    <span>Arena</span>
  </a>

  <div class="typing-inner">

    <!-- Mode selectors: time first, word list second. Click toggles
         the active button and resets the test. -->
    <div class="typing-modebar" id="typing-modebar">
      <div class="typing-modebar-group" data-group="seconds">
        <button class="typing-mode-btn"            type="button" data-seconds="15">15s</button>
        <button class="typing-mode-btn is-active"  type="button" data-seconds="30">30s</button>
        <button class="typing-mode-btn"            type="button" data-seconds="60">60s</button>
      </div>
      <div class="typing-modebar-divider"></div>
      <div class="typing-modebar-group" data-group="wordlist">
        <button class="typing-mode-btn is-active" type="button" data-wordlist="english">English</button>
        <button class="typing-mode-btn"           type="button" data-wordlist="real-estate">Real Estate</button>
        <button class="typing-mode-btn"           type="button" data-wordlist="code">Code</button>
      </div>
    </div>

    <!-- Live stats — hidden until the user begins typing so the
         first impression is just the prompt and the words. -->
    <div class="typing-stats" id="typing-stats">
      <div class="typing-stat">
        <span class="typing-stat-label">Time</span>
        <span class="typing-stat-value" id="typing-time">30</span>
      </div>
      <div class="typing-stat">
        <span class="typing-stat-label">WPM</span>
        <span class="typing-stat-value" id="typing-wpm">0</span>
      </div>
    </div>

    <!-- Word feed + the hidden input. Click anywhere in the wrap to
         re-focus the input (keystrokes route there). -->
    <div class="typing-feed-wrap" id="typing-feed-wrap">
      <div class="typing-feed-prompt">Click or press any key to start</div>
      <div class="typing-feed" id="typing-feed"></div>
      <input class="typing-input" id="typing-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    </div>

    <!-- Restart + Tab hint sit under the feed. -->
    <div class="typing-actions">
      <button class="typing-restart" id="typing-restart" type="button">Restart</button>
      <span class="typing-hint"><kbd>Tab</kbd> + <kbd>Enter</kbd> to restart</span>
    </div>

    <!-- Results panel — shown after a run completes. Repopulated
         each run; "Try again" is just a Restart shortcut. -->
    <div class="typing-results" id="typing-results">
      <div class="typing-results-grid">
        <div class="typing-result-cell">
          <span class="typing-result-label">WPM</span>
          <span class="typing-result-value" id="result-wpm">0</span>
          <span class="typing-result-sub" id="result-wpm-sub">net</span>
        </div>
        <div class="typing-result-cell">
          <span class="typing-result-label">Accuracy</span>
          <span class="typing-result-value" id="result-acc">0%</span>
          <span class="typing-result-sub" id="result-acc-sub">— / —</span>
        </div>
        <div class="typing-result-cell">
          <span class="typing-result-label">Raw WPM</span>
          <span class="typing-result-value" id="result-raw">0</span>
          <span class="typing-result-sub">no accuracy penalty</span>
        </div>
        <div class="typing-result-cell">
          <span class="typing-result-label">Consistency</span>
          <span class="typing-result-value" id="result-cons">0%</span>
          <span class="typing-result-sub">stddev of per-second WPM</span>
        </div>
      </div>
      <div class="typing-results-meta">
        <span id="result-meta">— · — · english</span>
        <span class="typing-save-state" id="result-save">Idle</span>
      </div>
    </div>

    <!-- Leaderboard for the active mode + word list. Re-fetched on
         mode switch and after every save. -->
    <div class="typing-board-wrap">
      <div class="typing-board-head">
        <h2 class="typing-board-title">Leaderboard</h2>
        <span class="typing-board-sub" id="board-sub">Top 10 · 30s · English</span>
      </div>
      <div id="board-host">
        <div class="typing-board-empty">Loading…</div>
      </div>
    </div>

  </div>
</div>

<script>
/* ─── Allowlist gate ─── same pattern as arena.html. */
const ARENA_EMAILS = [
  'vandolf@performanceproperty.com.au'
];
(function arenaGate() {
  function check() {
    let email = '';
    try { if (typeof getCurrentUserEmail === 'function') email = (getCurrentUserEmail() || '').toLowerCase(); } catch (_) {}
    if (!email) return false;
    if (ARENA_EMAILS.indexOf(email) < 0) {
      location.replace('../index.html');
    }
    return true;
  }
  if (!check()) {
    let tries = 0;
    const t = setInterval(() => { tries++; if (check() || tries > 20) clearInterval(t); }, 100);
  }
})();
</script>

<script>
/* ============================================================================
 * Typing Test — game logic.
 *
 * Test life-cycle:
 *   idle  ->  running (on first keystroke; timer starts)
 *         ->  finished (timer hits zero; results + leaderboard refresh)
 *         ->  back to idle (Restart / Tab+Enter / mode switch)
 *
 * Word feed uses a single rolling string of words from the active list.
 * Each word renders as <span class="typing-word"> with per-char child
 * spans; on every keystroke we mutate only the affected spans (no full
 * re-render) so typing feels instant even on long word counts.
 *
 * WPM math:
 *   - net WPM = (correct chars / 5) / minutes_elapsed
 *   - raw WPM = (typed chars / 5) / minutes_elapsed (no accuracy penalty)
 *   - accuracy = correct chars / total typed chars
 *   - consistency = 1 - (stddev(per-second-net-WPM) / mean(per-second-net-WPM))
 *     (clamped to [0, 1]; gives ~100% for a perfectly even pace)
 * ========================================================================== */

/* ─── Word lists ─── */
const WORDS_ENGLISH = (
  'the of and to a in is you that it he was for on are as with his they at be ' +
  'this have from or one had by word but not what all were we when your can said ' +
  'there use an each which she do how their if will up other about out many then ' +
  'them these so some her would make like him into time has look two more write ' +
  'go see number no way could people my than first water been call who oil its ' +
  'now find long down day did get come made may part over new sound take only ' +
  'little work know place year live me back give most very after thing our just ' +
  'name good sentence man think say great where help through much before line ' +
  'right too means old any same tell boy follow came want show also around farm ' +
  'three small set put end why again turn here off went old number great tell men'
).split(/\s+/).filter(Boolean);

const WORDS_REAL_ESTATE = (
  'property listing agent vendor buyer settlement auction valuation suburb ' +
  'median market broker mortgage tenant lessor freehold leasehold strata title ' +
  'inspection appraisal comparable sales rental yield growth capital negative ' +
  'gearing depreciation contract conveyance commission franchise principal ' +
  'campaign offer counter exchange cooling period deposit settlement balance ' +
  'finance pre-approval loan equity refinance investor portfolio landlord ' +
  'maintenance repair fixture fitting bedroom bathroom carport garage land ' +
  'size dwelling apartment unit townhouse villa house terrace duplex acreage ' +
  'rural commercial industrial residential subdivision zoning council rates ' +
  'water levy body corporate strata fees outgoings ingoings disclosure section ' +
  'thirty two contract building pest inspection due diligence settlement period ' +
  'completion handover keys final walk through clearance certificate'
).split(/\s+/).filter(Boolean);

const WORDS_CODE = (
  'function const let var return if else for while break continue switch case ' +
  'default class extends super new this typeof instanceof async await yield ' +
  'throw try catch finally import export from default null undefined true false ' +
  'public private protected static void int string boolean number array object ' +
  'map filter reduce forEach push pop shift unshift slice splice concat join ' +
  'split length includes indexOf find some every promise resolve reject then ' +
  'catch fetch json parse stringify document window event listener add remove ' +
  'query selector get set value innerHTML className classList toggle style'
).split(/\s+/).filter(Boolean);

const WORD_LISTS = {
  'english':     WORDS_ENGLISH,
  'real-estate': WORDS_REAL_ESTATE,
  'code':        WORDS_CODE,
};

/* ─── DOM refs ─── */
const $modebar    = document.getElementById('typing-modebar');
const $stats      = document.getElementById('typing-stats');
const $time       = document.getElementById('typing-time');
const $wpm        = document.getElementById('typing-wpm');
const $feedWrap   = document.getElementById('typing-feed-wrap');
const $feed       = document.getElementById('typing-feed');
const $input      = document.getElementById('typing-input');
const $restart    = document.getElementById('typing-restart');
const $results    = document.getElementById('typing-results');
const $resultWpm  = document.getElementById('result-wpm');
const $resultWpmSub = document.getElementById('result-wpm-sub');
const $resultAcc  = document.getElementById('result-acc');
const $resultAccSub = document.getElementById('result-acc-sub');
const $resultRaw  = document.getElementById('result-raw');
const $resultCons = document.getElementById('result-cons');
const $resultMeta = document.getElementById('result-meta');
const $resultSave = document.getElementById('result-save');
const $boardSub   = document.getElementById('board-sub');
const $boardHost  = document.getElementById('board-host');

/* ─── State ─── */
let modeSeconds = 30;
let wordList    = 'english';

let words      = [];      /* string[] — target words */
let typedWords = [];      /* string[] — what user actually typed (incl. extras) */
let curWord    = 0;       /* index into words[] */
let curChar    = 0;       /* char position within curWord's typedWords entry */
let charsCorrect   = 0;
let charsIncorrect = 0;
let extrasTyped    = 0;   /* chars typed past the target word's length */

let phase     = 'idle';   /* 'idle' | 'running' | 'finished' */
let startTs   = 0;
let endTs     = 0;
let tickTimer = null;

/* Per-second sample of CORRECT-chars-so-far. Used after the test
   ends to compute per-second net-WPM and its consistency. */
let secondSamples = [];

/* ─── Word generation ─── pick enough words to comfortably outlast
   the longest mode (60s @ ~120wpm worst case). 250 is overkill for
   most users but means we never run out mid-test. */
function generateWords() {
  const list = WORD_LISTS[wordList] || WORDS_ENGLISH;
  const out = [];
  let last = '';
  for (let i = 0; i < 250; i++) {
    let w;
    /* Avoid same-word repeats so the test feels less "random sample" */
    do { w = list[Math.floor(Math.random() * list.length)]; }
    while (w === last && list.length > 1);
    out.push(w);
    last = w;
  }
  return out;
}

/* ─── Initial render ─── one <span class="typing-word"> per word,
   each containing one <span class="typing-char"> per char. */
function renderFeed() {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    const wEl = document.createElement('span');
    wEl.className = 'typing-word';
    wEl.dataset.idx = String(i);
    for (let j = 0; j < w.length; j++) {
      const c = document.createElement('span');
      c.className = 'typing-char';
      c.textContent = w[j];
      c.dataset.idx = String(j);
      wEl.appendChild(c);
    }
    frag.appendChild(wEl);
  }
  $feed.innerHTML = '';
  $feed.appendChild(frag);
  paintCursor();
}

/* Place the blinking caret. Visually it's an ::before on the active
   char, OR an ::after on the active word if the user is typing
   characters past the word's natural end. */
function paintCursor() {
  $feed.querySelectorAll('.is-cursor').forEach(n => n.classList.remove('is-cursor'));
  $feed.querySelectorAll('.is-cursor-end').forEach(n => n.classList.remove('is-cursor-end'));
  const wEl = $feed.children[curWord];
  if (!wEl) return;
  const w = words[curWord];
  if (curChar < w.length) {
    const cEl = wEl.children[curChar];
    if (cEl) cEl.classList.add('is-cursor');
  } else {
    /* End of word — caret hangs off the right side. */
    wEl.classList.add('is-cursor-end');
  }
  shiftFeedToActive();
}

/* Keep the active row roughly in the middle of the visible viewport.
   Our feed has line-height:1.6, so we shift it up by `row * 1.6em`
   via the CSS custom property --feed-shift. We snap to a row index
   by comparing the active word's offsetTop to the first word's. */
function shiftFeedToActive() {
  const first = $feed.children[0];
  const active = $feed.children[curWord];
  if (!first || !active) return;
  const lineHeightPx = parseFloat(getComputedStyle($feed).lineHeight);
  if (!lineHeightPx) return;
  const row = Math.round((active.offsetTop - first.offsetTop) / lineHeightPx);
  /* Show one row above the active row when possible (i.e. shift = row).
     The feed-wrap clips overflow, and we cap at row 0 for the first line. */
  const target = Math.max(0, row);
  $feed.style.setProperty('--feed-shift', String(target));
}

/* ─── Reset ─── back to a clean slate. Called on init, on Restart,
   and on mode switch. */
function resetTest() {
  if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  phase = 'idle';
  startTs = 0; endTs = 0;
  curWord = 0; curChar = 0;
  charsCorrect = 0; charsIncorrect = 0; extrasTyped = 0;
  secondSamples = [];
  words = generateWords();
  typedWords = words.map(() => '');
  $time.textContent = String(modeSeconds);
  $wpm.textContent = '0';
  $stats.classList.remove('is-on');
  $results.classList.remove('is-on');
  $input.value = '';
  $feed.style.setProperty('--feed-shift', '0');
  renderFeed();
  focusInput();
}

function focusInput() {
  /* setTimeout 0 to avoid focus-stealing when called during a click
     event chain. Safe to call repeatedly. */
  setTimeout(() => { try { $input.focus({ preventScroll: true }); } catch (_) { $input.focus(); } }, 0);
}

/* ─── Timer ─── 1 Hz ticks update the time display and sample the
   correct-char count. Stops + finishes when seconds <= 0. */
function startTimer() {
  startTs = performance.now();
  /* Initial sample at t=0 so per-second deltas align cleanly. */
  secondSamples = [{ t: 0, correct: 0 }];
  $time.textContent = String(modeSeconds);
  tickTimer = setInterval(() => {
    const elapsed = (performance.now() - startTs) / 1000;
    const remaining = modeSeconds - elapsed;
    if (remaining <= 0) {
      $time.textContent = '0';
      $wpm.textContent = String(currentNetWpm(modeSeconds));
      finishTest();
      return;
    }
    $time.textContent = String(Math.ceil(remaining));
    /* Snapshot WPM live for the on-screen counter. */
    $wpm.textContent = String(currentNetWpm(elapsed));
    /* Per-second sample — keep one row per integer-second crossed. */
    const s = Math.floor(elapsed);
    if (s > secondSamples[secondSamples.length - 1].t) {
      secondSamples.push({ t: s, correct: charsCorrect });
    }
  }, 200);   /* 5 Hz updates feel smoother than 1 Hz, but we still snap to integer-seconds for sampling */
}

function currentNetWpm(seconds) {
  if (!seconds || seconds <= 0) return 0;
  const minutes = seconds / 60;
  return Math.max(0, Math.round((charsCorrect / 5) / minutes));
}

/* ─── Keystroke handler ─── wired on the hidden <input>. Runs after
   each input event so the value is the latest typed string. We never
   actually consume the input's value — we only diff against curWord
   to figure out what changed. Then we clear it so the input's
   internal value never grows. */
$input.addEventListener('input', (ev) => {
  const data = ev.data;            /* the inserted text, or null on backspace */
  const inputType = ev.inputType;  /* 'insertText' | 'deleteContentBackward' | etc */
  if (phase === 'finished') return;

  if (phase === 'idle' && (inputType === 'insertText' || inputType === 'insertCompositionText')) {
    /* First keystroke — flip to running and start the timer. */
    phase = 'running';
    $stats.classList.add('is-on');
    startTimer();
  }

  if (inputType === 'deleteContentBackward') {
    handleBackspace();
  } else if (data) {
    for (const ch of data) handleChar(ch);
  }

  /* Clear the input so it doesn't accumulate; keystrokes always
     come in as deltas. */
  $input.value = '';
});

/* Tab+Enter restart shortcut, plus Esc to defocus / refocus. We
   listen on the document so the user can mash the keys before the
   hidden input has focus. */
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Tab') {
    /* Tab alone won't reach the hidden input; we capture it here. */
    ev.preventDefault();
    /* Some users like the "tab to restart" feel; we wait for Enter
       so we don't reset on accidental Tab presses. The combo is
       documented in the hint pill under the feed. */
    document.addEventListener('keydown', function tabEnter(e2) {
      document.removeEventListener('keydown', tabEnter);
      if (e2.key === 'Enter') {
        e2.preventDefault();
        resetTest();
      }
    }, { once: true });
  }
});

function handleChar(ch) {
  if (phase !== 'running') return;
  const target = words[curWord] || '';
  const wEl = $feed.children[curWord];

  if (ch === ' ') {
    /* Space → end of word. If user hasn't reached the end, mark the
       missing chars as incorrect (skipped chars count against acc). */
    if (curChar === 0) return;       /* leading space = ignore */
    const skipped = Math.max(0, target.length - curChar);
    charsIncorrect += skipped;
    /* Move to the next word. */
    if (wEl) {
      /* Mark word with red underline if it has any errors (visual
         hint that this word is "bad" without re-flowing chars). */
      const wrong = wEl.querySelectorAll('.is-wrong, .is-extra').length || skipped > 0;
      if (wrong) wEl.classList.add('has-error');
    }
    curWord++;
    curChar = 0;
    if (curWord >= words.length) {
      /* Ran out of words mid-test — generate more so we never hit
         the wall. */
      const extras = generateWords();
      words = words.concat(extras);
      typedWords = typedWords.concat(extras.map(() => ''));
      /* Append new word elements without nuking existing layout. */
      const frag = document.createDocumentFragment();
      for (let i = 0; i < extras.length; i++) {
        const w = extras[i];
        const wEl2 = document.createElement('span');
        wEl2.className = 'typing-word';
        wEl2.dataset.idx = String(words.length - extras.length + i);
        for (let j = 0; j < w.length; j++) {
          const c = document.createElement('span');
          c.className = 'typing-char';
          c.textContent = w[j];
          c.dataset.idx = String(j);
          wEl2.appendChild(c);
        }
        frag.appendChild(wEl2);
      }
      $feed.appendChild(frag);
    }
    paintCursor();
    return;
  }

  /* Regular character. */
  typedWords[curWord] += ch;

  if (curChar < target.length) {
    const cEl = wEl && wEl.children[curChar];
    if (ch === target[curChar]) {
      charsCorrect++;
      if (cEl) { cEl.classList.add('is-correct'); cEl.classList.remove('is-wrong'); }
    } else {
      charsIncorrect++;
      if (cEl) { cEl.classList.remove('is-correct'); cEl.classList.add('is-wrong'); }
    }
    curChar++;
  } else {
    /* Overflow char — render an "extra" span. Counts as an incorrect
       char for accuracy purposes. */
    extrasTyped++;
    charsIncorrect++;
    if (wEl) {
      const c = document.createElement('span');
      c.className = 'typing-char is-extra';
      c.textContent = ch;
      c.dataset.idx = String(curChar);
      wEl.appendChild(c);
    }
    curChar++;
  }
  paintCursor();
}

function handleBackspace() {
  if (phase !== 'running' && phase !== 'idle') return;
  const wEl = $feed.children[curWord];
  if (curChar === 0) {
    /* Already at the start of a word. Allow stepping back into the
       previous word to fix earlier mistakes (matches monkeytype). */
    if (curWord === 0) return;
    curWord--;
    const prev = words[curWord];
    /* Step to the position right after the last typed char of the
       previous word (could be > prev.length if there were extras). */
    curChar = (typedWords[curWord] || '').length;
    /* Drop the last char from typedWords to "undo" it. */
    if (curChar > 0) {
      typedWords[curWord] = typedWords[curWord].slice(0, -1);
      curChar--;
      removeCharAt(curWord, curChar);
    }
    /* Re-evaluate has-error class on the now-current word. */
    const wEl2 = $feed.children[curWord];
    if (wEl2) {
      const stillWrong = wEl2.querySelectorAll('.is-wrong, .is-extra').length;
      wEl2.classList.toggle('has-error', stillWrong > 0);
    }
    paintCursor();
    return;
  }

  /* Within the current word — undo the last typed char. */
  curChar--;
  typedWords[curWord] = typedWords[curWord].slice(0, -1);
  removeCharAt(curWord, curChar);
  paintCursor();
}

/* Undo a char's contribution to scoring + visual state. */
function removeCharAt(wIdx, cIdx) {
  const target = words[wIdx];
  const wEl = $feed.children[wIdx];
  if (!wEl) return;
  if (cIdx < target.length) {
    const cEl = wEl.children[cIdx];
    if (cEl) {
      if (cEl.classList.contains('is-correct')) charsCorrect = Math.max(0, charsCorrect - 1);
      else if (cEl.classList.contains('is-wrong')) charsIncorrect = Math.max(0, charsIncorrect - 1);
      cEl.classList.remove('is-correct', 'is-wrong');
    }
  } else {
    /* Was an extra char — remove the appended span. */
    const extras = wEl.querySelectorAll('.is-extra');
    const last = extras[extras.length - 1];
    if (last) last.remove();
    extrasTyped = Math.max(0, extrasTyped - 1);
    charsIncorrect = Math.max(0, charsIncorrect - 1);
  }
}

/* ─── Finish + results ─── */
function finishTest() {
  if (phase === 'finished') return;
  if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  endTs = performance.now();
  phase = 'finished';

  const seconds = modeSeconds;
  const minutes = seconds / 60;
  const totalTyped = charsCorrect + charsIncorrect;
  const wpm = Math.max(0, Math.round((charsCorrect / 5) / minutes));
  const raw = Math.max(0, Math.round((totalTyped / 5) / minutes));
  const acc = totalTyped > 0 ? (charsCorrect / totalTyped) * 100 : 0;
  const cons = computeConsistency();

  $resultWpm.textContent = String(wpm);
  $resultRaw.textContent = String(raw);
  $resultAcc.textContent = acc.toFixed(1) + '%';
  $resultAccSub.textContent = charsCorrect + ' / ' + totalTyped;
  $resultCons.textContent = cons.toFixed(0) + '%';
  $resultMeta.textContent = seconds + 's · ' + wordListLabel(wordList);
  $resultSave.classList.remove('is-saving','is-saved','is-error');
  $resultSave.textContent = 'Idle';

  $results.classList.add('is-on');

  /* Persist the run, then refresh the leaderboard so the new entry
     shows up if it qualifies. */
  saveScore({
    wpm, raw_wpm: raw,
    accuracy: Number(acc.toFixed(2)),
    consistency: Number(cons.toFixed(2)),
    mode_seconds: seconds,
    word_list: wordList,
    chars_correct: charsCorrect,
    chars_incorrect: charsIncorrect,
    duration_ms: Math.round(endTs - startTs),
  });
}

/* Consistency = 100 × (1 − stddev/mean) of per-second NET WPM.
   Floored at 0% and capped at 100%. Lower stddev = steadier pace =
   higher consistency. Returns 0 if too few samples to be meaningful. */
function computeConsistency() {
  if (secondSamples.length < 3) return 0;
  /* Per-second deltas of correct-chars, converted to per-second
     WPM (chars/5) × 60. */
  const wpms = [];
  for (let i = 1; i < secondSamples.length; i++) {
    const d = secondSamples[i].correct - secondSamples[i - 1].correct;
    wpms.push((d / 5) * 60);
  }
  const mean = wpms.reduce((a, b) => a + b, 0) / wpms.length;
  if (mean <= 0) return 0;
  const variance = wpms.reduce((a, b) => a + (b - mean) * (b - mean), 0) / wpms.length;
  const stddev = Math.sqrt(variance);
  const ratio = stddev / mean;
  const cons = (1 - ratio) * 100;
  return Math.max(0, Math.min(100, cons));
}

/* ─── Save to Supabase ───
   Sets user_id from the active session (RLS verifies user_id =
   auth.uid() so the client can't impersonate anyone). Also stamps
   player_email + player_name onto the row — denormalised display
   fields the leaderboard reads directly, since profiles RLS would
   block non-writers from joining other users' display names.

   On insert error we colour the pill red and keep the result on
   screen so the user can copy their numbers manually if needed. */
let _meCache = null;   /* one profile lookup per session, cached */
async function _resolveMe() {
  if (_meCache) return _meCache;
  if (!window.sb) return null;
  const { data: sess } = await window.sb.auth.getSession();
  if (!sess || !sess.session) return null;
  const u = sess.session.user;
  let fullName = '';
  /* Own-profile read is allowed by the "users read own profile" policy. */
  try {
    const { data: prof } = await window.sb
      .from('profiles')
      .select('full_name')
      .eq('id', u.id)
      .single();
    if (prof && prof.full_name) fullName = prof.full_name;
  } catch (_) {}
  _meCache = { id: u.id, email: (u.email || '').toLowerCase(), fullName };
  return _meCache;
}

async function saveScore(row) {
  $resultSave.classList.add('is-saving');
  $resultSave.textContent = 'Saving…';
  try {
    if (!window.sb) throw new Error('Supabase client not ready');
    const me = await _resolveMe();
    if (!me) throw new Error('No active session');
    row.user_id      = me.id;
    row.player_email = me.email;
    row.player_name  = me.fullName || null;
    const { error } = await window.sb.from('arena_typing_scores').insert(row);
    if (error) throw error;
    $resultSave.classList.remove('is-saving');
    $resultSave.classList.add('is-saved');
    $resultSave.textContent = 'Saved';
    /* Refresh leaderboard so the new run shows up if it qualifies. */
    fetchLeaderboard();
  } catch (e) {
    console.warn('saveScore failed:', e);
    $resultSave.classList.remove('is-saving');
    $resultSave.classList.add('is-error');
    $resultSave.textContent = 'Save failed';
  }
}

/* ─── Leaderboard ─── top 10 by WPM for the active mode + word list.
   We also fetch the current user's email so we can highlight their
   row in the table. */
async function fetchLeaderboard() {
  $boardSub.textContent = 'Top 10 · ' + modeSeconds + 's · ' + wordListLabel(wordList);
  $boardHost.innerHTML = '<div class="typing-board-empty">Loading…</div>';
  if (!window.sb) {
    $boardHost.innerHTML = '<div class="typing-board-empty">Database unavailable</div>';
    return;
  }
  try {
    /* Top 10 rows for this mode + word list. Reads the denormalised
       player_email / player_name columns directly — no join into
       public.profiles, which would be blocked by that table's RLS for
       non-writer users (they can only read their own profile row). */
    const { data, error } = await window.sb
      .from('arena_typing_scores')
      .select('id, wpm, accuracy, completed_at, user_id, player_email, player_name')
      .eq('mode_seconds', modeSeconds)
      .eq('word_list', wordList)
      .order('wpm', { ascending: false })
      .limit(10);
    if (error) throw error;
    renderLeaderboard(data || []);
  } catch (e) {
    console.warn('fetchLeaderboard failed:', e);
    $boardHost.innerHTML = '<div class="typing-board-empty">Could not load leaderboard</div>';
  }
}

function renderLeaderboard(rows) {
  if (!rows.length) {
    $boardHost.innerHTML = '<div class="typing-board-empty">No runs yet — be the first!</div>';
    return;
  }
  let myEmail = '';
  try { if (typeof getCurrentUserEmail === 'function') myEmail = (getCurrentUserEmail() || '').toLowerCase(); } catch (_) {}
  const tbl = document.createElement('table');
  tbl.className = 'typing-board';
  tbl.innerHTML =
    '<thead><tr>' +
      '<th class="col-rank">#</th>' +
      '<th>Player</th>' +
      '<th class="col-wpm">WPM</th>' +
      '<th class="col-acc">Acc</th>' +
      '<th>When</th>' +
    '</tr></thead><tbody></tbody>';
  const tbody = tbl.querySelector('tbody');
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    const email = (r.player_email || '').toLowerCase();
    if (myEmail && email === myEmail) tr.classList.add('is-self');
    const name = r.player_name || (email ? email.split('@')[0] : 'Anonymous');
    tr.innerHTML =
      '<td class="col-rank">' + (i + 1) + '</td>' +
      '<td>' + escapeHtml(name) + '</td>' +
      '<td class="col-wpm">' + r.wpm + '</td>' +
      '<td class="col-acc">' + Number(r.accuracy).toFixed(0) + '%</td>' +
      '<td>' + formatRelative(r.completed_at) + '</td>';
    tbody.appendChild(tr);
  });
  $boardHost.innerHTML = '';
  $boardHost.appendChild(tbl);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function formatRelative(iso) {
  const t = new Date(iso).getTime();
  if (isNaN(t)) return '—';
  const diff = (Date.now() - t) / 1000;
  if (diff < 60)        return Math.floor(diff)        + 's ago';
  if (diff < 3600)      return Math.floor(diff / 60)   + 'm ago';
  if (diff < 86400)     return Math.floor(diff / 3600) + 'h ago';
  if (diff < 86400 * 7) return Math.floor(diff / 86400)+ 'd ago';
  const d = new Date(iso);
  return d.toLocaleDateString();
}
function wordListLabel(key) {
  return key === 'real-estate' ? 'Real Estate'
       : key === 'code'        ? 'Code'
       : 'English';
}

/* ─── Mode bar wiring ─── click toggles the active button in its
   group and resets the test. */
$modebar.addEventListener('click', (ev) => {
  const btn = ev.target.closest('.typing-mode-btn');
  if (!btn) return;
  const group = btn.closest('.typing-modebar-group');
  if (!group) return;
  group.querySelectorAll('.typing-mode-btn').forEach(b => b.classList.remove('is-active'));
  btn.classList.add('is-active');
  if (group.dataset.group === 'seconds') {
    modeSeconds = parseInt(btn.dataset.seconds, 10) || 30;
  } else if (group.dataset.group === 'wordlist') {
    wordList = btn.dataset.wordlist || 'english';
  }
  resetTest();
  fetchLeaderboard();
});

/* ─── Restart button + click-to-focus ─── */
$restart.addEventListener('click', () => { resetTest(); });
$feedWrap.addEventListener('click', focusInput);

/* ─── Focus / blur — blur the feed when the input loses focus so
   the user notices and clicks back in. */
$input.addEventListener('focus', () => {
  $feedWrap.classList.remove('is-blurred');
});
$input.addEventListener('blur', () => {
  if (phase === 'finished') return;
  $feedWrap.classList.add('is-blurred');
});

/* ─── Boot ─── */
function boot() {
  resetTest();
  /* Defer the leaderboard fetch until the Supabase client + auth
     session are ready. Poll briefly for both. */
  let tries = 0;
  const t = setInterval(() => {
    tries++;
    if (window.sb) { clearInterval(t); fetchLeaderboard(); return; }
    if (tries > 30) { clearInterval(t); }
  }, 100);
}
boot();
</script>
