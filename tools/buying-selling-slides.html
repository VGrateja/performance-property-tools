<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="../assets/logo.png" type="image/png"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Property — Buying / Selling Slides</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../shared/common.css?v=3d044d9a"/>
<script src="../shared/fit-screen.js?v=5e41a716"></script>
<style>
/* ============================================================================
   Buying / Selling Slides — an Online-Reports-style deck, but horizontal 16:9
   slides with a Present Mode. Data is Forge-driven. Phase 1: framework + Present
   Mode + the Forge-native data slides (title, forecasted population, sensitivity
   H/U). Chart slides are Phase-2 placeholders. Brand-navy slides are theme-fixed.
   ============================================================================ */
:root{
  --bss-navy:#0a2440; --bss-navy2:#0d2c4e; --bss-ink:#f5f9ff; --bss-mut:#9fb8d6;
  --bss-cyan:#38c6e0; --bss-cyanD:#1a97b3; --bss-line:rgba(120,170,220,.22);
  --bss-pos:#37d39b; --bss-neg:#ff6b6b; --bss-panel:rgba(255,255,255,.045);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Figtree','DM Sans',sans-serif;background:var(--bg,#0b1120);color:var(--text,#e6eefc);}
/* ── top controls ── */
.bss-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--border,#233);position:sticky;top:0;z-index:20;background:var(--panel,#0f172a);}
.bss-bar h1{font-size:1.05rem;font-weight:800;margin:0 10px 0 0;letter-spacing:.2px;}
.bss-bar .grow{flex:1}
.bss-ctl{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--muted,#93a4c3);}
.bss-ctl select{font:inherit;font-size:.85rem;padding:7px 10px;border-radius:9px;border:1px solid var(--border,#2b3a52);background:var(--panel2,#131c2e);color:var(--text,#e6eefc);}
.bss-ctl select option{background:#131c2e;color:#e6eefc;}
.bss-seg{display:inline-flex;border:1px solid var(--border,#2b3a52);border-radius:10px;overflow:hidden}
.bss-seg button{font:inherit;font-size:.82rem;font-weight:700;padding:7px 15px;border:0;background:transparent;color:var(--muted,#93a4c3);cursor:pointer}
.bss-seg button.on{background:var(--bss-cyan);color:#04202a}
.bss-btn{font:inherit;font-size:.82rem;font-weight:700;padding:8px 15px;border-radius:10px;border:1px solid var(--border,#2b3a52);background:var(--panel2,#131c2e);color:var(--text,#e6eefc);cursor:pointer}
.bss-btn.primary{background:var(--bss-cyan);border-color:var(--bss-cyan);color:#04202a}
.bss-btn:disabled{opacity:.45;cursor:not-allowed}
/* ── stage + slide ── */
.bss-stage{display:flex;justify-content:center;align-items:flex-start;padding:26px 20px 8px;}
.bss-slidewrap{position:relative;width:100%;max-width:1180px;aspect-ratio:16/9;}
.bss-scale{position:absolute;inset:0;}
.bss-slide{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:top left;
  background:radial-gradient(1200px 700px at 78% -10%,var(--bss-navy2),var(--bss-navy));
  color:var(--bss-ink);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45);
  border:1px solid rgba(120,170,220,.14);}
.bss-slide .pad{position:absolute;inset:0;padding:64px 72px 58px;display:flex;flex-direction:column;}
.bss-slide .kicker{color:var(--bss-cyan);font-weight:800;font-size:15px;letter-spacing:2.5px;text-transform:uppercase;}
.bss-slide h2{font-size:38px;font-weight:800;margin:6px 0 0;line-height:1.08;letter-spacing:.3px;}
.bss-slide .rule{width:78px;height:4px;background:var(--bss-cyan);border-radius:3px;margin:16px 0 22px;}
.bss-slide p.body{font-size:19px;line-height:1.5;color:#dce8fb;max-width:1040px;margin:0 0 18px;}
.bss-slide .num{color:var(--bss-cyan);font-weight:800;}
.bss-logo{position:absolute;top:40px;right:56px;font-weight:800;letter-spacing:1px;font-size:13px;color:var(--bss-mut);text-align:right;line-height:1.3}
.bss-logo b{color:#fff;display:block;font-size:15px;letter-spacing:2px}
.bss-disc{position:absolute;left:72px;right:72px;bottom:20px;font-size:10.5px;color:rgba(160,190,225,.55);line-height:1.4}
/* title slide */
.bss-title{justify-content:center;align-items:flex-start}
.bss-title .mode{color:var(--bss-cyan);font-weight:800;font-size:17px;letter-spacing:4px;text-transform:uppercase}
.bss-title h1{font-size:72px;font-weight:800;margin:10px 0 0;line-height:1.02}
.bss-title .sub{font-size:22px;color:var(--bss-mut);margin-top:18px;font-weight:600}
/* tables */
.bss-tbl{width:100%;border-collapse:collapse;font-size:18px;font-variant-numeric:tabular-nums}
.bss-tbl th,.bss-tbl td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--bss-line)}
.bss-tbl th{color:var(--bss-mut);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.6px}
.bss-tbl th:first-child,.bss-tbl td:first-child{text-align:left}
.bss-tbl tr.hl td{background:rgba(56,198,224,.10)}
.bss-tbl td .tag{font-size:11px;color:var(--bss-cyan);font-weight:800;margin-left:8px;text-transform:uppercase;letter-spacing:.5px}
.bss-pos{color:var(--bss-pos)} .bss-neg{color:var(--bss-neg)}
.bss-cards{display:flex;gap:18px;margin-top:6px}
.bss-card{flex:1;background:var(--bss-panel);border:1px solid var(--bss-line);border-radius:12px;padding:20px 22px}
.bss-card .k{color:var(--bss-mut);font-size:14px;font-weight:600}
.bss-card .v{font-size:34px;font-weight:800;margin-top:6px}
.bss-note{color:var(--bss-mut);font-size:15px;margin-top:16px}
/* stub */
.bss-stub{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--bss-line);border-radius:14px;color:var(--bss-mut);gap:8px;margin-top:6px}
.bss-stub .big{font-size:22px;font-weight:800;color:#cfe0f5}
.bss-stub .src{font-size:14px;background:rgba(56,198,224,.14);color:var(--bss-cyan);padding:4px 12px;border-radius:20px;font-weight:700}
/* nav */
.bss-nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 0 26px}
.bss-nav .arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--border,#2b3a52);background:var(--panel2,#131c2e);color:var(--text);font-size:18px;cursor:pointer;display:grid;place-items:center}
.bss-nav .count{font-size:.85rem;color:var(--muted,#93a4c3);min-width:120px;text-align:center;font-weight:700}
.bss-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:640px}
.bss-dot{width:10px;height:10px;border-radius:50%;border:0;background:var(--border,#33465f);cursor:pointer;padding:0}
.bss-dot.on{background:var(--bss-cyan)}
/* present mode */
body.bss-present .bss-bar,body.bss-present .bss-nav{display:none}
body.bss-present .bss-stage{padding:0;height:100vh;align-items:center;background:#05101f}
body.bss-present .bss-slidewrap{max-width:none;width:min(100vw,177.78vh);}
body.bss-present .bss-slide{border-radius:0}
.bss-presd{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:none;gap:14px;align-items:center;z-index:40;
  background:rgba(8,20,38,.82);border:1px solid var(--bss-line);border-radius:30px;padding:8px 10px;backdrop-filter:blur(6px)}
body.bss-present .bss-presd{display:flex}
.bss-presd button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:16px;cursor:pointer}
.bss-presd .c{color:#cfe0f5;font-size:13px;font-weight:700;min-width:96px;text-align:center}
.bss-boot{padding:60px;text-align:center;color:var(--muted,#93a4c3)}
</style>
</head>
<body>
<div class="bss-bar">
  <h1>Buying / Selling Slides</h1>
  <span class="bss-seg" id="bssMode">
    <button data-mode="sell" class="on">Selling</button>
    <button data-mode="buy">Buying</button>
  </span>
  <span class="bss-ctl"><label for="bssRegion">Region</label><select id="bssRegion"></select></span>
  <span class="bss-ctl" id="bssMonth"></span>
  <span class="grow"></span>
  <button class="bss-btn" id="bssPresent">▶ Present</button>
  <button class="bss-btn" id="bssDownload" disabled title="PDF / image export — a later phase">⬇ Download</button>
</div>

<div class="bss-stage" id="bssStage">
  <div class="bss-slidewrap">
    <div class="bss-scale"><div class="bss-slide" id="bssSlide"><div class="bss-boot">Loading Forge data…</div></div></div>
  </div>
</div>

<div class="bss-nav" id="bssNav" hidden>
  <button class="arrow" id="bssPrev">‹</button>
  <span class="count" id="bssCount"></span>
  <button class="arrow" id="bssNext">›</button>
</div>
<div class="bss-dots" id="bssDots" style="display:flex;justify-content:center;padding-bottom:24px"></div>

<div class="bss-presd">
  <button id="bssPPrev">‹</button><span class="c" id="bssPCount"></span><button id="bssPNext">›</button>
  <button id="bssPExit" title="Exit (Esc)">✕</button>
</div>

<script src="../shared/supabase-client.js?v=8a4cbba0"></script>
<script src="../shared/auth.js?v=dfb5f1d8"></script>
<script src="../shared/auth-gate.js?v=bfa4ab26"></script>
<script>
/* ─────────────────────────── Buying/Selling Slides ───────────────────────────
   Phase 1: Forge-driven deck framework + Present Mode. Live slides: title,
   forecasted population, sensitivity H/U. Chart slides are Phase-2 stubs. */
const $ = s => document.querySelector(s);
const CAPS = new Set(['sydney','melbourne','brisbane','perth','adelaide','canberra','hobart','darwin']);
const DISC = 'DISCLAIMER: Performance Property accepts no responsibility or liability for anyone who uses this information to inform decision-making. Copyright ' + (new Date().getFullYear()) + ' Performance Property.';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const now = new Date();
const MONTH_LABEL = MONTHS[now.getMonth()] + ' ' + now.getFullYear();
const REVIEW_YEAR = now.getFullYear();

let DB = null;
let state = { slug:'adelaide', mode:'sell', idx:0 };
let DECK = [];

const fmtInt = v => (v<0?'-':'') + '$'.replace('$','') + Math.abs(Math.round(v)).toLocaleString();
const money  = v => (v<0?'-$':'$') + Math.abs(Math.round(v)).toLocaleString();
const pct    = (v,dp=2) => (v>=0?'+':'') + v.toFixed(dp) + '%';

/* ── Forge load ── */
async function loadForge(){
  for (let i=0;i<60 && !window.sb;i++) await new Promise(r=>setTimeout(r,100));
  if (!window.sb) throw new Error('No database connection.');
  const pull = async metric => { let all=[],from=0; for(;;){ const {data,error}=await window.sb.from('rdp_raw_series').select('region_slug,period,value').eq('metric',metric).range(from,from+999); if(error)throw error; all=all.concat(data||[]); if(!data||data.length<1000)break; from+=1000; } return all; };
  const idx = rows => { const m={}; for(const r of rows){ (m[r.region_slug]||={})[String(r.period).slice(0,4)]=r.value; } return m; };
  const [reg, runway, cfgRows, POP, NI, NOM, NIM, PNI, PNOM, PNIM] = await Promise.all([
    window.sb.from('rdp_regions').select('slug,name,state,cluster'),
    window.sb.from('rdp_runway').select('region_slug,payload'),
    window.sb.from('rdp_runway_config').select('key,value'),
    pull('population'), pull('natural_increase'), pull('nom'), pull('nim'),
    pull('pop_proj_ni'), pull('pop_proj_nom'), pull('pop_proj_nim'),
  ]);
  const cfg = Object.fromEntries((cfgRows.data||[]).map(r=>[r.key,r.value]));
  const runwayBy = {}; for (const r of (runway.data||[])) if (r.payload && r.payload.inputs && r.payload.inputs.income!=null) runwayBy[r.region_slug]=r.payload;
  const meta = {}; for (const r of (reg.data||[])) meta[r.slug] = r;
  DB = { meta, runway:runwayBy, cfg,
    pop:idx(POP), ni:idx(NI), nom:idx(NOM), nim:idx(NIM), pni:idx(PNI), pnom:idx(PNOM), pnim:idx(PNIM) };
}
const latestVal = o => { if(!o) return null; const y=Object.keys(o).sort(); return y.length?o[y[y.length-1]]:null; };
const shareOf = (m,slug,st) => { const a=latestVal(m[slug]), b=latestVal(m[st]); return (a==null||!b)?0:a/b; };

/* Forecasted population for one region, nYears ahead. Capital → gov projection
   direct; region → state projection × live Forge share. */
function forecastPop(slug, nYears){
  const st = DB.meta[slug] && DB.meta[slug].state ? 'st-'+DB.meta[slug].state.toLowerCase() : null;
  const isCap = DB.meta[slug] && DB.meta[slug].cluster==='capital';
  const base = latestVal(DB.pop[slug]); if (base==null) return null;
  const years = Object.keys(DB.pni[isCap?slug:st]||{}).map(Number).sort((a,b)=>a-b).slice(0,nYears);
  if (!years.length) return null;
  const sh = isCap ? null : { ni:shareOf(DB.ni,slug,st), nom:shareOf(DB.nom,slug,st), nim:shareOf(DB.nim,slug,st) };
  let p = base; const rows=[];
  for (const y of years){ const ys=String(y);
    const g = isCap
      ? ((DB.pni[slug]||{})[ys]||0)+((DB.pnom[slug]||{})[ys]||0)+((DB.pnim[slug]||{})[ys]||0)
      : ((DB.pni[st]||{})[ys]||0)*sh.ni + ((DB.pnom[st]||{})[ys]||0)*sh.nom + ((DB.pnim[st]||{})[ys]||0)*sh.nim;
    p += g; rows.push({ y, label:(y-1)+'-'+String(y).slice(-2), pop:p });
  }
  const finalPop = rows[rows.length-1].pop, growth = finalPop - base;
  return { base, rows, finalPop, growth, growthPct: growth/base*100 };
}

/* Sensitivity ladder for one region/type. years = 1 (sell) / 5 (buy). */
function sensitivity(slug, type, years){
  const p = DB.runway[slug]; if(!p) return null;
  const inc0 = p.inputs.income, median = type==='h'?p.inputs.median_h:p.inputs.median_u, ai = type==='h'?p.ai_ceiling.h:p.ai_ceiling.u;
  if (median==null || ai==null) return null;
  const wg = CAPS.has(slug) ? (DB.cfg.wage_growth.capital||0.03) : (DB.cfg.wage_growth.regional||0.02);
  const income = inc0 * Math.pow(1+wg, years);
  const margin = DB.cfg.rates.forecast.margin + (DB.cfg.rates.forecast.apra||0);
  const curCash = DB.cfg.rates.current.cash, fcCash = DB.cfg.rates.forecast.cash;
  const ladder = [...new Set([0.05,0.045,0.035,0.03,0.02,0.015,0.01,curCash,fcCash])].sort((a,b)=>b-a);
  const rows = ladder.map(cash=>{ const rate=cash+margin; const m=income*52*ai/12; const ceil=(m*(1-Math.pow(1+rate/12,-360))/(rate/12))/0.8; const g=ceil-median;
    return { cash, ceil, g, gp:g/median*100, isCur:cash===curCash, isFc:cash===fcCash }; });
  return { median, ceilRows:rows, curCash, fcCash };
}

/* ── slide builders (deck order matches the sample) ── */
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function chrome(inner){ return '<div class="bss-logo"><b>PERFORMANCE</b>PROPERTY</div>' + inner + '<div class="bss-disc">'+DISC+'</div>'; }
function head(kicker,title){ return '<div class="kicker">'+esc(kicker)+'</div><h2>'+esc(title)+'</h2><div class="rule"></div>'; }
function stub(kicker,title,source){ return chrome('<div class="pad">'+head(kicker,title)+'<div class="bss-stub"><div class="big">'+esc(title)+'</div><div class="src">Phase 2 · '+esc(source)+'</div></div></div>'); }

function slideTitle(ctx){
  const verb = ctx.mode==='buy'?'Buying':'Selling';
  return chrome('<div class="pad bss-title"><div class="mode">'+verb+' in</div><h1>'+esc(ctx.name)+'</h1>'
    + '<div class="sub">Investment Committee Review — '+REVIEW_YEAR+'</div>'
    + '<div class="sub" style="font-size:16px;margin-top:6px">'+MONTH_LABEL+'</div></div>');
}
function slideForecastPop(ctx){
  const f = forecastPop(ctx.slug, 3);
  if (!f) return stub('Forecast','Forecasted Population','population.gov.au + Forge');
  const rows = f.rows.map(r=>'<tr><td>By '+r.label+'</td><td>'+Math.round(r.pop).toLocaleString()+'</td></tr>').join('');
  return chrome('<div class="pad">'+head('Forecast','Forecasted Population')
    + '<div class="bss-cards">'
    + '<div class="bss-card"><div class="k">Current (2024-25)</div><div class="v">'+Math.round(f.base).toLocaleString()+'</div></div>'
    + '<div class="bss-card"><div class="k">By '+f.rows[f.rows.length-1].label+'</div><div class="v">'+Math.round(f.finalPop).toLocaleString()+'</div></div>'
    + '<div class="bss-card"><div class="k">Forecasted 3-Year Growth</div><div class="v bss-pos">+'+Math.round(f.growth).toLocaleString()+'</div><div class="k" style="margin-top:4px">('+pct(f.growthPct)+')</div></div>'
    + '</div>'
    + '<table class="bss-tbl" style="margin-top:26px;max-width:520px"><thead><tr><th>Year</th><th>Population</th></tr></thead><tbody>'
    + '<tr><td>Current (2024-25)</td><td>'+Math.round(f.base).toLocaleString()+'</td></tr>'+rows+'</tbody></table>'
    + '<div class="bss-note">Base population live from Forge; components from the population.gov.au projections.</div></div>');
}
function slideSensitivity(ctx, type){
  const s = sensitivity(ctx.slug, type, ctx.mode==='buy'?5:1);
  const tName = type==='h'?'HOUSE':'UNIT', mLab = type==='h'?'MHP':'MUP';
  if (!s) return stub('Scenario','Sensitivity Analysis - '+tName,'Runway (Forge)');
  const wy = ctx.mode==='buy'?'5 year':'1 year';
  const narr = ctx.mode==='buy'
    ? 'We aim to buy while the market is near the bottom of its cycle, before demand returns. The table below shows the affordability ceiling at each cash rate — the room for growth as rates fall.'
    : 'We aim to sell as the market approaches the top, not after it has hit the top, as there is downside risk once demand leaves the market. The main risk to this forecast is that interest rates drop further than predicted, resulting in more upside.';
  const rows = s.ceilRows.map(r=>'<tr class="'+((r.isCur||r.isFc)?'hl':'')+'"><td>'+(r.cash*100).toFixed(2)+'%'
    +(r.isCur?'<span class="tag">current</span>':r.isFc?'<span class="tag">forecast</span>':'')+'</td>'
    +'<td>$'+Math.round(r.ceil).toLocaleString()+'</td>'
    +'<td class="'+(r.g>=0?'bss-pos':'bss-neg')+'">'+money(r.g)+'</td>'
    +'<td class="'+(r.g>=0?'bss-pos':'bss-neg')+'">'+pct(r.gp)+'</td></tr>').join('');
  return chrome('<div class="pad">'+head('Scenario','Sensitivity Analysis - '+tName)
    + '<p class="body" style="font-size:16px;margin-bottom:12px">'+narr+'</p>'
    + '<div class="bss-note" style="margin:0 0 10px">Current '+mLab+': <span class="num">$'+Math.round(s.median).toLocaleString()+'</span>'
    + ' &nbsp;·&nbsp; '+wy+' wage growth &nbsp;·&nbsp; forecast cash rate: <span class="num">'+(s.fcCash*100).toFixed(2)+'%</span></div>'
    + '<table class="bss-tbl"><thead><tr><th>Cash Rate</th><th>Ceiling Price</th><th>Growth from '+mLab+'</th><th>% Growth</th></tr></thead><tbody>'+rows+'</tbody></table></div>');
}

const SLIDE_DEFS = [
  { render: slideTitle },
  { render: c=>stub('Timing','Market Positions Clock','Property Clock') },
  { render: c=>stub('Timing','Property Clock — Timing','Property Clock') },
  { render: c=>stub('Value','Median House Price','Forge median price + thesis') },
  { render: c=>stub('Supply & Demand','Vacancy Rate Forecast','rdp_vr_forecast') },
  { render: c=>stub('Value','Replacement Cost','land + build cost input') },
  { render: c=>stub('Affordability','Affordability Index','Computed Metrics') },
  { render: c=>stub('Affordability','Price to Income','Computed Metrics') },
  { render: c=>stub('Value','Ranking as Most Expensive','Ranking (Forge)') },
  { render: c=>stub('Value','Adelaide as % of Melbourne','median-price ratio') },
  { render: c=>stub('Supply & Demand','Stock on Market v. ADOM','demand inputs') },
  { render: c=>stub('Supply & Demand','Vacancy Rate v. Rent','VR + rents') },
  { render: slideForecastPop },
  { render: c=>slideSensitivity(c,'h') },
  { render: c=>slideSensitivity(c,'u') },
];

/* ── render + nav ── */
function ctx(){ const m=DB.meta[state.slug]; return { slug:state.slug, name:(m&&m.name)||state.slug, mode:state.mode }; }
function buildDeck(){ const c=ctx(); DECK = SLIDE_DEFS.map(d=>d.render(c)); if(state.idx>=DECK.length)state.idx=DECK.length-1; }
function fitSlide(){ const wrap=document.querySelector('.bss-slidewrap'); if(!wrap)return; const s=wrap.clientWidth/1280; document.querySelectorAll('.bss-slide').forEach(el=>el.style.transform='scale('+s+')'); const sc=document.querySelector('.bss-scale'); if(sc)sc.style.height=(720*s)+'px'; }
function render(){
  const slide=$('#bssSlide'); slide.innerHTML = DECK[state.idx] || '';
  $('#bssNav').hidden=false;
  $('#bssCount').textContent = 'Slide '+(state.idx+1)+' / '+DECK.length;
  $('#bssPCount').textContent = (state.idx+1)+' / '+DECK.length;
  const dots=$('#bssDots'); dots.innerHTML=DECK.map((_,i)=>'<button class="bss-dot'+(i===state.idx?' on':'')+'" data-i="'+i+'"></button>').join('');
  fitSlide();
}
function go(i){ state.idx=Math.max(0,Math.min(DECK.length-1,i)); render(); }
function rebuild(){ buildDeck(); render(); }

/* ── present mode ── */
function enterPresent(){ document.body.classList.add('bss-present'); const el=document.querySelector('.bss-stage'); if(el.requestFullscreen)el.requestFullscreen().catch(()=>{}); fitSlide(); }
function exitPresent(){ document.body.classList.remove('bss-present'); if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{}); fitSlide(); }
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement) document.body.classList.remove('bss-present'); fitSlide(); });

/* ── wire up ── */
async function boot(){
  try { await loadForge(); }
  catch(e){ $('#bssSlide').innerHTML='<div class="bss-boot">Couldn’t load Forge data: '+esc(e.message)+'</div>'; return; }
  // region dropdown — every region that has runway (sensitivity) data, capitals first
  const slugs = Object.keys(DB.runway).sort((a,b)=>{ const ca=CAPS.has(a)?0:1, cb=CAPS.has(b)?0:1; return ca-cb || ((DB.meta[a]&&DB.meta[a].name)||a).localeCompare((DB.meta[b]&&DB.meta[b].name)||b); });
  if (!slugs.includes(state.slug)) state.slug = slugs.includes('adelaide')?'adelaide':slugs[0];
  $('#bssRegion').innerHTML = slugs.map(s=>'<option value="'+s+'"'+(s===state.slug?' selected':'')+'>'+esc((DB.meta[s]&&DB.meta[s].name)||s)+'</option>').join('');
  $('#bssMonth').innerHTML = '<label>Month</label><b style="color:var(--text);font-weight:700">'+MONTH_LABEL+'</b>';
  rebuild();
}
$('#bssRegion').addEventListener('change',e=>{ state.slug=e.target.value; state.idx=0; rebuild(); });
$('#bssMode').addEventListener('click',e=>{ const b=e.target.closest('button[data-mode]'); if(!b)return; state.mode=b.dataset.mode; document.querySelectorAll('#bssMode button').forEach(x=>x.classList.toggle('on',x===b)); rebuild(); });
$('#bssPrev').addEventListener('click',()=>go(state.idx-1));
$('#bssNext').addEventListener('click',()=>go(state.idx+1));
$('#bssPPrev').addEventListener('click',()=>go(state.idx-1));
$('#bssPNext').addEventListener('click',()=>go(state.idx+1));
$('#bssPExit').addEventListener('click',exitPresent);
$('#bssPresent').addEventListener('click',enterPresent);
$('#bssDots').addEventListener('click',e=>{ const d=e.target.closest('.bss-dot'); if(d)go(+d.dataset.i); });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='PageDown')go(state.idx+1); else if(e.key==='ArrowLeft'||e.key==='PageUp')go(state.idx-1); else if(e.key==='Escape'&&document.body.classList.contains('bss-present'))exitPresent(); });
window.addEventListener('resize',fitSlide);
boot();
</script>
</body>
</html>
