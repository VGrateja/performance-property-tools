<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookshelf &mdash; Performance Property</title>
<link rel="icon" href="../assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
<!-- OS chrome: mode/period/shade + legacy data-theme bridge -->
<script src="../shared/os-chrome.js?v=299f747d"></script>
<link rel="stylesheet" href="../shared/os-theme.css?v=673f98a2"/>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   BOOKSHELF — staff library of in-hub books, read like a real book.
   Content lives in public.books (mig 097) and is fetched at runtime — the
   strategy text is Confidential and this repo is public, so NO book content
   ships in this file.

   Perf ground rules (the hub-freeze lessons): the page turn is ONE
   compositor-only 3D flip (transform + opacity, no layout, no filters);
   will-change exists only DURING a turn; only the pages adjacent to the
   spread are in the DOM; no backdrop-filter anywhere near the book. Reduced
   mode (prefers-reduced-motion / lite flag / low-memory device) swaps the
   flip for a 120ms cross-fade.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bk-ink:#F4F6F8; --bk-ink2:#C6CCD6; --bk-mut:var(--mut,#8b93a2);
  --bk-teal:#00A0B4; --bk-deep:#171B24; --bk-blue:#54A6DE; --bk-warn:#FFA91F;
  --bk-border:rgba(255,255,255,0.10);
  --bk-surface:rgba(255,255,255,0.045);
  /* the paper (always light — a book page is paper in both themes) */
  --pg-paper:#FCFCFA; --pg-paper2:#F4F3EE; --pg-ink:#232830; --pg-ink2:#4A5160;
  --pg-mut:#7A8290; --pg-line:#E3E2DA;
  --pg-w:620px; --pg-h:847px;
}
[data-theme="light"]{
  --bk-ink:#171B24; --bk-ink2:#3F4650;
  --bk-border:rgba(23,27,36,0.12);
  --bk-surface:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat',system-ui,sans-serif;color:var(--bk-ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ── shelf ────────────────────────────────────────────────────────────── */
.bk-shelf{max-width:1180px;margin:0 auto;padding:26px 22px 60px}
.bk-shelf h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-0.01em}
.bk-shelf .sub{margin:6px 0 26px;font-size:12.5px;color:var(--bk-mut)}
.bk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px}
.bk-card{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;color:inherit;font-family:inherit}
/* the jacket is a true MINIATURE of the book's cover page (same markup,
   scaled) — the shelf and the picked-up book must show the same thing, or
   every pick/return landing is a visible content morph */
.bk-card .jacket{
  aspect-ratio:480/656; border-radius:6px 12px 12px 6px; position:relative;
  border:1px solid rgba(255,255,255,0.09);
  box-shadow:0 14px 30px rgba(0,0,0,0.35), inset 4px 0 8px -5px rgba(255,255,255,0.25);
  transform:perspective(900px) rotateY(0deg);
  transition:transform .22s ease, box-shadow .22s ease;
  overflow:hidden; display:block;
}
.bk-card:hover .jacket{ transform:perspective(900px) rotateY(-7deg) translateY(-3px); box-shadow:0 22px 40px rgba(0,0,0,0.42), inset 4px 0 8px -5px rgba(255,255,255,0.25) }
.bk-card:focus-visible .jacket{ outline:2px solid var(--bk-teal); outline-offset:3px }
.jscale{position:absolute;left:0;top:0;width:var(--pg-w);height:var(--pg-h);transform-origin:top left;display:block}
.bk-card .meta{margin-top:11px}
.bk-card .m-title{font-size:13.5px;font-weight:700}
.bk-card .m-sub{font-size:11px;color:var(--bk-mut);margin-top:2px}
.bk-card .m-resume{display:inline-block;margin-top:7px;font-size:10px;font-weight:700;color:var(--bk-teal);background:rgba(0,160,180,0.12);border:1px solid rgba(0,160,180,0.3);border-radius:8px;padding:2px 8px}
.bk-empty{padding:60px 0;text-align:center;color:var(--bk-mut);font-size:13px}

/* picking a book: the clicked jacket lifts off the shelf and flies onto the
   stage, fading into the real book (fixed clone + transform/opacity only) */
.bk-shelf{transition:opacity .2s ease}
body.bk-picking .bk-shelf{opacity:0}
.bk-pick{position:fixed;z-index:80;margin:0;pointer-events:none;transform-origin:top left;
  will-change:transform;transition:transform .48s cubic-bezier(.22,.61,.36,1)}
.bk-pick .jacket{width:100%;height:100%;aspect-ratio:auto;transform:none !important;transition:none !important;
  box-shadow:0 22px 44px rgba(0,0,0,0.5)}
/* !important: the shelf markup sets display:block INLINE on .meta — without
   it the flying clone drags the caption text along as a giant ghost */
.bk-pick .meta{display:none !important}
body.bk-arriving .bk-reader{animation:bkArrive .34s ease both}
@keyframes bkArrive{from{opacity:0}to{opacity:1}}

/* returning a book: the reader hides, the shelf fades back in beneath the
   cover clone flying down to its slot. Double-class selectors so they beat
   the body.bk-open display rules regardless of stylesheet order. */
body.bk-open.bk-returning .bk-shelf{display:block;opacity:0;animation:bkShelfIn .28s ease .1s both}
@keyframes bkShelfIn{from{opacity:0}to{opacity:1}}
body.bk-open.bk-returning .bk-reader{display:none}
.bk-return{position:fixed;z-index:80;margin:0;pointer-events:none;transform-origin:top left;
  will-change:transform;width:var(--pg-w);height:var(--pg-h);border-radius:8px;overflow:hidden;
  box-shadow:0 22px 44px rgba(0,0,0,0.5)}

/* the destination book waits for the flyer — nothing sits there while the
   pick animation is still in the air */
body.bk-flying #bkBook{visibility:hidden}

/* mid-book pick: a small 3D book that OPENS on the way — right page under a
   sheet whose front is the shelf jacket and whose back is the left page */
.bk-flyrig{position:fixed;z-index:80;width:var(--pg-w);height:var(--pg-h);margin:0;pointer-events:none;
  transform-origin:top left;will-change:transform;perspective:2000px;
  transition:transform .48s cubic-bezier(.22,.61,.36,1)}
.bk-flyrig .fr-page{position:absolute;inset:0;overflow:hidden;background:var(--pg-paper);
  border-radius:8px;box-shadow:0 20px 40px rgba(0,0,0,0.5)}
.bk-flyrig .fr-sheet{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
  transition:transform .64s cubic-bezier(.3,.02,.18,.98)}
.bk-flyrig .fr-sheet .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  overflow:hidden;background:var(--pg-paper);border-radius:8px}
.bk-flyrig .fr-sheet .face.back{transform:rotateY(180deg)}
.bk-flyrig .face.pg-cover{background:linear-gradient(150deg,#20293b 0%,var(--bk-deep) 52%,#0d1119 100%)}

/* ── reader stage ─────────────────────────────────────────────────────── */
.bk-reader{display:none;position:relative;min-height:calc(100vh - 64px)}
body.bk-open .bk-reader{display:block}
body.bk-open .bk-shelf{display:none}
.bk-stage{
  position:relative; margin:0 auto; padding:14px 0 0;
  display:flex; align-items:flex-start; justify-content:center;
  perspective:2600px;
}
/* fitStage() gives .bk-scale an explicit UNSCALED box and computes the
   stage height from the VISUAL (scaled) height — otherwise everything after
   the stage (the progress line) positions against the unscaled layout box
   and ends up ON the book whenever scale > 1 (fullscreen). */
.bk-scale{transform-origin:top center}

/* the book = spread of two pages (or one, narrow).
   NO filter here: a drop-shadow ancestor forces a re-raster of the whole
   filtered surface every frame a child transform animates — the pages carry
   static box-shadows instead (compositor-friendly). */
.bk-book{position:relative;display:flex}
.bk-page{box-shadow:0 22px 32px rgba(0,0,0,0.36)}
[data-theme="light"] .bk-page{box-shadow:0 18px 28px rgba(23,27,36,0.26)}
.bk-page{
  width:var(--pg-w);height:var(--pg-h);
  background:var(--pg-paper);
  color:var(--pg-ink);
  position:relative; overflow:hidden;
}
.bk-page.pg-left{border-radius:10px 2px 2px 10px}
.bk-page.pg-right{border-radius:2px 10px 10px 2px}
.bk-page.pg-single{border-radius:8px}
/* inner gutter shading toward the spine */
.bk-page.pg-left::after{content:'';position:absolute;inset:0 0 0 auto;width:26px;pointer-events:none;
  background:linear-gradient(to left, rgba(35,40,48,0.10), transparent)}
.bk-page.pg-right::after{content:'';position:absolute;inset:0 auto 0 0;width:26px;pointer-events:none;
  background:linear-gradient(to right, rgba(35,40,48,0.10), transparent)}

/* the animated flipper — one compositor-only rotateY; translateZ(0) promotes
   the layer at insert time so the first animation frames aren't spent
   rasterising (the old version started the turn while the freshly built
   faces were still painting → jump-cut). */
.bk-flip{
  position:absolute; top:0; width:var(--pg-w); height:var(--pg-h);
  transform-style:preserve-3d; z-index:5; pointer-events:none;
  transform:translateZ(0);
}
.bk-flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--pg-paper)}
/* a face can BE the cover (the cover-open swing) — .bk-flip .face outranks
   .pg-cover, so the dark jacket needs restating at face specificity */
.bk-flip .face.pg-cover{background:linear-gradient(150deg,#20293b 0%,var(--bk-deep) 52%,#0d1119 100%)}
.bk-flip .face.back{transform:rotateY(180deg)}
.bk-flip.fwd{right:0;transform-origin:left center}
.bk-flip.bwd{left:0;transform-origin:right center}
.bk-flip.go{transition:transform .64s cubic-bezier(.3,.02,.18,.98)}
.bk-flip.fwd .face.front{border-radius:2px 10px 10px 2px}
.bk-flip.bwd .face.front{border-radius:10px 2px 2px 10px}
/* landed back faces must match the page they become (corner pop otherwise) */
.bk-flip.fwd .face.back{border-radius:10px 2px 2px 10px}
.bk-flip.bwd .face.back{border-radius:2px 10px 10px 2px}
/* a COVER face is the closed book — uniformly rounded like the settled
   cover (pg-single 8px), not spread-sheet corners ("pointed" during the
   close, then popping circular at rebuild) */
.bk-flip.fwd .face.front.pg-cover,
.bk-flip.bwd .face.back.pg-cover{border-radius:8px}
/* shading on the flipping sheet: rises as the page stands up, dies as it
   lands flat. Always darkest at the SPINE edge of whichever face shows. */
.bk-flip .face::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;z-index:2}
.bk-flip.fwd .face.front::before,.bk-flip.bwd .face.back::before{background:linear-gradient(to right, rgba(0,0,0,0.20), transparent 62%)}
.bk-flip.fwd .face.back::before,.bk-flip.bwd .face.front::before{background:linear-gradient(to left, rgba(0,0,0,0.20), transparent 62%)}
.bk-flip.go .face::before{animation:bkSheetShade .64s cubic-bezier(.3,.02,.18,.98) forwards}
@keyframes bkSheetShade{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
/* faces carry the SAME spine-gutter shading as the page they show/become —
   without it the spine brightens/darkens the instant the rebuild swaps in */
.bk-flip .face::after{content:'';position:absolute;top:0;bottom:0;width:26px;pointer-events:none}
.bk-flip.fwd .face.front::after,.bk-flip.bwd .face.back::after{left:0;background:linear-gradient(to right, rgba(35,40,48,0.10), transparent)}
.bk-flip.fwd .face.back::after,.bk-flip.bwd .face.front::after{right:0;background:linear-gradient(to left, rgba(35,40,48,0.10), transparent)}
.bk-flip .face.pg-cover::after{display:none}   /* covers are boards, not paper */
/* cast shadows on the static halves: the revealed page brightens as the
   sheet lifts away; the landing page darkens just before touchdown */
.bk-shade{position:absolute;top:0;width:var(--pg-w);height:var(--pg-h);pointer-events:none;z-index:4}
.bk-shade.r{right:0;background:linear-gradient(to right, rgba(15,20,28,0.28), transparent 62%)}
.bk-shade.l{left:0;background:linear-gradient(to left, rgba(15,20,28,0.28), transparent 62%)}
.bk-shade.out{animation:bkShadeOut .64s ease-out forwards}
.bk-shade.in{animation:bkShadeIn .64s ease-in forwards}
@keyframes bkShadeOut{0%{opacity:1}70%{opacity:.15}100%{opacity:0}}
/* peak earlier and lower, melt to 0 by touchdown — an abrupt fade in the
   last frames reads as a glitch */
@keyframes bkShadeIn{0%{opacity:0}55%{opacity:0}82%{opacity:.5}100%{opacity:0}}

/* ── the physical page block (the held-book look, Van's photo 2026-08-05):
   stacked-paper strips flank the page — read pages on the LEFT of the spine,
   the remaining block on the RIGHT, and the block's bottom edge underneath.
   Widths are set inline by buildSpread from the reading position. Pure
   decoration: pointer-events none, painted under the page, no filters. */
.bk-page{z-index:1}
.bk-edge{position:absolute;pointer-events:none;z-index:0;
  transition:width .35s ease, left .35s ease, right .35s ease;
  --paperline:color-mix(in srgb, var(--pg-paper) 80%, #4a4234);
  box-shadow:0 20px 28px rgba(0,0,0,0.30)}
.bk-edge.l{top:3px;bottom:-6px;border-radius:6px 0 0 6px;
  background:linear-gradient(to bottom, rgba(0,0,0,.10), rgba(0,0,0,0) 10%, rgba(0,0,0,0) 90%, rgba(0,0,0,.14)),
    repeating-linear-gradient(to right, var(--pg-paper) 0 1px, var(--paperline) 1px 2px)}
.bk-edge.r{top:3px;bottom:-6px;border-radius:0 6px 6px 0;
  background:linear-gradient(to bottom, rgba(0,0,0,.10), rgba(0,0,0,0) 10%, rgba(0,0,0,0) 90%, rgba(0,0,0,.14)),
    repeating-linear-gradient(to left, var(--pg-paper) 0 1px, var(--paperline) 1px 2px)}
.bk-edge.b{bottom:-7px;height:9px;border-radius:2px 2px 8px 8px;
  background:linear-gradient(to right, rgba(0,0,0,.08), rgba(0,0,0,0) 8%, rgba(0,0,0,0) 92%, rgba(0,0,0,.08)),
    repeating-linear-gradient(to bottom, var(--pg-paper) 0 1px, var(--paperline) 1px 2px)}
[data-theme="light"] .bk-edge{box-shadow:0 16px 24px rgba(23,27,36,0.22)}

/* ── SINGLE-PAGE leaf (the only reading mode since 2026-08-05): the sheet
   hinges on the LEFT edge (the spine). Forward folds the current page away
   over the spine — it fades in the final stretch instead of lying mirrored
   beside the book; backward raises the previous leaf back on top, fading in
   as it arrives. The blank face is the reverse of the leaf (plain paper). */
.bk-flip.sgl{left:0;transform-origin:left center}
.bk-flip.sgl .face{border-radius:8px}
/* leaves travel between flat (0°) and the STANDING angle of the book's other
   half (past vertical, leaning LEFT of the spine like a held book) — both
   faces carry the SAME page so the 90° crossover is imperceptible and the
   landed sheet IS the visible turned page (no fades) */
.bk-flip.sgl.go{transition:transform .64s cubic-bezier(.3,.02,.18,.98)}
.bk-flip.sgl .face.front::after,.bk-flip.sgl .face.back::after{content:'';position:absolute;inset:0;width:auto;pointer-events:none;opacity:0;
  transition:opacity .3s ease .28s;background:
    linear-gradient(to right, rgba(255,255,255,0.55), rgba(255,255,255,0) 5%),
    linear-gradient(color-mix(in srgb, var(--pg-paper) 58%, transparent), color-mix(in srgb, var(--pg-paper) 58%, transparent)),
    linear-gradient(to right, rgba(0,0,0,0.22), rgba(0,0,0,0.07) 30%, rgba(0,0,0,0.03) 62%, rgba(0,0,0,0.16))}
.bk-flip.sgl.go .face::after{opacity:1}
.bk-flip.sgl.bwd .face::after{opacity:1;transition:opacity .26s ease}
.bk-flip.sgl.bwd.go .face::after{opacity:0}
/* the persistent turned half: the previous page standing just past vertical
   at the spine (Van's held-book photo) — visible, but barely any width */
.bk-stand{position:absolute;left:0;top:0;width:var(--pg-w);height:var(--pg-h);
  transform-origin:left center;transform-style:preserve-3d;pointer-events:none;z-index:1;
  will-change:transform;   /* stands animate on every takeoff — keeping them composited also matches the landed sheet's rasterization, so the swap is invisible */
  transition:transform .5s cubic-bezier(.3,.02,.18,.98), opacity .45s ease}
.bk-stand .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  overflow:hidden;background:var(--pg-paper);border-radius:8px}
.bk-stand .face.back{transform:rotateY(180deg)}
/* near-edge-on lighting: bright fold line at the spine, deep mid shade, and a
   paper veil so the foreshortened print reads as paper, not pasted glyphs */
.bk-stand .face::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to right, rgba(255,255,255,0.55), rgba(255,255,255,0) 5%),
    linear-gradient(color-mix(in srgb, var(--pg-paper) 58%, transparent), color-mix(in srgb, var(--pg-paper) 58%, transparent)),
    linear-gradient(to right, rgba(0,0,0,0.22), rgba(0,0,0,0.07) 30%, rgba(0,0,0,0.03) 62%, rgba(0,0,0,0.16))}
/* deeper fan leaves: mostly paper — near edge-on, print all but disappears */
.bk-stand.d1 .face::after,.bk-flip.sgl.d1 .face.front::after,.bk-flip.sgl.d1 .face.back::after{background:
    linear-gradient(to right, rgba(255,255,255,0.5), rgba(255,255,255,0) 5%),
    linear-gradient(color-mix(in srgb, var(--pg-paper) 80%, transparent), color-mix(in srgb, var(--pg-paper) 80%, transparent)),
    linear-gradient(to right, rgba(0,0,0,0.20), rgba(0,0,0,0.06) 32%, rgba(0,0,0,0.14))}
.bk-stand.d2 .face::after,.bk-flip.sgl.d2 .face.front::after,.bk-flip.sgl.d2 .face.back::after{background:
    linear-gradient(to right, rgba(255,255,255,0.45), rgba(255,255,255,0) 5%),
    linear-gradient(color-mix(in srgb, var(--pg-paper) 90%, transparent), color-mix(in srgb, var(--pg-paper) 90%, transparent)),
    linear-gradient(to right, rgba(0,0,0,0.18), rgba(0,0,0,0.06) 35%, rgba(0,0,0,0.12))}
.bk-stand .face.pg-cover::after{background:linear-gradient(to right, rgba(255,255,255,0.18), rgba(255,255,255,0) 6%), linear-gradient(to right, rgba(0,0,0,0.30), rgba(0,0,0,0.10) 40%, rgba(0,0,0,0.22))}
/* the reading page's gutter: the standing half shades the paper near the spine */
.bk-page.pg-single:not(.pg-cover)::after{content:'';position:absolute;inset:0 auto 0 0;width:36px;
  pointer-events:none;z-index:3;background:linear-gradient(to right, rgba(35,40,48,0.16), transparent)}
/* full-width reveal/landing shade for the single page (spine at the left) */
.bk-shade.s{left:0;background:linear-gradient(to right, rgba(15,20,28,0.26), transparent 58%)}

/* reduced-motion / lite crossfade */
body.bk-lite .bk-flip{display:none}
.bk-fade{animation:bkfade .13s ease}
@keyframes bkfade{from{opacity:.35}to{opacity:1}}

/* click-to-turn: handled on the book itself (clicks on buttons/links win) */
.bk-book{cursor:pointer}
.bk-book .pg-toc,.bk-book .pg-flow{cursor:default}

/* ── page typography (the “paper”) ────────────────────────────────────── */
.pgc{padding:46px 42px 58px;height:100%;display:flex;flex-direction:column;position:relative}
.pgc .kick{font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--bk-teal);margin:0 0 12px}
.pgc h1{font-size:19px;font-weight:800;letter-spacing:-0.01em;line-height:1.25;margin:14px 0 6px;color:var(--pg-ink)}
.pgc h2{font-size:14.5px;font-weight:700;line-height:1.3;margin:12px 0 4px;color:var(--pg-ink)}
.pgc h3{font-size:12.5px;font-weight:700;font-style:italic;margin:11px 0 3px;color:var(--pg-ink2)}
.pgc p{font-size:12.6px;line-height:1.6;margin:6px 0;color:var(--pg-ink2)}
.pgc p b{color:var(--pg-ink)}
.pgc .note{font-size:10.5px;line-height:1.55;font-style:italic;color:var(--pg-mut);margin:8px 0}
.pgc .meta{font-size:11px;color:var(--pg-mut);margin:2px 0}
.pgc ul,.pgc ol{margin:6px 0 8px;padding-left:20px}
.pgc li{font-size:12.3px;line-height:1.55;color:var(--pg-ink2);margin:3px 0}
.pgc li::marker{color:var(--bk-teal);font-weight:700}
.pgc table{width:100%;border-collapse:collapse;font-size:10.8px;margin:8px 0}
.pgc th{background:var(--bk-deep);color:#fff;font-weight:700;padding:5px 8px;text-align:left;font-size:10px;letter-spacing:.03em}
.pgc td{border:1px solid var(--pg-line);padding:4.5px 8px;color:var(--pg-ink2);line-height:1.4;vertical-align:top}
.pgc tr.grp td{background:#E9F6F8;color:var(--bk-deep);font-weight:800;font-size:10px;letter-spacing:.05em;text-transform:uppercase;border-color:var(--pg-line)}
.pgc .tbl-cont{font-size:9.5px;color:var(--pg-mut);font-style:italic;margin:0 0 3px}
.pgc figure{margin:10px 0;text-align:center}
.pgc figure img{max-width:100%;height:auto;border:1px solid var(--pg-line);border-radius:6px}
.pgc figcaption{font-size:10px;font-style:italic;color:var(--pg-mut);margin-top:5px}
/* ── measured auto-density: source-page-faithful pagination means a page holds
   exactly what the document page holds — dense document pages tighten their
   own typography (two notches, applied by fitDensity() after render). ── */
.pg-dense .pgc p{font-size:11.6px;line-height:1.5;margin:5px 0}
.pg-dense .pgc li{font-size:11.3px;line-height:1.45;margin:2.5px 0}
.pg-dense .pgc h1{font-size:17.5px;margin:12px 0 5px}
.pg-dense .pgc h2{font-size:13.5px;margin:10px 0 3px}
.pg-dense .pgc h3{font-size:11.8px;margin:9px 0 2px}
.pg-dense .pgc .note{font-size:9.9px;line-height:1.45;margin:6px 0}
.pg-dense .pgc table{font-size:10.2px;margin:6px 0}
.pg-dense .pgc td{padding:3.5px 7px;line-height:1.32}
.pg-dense .pgc th{padding:4px 7px}
.pg-dense .pgc ul,.pg-dense .pgc ol{margin:4px 0 6px}
.pg-dense2 .pgc p{font-size:10.6px;line-height:1.42;margin:4px 0}
.pg-dense2 .pgc li{font-size:10.4px;line-height:1.38;margin:2px 0}
.pg-dense2 .pgc h1{font-size:16px;margin:10px 0 4px}
.pg-dense2 .pgc h2{font-size:12.6px;margin:8px 0 3px}
.pg-dense2 .pgc h3{font-size:11.2px;margin:7px 0 2px}
.pg-dense2 .pgc .note{font-size:9.3px;line-height:1.4;margin:5px 0}
.pg-dense2 .pgc table{font-size:9.5px;margin:5px 0}
.pg-dense2 .pgc td{padding:3px 6px;line-height:1.28}
.pg-dense2 .pgc th{padding:3.5px 6px}
.pgc .folio{position:absolute;bottom:22px;font-size:10px;color:var(--pg-mut);font-weight:600}
.pg-left .folio,.pg-single .folio{left:42px}
.pg-right .folio{right:42px}
.pgc .runhead{position:absolute;top:20px;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pg-mut)}
.pg-left .runhead{left:42px}
.pg-right .runhead,.pg-single .runhead{right:42px}
.pgc .conf{position:absolute;bottom:22px;right:42px;font-size:8.5px;letter-spacing:.12em;color:#C9CDD6;text-transform:uppercase}
.pg-right .conf{right:auto;left:42px}   /* single pages keep conf at the right — the folio owns the left */

/* cover page */
.pg-cover{background:linear-gradient(150deg,#20293b 0%,var(--bk-deep) 52%,#0d1119 100%)}
/* spine crease — part of the cover DESIGN (rendered by coverHtml as a real
   .c-spine span) so the shelf miniature, the picked book, and the flying
   clones all show it. NOT a pseudo-element: the flip faces already own
   ::before (sheet shading) and ::after (gutter) — a pseudo crease gets
   clobbered for the whole open/close animation. */
.pg-cover .c-spine{position:absolute;top:0;bottom:0;left:14px;width:1px;background:rgba(255,255,255,0.14);z-index:1;pointer-events:none}
.pg-cover .pgc{justify-content:space-between;padding:56px 46px}
.pg-cover .c-kick{font-size:10px;font-weight:800;letter-spacing:.26em;color:var(--bk-teal);text-transform:uppercase}
.pg-cover .c-title{font-size:35px;font-weight:900;line-height:1.12;color:#fff;letter-spacing:-0.015em;margin-top:14px}
.pg-cover .c-sub{font-size:12.5px;line-height:1.6;color:rgba(255,255,255,0.72);margin-top:14px;max-width:320px}
.pg-cover .c-rule{width:44px;height:4px;background:var(--bk-teal);border-radius:2px;margin-top:20px}
.pg-cover .c-foot{display:flex;align-items:flex-end;justify-content:space-between}
.pg-cover .c-pub{font-size:9px;font-weight:600;letter-spacing:.1em;color:rgba(255,255,255,0.55);text-transform:uppercase;line-height:1.7}
.pg-cover .c-logo{height:22px}
.pg-cover .c-conf{position:absolute;top:22px;right:46px;font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,0.35);text-transform:uppercase}

/* title page + end page */
.pg-titlepage .pgc{justify-content:center;text-align:center;align-items:center}
.pg-titlepage .t-title{font-size:24px;font-weight:800;color:var(--pg-ink);letter-spacing:-0.01em;line-height:1.2}
.pg-titlepage .t-sub{font-size:12px;color:var(--pg-ink2);margin-top:12px;max-width:300px;line-height:1.6}
.pg-titlepage .t-ed{font-size:10.5px;color:var(--pg-mut);margin-top:26px;line-height:1.8}
.pg-titlepage .t-disc{font-size:8.6px;line-height:1.65;color:var(--pg-mut);margin-top:30px;max-width:330px;text-align:center}
.pg-titlepage .t-copy{font-size:7.8px;line-height:1.6;color:var(--pg-mut);opacity:.75;margin-top:12px;max-width:330px;text-align:center}
.pgc .e-disc{font-size:8.4px;line-height:1.6;color:var(--pg-mut);margin-top:30px;max-width:340px;text-align:center}
.pgc .e-copy{font-size:7.6px;line-height:1.55;color:var(--pg-mut);opacity:.75;margin-top:10px;max-width:340px;text-align:center}
.pg-titlepage img{height:20px;margin-bottom:26px}

/* chapter opener */
.pg-chapter .ch-num{font-size:64px;font-weight:900;color:rgba(0,160,180,0.18);line-height:1;letter-spacing:-0.03em}
.pg-chapter .ch-title{font-size:24px;font-weight:800;letter-spacing:-0.015em;margin-top:-16px;color:var(--pg-ink)}
.pg-chapter .ch-tag{font-size:12px;font-style:italic;color:var(--pg-ink2);margin:8px 0 4px}
.pg-chapter .ch-rule{width:38px;height:3px;background:var(--bk-teal);border-radius:2px;margin:14px 0 10px}

/* TOC — two compact columns so six chapters + sections fit one page */
.pg-toc .toc-cols{column-count:2;column-gap:26px;margin-top:8px}
.pg-toc .toc-chap{break-inside:avoid;margin-bottom:9px}
.pg-toc .toc-row{display:flex;align-items:baseline;gap:6px;margin:4px 0 2px;cursor:pointer}
.pg-toc .toc-row:hover .tl{color:var(--bk-teal)}
.pg-toc .toc-row .tn{font-size:9.5px;font-weight:800;color:var(--bk-teal);min-width:13px}
.pg-toc .toc-row .tl{font-size:10.8px;font-weight:700;color:var(--pg-ink)}
.pg-toc .toc-row .dots{flex:1;border-bottom:1.5px dotted var(--pg-line);transform:translateY(-2px);min-width:8px}
.pg-toc .toc-row .tp{font-size:9.5px;font-weight:700;color:var(--pg-ink2)}
.pg-toc .toc-sec{display:flex;align-items:baseline;gap:6px;margin:1.5px 0 1.5px 18px;cursor:pointer}
.pg-toc .toc-sec:hover .tsl{color:var(--bk-teal)}
.pg-toc .toc-sec .tsl{font-size:8.9px;color:var(--pg-ink2);line-height:1.35}
.pg-toc .toc-sec .dots{flex:1;border-bottom:1px dotted var(--pg-line);transform:translateY(-1px);min-width:6px}
.pg-toc .toc-sec .tsp{font-size:8.6px;color:var(--pg-mut)}

/* flowchart page */
.pg-flow .fl-wrap{position:relative;flex:1;margin-top:4px}
.fl-node{position:absolute;transform:translate(-50%,0);border-radius:9px;padding:7px 10px;font-size:9.6px;line-height:1.35;text-align:center;font-weight:600}
.fl-q{background:#E7F4FB;border:1.5px solid var(--bk-blue);color:#123;width:168px}
.fl-a{background:var(--bk-deep);color:#fff;border-radius:999px;padding:3px 12px;font-size:9px;font-weight:800;letter-spacing:.06em;width:auto;white-space:nowrap}
.fl-end{appearance:none;cursor:pointer;font-family:inherit;background:#FFF3DC;border:1.5px solid var(--bk-warn);color:#5a3c00;width:128px;font-weight:700;transition:transform .12s ease, box-shadow .12s ease}
.fl-end:hover{transform:translate(-50%,-2px);box-shadow:0 6px 14px rgba(0,0,0,0.14);background:#FFEAC2}
.fl-end:focus-visible{outline:2px solid var(--bk-teal);outline-offset:2px}
.fl-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fl-svg path{stroke:#232830;stroke-width:1.6;fill:none;marker-end:url(#bkarr)}
.fl-hint{font-size:10px;color:var(--pg-mut);font-style:italic;margin-top:2px}
.fl-guide-btn{appearance:none;border:0;cursor:pointer;font-family:inherit;
  background:var(--bk-teal);color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;
  border-radius:9px;padding:8px 14px;margin-top:8px;align-self:flex-start}
.fl-guide-btn:hover{filter:brightness(1.07)}

/* guided overlay (inside the page) */
.fl-guide{position:absolute;inset:0;background:var(--pg-paper);display:none;flex-direction:column;padding:46px 42px}
.pg-flow.guiding .fl-guide{display:flex}
.fl-guide .gq{font-size:15.5px;font-weight:800;line-height:1.4;color:var(--pg-ink);margin:18px 0 16px}
.fl-guide .gopt{appearance:none;cursor:pointer;font-family:inherit;text-align:left;
  border:1.5px solid var(--bk-blue);background:#F2F9FE;color:#123;border-radius:10px;
  font-size:12.5px;font-weight:700;padding:11px 14px;margin:5px 0}
.fl-guide .gopt:hover{background:#E7F4FB}
.fl-guide .gpath{font-size:10px;color:var(--pg-mut);min-height:16px}
.fl-guide .gres{font-size:11.5px;color:var(--pg-ink2);margin:4px 0 10px}
.fl-guide .gback{appearance:none;border:0;background:transparent;cursor:pointer;font-family:inherit;color:var(--bk-teal);font-size:10.5px;font-weight:700;align-self:flex-start;padding:0;margin-top:auto}

/* ── reader chrome (bar under the book) ───────────────────────────────── */
.bk-bar{
  display:flex;align-items:center;gap:10px;justify-content:center;
  padding:12px 16px 26px;flex-wrap:wrap;
}
.bk-btn{appearance:none;cursor:pointer;font-family:inherit;
  border:1px solid var(--bk-border);background:var(--bk-surface);color:var(--bk-ink2);
  font-size:11.5px;font-weight:700;border-radius:9px;padding:7px 12px}
.bk-btn:hover{color:var(--bk-ink);border-color:var(--bk-teal)}
/* wide enough for the longest label ("introduction–flowchart · 72pp") — a
   shrinking label mid-close shoves every bar button sideways otherwise */
.bk-count{font-size:11.5px;color:var(--bk-mut);font-weight:600;min-width:196px;text-align:center}
.bk-goto{width:52px;border:1px solid var(--bk-border);background:var(--bk-surface);color:var(--bk-ink);
  border-radius:8px;padding:6px 8px;font:600 11.5px 'Montserrat',sans-serif;text-align:center}
.bk-goto:focus{outline:none;border-color:var(--bk-teal)}
.bk-progrow{display:flex;justify-content:center;padding:2px 0 18px}
.bk-progress{position:relative;height:3px;background:var(--bk-border);border-radius:2px;width:min(560px,72vw)}
.bk-progress .fill{position:absolute;inset:0 auto 0 0;background:var(--bk-teal);border-radius:2px;transition:width .25s ease}

/* fullscreen read mode — the bar hides at the bottom; the progress line stays
   in flow, which (with fitStage's visual-height stage) puts it UNDER the book */
body.bk-fs .appbar{display:none !important}
body.bk-fs .bk-bar{position:fixed;left:0;right:0;bottom:0;opacity:0;transition:opacity .2s;background:linear-gradient(to top, rgba(10,14,20,0.55), transparent);padding-bottom:14px}
body.bk-fs .bk-bar:hover,body.bk-fs .bk-bar:focus-within{opacity:1}
body.bk-fs .bk-stage{padding-top:6px}
body.bk-fs .bk-progrow{padding:8px 0 10px}

@media (max-width:700px){
  .bk-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
}
</style>
</head>
<body>

<!-- ── shelf ── -->
<div class="bk-shelf" id="bkShelf">
  <h1>Bookshelf</h1>
  <div class="sub">Performance Property publications — open a book, turn its pages, and use the flowchart to find the strategy that fits.</div>
  <div class="bk-grid" id="bkGrid"><div class="bk-empty">Loading the shelf…</div></div>
</div>

<!-- ── reader ── -->
<div class="bk-reader" id="bkReader">
  <div class="bk-stage" id="bkStage">
    <div class="bk-scale" id="bkScale">
      <div class="bk-book" id="bkBook"></div>
    </div>
  </div>
  <div class="bk-bar">
    <button class="bk-btn" id="bkBack">‹ Shelf</button>
    <button class="bk-btn" id="bkTocBtn">Contents</button>
    <button class="bk-btn" id="bkPrev" aria-label="Previous page">←</button>
    <span class="bk-count" id="bkCount"></span>
    <button class="bk-btn" id="bkNext" aria-label="Next page">→</button>
    <input class="bk-goto" id="bkGoto" inputmode="numeric" placeholder="p." title="Go to page (folio number)"/>
    <button class="bk-btn" id="bkFs">Read fullscreen</button>
  </div>
  <div class="bk-progrow">
    <div class="bk-progress"><div class="fill" id="bkFill" style="width:0%"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase-client.js?v=b4bd183c"></script>
<script src="../shared/tool-registry.js?v=fe393d9e"></script>
<script src="../shared/desktop-pins.js?v=e2416017"></script>
<script src="../shared/auth.js?v=7dce203e"></script>
<script src="../shared/auth-gate.js?v=003cdc01"></script>
<script src="../shared/pp-telemetry.js?v=a1e39d4f"></script>
<script src="../shared/fit-screen.js?v=5e41a716"></script>
<script>
'use strict';
PP_OS.initChrome({ name: 'Bookshelf', section: 'vault', backHref: '../' });

var $ = function (s) { return document.querySelector(s); };
var esc = window.PP_escapeHtml || function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};

/* reduced mode: honour the OS setting, the hub's lite flag, weak devices */
var LITE = false;
try {
  LITE = matchMedia('(prefers-reduced-motion: reduce)').matches ||
         localStorage.getItem('pp-lite') === '1' ||
         (navigator.deviceMemory && navigator.deviceMemory <= 4);
} catch (e) {}
if (LITE) document.body.classList.add('bk-lite');

var LOGO_DARK_BG = '../assets/Reports/logo-color.png';        /* white text — dark covers */
var LOGO_LIGHT_BG = '../assets/Reports/logo-color-black.png'; /* dark text — paper pages */

var state = {
  books: [],            /* shelf rows {slug,title,subtitle,cover} */
  book: null,           /* full payload when open */
  idx: 0,               /* current page index (left page of the spread) */
  single: false,        /* single-page mode (narrow) */
  turning: false,       /* exclusive animations: cover open/close, pick, return */
  pending: 0,           /* page-flip sheets in the air (flips may overlap) */
  pendingDir: 0,
  zSeq: 5,              /* newer sheets land on top */
  lastTurnAt: 0,
  cache: {},            /* pageIdx -> rendered HTML */
};

/* ── data ─────────────────────────────────────────────────────────────── */
function loadShelf() {
  /* cover jsonb carries pageCount so the shelf never downloads page content */
  window.sb.from('books').select('slug,title,subtitle,cover').order('sort')
    .then(function (r) {
      if (r.error) { $('#bkGrid').innerHTML = '<div class="bk-empty">Couldn’t load the shelf: ' + esc(r.error.message) + '</div>'; return; }
      state.books = r.data || [];
      renderShelf();
      route();
    }, function () { $('#bkGrid').innerHTML = '<div class="bk-empty">Couldn’t load the shelf.</div>'; });
}
var BOOK_CACHE = {};                     /* slug → payload: repeat opens are instant */
function fetchBook(slug, cb) {
  if (BOOK_CACHE[slug]) { cb(BOOK_CACHE[slug]); return; }
  window.sb.from('books').select('payload').eq('slug', slug).maybeSingle()
    .then(function (r) {
      if (r.error || !r.data) { cb(null); return; }
      BOOK_CACHE[slug] = r.data.payload;
      cb(r.data.payload);
    }, function () { cb(null); });
}
function loadBook(slug, page, cb) {
  fetchBook(slug, function (payload) {
    if (!payload) { closeBook(); if (cb) cb(false); return; }
    openBook(payload, page);
    if (cb) cb(true);
  });
}

/* shelf → reader: the clicked jacket lifts while the payload fetches and the
   shelf fades, then flies onto the stage. The real book stays HIDDEN until
   touchdown (body.bk-flying) — nothing waits at the destination. Cover-picks
   fly the jacket clone and crossfade into the flat cover (which then settles
   into its POV tilt). Mid-book picks fly a 3D rig whose jacket-front swings
   OPEN on the way, landing as the exact spread. */
function pickBook(cardEl, book, page) {
  var slug = book.slug;
  if (LITE) { loadBook(slug, page); return; }
  if (document.body.classList.contains('bk-picking')) return;
  var jacket = cardEl.querySelector('.jacket');
  var r = jacket.getBoundingClientRect();
  /* a mid-book pick (resume ≥ 1) opens in flight onto its single page */
  var spreadPick = page >= 1;
  var s0x = r.width / 620, s0y = r.height / 847;
  var flyer, sheet, rp, backFace;
  if (spreadPick) {
    flyer = document.createElement('div');
    flyer.className = 'bk-flyrig';
    rp = document.createElement('div'); rp.className = 'fr-page pg-single';
    sheet = document.createElement('div'); sheet.className = 'fr-sheet';
    var f = document.createElement('div'); f.className = 'face front pg-cover';
    f.innerHTML = coverHtml(rowCoverMeta(book));       /* takeoff = the shelf miniature, full size */
    backFace = document.createElement('div'); backFace.className = 'face pg-single'; /* becomes the standing leaf; 'back' added at fly() */
    sheet.appendChild(f); sheet.appendChild(backFace);
    flyer.appendChild(rp); flyer.appendChild(sheet);
    flyer.style.transform = 'scale(' + s0x + ',' + s0y + ')';
  } else {
    flyer = cardEl.cloneNode(true);
    flyer.className = 'bk-card bk-pick';
    flyer.style.width = r.width + 'px'; flyer.style.height = r.height + 'px';
  }
  flyer.style.left = r.left + 'px'; flyer.style.top = r.top + 'px';
  document.body.appendChild(flyer);
  document.body.classList.add('bk-picking');
  state.turning = true;                                /* freeze turns until the arrival settles */
  requestAnimationFrame(function () {
    flyer.style.transform = spreadPick
      ? 'translateY(-10px) scale(' + (s0x * 1.05) + ',' + (s0y * 1.05) + ')'
      : 'translateY(-10px) scale(1.05)';
  });
  var done = false;
  function clean(failed) {
    if (done) return; done = true;
    if (flyer.parentNode) flyer.remove();
    document.body.classList.remove('bk-picking');
    document.body.classList.remove('bk-flying');
    state.turning = false;
    if (failed) { state.arriveFlat = false; return; }  /* shelf fades back in */
    settleCover();
    setTimeout(function () { document.body.classList.remove('bk-arriving'); }, 420);
  }
  var payload = null, gateOpen = false, flown = false;
  var safety = setTimeout(function () { clean(!state.book); }, 2600);
  setTimeout(function () { gateOpen = true; fly(); }, 220);
  fetchBook(slug, function (p) {
    if (!p) { clearTimeout(safety); clean(true); return; }
    payload = p; fly();
  });
  function fly() {
    if (!payload || !gateOpen || flown) return;
    flown = true;
    clearTimeout(safety);
    state.arriveFlat = true;                         /* single-page covers sit flat */
    openBook(payload, page);
    document.body.classList.add('bk-arriving');        /* reader chrome fades in… */
    document.body.classList.add('bk-flying');          /* …but the book waits for the flyer */
    var br = $('#bkBook').getBoundingClientRect();
    var to = br;                                     /* single page = the whole book box */
    var dur;
    if (spreadPick) {
      setPage(rp, state.idx);                          /* the destination page under the opening cover */
      setPage(backFace, Math.max(0, state.idx - 1));   /* the reverse = what stands at the spine on arrival */
      fitDensity(rp); fitDensity(backFace);
      wireFlowIn(rp);                                  /* arrows before anything rotates */
      backFace.classList.add('back');
      dur = 660;
      flyer.style.transition = 'transform .64s cubic-bezier(.3,.02,.18,.98)';
      void flyer.offsetWidth;
      requestAnimationFrame(function () {
        flyer.style.transform = 'translate(' + (to.left - r.left) + 'px,' + (to.top - r.top) + 'px) ' +
          'scale(' + (to.width / 620) + ',' + (to.height / 847) + ')';
        sheet.style.transform = 'rotateY(-93.5deg)';   /* opens in flight to the standing angle (matches BK_STAND) */
      });
    } else {
      dur = 540;
      flyer.style.transition = 'transform .5s cubic-bezier(.3,.02,.18,.98)';
      void flyer.offsetWidth;
      requestAnimationFrame(function () {
        flyer.style.transform = 'translate(' + (to.left - r.left) + 'px,' + (to.top - r.top) + 'px) ' +
          'scale(' + (to.width / r.width) + ',' + (to.height / r.height) + ')';
      });
    }
    setTimeout(touchdown, dur);
  }
  function touchdown() {
    document.body.classList.remove('bk-flying');       /* the real book takes over */
    flyer.style.transition = 'opacity .14s ease';
    flyer.style.opacity = '0';
    setTimeout(function () { clean(false); }, 170);
  }
}

/* ── shelf render ─────────────────────────────────────────────────────── */
function resumeKey(slug) { return 'pp_book_pos_' + slug; }
/* ONE cover design everywhere: the cover page, the shelf miniature, and the
   flying clones/rig all render this — identical content is what makes the
   pick/return landings seamless. meta = {publisher,title,subtitle,edition,
   confidential} (from the payload, or from the row's cover jsonb). */
function coverHtml(meta) {
  return '<div class="pgc"><span class="c-spine"></span>' +
    (meta.confidential !== false ? '<span class="c-conf">Confidential</span>' : '') +
    '<div><div class="c-kick">' + esc(meta.publisher || '') + '</div>' +
    '<div class="c-title">' + esc(meta.title || '') + '</div>' +
    '<div class="c-sub">' + esc(meta.subtitle || '') + '</div><div class="c-rule"></div></div>' +
    '<div class="c-foot"><div class="c-pub">' + esc(meta.edition || '') + '<br>Internal · advisor use</div>' +
    '<img class="c-logo" src="' + LOGO_DARK_BG + '" alt="Performance Property"/></div></div>';
}
function rowCoverMeta(b) {
  var c = b.cover || {};
  return { publisher: c.publisher || 'Performance Property', title: b.title, subtitle: b.subtitle || '',
           edition: c.edition || '', confidential: c.confidential !== false };
}
/* scale each miniature to its card (cover and jacket share the same aspect) */
function fitJackets() {
  document.querySelectorAll('#bkGrid .jacket .jscale').forEach(function (s) {
    var w = s.parentElement.clientWidth;
    if (w) s.style.transform = 'scale(' + (w / 620) + ')';
  });
}
window.addEventListener('resize', fitJackets);
function renderShelf() {
  var g = $('#bkGrid');
  if (!state.books.length) { g.innerHTML = '<div class="bk-empty">No books on the shelf yet.</div>'; return; }
  g.innerHTML = state.books.map(function (b) {
    var pages = (b.cover && b.cover.pageCount) || 0;
    var fc = (b.cover && b.cover.frontCount) || 4;
    var res = null;
    try { res = parseInt(localStorage.getItem(resumeKey(b.slug)), 10); } catch (e) {}
    var resume = res && res > 1 ? '<span class="m-resume">Resume — p' + Math.max(1, folioOf(res, fc)) + '</span>' : '';
    return '<button class="bk-card" data-slug="' + esc(b.slug) + '" title="Open ' + esc(b.title) + '">' +
      '<span class="jacket"><span class="jscale pg-cover">' + coverHtml(rowCoverMeta(b)) + '</span></span>' +
      '<span class="meta" style="display:block">' +
        '<span class="m-title" style="display:block">' + esc(b.title) + '</span>' +
        '<span class="m-sub" style="display:block">' + esc(b.subtitle || '') + (pages ? ' · ' + (pages - fc) + ' pages' : '') + '</span>' + resume +
      '</span>' +
    '</button>';
  }).join('');
  fitJackets();
  g.querySelectorAll('.bk-card').forEach(function (c, i) {
    c.addEventListener('click', function () {
      var b = state.books[i];
      var res = null;
      try { res = parseInt(localStorage.getItem(resumeKey(b.slug)), 10); } catch (e) {}

}

/* ── folio numbering: content starts counting at 1 after the front matter
   (frontCount rides in the payload — older payloads had 4 front pages) ── */
function frontCount() { return (state.book && state.book.frontCount) || 4; }
function folioOf(idx, fc) { return idx - (fc || frontCount()) + 1; }
function idxOfFolio(f) { return f + frontCount() - 1; }

/* ── page rendering ───────────────────────────────────────────────────── */
function blockHtml(b, book) {
  switch (b.t) {
    case 'h1': return '<h1>' + b.html + '</h1>';
    case 'h2': return '<h2>' + b.html + '</h2>';
    case 'h3': return '<h3>' + b.html + '</h3>';
    case 'p': return '<p>' + b.html + '</p>';
    case 'note': return '<p class="note">' + b.html + '</p>';
    case 'meta': return '<p class="meta">' + b.html + '</p>';
    case 'ul': case 'ol':
      return '<' + b.t + '>' + b.items.map(function (it) { return '<li>' + it.html + '</li>'; }).join('') + '</' + b.t + '>';
    case 'table':
      return (b.cont ? '<p class="tbl-cont">Risk mitigation framework, continued</p>' : '') +
        '<table>' + (b.cont ? '' : '<tr><th>' + esc(b.head[0]) + '</th><th>' + esc(b.head[1]) + '</th></tr>') +
        b.rows.map(function (r) {
          return r.g ? '<tr class="grp"><td colspan="2">' + esc(r.g) + '</td></tr>'
                     : '<tr><td>' + esc(r.l) + '</td><td>' + esc(r.r) + '</td></tr>';
        }).join('') + '</table>';
    case 'img':
      return '<figure><img src="' + book.assets[b.src] + '" alt="' + esc(b.cap || '') + '" width="' + b.w + '" height="' + b.h + '"/>' +
        (b.cap ? '<figcaption>' + esc(b.cap) + '</figcaption>' : '') + '</figure>';
    default: return '';
  }
}
