/* connect the flowchart arrows once the nodes have real boxes */
function wireFlow(pageEl) {
  var wrap = pageEl.querySelector('.fl-wrap');
  if (!wrap) return;
  var svg = wrap.querySelector('.fl-svg');
  var box = wrap.getBoundingClientRect();
  if (!box.height) return;
  svg.setAttribute('viewBox', '0 0 ' + box.width + ' ' + box.height);
  wrap.querySelectorAll('.fl-node').forEach(function (n) { n._r = n.getBoundingClientRect(); });
  svg.querySelectorAll('path[data-e]').forEach(function (path) {
    var pair = path.dataset.e.split('-');
    var a = wrap.querySelector('[data-k="' + pair[0] + '"]');
    var b2 = wrap.querySelector('[data-k="' + pair[1] + '"]');
    if (!a || !b2) return;
    var ra = a._r || a.getBoundingClientRect(), rb = b2._r || b2.getBoundingClientRect();
    var x1 = ra.left + ra.width / 2 - box.left, y1 = ra.bottom - box.top;
    var x2 = rb.left + rb.width / 2 - box.left, y2 = rb.top - box.top;
    path.setAttribute('d', 'M' + x1 + ',' + y1 + ' C' + x1 + ',' + (y1 + 14) + ' ' + x2 + ',' + (y2 - 16) + ' ' + x2 + ',' + (y2 - 2));
  });
}

/* guided mode */
function startGuide(pageEl) {
  var book = state.book;
  var gui = pageEl.querySelector('.fl-guide');
  var flowPage = pageEl.closest('.bk-page') ? pageEl : pageEl;
  var qmap = {}; book.flow.q.forEach(function (q) { qmap[q.id] = q; });
  var path = [];
  function chapterPage(slug) {
    var ch = book.chapters.find(function (c) { return c.slug === slug; });
    var t = book.toc.find(function (c) { return c.n === (ch && ch.n); });
    return t ? t.page : frontCount();
  }
  function render(qid) {
    var q = qmap[qid];
    var crumbs = path.map(function (s) { return esc(s); }).join('  ›  ');
    if (!q) return;
    var opts = '';
    if (q.opts) {
      opts = q.opts.map(function (o, i) { return '<button class="gopt" data-o="' + i + '">' + esc(o.label) + '</button>'; }).join('');
    } else {
      opts = '<button class="gopt" data-a="yes">Yes</button><button class="gopt" data-a="no">No</button>';
    }
    gui.innerHTML = '<div class="kick">Find your strategy</div><div class="gpath">' + crumbs + '</div>' +
      '<div class="gq">' + esc(q.text) + '</div>' + opts +
      '<button class="gback">‹ Back to the flowchart</button>';
    gui.querySelector('.gback').onclick = function () { flowPage.classList.remove('guiding'); };
    gui.querySelectorAll('.gopt').forEach(function (btn) {
      btn.onclick = function () {
        if (btn.dataset.a) {
          var next = q[btn.dataset.a];
          path.push(q.text.split('?')[0].slice(0, 34) + '? ' + (btn.dataset.a === 'yes' ? 'Yes' : 'No'));
          if (typeof next === 'string') render(next);
          else finish([next.end]);
        } else {
          var o = q.opts[+btn.dataset.o];
          path.push(o.label);
          finish(o.ends || [o.end]);
        }
      };
    });
  }
  function finish(slugs) {
    var crumbs = path.map(function (s) { return esc(s); }).join('  ›  ');
    gui.innerHTML = '<div class="kick">Your strategy</div><div class="gpath">' + crumbs + '</div>' +
      '<div class="gq">' + (slugs.length > 1 ? 'Two strategies fit this path:' : 'This path points to:') + '</div>' +
      slugs.map(function (s) {
        return '<button class="gopt" data-s="' + s + '">' + esc(state.book.flow.ends[s]) + ' — open chapter ›</button>';
      }).join('') +
      '<div class="gres">' + (slugs.length > 1 ? 'Strategic Allocation blends property with financial products; the Commercial Property Portfolio pursues income through commercial assets. Read both — advisors often combine them.' : '') + '</div>' +
      '<button class="gback">‹ Start again</button>';
    gui.querySelector('.gback').onclick = function () { path = []; render('q1'); };
    gui.querySelectorAll('.gopt').forEach(function (btn) {
      btn.onclick = function () { flowPage.classList.remove('guiding'); goTo(chapterPage(btn.dataset.s)); };
    });
  }
  flowPage.classList.add('guiding');
  path = [];
  render('q1');
}

/* ── spread building ──────────────────────────────────────────────────── */
var KIND_CLS = { cover: 'pg-cover', title: 'pg-titlepage', toc: 'pg-toc', flow: 'pg-flow', chapter: 'pg-chapter' };
/* set a page's content AND its kind class — the flip faces and the
   underneath-swap in turn() need both, or a chapter opener/TOC shows
   unstyled for the duration of the turn */
function setPage(el, idx) {
  el.className = el.className.replace(/\bpg-(cover|titlepage|toc|flow|chapter)\b/g, '').replace(/\s{2,}/g, ' ').trim();
  var p = state.book && state.book.pages[idx];
  if (p && KIND_CLS[p.kind]) el.classList.add(KIND_CLS[p.kind]);
  el.innerHTML = renderPage(idx);
}
/* dense document pages tighten their own type — measure AFTER the node is in
   the DOM (scrollHeight is 0 detached). Two notches, then accept. */
function fitDensity(el) {
  if (!el || !el.isConnected) return;
  var c = el.querySelector('.pgc');
  if (!c) return;
  el.classList.remove('pg-dense', 'pg-dense2');
  if (c.scrollHeight <= c.clientHeight + 2) return;
  el.classList.add('pg-dense');
  if (c.scrollHeight > c.clientHeight + 2) el.classList.add('pg-dense2');
}
function pageNode(idx, cls) {
  var d = document.createElement('div');
  d.className = 'bk-page ' + cls;
  setPage(d, idx);
  return d;
}
function normalizeIdx(i) {
  if (state.single) return Math.max(0, Math.min(i, state.book.pages.length - 1));
  if (i <= 0) return 0;                     /* cover sits alone on the right? no — cover = single left? */
  if (i % 2 === 1) i--;                     /* spreads start on even idx */
  return Math.max(0, Math.min(i, state.book.pages.length - 1));
}
function buildSpread() {
  var book = state.book, wrapEl = $('#bkBook');
  wrapEl.innerHTML = '';
  var i = state.idx;
  if (state.single) {
    wrapEl.appendChild(pageNode(i, 'pg-single' + (LITE ? ' bk-fade' : '')));
  } else if (i === 0) {
    /* the closed book: cover alone, POV tilt (arrivals land flat + settle) */
    var c = pageNode(0, 'pg-single');
    c.style.transition = 'transform .35s ease';
    if (state.arriveFlat) {
      c.style.transform = 'perspective(1400px) rotateY(0deg)';
    } else {
      c.style.transform = 'perspective(1400px) rotateY(-9deg)';
      wireCoverTilt(c);
    }
    wrapEl.appendChild(c);
  } else {
    wrapEl.appendChild(pageNode(i, 'pg-left' + (LITE ? ' bk-fade' : '')));
    wrapEl.appendChild(pageNode(i + 1, 'pg-right' + (LITE ? ' bk-fade' : '')));
  }
  wrapEl.querySelectorAll('.bk-page').forEach(fitDensity);
  addStandingLeaf(wrapEl);
  addBlockEdges(wrapEl);
  wireInteractive(wrapEl);
  syncBar();
  fitStage();
}
/* the physical page block: read pages stack left of the spine, the remaining
   block sits at the fore-edge, and the bottom of the block peeks underneath.
   Rebuilt with the spread (cheap static divs; widths track the position). */
var BK_STAND = -93.5;                    /* the front standing leaf — flips land here */
var BK_FAN = [-93.5, -96.5, -100];       /* up to three turned pages fan out at the spine */
function bkFanAngle(d){ return d < BK_FAN.length ? BK_FAN[d] : BK_FAN[BK_FAN.length - 1] - (d - BK_FAN.length + 1) * 3; }
function addStandingLeaf(wrapEl) {
  if (!state.book || state.idx < 1) return;
  var n = Math.min(BK_FAN.length, state.idx);
  for (var i = n - 1; i >= 0; i--) {               /* deepest first — the front leaf paints last */
    var leaf = document.createElement('div');
    leaf.className = 'bk-stand' + (i ? ' d' + i : '');
    var lf = document.createElement('div'); lf.className = 'face front pg-single';
    var lb = document.createElement('div'); lb.className = 'face back pg-single';
    setPage(lf, state.idx - 1 - i);
    setPage(lb, state.idx - 1 - i);                /* past 90° the BACK face is the visible one */
    leaf.appendChild(lf); leaf.appendChild(lb);
    leaf.dataset.d = i;
    leaf.style.transform = 'rotateY(' + BK_FAN[i] + 'deg)';
    wrapEl.appendChild(leaf);
    fitDensity(lb); fitDensity(lf);
  }
}
function bkEdgeWidths() {
  var n = state.book ? state.book.pages.length : 0;
  if (!n) return null;
  var T = 22;                                        /* total block thickness */
  var read = n > 1 ? Math.max(0, Math.min(1, state.idx / (n - 1))) : 0;
  return {
    wl: state.idx === 0 ? 0 : Math.max(3, T * read),
    wr: state.idx >= n - 1 ? 0 : Math.max(3, T * (1 - read))
  };
}
function updateBlockEdges(wrapEl) {
  var w = bkEdgeWidths(); if (!w) return;
  var l = wrapEl.querySelector('.bk-edge.l'), r = wrapEl.querySelector('.bk-edge.r'), b = wrapEl.querySelector('.bk-edge.b');
  if (l) { l.style.left = (-w.wl) + 'px'; l.style.width = w.wl + 'px'; }
  if (r) { r.style.right = (-w.wr) + 'px'; r.style.width = w.wr + 'px'; }
  if (b) { b.style.left = (-w.wl) + 'px'; b.style.right = (-w.wr) + 'px'; }
}
function addBlockEdges(wrapEl) {
  var wz = bkEdgeWidths();
  if (!wz) return;
  var wl = wz.wl, wr = wz.wr;
  if (wl) { var l = document.createElement('div'); l.className = 'bk-edge l';
    l.style.left = (-wl) + 'px'; l.style.width = wl + 'px'; wrapEl.appendChild(l); }
  if (wr) { var r = document.createElement('div'); r.className = 'bk-edge r';
    r.style.right = (-wr) + 'px'; r.style.width = wr + 'px'; wrapEl.appendChild(r); }
  var b = document.createElement('div'); b.className = 'bk-edge b';
  b.style.left = (-wl) + 'px'; b.style.right = (-wr) + 'px';
  wrapEl.appendChild(b);
}
function wireCoverTilt(c) {
  c.addEventListener('mouseenter', function () { c.style.transform = 'perspective(1400px) rotateY(-3deg)'; });
  c.addEventListener('mouseleave', function () { c.style.transform = 'perspective(1400px) rotateY(-9deg)'; });
}
/* ease a flat-arrived cover into the shelf-POV tilt (pick + close land flat) */
function settleCover() {
  state.arriveFlat = false;
  if (!state.book || state.idx !== 0 || state.single) return;
  var c = $('#bkBook').querySelector('.bk-page');
  if (!c || /rotateY\(-9deg\)/.test(c.style.transform)) return;
  c.style.transform = 'perspective(1400px) rotateY(-9deg)';
  wireCoverTilt(c);
}
function wireInteractive(rootEl) {
  rootEl.querySelectorAll('[data-go]').forEach(function (el) {
    el.addEventListener('click', function (ev) { ev.stopPropagation(); goTo(+el.dataset.go); });
  });
  rootEl.querySelectorAll('.fl-end').forEach(function (el) {
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var book = state.book;
      var ch = book.chapters.find(function (c) { return c.slug === el.dataset.end; });
      var t = book.toc.find(function (c) { return ch && c.n === ch.n; });
      if (t) goTo(t.page);
    });
  });
  rootEl.querySelectorAll('[data-guide]').forEach(function (el) {
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      startGuide(el.closest('.pg-flow') || el.closest('.bk-page'));
    });
  });
  /* synchronous — a rAF here paints the flowchart one frame WITHOUT its
     arrows after every landing (they visibly pop in) */
  wireFlowIn(rootEl);
}
/* draw the flowchart arrows inside el if it holds the flow page — el may BE
   the flow page (setPage puts the kind class on faces/underneath pages
   directly). Must be in the DOM, laid out, and NOT rotated (wireFlow
   measures client rects). */
function wireFlowIn(el) {
  if (!el || !el.querySelector) return;
  var fl = (el.classList && el.classList.contains('pg-flow')) ? el : el.querySelector('.pg-flow');
  if (fl) wireFlow(fl);
}

/* ── turning ──────────────────────────────────────────────────────────── */
function goTo(i, silent) {
  if (!state.book) return;
  state.idx = normalizeIdx(i);
  state.turning = false;
  state.pending = 0; state.pendingDir = 0;   /* buildSpread clears any in-flight sheets */
  buildSpread();
  persist();
  if (!silent) syncURL();
}
function next() { turn(1); }
function prev() { turn(-1); }
function turn(dir) {
  var book = state.book;
  if (!book || state.turning) return;
  /* overlapping flips: same direction only, paced, capped */
  if (state.pending) {
    if (dir !== state.pendingDir) return;                        /* no mid-air reversals */
    if (state.pending >= 4) return;
    if (Date.now() - state.lastTurnAt < 140) return;             /* key-repeat pacing */
  }
  var step = state.single ? 1 : (state.idx === 0 ? 1 : 2);
  var target = state.idx + dir * step;
  if (dir > 0 && state.idx === 0) target = 1;                    /* open the cover onto p1/p2 spread */
  if (!state.single && target > 0 && target % 2 === 1) target--; /* keep spreads even; cover handled above */
  if (dir > 0 && state.idx >= book.pages.length - (state.single ? 1 : 2)) return;
  if (dir < 0 && state.idx === 0) return;
  if (dir < 0 && target < 0) target = 0;
  if (dir > 0 && state.idx === 0 && !state.single) target = 2;     /* cover → first spread (idx 2,3) */

  if (LITE) { goTo(target); return; }

  /* ── single-page leaf turn: the sheet hinges on the LEFT edge. Forward
     lifts the CURRENT page away (base pre-set to the target, sheet fades as
     it folds out over the spine); backward raises the target leaf back on
     top (fades in, lands, commits). Covers ride the same path — the front
     face simply renders the cover art. Overlapping riffles keep the spread
     bookkeeping: idx advances at takeoff, non-last sheets commit on landing,
     the last one down rebuilds. */
  if (state.single) {
    if (target === 0 && !state.pending) { closeCover(); return; }   /* keep the close exclusive */
    var wrapEl1 = $('#bkBook');
    var idxFrom1 = state.idx;
    state.idx = target;
    state.pending++;
    state.pendingDir = dir;
    state.lastTurnAt = Date.now();
    var firstOfBurst1 = state.pending === 1;
    persist(); syncURL(); syncBar();
    if (dir > 0) {
      wrapEl1.querySelectorAll('.bk-stand, .bk-flip.sgl.fwd').forEach(function (el) {
        var d = (+el.dataset.d || 0) + 1;
        el.dataset.d = d;
        el.classList.remove('d1', 'd2');
        el.classList.add(d === 1 ? 'd1' : 'd2');           /* the veil grade travels with the depth */
        el.style.transform = 'rotateY(' + bkFanAngle(d) + 'deg)';
        if (d >= BK_FAN.length) el.style.opacity = '0';   /* pushed off the fan — gone before the rebuild drops it */
      });
    } else {
      /* the front leaf leaves the fan (the sheet takes its place); the REMAINING
         static leaves step forward — in-flight sheets are never retargeted */
      var stands0 = wrapEl1.querySelectorAll('.bk-stand');
      if (stands0.length) stands0[stands0.length - 1].remove();
      wrapEl1.querySelectorAll('.bk-stand').forEach(function (el) {
        var d = Math.max(0, (+el.dataset.d || 0) - 1);
        el.dataset.d = d;
        el.classList.remove('d1', 'd2');
        if (d === 1) el.classList.add('d1'); else if (d >= 2) el.classList.add('d2');
        el.style.transform = 'rotateY(' + bkFanAngle(d) + 'deg)';
      });
      /* the incoming deepest leaf fades IN now, so the rebuild adds nothing */
      var backIdx = target - BK_FAN.length;
      if (backIdx >= 0) {
        var bleaf = document.createElement('div');
        bleaf.className = 'bk-stand d' + (BK_FAN.length - 1);
        bleaf.dataset.d = BK_FAN.length - 1;
        var bf = document.createElement('div'); bf.className = 'face front pg-single';
        var bb = document.createElement('div'); bb.className = 'face back pg-single';
        setPage(bf, backIdx); setPage(bb, backIdx);
        bleaf.appendChild(bf); bleaf.appendChild(bb);
        bleaf.style.transform = 'rotateY(' + bkFanAngle(BK_FAN.length - 1) + 'deg)';
        bleaf.style.opacity = '0';
        var firstStand = wrapEl1.querySelector('.bk-stand');
        if (firstStand) wrapEl1.insertBefore(bleaf, firstStand); else wrapEl1.appendChild(bleaf);
        fitDensity(bf); fitDensity(bb);
        void bleaf.offsetHeight;
        bleaf.style.opacity = '1';
      }
    }
    updateBlockEdges(wrapEl1);                       /* the block thickness follows at takeoff, not at the rebuild */
    var flip1 = document.createElement('div');
    flip1.className = 'bk-flip sgl ' + (dir > 0 ? 'fwd' : 'bwd');
    flip1.dataset.d = 0;
    flip1.style.zIndex = ++state.zSeq;
    var front1 = document.createElement('div'); front1.className = 'face front pg-single';
    var back1 = document.createElement('div'); back1.className = 'face back pg-single';
    var base1 = wrapEl1.querySelector('.bk-page:not(.bk-stand .face)') || wrapEl1.querySelector('.bk-page');
    if (dir > 0) {
      setPage(front1, idxFrom1);                     /* the lifting leaf = what's on top now */
      setPage(back1, idxFrom1);                      /* same page on the reverse — visible past 90° */
      if (base1) { setPage(base1, target); fitDensity(base1); wireFlowIn(base1); }   /* revealed beneath */
    } else {
      setPage(front1, target);                       /* the returning leaf lands as the new page */
      setPage(back1, target);
    }
    flip1.appendChild(front1); flip1.appendChild(back1);
    flip1.style.willChange = 'transform';
    wrapEl1.appendChild(flip1);
    /* density + flow arrows while the face is still unrotated (nothing paints
       between append and the transform below — same trick as the spread) */
    fitDensity(front1);
    fitDensity(back1);                               /* the BACK face is the visible one past 90° — unfitted it would swap sizes at the rebuild */
    wireFlowIn(front1);
    if (dir < 0) flip1.style.transform = 'rotateY(' + BK_STAND + 'deg)';   /* start standing at the spine */
    if (firstOfBurst1) {
      var sh1 = document.createElement('div');
      sh1.className = 'bk-shade s ' + (dir > 0 ? 'out' : 'in');
      wrapEl1.appendChild(sh1);
    }
    void flip1.offsetHeight;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        flip1.classList.add('go');
        flip1.style.transform = 'rotateY(' + (dir > 0 ? bkFanAngle(+flip1.dataset.d || 0) : 0) + 'deg)';
      });
    });
    var done1 = false;
    function finish1() {
      if (done1) return; done1 = true;
      if (!flip1.parentNode) { flip1.style.willChange = ''; return; }   /* an external goTo already rebuilt */
      state.pending--;
      if (state.pending <= 0) { goTo(state.idx); return; }
      flip1.style.willChange = '';
      /* fwd sheets STAY as the standing fan; a landed bwd sheet commits its
         page into the base and leaves (a flat lingering sheet would be
         yanked around by later takeoffs) */
      if (dir < 0) {
        if (base1) { setPage(base1, target); fitDensity(base1); wireFlowIn(base1); }
        flip1.remove();
      }
    }
    flip1.addEventListener('transitionend', function (ev) { if (ev.propertyName === 'transform') finish1(); });
    setTimeout(finish1, 900);
    return;
  }

  /* cover transitions stay exclusive — wait for the air to clear */
  if (dir > 0 && state.idx === 0) { if (!state.pending) openCover(); return; }
  if (target === 0) { if (!state.pending) closeCover(); return; }

  /* 3D flip: forward flips the right page; backward flips the left.
     Flips may OVERLAP (rapid flipping): idx advances at TAKEOFF, each
     landing sheet commits its page into the static spread, and only the
     last sheet down rebuilds. */
  var wrapEl = $('#bkBook');
  var idxFrom = state.idx;
  state.idx = target;
  state.pending++;
  state.pendingDir = dir;
  state.lastTurnAt = Date.now();
  var firstOfBurst = state.pending === 1;
  persist(); syncURL(); syncBar();
  var flip = document.createElement('div');
  flip.className = 'bk-flip ' + (dir > 0 ? 'fwd' : 'bwd');
  flip.style.zIndex = ++state.zSeq;                              /* newer sheets land on top */
  /* faces carry the SIDE class of the page they show — runhead/folio/conf
     positions are .pg-left/.pg-right-scoped, and without the class they
     collapse to their static spot (the runhead lands near the spine) until
     the rebuild snaps them home */
  var front = document.createElement('div'); front.className = 'face front ' + (dir > 0 ? 'pg-right' : 'pg-left');
  var back = document.createElement('div'); back.className = 'face back ' + (dir > 0 ? 'pg-left' : 'pg-right');
  if (dir > 0) {
    setPage(front, idxFrom + 1);                   /* current right */
    setPage(back, target);                         /* next left */
    /* underneath: replace right page content with the incoming right */
    var rightEl = wrapEl.querySelector('.pg-right');
    if (rightEl) { setPage(rightEl, target + 1); wireFlowIn(rightEl); }
  } else {
    setPage(front, idxFrom);                       /* current left */
    setPage(back, target + 1);                     /* prev right */
    var leftEl = wrapEl.querySelector('.pg-left');
    if (leftEl) { setPage(leftEl, target); wireFlowIn(leftEl); }
  }
  flip.appendChild(front); flip.appendChild(back);
  flip.style.willChange = 'transform';
  wrapEl.appendChild(flip);
  /* reveal + landing shadows on the static halves — only for the first
     sheet of a burst (stacked shades darken; a riffle needs none) */
  if (firstOfBurst) {
    var shOut = document.createElement('div'), shIn = document.createElement('div');
    shOut.className = 'bk-shade out ' + (dir > 0 ? 'r' : 'l');
    shIn.className = 'bk-shade in ' + (dir > 0 ? 'l' : 'r');
    wrapEl.appendChild(shOut); wrapEl.appendChild(shIn);
  }
  /* force style+layout of the fresh faces NOW, then start on a clean frame —
     starting in the same frame as the DOM build makes the browser spend the
     first transition frames on first-paint work (the "laggy jump-cut") */
  void flip.offsetHeight;
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      flip.classList.add('go');
      flip.style.transform = 'rotateY(' + (dir > 0 ? -180 : 180) + 'deg)';
    });
  });
  var done = false;
  function finish() {
    if (done) return; done = true;
    flip.style.willChange = '';
    if (!flip.parentNode) return;                  /* an external goTo already rebuilt */
    state.pending--;
    if (state.pending <= 0) { goTo(state.idx); return; }         /* last one down rebuilds */
    /* commit this sheet's landed page into the static half, drop the sheet */
    if (dir > 0) {
      var l = wrapEl.querySelector('.pg-left');
      if (l) { setPage(l, target); wireFlowIn(l); }
    } else {
      var r2 = wrapEl.querySelector('.pg-right');
      if (r2) { setPage(r2, target + 1); wireFlowIn(r2); }
    }
    flip.remove();
  }
  flip.addEventListener('transitionend', finish);
  setTimeout(finish, 860);                                        /* safety */
}

/* cover → first spread: the front cover swings open around the spine while
   the whole book slides across to centre the opening spread. The book
   starts one page wide (right half of the spread = where the closed cover
   sat) and the scale eases between the cover fit and the spread fit. */
function openCover() {
  state.turning = true;
  var sCover = state.scale || fitScaleFor(620);
  state.idx = 2;
  buildSpread();                                   /* flow | contents, refits */
  persist(); syncURL();
  var sSpread = state.scale || 1;
  var wrapEl = $('#bkBook'), scaleEl = $('#bkScale');
  var leftEl = wrapEl.querySelector('.pg-left');
  if (leftEl) leftEl.style.visibility = 'hidden';  /* empty air until the cover lands */
  /* while the 8px-rounded cover sits on it, the page beneath must not show
     white through the cover's corner arcs (its spine corners are 2px) */
  var rightEl = wrapEl.querySelector('.pg-right');
  if (rightEl) rightEl.style.borderRadius = '8px 10px 10px 8px';
  var flip = document.createElement('div');
  flip.className = 'bk-flip fwd';
  var front = document.createElement('div'); front.className = 'face front';
  var back = document.createElement('div'); back.className = 'face pg-left'; /* 'back' added below */
  setPage(front, 0);                               /* the cover art */
  setPage(back, 2);                                /* lands as the left page */
  flip.appendChild(front); flip.appendChild(back);
  flip.style.willChange = 'transform';
  wrapEl.appendChild(flip);
  /* wire the flowchart arrows while the face is still unrotated (wireFlow
     measures client rects) — nothing paints between these lines */
  wireFlowIn(back);
  back.classList.add('back');
  flip.style.transform = 'rotateY(-9deg)';         /* pick up from the POV tilt */
  var shOut = document.createElement('div');
  shOut.className = 'bk-shade out r';
  wrapEl.appendChild(shOut);
  /* closed book where the cover was: right half centred */
  scaleEl.style.transition = 'none';
  scaleEl.style.transform = 'scale(' + sCover + ') translateX(-240px)';
  void scaleEl.offsetHeight;
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      scaleEl.style.transition = 'transform .64s cubic-bezier(.3,.02,.18,.98)';
      scaleEl.style.transform = 'scale(' + sSpread + ') translateX(0px)';
      flip.classList.add('go');
      flip.style.transform = 'rotateY(-180deg)';
    });
  });
  var done = false;
  function finish() {
    if (done) return; done = true;
    scaleEl.style.transition = '';
    goTo(2);
  }
  flip.addEventListener('transitionend', finish);
  setTimeout(finish, 860);
}

/* spread → closed cover: mirror of openCover — the sheet (current left page,
   with the front cover on its back) sweeps shut over the right half while
   the book re-centres on the closed cover. Works from ANY spread, so the
   shelf return can close the book from wherever the reader is; onDone (if
   given) takes over after the sweep instead of rebuilding at the cover. */
function closeCover(onDone) {
  state.turning = true;
  /* single-page: the cover leaf sweeps shut over the current page — same
     left-hinged sheet as a backward turn, cover art on its front. No scale
     or translate choreography (the closed book is the same box). */
  if (state.single) {
    var wrapS = $('#bkBook');
    var flipS = document.createElement('div');
    flipS.className = 'bk-flip sgl bwd';
    flipS.style.zIndex = ++state.zSeq;
    var frontS = document.createElement('div'); frontS.className = 'face front pg-single';
    var backS = document.createElement('div'); backS.className = 'face back pg-single';
    setPage(frontS, 0);                            /* the cover art lands on top */
    setPage(backS, 0);                             /* and shows on the reverse while standing */
    flipS.appendChild(frontS); flipS.appendChild(backS);
    flipS.style.willChange = 'transform';
    flipS.style.transform = 'rotateY(' + BK_STAND + 'deg)';
    var stC = wrapS.querySelector('.bk-stand');
    if (stC) stC.remove();                         /* the sweeping cover replaces the standing leaf */
    wrapS.appendChild(flipS);
    void flipS.offsetHeight;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        flipS.classList.add('go');
        flipS.style.transform = 'rotateY(0deg)';
      });
    });
    var doneS = false;
    var finishS = function () {
      if (doneS) return; doneS = true;
      if (onDone) { onDone(flipS); return; }        /* shelf return continues from the landed sheet */
      state.arriveFlat = true;
      goTo(0);
    };
    flipS.addEventListener('transitionend', function (ev) { if (ev.propertyName === 'transform') finishS(); });
    setTimeout(finishS, 900);
    return;
  }
  var sSpread = state.scale || 1;
  var sCover = fitScaleFor(620);
  var wrapEl = $('#bkBook'), scaleEl = $('#bkScale');
  var leftEl = wrapEl.querySelector('.pg-left');
  /* the landed cover is 8px-rounded — round the page beneath to match, or
     white peeks through the cover's corner arcs at touchdown */
  var rightEl = wrapEl.querySelector('.pg-right');
  if (rightEl) rightEl.style.borderRadius = '8px 10px 10px 8px';
  var flip = document.createElement('div');
  flip.className = 'bk-flip bwd';
  var front = document.createElement('div'); front.className = 'face front pg-left';
  var back = document.createElement('div'); back.className = 'face back';
  setPage(front, state.idx);                       /* current left page */
  setPage(back, 0);                                /* cover art faces up when shut */
  flip.appendChild(front); flip.appendChild(back);
  flip.style.willChange = 'transform';
  wrapEl.appendChild(flip);
  if (leftEl) leftEl.style.visibility = 'hidden';  /* the sheet IS the left page now */
  scaleEl.style.transition = 'none';
  scaleEl.style.transform = 'scale(' + sSpread + ') translateX(0px)';
  void scaleEl.offsetHeight;
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      scaleEl.style.transition = 'transform .64s cubic-bezier(.3,.02,.18,.98)';
      scaleEl.style.transform = 'scale(' + sCover + ') translateX(-240px)';
      flip.classList.add('go');
      flip.style.transform = 'rotateY(180deg)';
    });
  });
  var done = false;
  function finish() {
    if (done) return; done = true;
    scaleEl.style.transition = '';
    if (onDone) { onDone(flip); return; }          /* shelf return continues from the landed sheet */
    state.arriveFlat = true;                       /* rebuild flat… */
    goTo(0);
    setTimeout(settleCover, 160);                  /* …then ease into the POV tilt after a beat */
  }
  flip.addEventListener('transitionend', finish);
  setTimeout(finish, 860);
}

/* ── chrome sync ──────────────────────────────────────────────────────── */
function syncBar() {
  var book = state.book; if (!book) return;
  var n = book.pages.length;
  var label;
  if (state.idx === 0) label = 'Cover';
  else if (state.single) label = folioLabel(state.idx);
  else {
    var a = folioLabel(state.idx), b = folioLabel(Math.min(state.idx + 1, n - 1));
    label = a === b ? a : a + '–' + b;             /* intro spread reads "introduction", not "introduction–introduction" */
  }
  $('#bkCount').textContent = label + ' · ' + (n - frontCount()) + 'pp';
  $('#bkFill').style.width = Math.round((state.idx / (n - 1)) * 100) + '%';
}
function folioLabel(idx) {
  var f = folioOf(idx);
  if (f >= 1 && f <= state.book.pages.length - frontCount() - 1) return 'p' + f;
  var k = state.book.pages[idx] && state.book.pages[idx].kind;
  return { cover: 'cover', title: 'title', intro: 'introduction', flow: 'flowchart', toc: 'contents' }[k] || '·';
}
function persist() {
  try { localStorage.setItem(resumeKey(state.book.slug), String(state.idx)); } catch (e) {}
}
function syncURL() {
  try {
    history.replaceState(null, '', '?book=' + encodeURIComponent(state.book.slug) + '&page=' + state.idx);
  } catch (e) {}
}

/* scale the spread to the viewport (transform only — no layout thrash).
   The scale wrapper keeps its UNSCALED layout box, so the stage height must
   come from the VISUAL height and the wrapper must be top-anchored
   (align-items:flex-start + transform-origin:top center) — otherwise the
   progress line after the stage lands ON the book whenever s > 1. */
function fitScaleFor(w) {
  var availW = Math.min(window.innerWidth - 36, 1160);
  var availH = Math.max(320, window.innerHeight - (document.body.classList.contains('bk-fs') ? 88 : 150));
  return Math.min(availW / w, availH / 847, 1.2);
}
function fitStage() {
  var stage = $('#bkStage'), scale = $('#bkScale');
  var pageW = 620, pageH = 847;
  var w = state.single || state.idx === 0 ? pageW : pageW * 2;
  var s = fitScaleFor(w);
  state.scale = s;
  scale.style.width = w + 'px';
  scale.style.height = pageH + 'px';
  scale.style.transform = 'scale(' + s + ')';
  stage.style.height = Math.ceil(pageH * s + 16) + 'px';
}

/* ── open/close ───────────────────────────────────────────────────────── */
function openBook(payload, page) {
  state.book = payload;
  state.cache = {};
  state.single = true;   /* one-page view is THE reading mode (Saskia 2026-08-05) */
  state.idx = normalizeIdx(page || 0);
  document.body.classList.add('bk-open');
  buildSpread();
  syncURL();
  document.title = payload.title + ' · Bookshelf';
}
function closeBook(keepShelf) {
  state.book = null;
  document.body.classList.remove('bk-open', 'bk-fs');
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  document.title = 'Bookshelf — Performance Property';
  if (!keepShelf) renderShelf();   /* refresh resume chips */
}

/* reader → shelf: sweep the book shut if it's open (any spread), then fly
   the closed cover down to its shelf slot while the shelf fades back in.
   LITE keeps the instant path; the resume position is preserved. */
function returnToShelf() {
  if (!state.book || state.returning) return;
  if (LITE) { closeBook(); return; }
  if (state.turning || state.pending) return;      /* let the air clear first */
  state.returning = true;
  state.turning = true;
  var begin = function () {
    if (state.idx > 0) closeCover(flyBack);         /* sweep shut first, then fly */
    else flyBack(null);
  };
  /* leave OS fullscreen first, so the flight happens in the final layout */
  if (document.fullscreenElement || document.body.classList.contains('bk-fs')) {
    document.body.classList.remove('bk-fs');
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    setTimeout(begin, 150);
  } else begin();

  function flyBack(landedFlip) {
    if (landedFlip) { spawn(landedFlip.getBoundingClientRect()); return; }
    var c = $('#bkBook').querySelector('.bk-page');
    if (!c) { finishInstant(); return; }
    /* straighten the POV tilt so the clone spawns on an exact match */
    var flat = state.single || !/rotateY\(-[39]deg\)/.test(c.style.transform);
    if (!flat) c.style.transform = 'perspective(1400px) rotateY(0deg)';
    setTimeout(function () { spawn($('#bkBook').getBoundingClientRect()); }, flat ? 30 : 280);
  }
  function spawn(src) {
    var clone = document.createElement('div');
    clone.className = 'bk-return';
    setPage(clone, 0);                             /* the cover, laid out at 480×656 */
    clone.style.left = src.left + 'px'; clone.style.top = src.top + 'px';
    clone.style.transform = 'scale(' + (src.width / 480) + ',' + (src.height / 656) + ')';
    document.body.appendChild(clone);
    /* show the shelf BEFORE rendering it — fitJackets() inside renderShelf
       measures card widths, and a display:none shelf measures 0 (the
       miniature would render unscaled/cropped) */
    document.body.classList.add('bk-returning');   /* reader hides, shelf fades in beneath */
    renderShelf();                                 /* fresh resume chips before measuring */
    var card = $('#bkGrid .bk-card[data-slug="' + state.book.slug + '"]');
    var jEl = card && card.querySelector('.jacket');
    var jr = jEl && jEl.getBoundingClientRect();
    if (!jr) { clone.remove(); finishInstant(); return; }
    jEl.style.visibility = 'hidden';                   /* the slot waits for the book */
    void clone.offsetWidth;
    requestAnimationFrame(function () {
      clone.style.transition = 'transform .5s cubic-bezier(.3,.02,.18,.98)';
      clone.style.transform = 'translate(' + (jr.left - src.left) + 'px,' + (jr.top - src.top) + 'px) ' +
        'scale(' + (jr.width / 480) + ',' + (jr.height / 656) + ')';
    });
    setTimeout(function () {                           /* touchdown: reveal + crossfade */
      jEl.style.visibility = '';
      clone.style.transition = 'opacity .14s ease';
      clone.style.opacity = '0';
      setTimeout(function () { clone.remove(); finishInstant(); }, 170);
    }, 520);
  }
  function finishInstant() {
    $('#bkBook').innerHTML = '';                   /* drop the landed sweep sheet */
    closeBook(true);                               /* shelf is already rendered */
    document.body.classList.remove('bk-returning');
    state.returning = false;
    state.turning = false;
    fitJackets();                                  /* safety: re-fit in the final layout */
  }
}

/* ── controls ─────────────────────────────────────────────────────────── */
/* click-to-turn on the book: left half back, right half forward — unless the
   click landed on something interactive (TOC rows, flow chips, guide) */
$('#bkBook').addEventListener('click', function (ev) {
  if (!state.book || state.turning) return;
  if (ev.target.closest('button, [data-go], a, input, .fl-guide')) return;
  var r = this.getBoundingClientRect();
  (ev.clientX < r.left + r.width / 2 && state.idx > 0) ? prev() : next();
});
$('#bkBack').addEventListener('click', returnToShelf);
$('#bkPrev').addEventListener('click', prev);
$('#bkNext').addEventListener('click', next);
$('#bkTocBtn').addEventListener('click', function () { if (state.book) goTo(state.book.tocPage); });
$('#bkGoto').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || !state.book) return;
  var f = parseInt(this.value, 10);
  if (isFinite(f)) goTo(idxOfFolio(f));
  this.value = '';
});
$('#bkFs').addEventListener('click', function () {
  var on = !document.body.classList.contains('bk-fs');
  document.body.classList.toggle('bk-fs', on);
  try { on ? document.documentElement.requestFullscreen() : document.exitFullscreen(); } catch (e) {}
  fitStage();
});
document.addEventListener('fullscreenchange', function () {
  if (!document.fullscreenElement) document.body.classList.remove('bk-fs');
  fitStage();
});
document.addEventListener('keydown', function (e) {
  if (!state.book) return;
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') goTo(0);
});
/* swipe */
(function () {
  var x0 = null;
  document.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 == null || !state.book) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 46) (dx < 0 ? next() : prev());
    x0 = null;
  }, { passive: true });
})();
window.addEventListener('resize', function () {
  if (!state.book) return;
  fitStage();   /* single-page always — only the fit scale responds to resizes */
});

/* ── routing ──────────────────────────────────────────────────────────── */
function route() {
  var q = new URLSearchParams(location.search);
  var slug = q.get('book');
  if (slug) loadBook(slug, parseInt(q.get('page'), 10) || 0);
}
loadShelf();
</script>
</body>
</html>
