/* ═══ state ═════════════════════════════════════════════════════════════ */
const S = { draft: null, savedAt: null, origin: '', pvReady: false };

/* ═══ preview (the public page in an iframe, fed by postMessage) ════════ */
function postPreview() {
  const f = $('#pv'); if (!f.contentWindow || !S.draft) return;
  const saved = !!S.savedAt;
  f.contentWindow.postMessage({ type: 'adl-preview', payload: S.draft, saved,
    status: saved ? 'Saved · ' + S.savedAt : 'Draft — not published to the client link' }, location.origin);
}
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'adl-ready') return;
  S.pvReady = true; postPreview();
});

/* ═══ chrome ════════════════════════════════════════════════════════════ */
function status(kind, head, rest) {
  const el = $('#arStatus');
  el.className = 'ar-status' + (kind ? ' ' + kind : '');
  el.innerHTML = '<b>' + esc(head) + '</b>' + (rest ? ' · ' + esc(rest) : '');
}
let toastT = null;
function toast(msg) { const t = $('#arToast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function clientUrl() { return new URL(CLIENT_PATH, location.href).href; }

async function boot() {
  let g = 0; while (!window.sb && g++ < 80) await new Promise(r => setTimeout(r, 100));
  let note = '';
  try {
    if (!window.sb) throw new Error('No database connection');
    const { data, error } = await sb.from('client_pages').select('payload, updated_at').eq('key', KEY).maybeSingle();
    if (error) throw error;
    if (data && data.payload) {
      S.draft = data.payload; S.origin = 'row';
      S.savedAt = new Date(data.updated_at).toLocaleString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
      note = 'Published version · saved ' + S.savedAt;
    }
  } catch (e) {
    note = 'Could not read the saved page (' + ((e && e.message) || e) + ') — showing the built-in figures.';
  }
  if (!S.draft) { S.draft = structuredClone(SEED); S.origin = 'seed'; note = note || 'Built-in figures · not published to the client link yet.'; }
  status(S.origin === 'row' ? 'ok' : '', S.origin === 'row' ? 'Loaded' : 'Preview', note);
  if (S.pvReady) postPreview();
  $('#pv').addEventListener('load', () => setTimeout(postPreview, 50));
}

$('#btnCopy').addEventListener('click', () => {
  const url = clientUrl(), label = (S.draft && S.draft.text && S.draft.text.title) || 'Adelaide returns';
  const done = () => toast('Client link copied'), fail = () => toast('Could not copy — ' + url);
  if (window.PP_COPY_LINK) PP_COPY_LINK.copy(url, label).then(done, fail);
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, fail);
  else fail();
});
document.querySelectorAll('.ar-pvbar [data-w]').forEach(b => b.addEventListener('click', () => {
  $('#pv').style.width = b.dataset.w ? b.dataset.w + 'px' : '100%';
}));
boot();
</script>
