      blocks.push({ tbl: 'df', cls: 't2', head: TH, row: '<tr><td>' + esc(d.item || '') + '</td><td>' + esc(d.room || '') + '</td><td class="cm">' + esc(d.issue || '') + '</td><td>' +
        (u ? '<img crossorigin="anonymous" src="' + esc(u) + '" width="46" height="34" style="object-fit:cover;border-radius:3px;display:block" alt="">' : '') +
        '</td><td>' + esc(d.who || '') + '</td><td class="cm">' + esc(d.action || '') + '</td></tr>' }); });
    else blocks.push({ h: '<p class="muted" style="font-size:9.5px">No defects logged.</p>' });
    const so = ck.signoff || {};
    const dt = v => v ? new Date(v + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    blocks.push({ h: '<div class="sh">Sign-off</div><div class="sign">' +
      [['Property', fullAddr()], ['Inspected by', so.inspectedBy], ['Date', dt(so.date)], ['Settlement date', dt(so.settlementDate)]]
        .map(([k, v]) => '<div><div class="k">' + k + '</div><div class="v">' + esc(v || '') + '</div></div>').join('') + '</div>' +
      '<ul class="ticks">' + VIC_SIGNOFF_TICKS.map(([k, lab]) => '<li><i class="' + (so[k] ? 'on' : '') + '">' + (so[k] ? '✓' : '') + '</i>' + esc(lab) + '</li>').join('') + '</ul>' });

  if (insp.summaryNotes) blocks.push({ h: '<div class="sh first">Summary</div><p class="para">' + esc(insp.summaryNotes) + '</p>' });
  if (ov.length) {

  const acc = [s.beds != null ? s.beds + ' bedrooms' : null, s.baths != null ? s.baths + ' bathrooms' : null,
    insp.living != null ? insp.living + ' living areas' : null, s.cars != null ? s.cars + ' car spaces' : null].filter(Boolean).join(' · ');
  if (acc) blocks.push({ h: '<div class="sh">Accommodation</div><p class="para">' + esc(acc) + '</p>' });
  blocks.push({ h: '<div class="sh">Items requiring attention</div>', keep: true });
  if (flagged.length) flagged.forEach(x => blocks.push({ h: '<p style="margin:2px 0;font-size:9.5px">• ' + esc(x) + '</p>' }));
  else blocks.push({ h: '<p class="para">Nothing flagged — all inspected features present and serviceable.</p>' });
  return flowPages(T2, () => pgHead(T2), blocks);
}

/* 7 · additional costs + settlement — the file's own figures first, then the boilerplate */
function bpHtml(arr) {
  return (arr || []).map(p => {
    const t = String(p || '').trim(); if (!t) return '';
    if (t.length < 48 && !/[.:!?]$/.test(t) && !/\n/.test(t) && !/^(Timeframe|Budget):/i.test(t)) return '<p class="hd">' + esc(t) + '</p>';
    let h = '', list = [];
    const flush = () => { if (list.length) { h += '<ul>' + list.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'; list = []; } };
    t.split(/\n/).map(x => x.trim()).filter(Boolean).forEach(line => {
      if (/^[-•]\s*/.test(line)) { list.push(line.replace(/^[-•]\s*/, '')); return; }
      flush();
      const m = line.match(/^(Timeframe|Budget):\s*(.*)$/i);
      h += m ? '<p><span class="lbl">' + esc(m[1]) + ':</span> ' + esc(m[2]) + '</p>' : '<p>' + esc(line) + '</p>';
    });
    flush();
    return h;
  }).join('');
}
function pageCostsSettlement(c, B) {
  const cf = c.cashflow || {}, nv = k => +cf[k] || 0;
  const TITLE = 'Additional costs and settlement';
  const acqRows = [['Stamp duty', 'stampDuty'], ['Engagement fee', 'engagementFee'], ['Acquisition fee', 'acquisitionFee'],
    ['Mortgage & title transfer fee', 'titleTransfer'], ['Conveyancing / legal', 'conveyancing'], ['Building & pest inspections', 'buildingPest'],
    ['Depreciation schedule', 'depreciationSchedule'], ['Professional clean', 'professionalClean']].filter(([, k]) => nv(k));
  const allowRows = [['Maintenance allowance (year one)', 'maintenanceAllowance'], ['Cosmetic works allowance', 'cosmeticWorks'],
    ['Minimum rental standards works', 'minRentalStdCost']].filter(([, k]) => nv(k));
  const mini = (title, rows, total) => '<table class="t2"><tr><th>' + title + '</th><th class="r">This property</th></tr>' +
    rows.map(([lab, k]) => '<tr><td>' + esc(lab) + '</td><td class="r nw">' + money(nv(k)) + '</td></tr>').join('') +
    (total != null ? '<tr class="tot"><td>Total</td><td class="r nw">' + money(total) + '</td></tr>' : '') + '</table>';
  const blocks = [];
  if (acqRows.length || allowRows.length) blocks.push({ h: '<p class="lede">This property\'s own figures, from the cashflow — the notes below refer to these costs.</p>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start">' +
    (acqRows.length ? mini('Acquisition costs', acqRows, acqRows.reduce((a, [, k]) => a + nv(k), 0)) : '<div></div>') +
    (allowRows.length ? mini('Allowances in the cost of property', allowRows, null) : '<div></div>') + '</div>' });
  const txt = ((B.additional_costs || []).length ? '<p class="hd" style="margin-top:0">Costs to maintain your investment</p>' + bpHtml(B.additional_costs) : '') +
    ((B.settlement || []).length ? '<p class="hd">Settlement</p>' + bpHtml(B.settlement) : '');
  if (txt) blocks.push({ h: '<div class="cols2" style="margin-top:14px">' + txt + '</div>' });
  if (!blocks.length) blocks.push({ h: '<p class="muted">No cost figures yet.</p>' });
  return flowPages(TITLE, () => pgHead(TITLE), blocks);
}

/* 8 · strata due diligence (isStrata() files only) — the draft structure */
function fmtStrata(v, type) {

function fmtVal(v) {
  if (v == null || v === '') return '—';

  if (typeof v === 'number') return Math.abs(v) < 1 && v !== 0 ? (v * 100).toFixed(2) + '%' : (Number.isInteger(v) ? v.toLocaleString() : String(v));

function calcCashflow(cf, mode, normRate) {
  const n = k => +cf[k] || 0;
  const budget = n('budget'); if (!budget) return null;
  const rate = mode === 'norm' ? (normRate || RATES.normalised || 0.0494) : (n('rate') || RATES.current || 0.065);
  const loan = budget * (n('lvr') || 0.9);
  const interest = loan * rate;
  const mPmt = loan * (rate / 12) / (1 - Math.pow(1 + rate / 12, -((n('loanTermYears') || 30) * 12)));
  const principal = mode === 'io' ? 0 : (mPmt * 12 - interest);
  const rent = n('rent'), income = rent * (n('weeksLet') || 52);
  const letting = (n('lettingFeeWeeks') || 0) * rent;
  const pm = income * (n('pmFeePct') || 0);
  const repairs = income * (n('repairsPctOfRent') || 0);
  /* flexible fee lines (e.g. QLD's Advice / Portfolio Management 2.2%): pct of income and/or flat $ */
  const fees = (cf.feeLines || []).reduce((a, f) => a + income * (+f.pct || 0) + (+f.amount || 0), 0);
  const pool = cf.hasPool === false ? 0 : n('poolMaintenance');   /* only while the cashflow's pool tick is on */
  const other = n('strata') + n('councilWater') + n('landTax') + n('insurance') + pool;
  const runningLessFin = letting + pm + repairs + fees + other;
  const acq = n('stampDuty') + n('engagementFee') + n('acquisitionFee') + n('titleTransfer') + n('conveyancing') + n('buildingPest') + n('depreciationSchedule') + n('professionalClean');
  const totalCost = budget + n('maintenanceAllowance') + n('minRentalStdCost') + n('cosmeticWorks') + acq;
  const annual = income - (runningLessFin + interest + principal);
  return { loan, requiredCapital: totalCost - loan, grossYield: income / budget, netYield: (income - runningLessFin) / budget,
    expenseRatio: runningLessFin / (income || 1), annual, weekly: annual / 52, interest, principal, income, totalCost, rate, pool, runningLessFin };
}

function pubSegment() {
  const t = ((CUR.setup || {}).propertyType) || '';
  if (pubIsCommercial()) {
    if (/block/i.test(t)) return 'unit_block';

/* Delete an IR file. The audit trigger (mig 104) writes a section='deleted'
   row with who/when before the row goes — that is the deletion history the
   home screen shows. Deleting a PUBLISHED file CASCADES in the DATABASE
   (mig 118, BEFORE DELETE trigger): its IR Library row, the Documents
   auto-folder entry (same row) and every report PDF under published/<id>/
   go in the SAME transaction, on every delete path — not just this button.
   The deck picker reads ir_files live so it drops out on its own; slides
   already inserted into decks baked their data and are untouched. RLS gates
   who may delete — dev tier only for published files (mig 117), and mig 118
   also stops a non-dev from un-publishing to sneak around that. So the
   client just issues the delete; a refusal comes back errorless with zero
   rows (the deck-lock lesson). */
function openDeleteIr() {

async function doDeleteIr() {
  const stat = m => { const e = $('#delStat'); if (e) e.textContent = m; };
  $('#delGo').disabled = true;
  const delId = CUR.id;
  const pub = !!(CUR.compliance || {}).published;
  try {
    /* RLS refusal returns NO error and zero rows — check the rows, not the
       error (the deck-lock lesson). On success the DB trigger (mig 118) has
       already removed the IR Library row and the Documents entry in the same
       transaction. */
    const { data, error } = await sb.from('ir_files').delete().eq('id', delId).select('id');
    if (error) throw error;
    if (!data || !data.length) {
      stat(pub ? 'Refused — published IRs can only be deleted by Vandolf.' : 'Refused — deleting needs ir-builder access.');
      $('#delGo').disabled = false;
      return;
    }
    /* The report PDF(s) can't be deleted from SQL (Supabase blocks direct
       storage-table deletes), so clear them here via the Storage API. Only a
       published file has any — re-publishes stack timestamped files under the
       one prefix. Best-effort: the visible surfaces are already clean. */
    if (pub) {
      try {
        const prefix = 'published/' + delId;
        const { data: objs } = await sb.storage.from('ir-library').list(prefix, { limit: 100 });
        const paths = (objs || []).map(o => prefix + '/' + o.name);
        if (paths.length) await sb.storage.from('ir-library').remove(paths);
      } catch (_) { /* the entry is gone from every list either way */ }
    }
    toast('IR deleted — recorded in the audit history');
    $('#ibpOv').classList.remove('show');
    CUR = null; history.replaceState(null, '', location.pathname);
    await refreshList();
  } catch (e) {
    stat('Delete failed: ' + (e.message || e));
    $('#delGo').disabled = false;
  }
}

}
async function generateReportPdfBlob(statFn) {

        stat('uploading the PDF…');
        pdfPath = 'published/' + CUR.id + '/IR-' + ddSlug(CUR.address) + '-' + Date.now() + '.pdf';
        const up = await sb.storage.from('ir-library').upload(pdfPath, blob, { contentType: 'application/pdf' });
        if (up.error) { pdfPath = null; stat(/not.*found/i.test(up.error.message) ? 'PDF skipped — apply migration 106. Publishing without it…' : 'PDF upload failed (' + up.error.message + ') — publishing without it…'); }
      } catch (e) { pdfPath = null; stat('PDF render failed — publishing without it…'); }
    }
    if (pdfPath) metrics.report_pdf = pdfPath;
    metrics.price_paid = pricePaid;   /* also on the library row, so it never has to be re-keyed there */
    const rec = {
      domain: pubIsCommercial() ? 'commercial' : 'residential',
      market_label: CUR.market_label, market_slug: CUR.market_slug,
      segment: pubSegment(), strategy: pubStrategy(),
      budget: (((CUR.pricing || {}).adopted) || {}).topPrice || (CUR.cashflow || {}).budget || null,
      address: pubFullAddress(), suburb: CUR.suburb, state: CUR.state, lga: (CUR.setup || {}).lga || null,
      sold_date: month + '-01', link_url: $('#pubLink').value.trim() || null,
      notes: $('#pubNotes').value.trim() || null, status: 'current', source: 'ir-builder',
    };
    stat(existing ? 'updating the library entry…' : 'creating the library entry…');
    let libId;
    if (existing) {
      const patch = {};
      for (const [k, v] of Object.entries(rec)) if (v != null) patch[k] = v;   /* never blank existing values */
      patch.metrics = { ...(existing.metrics || {}), ...metrics };
      const { error } = await sb.from('investment_reports').update(patch).eq('id', existing.id);
      if (error) throw error;
      libId = existing.id;
    } else {
      rec.metrics = metrics;
      const { data, error } = await sb.from('investment_reports').insert(rec).select('id').single();
      if (error) throw error;
      libId = data.id;
    }
    /* the market panel it was presented with, cached before the file locks */
    await cacheMarketPanel();
    /* stamp the file + flip to final */
    const comp = { ...(CUR.compliance || {}), published: { at: new Date().toISOString(), libraryId: libId, sold_date: month + '-01', price_paid: pricePaid, pdf: pdfPath || null } };
    await saveSection('compliance', comp, true);
    if (CUR.status !== 'final') {
      await sb.from('ir_files').update({ status: 'final' }).eq('id', CUR.id);
      CUR.status = 'final';
    }
    stat('');
    $('#ibpDlg').innerHTML = '<h2>Published ✓</h2>' +
      '<div class="ib-note">The library entry is live' + (pdfPath ? ' with the report PDF attached' : '') +
      '. This file is now <b>final</b> (read-only — flip the status back to active if it needs edits).</div>' +
      '<div class="ib-savebar"><button class="ib-btn" id="pubClose" type="button">Close</button>' +
      '<a class="ib-btn pri" style="text-decoration:none" href="investment-reports.html?id=' + libId + '" target="_blank" rel="noopener">Open in the library ↗</a></div>';
    $('#pubClose').onclick = () => { $('#ibpOv').classList.remove('show'); renderFile(); };
  } catch (e) {
    stat('Publish failed: ' + (e.message || e));
    $('#pubGo').disabled = false;
  }
}

/* ── AUDIT tab: who changed what — rows from the ir_files_audit trigger,
   field-level diff computed here from each row's old/new section values ── */
function jsonDiff(a, b, base, out, depth) {
  base = base || []; out = out || []; depth = depth || 0;
  if (depth > 6 || out.length > 40) return out;
  const isObj = x => x && typeof x === 'object';
  if (!isObj(a) || !isObj(b)) {
    if (JSON.stringify(a === undefined ? null : a) !== JSON.stringify(b === undefined ? null : b))
      out.push({ path: base.join('.'), from: a, to: b });
    return out;
  }
  const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const k of keys) jsonDiff(a ? a[k] : undefined, b ? b[k] : undefined, [...base, k], out, depth + 1);
  return out;
}
async function renderAudit(el) {
  el.innerHTML = '<div class="ib-card"><div class="ib-note">Loading the trail&hellip;</div></div>';
  const { data, error } = await sb.from('ir_files_audit').select('*')
    .eq('file_id', CUR.id).order('changed_at', { ascending: false }).limit(200);
  if (error) { el.innerHTML = '<div class="ib-card"><div class="ib-note">Audit unavailable: ' + esc(error.message) + '</div></div>'; return; }
  if (!data || !data.length) { el.innerHTML = '<div class="ib-card"><div class="ib-note">No changes recorded yet.</div></div>'; return; }
  el.innerHTML = '<div class="ib-card"><h3>Audit trail <span class="right"><span class="ib-note">' + data.length + ' change(s) · every save is logged by the database, per section</span></span></h3>' +
    '<div class="ib-dd">' + data.map(r => {
      const who = esc((r.changed_email || 'system').split('@')[0]);
      const when = auTs(r.changed_at);
      let body = '';
      if (r.section === 'created') body = '<div class="ib-note">file created</div>';
      else if (r.section === 'deleted') body = '<div class="ib-note">file deleted</div>';
      else {
        const fmtA = v => v == null ? '—' : (typeof v === 'object' ? JSON.stringify(v).slice(0, 80) : fmtVal(v));
        const diffs = jsonDiff(r.old_value, r.new_value);
        const lines = diffs.slice(0, 10).map(d =>
          '<div class="ib-note" style="color:var(--ib-ink2)"><b>' + esc(d.path || r.section) + '</b>: ' +
          '<span style="color:var(--ib-bad)">' + esc(fmtA(d.from)) + '</span> → ' +
          '<span style="color:var(--ib-good)">' + esc(fmtA(d.to)) + '</span></div>').join('');
        body = lines + (diffs.length > 10 ? '<div class="ib-note">+' + (diffs.length - 10) + ' more field(s)</div>' : '') +
          (!diffs.length ? '<div class="ib-note">section rewritten (no field-level difference detected)</div>' : '');
      }
      return '<div class="ib-dditem"><div class="row1"><span class="nm">' + esc(label(r.section)) + '</span>' +
        '<span class="ib-chip">' + who + '</span><span class="ib-note">' + when + '</span></div>' + body + '</div>';
    }).join('') + '</div></div>';
}

boot();
