<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IR Builder &mdash; Performance Property</title>
<link rel="icon" href="../assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<!-- OS chrome: mode/period/shade + legacy data-theme bridge -->
<script src="../shared/os-chrome.js?v=f6ea2748"></script>
<link rel="stylesheet" href="../shared/os-theme.css?v=c82b0c67"/>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   IR BUILDER (Phase A, 2026-08-19) — the acquisition team's Property Master
   File, hub-native. Replaces the 30-tab per-property Google Sheet: the DD
   team fills a guided stepper, the BA team checks everything in ONE Review
   window (inline-editable, per-section "checked" marks). Data = ir_files +
   the ported rulebook/rubric/config (migration 104, seeded from the sample
   workbook). Suburb stats auto-fill from suburb_scores — the manual
   "enter LT CAGR from Looker" step is dead.
   Phase A ships: file list · Review window (all sections) · Setup + DD
   editors · computed cashflows (P&I / IO / Normalised — the cloned-template
   drift bug fixed in code). Inspection/Grading/Pricing editors: Phase B/C.
   Write access = dev/admin or a tool_roles 'ir-builder' grant.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --ib-ink:#F4F6F8; --ib-ink2:#C6CCD6; --ib-mut:var(--mut,#8B93A1);
  --ib-surface:rgba(255,255,255,0.045); --ib-surface-2:rgba(255,255,255,0.025);
  --ib-solid:#1A2130;
  --ib-border:rgba(255,255,255,0.10); --ib-border-2:rgba(255,255,255,0.18);
  --ib-teal:#00A0B4; --ib-navy:#171B24;
  --ib-good:#71B357; --ib-warn:#FFA91F; --ib-bad:#E72347; --ib-blue:#54A6DE; --ib-euc:#3E7967;
  --ib-teal-soft:rgba(0,160,180,0.14); --ib-good-soft:rgba(113,179,87,0.16);
  --ib-warn-soft:rgba(255,169,31,0.14); --ib-bad-soft:rgba(231,35,71,0.12); --ib-blue-soft:rgba(84,166,222,0.14);
  --ib-field-bg:#141A28; --ib-field-ink:#F4F6F8; --ib-field-border:rgba(255,255,255,0.20);
}
[data-theme="light"]{
  --ib-ink:#171B24; --ib-ink2:#3F4650;
  --ib-surface:#ffffff; --ib-surface-2:#F7F9FA; --ib-solid:#ffffff;
  --ib-border:rgba(23,27,36,0.12); --ib-border-2:rgba(23,27,36,0.22);
  --ib-teal-soft:#E8F7FA; --ib-good-soft:#F0F7ED; --ib-warn-soft:#FFF6E8; --ib-bad-soft:#FDECEF; --ib-blue-soft:#EDF5FC;
  --ib-field-bg:#ffffff; --ib-field-ink:#171B24; --ib-field-border:rgba(23,27,36,0.24);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat',system-ui,sans-serif;color:var(--ib-ink);-webkit-font-smoothing:antialiased}
.ib-wrap{max-width:1340px;margin:0 auto;padding:24px 28px 84px}
.ib-eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ib-teal)}
h1{font-size:28px;font-weight:800;letter-spacing:-0.02em;margin:4px 0 2px}
.ib-sub{font-size:12.5px;color:var(--ib-mut);margin:0;line-height:1.5;max-width:820px}
.ib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.ib-btn{border-radius:10px;padding:9px 16px;font:800 12.5px 'Montserrat',sans-serif;cursor:pointer;
  border:1px solid var(--ib-border-2);background:transparent;color:var(--ib-ink)}
.ib-btn.pri{background:var(--ib-teal);border-color:var(--ib-teal);color:#fff}
.ib-btn.sm{padding:6px 11px;font-size:11px}
.ib-btn:hover{filter:brightness(1.12)}
.ib-btn:disabled{opacity:.45;cursor:default}

/* home list */
.ib-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ib-fcard{text-align:left;border:1px solid var(--ib-border);background:var(--ib-surface);border-radius:14px;
  padding:14px 16px;cursor:pointer;color:var(--ib-ink);font-family:inherit;transition:border-color .15s,transform .15s}
.ib-fcard:hover{border-color:var(--ib-teal);transform:translateY(-2px)}
.ib-fcard .a{font-size:15px;font-weight:800;letter-spacing:-0.01em}
.ib-fcard .m{font-size:11.5px;font-weight:700;color:var(--ib-ink2);margin-top:3px}
.ib-fcard .r{font-size:10.5px;font-weight:600;color:var(--ib-mut);margin-top:7px}
.ib-chip{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  border-radius:6px;padding:2.5px 7px;line-height:1.5;background:var(--ib-teal-soft);color:var(--ib-teal);margin-left:6px}
.ib-chip.warn{background:var(--ib-warn-soft);color:var(--ib-warn)}
.ib-chip.good{background:var(--ib-good-soft);color:var(--ib-good)}
.ib-empty{padding:40px 10px;text-align:center;font-size:13px;font-weight:600;color:var(--ib-mut)}
.ib-ghead{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ib-teal);
  margin:18px 2px 9px;display:flex;align-items:center;gap:10px;grid-column:1/-1}
.ib-ghead::after{content:"";flex:1;height:1px;background:var(--ib-border)}
.ib-ghead .n{color:var(--ib-mut);letter-spacing:0;font-weight:700}

/* file header + steps */
.ib-fhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:2px 0 14px}
.ib-fhead h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-0.015em}
.ib-fhead .sub{font-size:12px;font-weight:700;color:var(--ib-mut)}
.ib-steps{display:flex;gap:6px;flex-wrap:wrap;background:var(--ib-surface-2);border:1px solid var(--ib-border);
  border-radius:12px;padding:5px;margin-bottom:16px}
.ib-step{border:0;background:transparent;color:var(--ib-mut);font:700 12px 'Montserrat',sans-serif;
  padding:8px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ib-step.on{background:var(--ib-teal);color:#fff}
.ib-step .d{width:7px;height:7px;border-radius:50%;background:var(--ib-mut);opacity:.6}
.ib-step .d.done{background:var(--ib-good);opacity:1}

/* forms */
.ib-card{border:1px solid var(--ib-border);background:var(--ib-surface);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.ib-card h3{margin:0 0 12px;font-size:14px;font-weight:800;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px}
.ib-card h3 .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.ib-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 12px}
.ib-form label,.ib-lb{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ib-mut)}
.ib-form input,.ib-form select,.ib-form textarea,.ib-inp{
  border-radius:9px;border:1px solid var(--ib-field-border);background:var(--ib-field-bg);
  color:var(--ib-field-ink);padding:9px 11px;font:600 12.5px 'Montserrat',sans-serif;outline:none}
.ib-form textarea{min-height:70px;resize:vertical;line-height:1.5}
.ib-form :focus,.ib-inp:focus{border-color:var(--ib-teal)}
.ib-note{font-size:11px;font-weight:600;color:var(--ib-mut);line-height:1.5}
.ib-savebar{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

/* suburb intel */
.ib-intel{border:1px solid rgba(0,160,180,.4);background:linear-gradient(140deg,var(--ib-teal-soft),transparent);border-radius:12px;padding:12px 14px;margin-top:12px}
.ib-intel .t{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ib-teal);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.ib-intel .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.ib-intel .cellk{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ib-mut)}
.ib-intel .cellv{font-size:14px;font-weight:800;margin-top:1px}

/* DD list */
.ib-dd{display:flex;flex-direction:column;gap:9px}
.ib-dditem{border:1px solid var(--ib-border);background:var(--ib-surface-2);border-radius:11px;padding:11px 13px}
.ib-dditem .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ib-dditem .nm{font-size:12.5px;font-weight:800;flex:1;min-width:200px}
.ib-dditem select{border-radius:8px;border:1px solid var(--ib-field-border);background:var(--ib-field-bg);
  color:var(--ib-field-ink);padding:6px 9px;font:700 11.5px 'Montserrat',sans-serif}
.ib-dditem select.s-Approved{color:var(--ib-good);border-color:rgba(113,179,87,.5)}
.ib-dditem select.s-Review{color:var(--ib-warn);border-color:rgba(255,169,31,.5)}
.ib-dditem select.s-Failed{color:var(--ib-bad);border-color:rgba(231,35,71,.5)}
.ib-dditem .src{font-size:10.5px;font-weight:700;color:var(--ib-blue);text-decoration:none}
.ib-dditem .src:hover{text-decoration:underline}
.ib-dditem textarea{width:100%;margin-top:8px;border-radius:8px;border:1px solid var(--ib-field-border);
  background:var(--ib-field-bg);color:var(--ib-field-ink);padding:7px 10px;font:600 11.5px 'Montserrat',sans-serif;min-height:34px;resize:vertical}
.ib-crit{margin-top:7px;font-size:10.5px;color:var(--ib-mut);line-height:1.5;display:none}
.ib-dditem.open .ib-crit{display:block}
.ib-crit b{font-weight:800}
.ib-crit .g{color:var(--ib-good)} .ib-crit .w{color:var(--ib-warn)} .ib-crit .b{color:var(--ib-bad)}
.ib-ddres{font-size:12px;font-weight:800;padding:8px 12px;border-radius:10px;display:inline-block;margin-bottom:12px}
.ib-ddres.Approved{background:var(--ib-good-soft);color:var(--ib-good)}
.ib-ddres.Review{background:var(--ib-warn-soft);color:var(--ib-warn)}
.ib-ddres.Failed{background:var(--ib-bad-soft);color:var(--ib-bad)}

/* review window */
.ib-rev-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ib-rev-prog{font-size:12px;font-weight:800;color:var(--ib-mut)}
.ib-rv{cursor:pointer;border-bottom:1px dashed var(--ib-border-2);padding:0 1px}
.ib-rv:hover{color:var(--ib-teal);border-color:var(--ib-teal)}
.ib-rv.num{font-variant-numeric:tabular-nums}
.ib-kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:7px 18px}
.ib-kv .pair{display:flex;gap:8px;align-items:baseline;font-size:12px;min-width:0}
.ib-kv .k{flex:none;max-width:46%;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ib-mut)}
.ib-kv .v{font-weight:700;overflow-wrap:anywhere}
.ib-tblwrap{overflow-x:auto}
.ib-tbl{border-collapse:collapse;width:100%;font-size:11.5px}
.ib-tbl th{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ib-mut);
  text-align:left;padding:5px 8px;border-bottom:1px solid var(--ib-border-2)}
.ib-tbl td{padding:6px 8px;border-bottom:1px solid var(--ib-border);font-weight:600;vertical-align:top}
.ib-checkbtn{border-radius:9px;padding:7px 12px;font:800 11px 'Montserrat',sans-serif;cursor:pointer;
  border:1px solid rgba(113,179,87,.55);background:var(--ib-good-soft);color:var(--ib-good)}
[data-theme="light"] .ib-checkbtn{color:#4E8A38}
.ib-checkbtn.off{border-color:var(--ib-border-2);background:transparent;color:var(--ib-mut)}
.ib-cashsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.ib-cash{border:1px solid var(--ib-border);border-radius:11px;padding:11px 13px;background:var(--ib-surface-2)}
.ib-cash .t{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ib-teal);margin-bottom:7px}
.ib-cash .row{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;padding:2px 0}
.ib-cash .row b{font-variant-numeric:tabular-nums}
.ib-cash .row.neg b{color:var(--ib-bad)} .ib-cash .row.pos b{color:var(--ib-good)}

/* rooms (inspection) */
.ib-room{border:1px solid var(--ib-border);background:var(--ib-surface-2);border-radius:11px;margin-bottom:9px;overflow:hidden}
.ib-room-h{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;font-size:12.5px;font-weight:800}
.ib-room-h .cnt{margin-left:auto;font-size:10px;font-weight:700;color:var(--ib-mut)}
.ib-room-b{display:none;padding:2px 13px 11px}
.ib-room.open .ib-room-b{display:block}
.ib-feat{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--ib-border)}
.ib-feat .fn{flex:1 1 150px;font-size:11.5px;font-weight:700;min-width:130px}
.ib-tgl{border:1px solid var(--ib-field-border);background:var(--ib-field-bg);color:var(--ib-mut);
  font:800 9.5px 'Montserrat',sans-serif;letter-spacing:.05em;text-transform:uppercase;border-radius:7px;padding:5px 9px;cursor:pointer}
.ib-tgl.on-p{background:var(--ib-good-soft);border-color:rgba(113,179,87,.55);color:var(--ib-good)}
.ib-tgl.on-r{background:var(--ib-warn-soft);border-color:rgba(255,169,31,.55);color:var(--ib-warn)}
.ib-tgl.on-m{background:var(--ib-bad-soft);border-color:rgba(231,35,71,.55);color:var(--ib-bad)}
.ib-feat input.fcost{width:84px;border-radius:7px;border:1px solid var(--ib-field-border);background:var(--ib-field-bg);
  color:var(--ib-field-ink);padding:5px 8px;font:600 11px 'Montserrat',sans-serif}
.ib-feat input.fnote{flex:2 1 160px;border-radius:7px;border:1px solid var(--ib-field-border);background:var(--ib-field-bg);
  color:var(--ib-field-ink);padding:5px 8px;font:600 11px 'Montserrat',sans-serif}

/* editable tables (pricing) */
.ib-etbl{border-collapse:collapse;width:100%;font-size:11.5px}
.ib-etbl th{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ib-mut);text-align:left;padding:4px 6px}
.ib-etbl td{padding:3px 4px;vertical-align:middle}
.ib-etbl input,.ib-etbl select{width:100%;min-width:56px;border-radius:7px;border:1px solid var(--ib-field-border);
  background:var(--ib-field-bg);color:var(--ib-field-ink);padding:6px 8px;font:600 11px 'Montserrat',sans-serif}
.ib-etbl .rm{border:0;background:transparent;color:var(--ib-bad);cursor:pointer;font-size:14px;padding:2px 6px}
.ib-derived{font-size:11px;font-weight:800;color:var(--ib-teal)}

/* evidence chips */
.ib-files{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.ib-file{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;border:1px solid var(--ib-border-2);
  border-radius:7px;padding:3px 7px;background:var(--ib-surface);cursor:pointer;color:var(--ib-ink2)}
.ib-file:hover{border-color:var(--ib-teal);color:var(--ib-ink)}
.ib-file .x{color:var(--ib-bad);cursor:pointer;font-weight:800}
.ib-attach{border:1px dashed var(--ib-border-2);background:transparent;color:var(--ib-mut);
  font:700 10px 'Montserrat',sans-serif;border-radius:7px;padding:4px 9px;cursor:pointer}
.ib-attach:hover{border-color:var(--ib-teal);color:var(--ib-teal)}

/* compliance */
.ib-comp-role{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ib-teal);margin:12px 0 5px}
.ib-comp-item{display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:1px dashed var(--ib-border);font-size:12px;font-weight:700}
.ib-comp-item .w{color:var(--ib-mut);font-size:10px;font-weight:600;margin-left:auto}
.ib-cbx{width:17px;height:17px;flex:none;border-radius:5px;border:1.5px solid var(--ib-field-border);background:var(--ib-field-bg);
  cursor:pointer;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900}
.ib-cbx.on{background:var(--ib-good);border-color:var(--ib-good)}
.ib-cbx.auto{cursor:default}
.ib-cbx.auto.off{background:var(--ib-surface-2)}

/* report preview + print */
.ib-prevwrap{display:flex;flex-wrap:wrap;gap:14px}
.ib-prev{width:315px;height:445px;overflow:hidden;border:1px solid var(--ib-border-2);border-radius:8px;background:#fff;
  box-shadow:0 10px 26px -14px #000;position:relative}
.ib-prev .pg{transform:scale(0.397);transform-origin:top left}
.ib-prev .lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(23,27,36,.85);color:#fff;
  font:700 9.5px 'Montserrat',sans-serif;padding:3px 8px;text-align:center}
#ibPrint{display:none}
.pg{width:794px;min-height:1122px;background:#fff;color:#2a3038;font-family:'Montserrat',system-ui,sans-serif;
  padding:44px 48px;position:relative;box-sizing:border-box}
.pg .band{background:#171B24;color:#fff;font-size:15px;font-weight:700;padding:9px 16px;margin:0 -48px 18px;display:flex;justify-content:space-between}
.pg .band .r{color:#9fe8f0}
.pg h2.pt{font-size:22px;font-weight:800;color:#171B24;margin:0 0 12px}
.pg .tealband{background:#37BCC8;color:#fff;text-align:center;font-size:20px;font-weight:800;padding:12px;margin:14px -12px}
.pg .gband{background:#DFF0CF;color:#2F5F50;font-size:16px;font-weight:700;padding:8px 14px;margin:6px 0}
.pg table{border-collapse:collapse;width:100%;font-size:11px}
.pg th{text-align:left;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:#666;padding:5px 8px;border-bottom:1.5px solid #ccc}
.pg td{padding:5px 8px;border-bottom:1px solid #eee;vertical-align:top}
.pg .chip{display:inline-block;font-size:9.5px;font-weight:800;border-radius:4px;padding:2px 8px;color:#fff}
.pg .c-Approved,.pg .c-Excellent{background:#4caf50}
.pg .c-Review,.pg .c-Average{background:#5f6771}
.pg .c-Failed{background:#E72347}
.pg .c-AboveAverage{background:#54c0de}
.pg .c-BelowAverage,.pg .c-Poor{background:#e08a3c}
.pg .c-neutral{background:#5f6771}
.pg .foot{position:absolute;bottom:18px;left:48px;right:48px;font-size:8.5px;color:#9aa;display:flex;justify-content:space-between}
.pg p{font-size:10.5px;line-height:1.55;margin:0 0 8px}
.pg .sec{font-size:12px;font-weight:800;color:#171B24;background:#eef1f4;padding:6px 10px;margin:12px 0 6px}
.pg .kvrow{display:flex;justify-content:space-between;font-size:11px;padding:4px 2px;border-bottom:1px solid #eee}
.pg .kvrow b{font-variant-numeric:tabular-nums}
.pg .cash3{display:flex;gap:14px}
.pg .cash3>div{flex:1;border:1px solid #ddd;border-radius:8px;padding:10px 12px}
.pg .cash3 .t{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#37BCC8;margin-bottom:6px}
.pg img.logo{height:34px}
@media print{
  body>*{display:none !important}
  body>#ibPrint{display:block !important}
  #ibPrint .pg{page-break-after:always;margin:0;box-shadow:none}
  @page{size:A4;margin:0}
}

.ib-prov{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  border-radius:5px;padding:1.5px 5px;margin-left:6px;vertical-align:1px}
.ib-prov.auto{background:var(--ib-teal-soft);color:var(--ib-teal)}
.ib-prov.edited{background:var(--ib-warn-soft);color:var(--ib-warn)}
[data-theme="light"] .ib-prov.edited{color:#B36F00}
/* property photos */
.ib-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.ib-photo{position:relative;border:1px solid var(--ib-border-2);border-radius:11px;overflow:hidden;background:var(--ib-surface-2);aspect-ratio:4/3}
.ib-photo img{width:100%;height:100%;object-fit:cover;display:block}
.ib-photo .cv{position:absolute;top:7px;left:7px;font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:var(--ib-teal);color:#fff;border-radius:5px;padding:2px 7px}
.ib-photo .acts{position:absolute;inset:auto 0 0 0;display:flex;gap:5px;justify-content:flex-end;padding:6px;
  background:linear-gradient(transparent,rgba(10,14,22,.75))}
.ib-photo .acts button{border:0;border-radius:6px;font:800 9px 'Montserrat',sans-serif;padding:4px 8px;cursor:pointer;
  background:rgba(255,255,255,.92);color:#171B24}
.ib-photo .acts button.del{background:var(--ib-bad);color:#fff}

/* publish modal */
.ibp-ov{display:none;position:fixed;inset:0;z-index:9300;background:var(--shade-bg,rgba(10,14,22,0.72));
  backdrop-filter:blur(6px);align-items:flex-start;justify-content:center;overflow:auto}
.ibp-ov.show{display:flex}
.ibp-dlg{width:min(620px,94vw);margin:8vh 0 6vh;background:var(--ib-solid);border:1px solid var(--ib-border-2);
  border-radius:16px;padding:20px 22px 18px;box-shadow:0 22px 60px rgba(0,0,0,0.45)}
.ibp-dlg h2{margin:0 0 4px;font-size:18px;font-weight:800}
.ibp-dlg .ib-form{margin-top:12px}
.ibp-stat{font-size:11.5px;font-weight:700;color:var(--ib-mut);margin-top:10px;min-height:16px}

  background:var(--ib-navy);color:#F4F6F8;border:1px solid rgba(255,255,255,0.18);border-radius:11px;
  padding:10px 18px;font:700 12.5px 'Montserrat',sans-serif;z-index:9400;pointer-events:none;transition:opacity .2s,transform .2s}

</style>
</head>
<body>

<div class="ib-wrap">
  <div class="ib-head">
    <div>
      <div class="ib-eyebrow">Acquisitions · pilot</div>
      <h1>IR Builder</h1>
      <p class="ib-sub">The Property Master File, hub-native — the DD team fills the steps, the BA team checks
        everything in one Review window. Suburb numbers fill themselves; the cashflows compute in code.</p>
    </div>
    <button class="ib-btn pri" id="ibNewBtn" type="button" style="display:none">+ New property file</button>
  </div>
  <div id="ibHome"><div class="ib-empty">Loading&hellip;</div></div>
  <div id="ibFile" style="display:none"></div>
</div>

<div class="ib-toast" id="ibToast"></div>
<div id="ibPrint" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="../shared/supabase-client.js?v=b4bd183c"></script>
<script src="../shared/tool-registry.js?v=206345a9"></script>
<script src="../shared/desktop-pins.js?v=e2416017"></script>
<script src="../shared/auth.js?v=7dce203e"></script>
<script src="../shared/auth-gate.js?v=003cdc01"></script>
<script src="../shared/pp-telemetry.js?v=a1e39d4f"></script>
<script src="../shared/fit-screen.js?v=5e41a716"></script>
<script>
'use strict';
PP_OS.initChrome({ name: 'IR Builder', section: 'vault', backHref: '../' });

/* ── helpers ── */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = v => (v == null || !isFinite(v)) ? '—' : (v < 0 ? '-$' : '$') + Math.abs(Math.round(v)).toLocaleString();
const pct = (v, dp) => (v == null || !isFinite(v)) ? '—' : (v * 100).toFixed(dp == null ? 2 : dp) + '%';
const label = k => String(k).replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/[_-]+/g, ' ')
  .replace(/\b\w/g, c => c.toUpperCase()).replace(/\bDd\b/, 'DD').replace(/\bLga\b/, 'LGA')
  .replace(/\bLt\b/, 'LT').replace(/\bLvr\b/, 'LVR').replace(/\bPm\b/, 'PM').replace(/\bCrm\b/, 'CRM').replace(/\bUrl\b/, 'URL');
function toast(m) { const t = $('#ibToast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
/* all stored timestamps are UTC — always DISPLAY them in AU time */
const auTs = ts => { if (!ts) return '—'; try { return new Intl.DateTimeFormat('en-AU',
  { timeZone: 'Australia/Melbourne', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(ts)); } catch (e) { return String(ts).slice(0, 16); } };
const auDay = ts => { if (!ts) return '—'; try { return new Intl.DateTimeFormat('en-AU',
  { timeZone: 'Australia/Melbourne', day: '2-digit', month: 'short' }).format(new Date(ts)); } catch (e) { return String(ts).slice(5, 10); } };

const SECTIONS = ['setup', 'suburb_stats', 'dd', 'inspection', 'grading', 'pricing', 'cashflow'];
const STEPS = [
  { id: 'review',     t: 'Review' },
  { id: 'setup',      t: 'Setup' },
  { id: 'dd',         t: 'Preliminary DD' },
  { id: 'inspection', t: 'Inspection' },
  { id: 'grading',    t: 'Grading' },
  { id: 'pricing',    t: 'Pricing' },
  { id: 'cashflow',   t: 'Cashflow' },
  { id: 'compliance', t: 'Compliance' },
  { id: 'report',     t: 'Report' },
  { id: 'audit',      t: 'Audit' },
];
const DD_RATINGS = ['Approved', 'Review', 'Failed'];
const GRADE5 = ['Poor', 'Below Average', 'Average', 'Above Average', 'Excellent'];
const COMPARABILITY = ['Inferior', 'Slightly Inferior', 'Comparable', 'Slightly Superior', 'Superior'];
/* room -> default feature list, straight from the workbook's inspection tab */
const ROOMS_DEF = {
  'Kitchen': ['Heating/Cooling/Fans', 'Dishwasher', 'Oven', 'Cooktop', 'Rangehood', 'Windows', 'Window Furnishings', 'Cabinetry', 'Benchtop', 'Fridge Space'],
  'Bathroom': ['Heating/Cooling/Fans', 'Shower', 'Bath', 'Vanity', 'Toilet', 'Windows', 'Cabinetry', 'Tiling'],
  'Ensuite': ['Heating/Cooling/Fans', 'Shower', 'Bath', 'Vanity', 'Toilet', 'Windows', 'Cabinetry', 'Tiling'],
  'Bedroom 1': ['Heating/Cooling/Fans', 'Windows', 'Window Furnishings', 'Cabinetry'],
  'Bedroom 2': ['Heating/Cooling/Fans', 'Windows', 'Window Furnishings', 'Cabinetry'],
  'Bedroom 3': ['Heating/Cooling/Fans', 'Windows', 'Window Furnishings', 'Cabinetry'],
  'Bedroom 4': ['Heating/Cooling/Fans', 'Windows', 'Window Furnishings', 'Cabinetry'],
  'Living 1': ['Heating/Cooling/Fans', 'Windows', 'Window Furnishings', 'Cabinetry'],
  'Living 2': ['Heating/Cooling/Fans', 'Windows', 'Window Furnishings', 'Cabinetry'],
  'Laundry': ['Heating/Cooling/Fans', 'Windows', 'Window Furnishings', 'Cabinetry', 'Trough'],
  'Garage/Carport': ['Roller/Panel Door', 'Windows', 'Window Furnishings', 'Cabinetry'],
  'General Interior': ['Paint Condition', 'Floor Levels', 'Floor Coverings', 'Switchboard', 'Safety Switches', 'Smoke Alarms', 'Window Locks', 'Ext. Door Deadlocks', 'Security Alarm'],
};
/* the workbook's manual compliance checklist, grouped by role */
const COMP_MANUAL = [
  ['Advisor', [['adv_initial', 'Initial Consultation Notes (CRM)']]],
  ['Consultant', [['con_handover', 'Handover & Consultant Call Notes (CRM)'], ['con_photos', 'Inspection Photos on file'],
    ['con_videos', 'Inspection Videos on file'], ['con_draft_ir', 'Draft Investment Report'],
    ['con_prepurchase', 'Pre-purchase Call Notes (CRM)'], ['con_final_ir', 'Final Investment Report']]],
  ['DD Support', [['dd_planning', 'Planning Docs on file'], ['dd_flood', 'Flood Docs on file'],
    ['dd_dbyd', 'DBYD Docs on file'], ['dd_master', 'Property file created from template']]],
  ['Assistant', [['as_price', 'PPA Price Analysis complete']]],
  ['Sales Admin', [['sa_bp', 'Building & Pest Inspection Report'], ['sa_strata', 'Strata / Owners Corp Report'],
    ['sa_contract_review', 'Contract Review'], ['sa_authority', 'Client Authority Signed'],
    ['sa_contract', 'Fully Signed Contract on file'], ['sa_rent_appraisal', 'Rent Appraisal'],
    ['sa_deposit', 'Deposit Trust Account Receipt']]],
];

let FILES = [], CUR = null, CFG = {}, RULES = [], RUBRIC = [], CAN = false, CANW = false, MY_EMAIL = '', view = 'review';
/* CAN = has the ir-builder role · CANW = CAN and the file is still ACTIVE
   (final/archived files are read-only until flipped back — the flip is audited) */
let RATES = { current: 0.065, normalised: 0.0494 };   /* refreshed from rdp_runway_config at boot */

/* ── boot ── */
async function boot() {
  _ibResolveDev();   /* async, cheap; the delete gate re-checks per render */
  let g = 0; while (!window.sb && g++ < 80) await new Promise(r => setTimeout(r, 100));
  if (!window.sb) return;
  MY_EMAIL = (typeof getCurrentUserEmail === 'function' && getCurrentUserEmail()) || '';
  /* Van's call: everyone who can VIEW the tool can EDIT it. auth-gate only
     lets group-allowed users (and dev/admin) reach this page, and RLS
     (ir_can_write, migration 107) checks the same group tick server-side —
     so on-page internal users are editors. Externals stay view-only. */
  CAN = !(typeof isViewOnly === 'function' && isViewOnly());
  $('#ibNewBtn').style.display = CAN ? '' : 'none';
  $('#ibNewBtn').onclick = newFile;
  const [cfg, files] = await Promise.all([
    sb.from('ir_config').select('key,payload'),
    sb.from('ir_files').select('id,address,suburb,state,market_label,market_slug,status,roles,updated_at,compliance,setup').order('updated_at', { ascending: false }),
  ]);
  if (cfg.error || files.error) {
    $('#ibHome').innerHTML = '<div class="ib-empty">' + (/does not exist|schema cache/i.test((cfg.error || files.error).message)
      ? 'Not set up yet — apply migration 104, then run scratch/seed-ir-builder.mjs --write --sample.'
      : 'Could not load the files — ask Van (access follows the tool\'s group tick).') + '</div>';
    return;
  }
  (cfg.data || []).forEach(r => { CFG[r.key] = r.payload; });
  FILES = files.data || [];
  try {
    const { data: rc } = await sb.from('rdp_runway_config').select('value').eq('key', 'rates').maybeSingle();
    if (rc && rc.value) {
      if (rc.value.current && rc.value.current.rate) RATES.current = rc.value.current.rate;
      if (rc.value.forecast && rc.value.forecast.rate) RATES.normalised = rc.value.forecast.rate;
    }
  } catch (e) {}
  const id = new URLSearchParams(location.search).get('id');
  renderHome();
  if (id) { const f = FILES.find(x => x.id === id); if (f) openFile(id); }
}

let SHOW_ARCH = false;
function renderHome() {
  $('#ibFile').style.display = 'none'; $('#ibHome').style.display = '';
  if (!FILES.length) {
    /* an empty list with edit rights = genuinely no files; without rights it
       means RLS is still on the old rule — apply migration 107 */
    $('#ibHome').innerHTML = '<div class="ib-empty">' + (CAN
      ? 'No property files yet — create the first one. (If files should exist, migration 107 may not be applied yet.)'
      : 'View-only account.') + '</div>';
    return;
  }
  const archived = FILES.filter(f => f.status === 'archived');
  const shown = SHOW_ARCH ? FILES : FILES.filter(f => f.status !== 'archived');
  const fcard = f => {
    const rv = (f.compliance && f.compliance.review) || {};
    const checked = SECTIONS.filter(s => rv[s]).length;
    return '<button class="ib-fcard" type="button" data-id="' + f.id + '">' +
      '<div class="a">' + esc(f.address + (f.suburb ? ', ' + f.suburb : '')) + '</div>' +
      '<div class="m">' + esc(f.market_label || '') + (f.state ? ' · ' + esc(f.state) : '') +
      '<span class="ib-chip' + (f.status === 'final' ? ' good' : f.status === 'archived' ? ' warn' : '') + '">' + f.status + '</span>' +
      (checked ? '<span class="ib-chip good">checked ' + checked + '/' + SECTIONS.length + '</span>' : '') + '</div>' +
      '<div class="r">' + esc(((f.roles || {}).consultant ? 'Consultant ' + f.roles.consultant : '')) +
      ' · updated ' + auTs(f.updated_at) + '</div></button>';
  };
  /* grouped by market; the explicit Commercial flag (or a commercial property
     type) pools under "Commercial" */
  const groupOf = f => ((f.setup || {}).commercial === true ||
    /block|industrial|medical|office|retail|commercial/i.test(((f.setup || {}).propertyType) || ''))
    ? 'Commercial' : (f.market_label || 'No market');
  const groups = new Map();
  for (const f of shown) { const g = groupOf(f); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(f); }
  const tail = ['Commercial', 'No market'];
  const keys = [...groups.keys()].sort((a, b) => {
    const ta = tail.indexOf(a), tb = tail.indexOf(b);
    if (ta !== tb) return (ta === -1 ? -1 : 1) - (tb === -1 ? -1 : 1) || ta - tb;
    return a.localeCompare(b);
  });
  $('#ibHome').innerHTML = '<div class="ib-files">' + keys.map(k =>
    '<div class="ib-ghead">' + esc(k) + ' <span class="n">' + groups.get(k).length + '</span></div>' +
    groups.get(k).map(fcard).join('')).join('') + '</div>' +
  (archived.length ? '<div class="ib-note" style="margin-top:12px"><button class="ib-btn sm" id="ibArchTgl" type="button">' +
    (SHOW_ARCH ? 'Hide' : 'Show') + ' archived (' + archived.length + ')</button></div>' : '');
  document.querySelectorAll('.ib-fcard').forEach(c => c.onclick = () => openFile(c.dataset.id));
  const at = document.getElementById('ibArchTgl');
  if (at) at.onclick = () => { SHOW_ARCH = !SHOW_ARCH; renderHome(); };
  _ibRenderDeletions();
}

/* Deletion history — the audit trigger's section='deleted' rows (who + when),
   appended under the file list so removals are never silent (Van 2026-08-23). */
async function _ibRenderDeletions() {
  try {
    const { data } = await sb.from('ir_files_audit')
      .select('address, changed_email, changed_at')
      .eq('section', 'deleted')
      .order('changed_at', { ascending: false })
      .limit(30);
    if (!data || !data.length) return;
    const host = document.createElement('div');
    host.className = 'ib-note';
    host.style.marginTop = '18px';
    host.innerHTML =
      '<details><summary style="cursor:pointer;font-weight:800">Deletion history (' + data.length + ')</summary>' +
      '<div style="margin-top:8px;display:grid;gap:4px">' +
      data.map(r =>
        '<div>' + esc(r.address || '(unknown address)') + ' — deleted by ' +
        esc(r.changed_email || 'unknown') + ' · ' + auTs(r.changed_at) + '</div>').join('') +
      '</div></details>';
    $('#ibHome').appendChild(host);
  } catch (e) { /* history is best-effort */ }
}

async function newFile() {
  const address = prompt('Street address (e.g. 12 Example Street):'); if (!address) return;
  const suburb = prompt('Suburb:') || null;
  const regions = ((CFG.regions || {}).regions) || [];
  const market = prompt('Market (' + regions.slice(0, 6).map(r => r.label).join(', ') + '…):') || '';
  const reg = regions.find(r => r.label.toLowerCase() === market.toLowerCase());
  const { data, error } = await sb.from('ir_files').insert({
    address, suburb, market_label: reg ? reg.label : (market || null),
    market_slug: reg ? reg.slug : null, state: reg ? reg.state : null,
  }).select('id').single();
  if (error) { toast('Create failed: ' + error.message); return; }
  const { data: rows } = await sb.from('ir_files').select('id,address,suburb,state,market_label,market_slug,status,roles,updated_at,compliance,setup').order('updated_at', { ascending: false });
  FILES = rows || FILES; renderHome(); openFile(data.id);
}

/* ── file view ── */
async function openFile(id) {
  const { data, error } = await sb.from('ir_files').select('*').eq('id', id).maybeSingle();
  if (error || !data) { toast('Could not open file'); return; }
  CUR = data;
  history.replaceState(null, '', location.pathname + '?id=' + id);
  RULES = []; RUBRIC = [];
  if (CUR.market_label) {
    const { data: r } = await sb.from('ir_dd_rules').select('item,variable,value').eq('region', CUR.market_label);
    RULES = r || [];
  }
  const { data: rb } = await sb.from('ir_grading_rubric').select('item,grade,comment,sort').order('sort');
  RUBRIC = rb || [];
  view = 'review';
  renderFile();
}

function stepDone(s) {
  if (s === 'review') return false;
  if (s === 'audit') return false;
  if (s === 'report') return !!(CUR.compliance || {}).reportAt;
  if (s === 'compliance') return Object.keys(((CUR.compliance || {}).items) || {}).length > 0;
  const v = CUR[s === 'setup' ? 'setup' : s];
  return v && Object.keys(v).length > 0 && (s !== 'dd' || Object.keys((v.items || {})).length > 0);
}

function renderFile() {
  $('#ibHome').style.display = 'none'; $('#ibFile').style.display = '';
  CANW = CAN && CUR.status === 'active';
  const rv = (CUR.compliance && CUR.compliance.review) || {};
  const statusCtl = CAN
    ? '<select id="ibStatus" class="ib-inp" style="padding:5px 9px;font-size:11px;font-weight:800">' +
      ['active', 'final', 'archived'].map(s => '<option' + (s === CUR.status ? ' selected' : '') + '>' + s + '</option>').join('') + '</select>'
    : '<span class="ib-chip' + (CUR.status === 'final' ? ' good' : CUR.status === 'archived' ? ' warn' : '') + '">' + CUR.status + '</span>';
  $('#ibFile').innerHTML =
    '<div class="ib-fhead"><button class="ib-btn sm" id="ibBack" type="button">&larr; Files</button>' +
    '<h2>' + esc(CUR.address + (CUR.suburb ? ', ' + CUR.suburb : '')) + '</h2>' +
    '<span class="sub">' + esc(CUR.market_label || 'market not set') + (CUR.state ? ' · ' + esc(CUR.state) : '') + '</span>' +
    statusCtl +
    (!CANW && CAN ? '<span class="ib-note">read-only while ' + CUR.status + '</span>' : '') +
    (CAN ? '<button class="ib-btn pri sm" id="ibPublish" type="button" style="margin-left:auto">' +
      ((CUR.compliance || {}).published ? 'Re-publish to library' : 'Publish as example IR') + '</button>' : '') +
    /* Delete: drafts — anyone who can write here; PUBLISHED files — Vandolf
       only (Van 2026-08-23). RLS is the real gate (mig 117); this only hides
       the button from people the database would refuse anyway. */
    (CAN && (!(CUR.compliance || {}).published || _ibIsDev())
      ? '<button class="ib-btn sm" id="ibDelete" type="button" style="color:var(--ib-bad);border-color:var(--ib-bad)">Delete</button>' : '') +
    '</div>' +
    '<div class="ib-steps">' + STEPS.map(s =>
      '<button class="ib-step' + (view === s.id ? ' on' : '') + '" type="button" data-step="' + s.id + '">' +
      (s.id === 'review' ? '' : '<span class="d' + (stepDone(s.id) ? ' done' : '') + '"></span>') + s.t +
      (s.id === 'review' ? ' (' + SECTIONS.filter(x => rv[x]).length + '/' + SECTIONS.length + ')' : '') +
      '</button>').join('') + '</div>' +
    '<div id="ibStepBody"></div>';
  $('#ibBack').onclick = () => { CUR = null; history.replaceState(null, '', location.pathname); refreshList(); };
  const delBtn = $('#ibDelete');
  if (delBtn) delBtn.onclick = openDeleteIr;
  const stSel = $('#ibStatus');
  if (stSel) stSel.onchange = async () => {
    const next = stSel.value;
    const { error } = await sb.from('ir_files').update({ status: next }).eq('id', CUR.id);
    if (error) { toast('Status change failed: ' + error.message); stSel.value = CUR.status; return; }
    CUR.status = next; toast('Status: ' + next + (next !== 'active' ? ' — file is now read-only' : ''));
    renderFile();
  };
  const pubBtn = $('#ibPublish');
  if (pubBtn) pubBtn.onclick = openPublish;
  document.querySelectorAll('.ib-step').forEach(b => b.onclick = () => { view = b.dataset.step; renderFile(); });
  const body = $('#ibStepBody');
  if (view === 'review') renderReview(body);
  else if (view === 'setup') renderSetup(body);
  else if (view === 'dd') renderDD(body);
  else if (view === 'inspection') renderInspection(body);
  else if (view === 'grading') renderGrading(body);
  else if (view === 'pricing') renderPricing(body);
  else if (view === 'cashflow') renderCashflow(body);
  else if (view === 'compliance') renderCompliance(body);
  else if (view === 'report') renderReport(body);
  else if (view === 'audit') renderAudit(body);
  else renderStub(body, view);
}

async function refreshList() {
  const { data } = await sb.from('ir_files').select('id,address,suburb,state,market_label,market_slug,status,roles,updated_at,compliance,setup').order('updated_at', { ascending: false });
  if (data) FILES = data;
  renderHome();
}

async function saveSection(sec, val, quiet) {
  CUR[sec] = val;
  const { error } = await sb.from('ir_files').update({ [sec]: val }).eq('id', CUR.id);
  if (error) { toast('Save failed: ' + error.message); return false; }
  if (!quiet) toast('Saved');
  return true;
}

/* ── SETUP step ── */
function renderSetup(el) {
  const s = CUR.setup || {}, roles = CUR.roles || {};
  const regions = ((CFG.regions || {}).regions) || [];
  el.innerHTML =
    '<div class="ib-card"><h3>Property</h3><div class="ib-form">' +
    '<label>Address<input id="fAddr" value="' + esc(CUR.address || '') + '"></label>' +
    '<label>Suburb<input id="fSub" value="' + esc(CUR.suburb || '') + '"></label>' +
    '<label>Market<select id="fMkt">' + '<option value="">—</option>' + regions.map(r =>
      '<option value="' + esc(r.label) + '"' + (r.label === CUR.market_label ? ' selected' : '') + '>' + esc(r.label) + '</option>').join('') + '</select></label>' +
    '<label>State<input id="fState" value="' + esc(CUR.state || '') + '"></label>' +
    '<label>Postcode<input id="fPost" value="' + esc(CUR.postcode || '') + '"></label>' +
    '<label>Property type<input id="fType" list="fTypeDl" value="' + esc(s.propertyType || '') + '" placeholder="House"><datalist id="fTypeDl">' +
      ['House', 'Unit', 'Townhouse', 'Villa', 'Unit Block', 'Industrial', 'Medical', 'Office', 'Retail'].map(t => '<option value="' + t + '">').join('') + '</datalist></label>' +
    '<label>Commercial property?<select id="fCommercial"><option value=""' + (s.commercial !== true ? ' selected' : '') + '>No — residential</option>' +
      '<option value="1"' + (s.commercial === true ? ' selected' : '') + '>Yes — commercial</option></select></label>' +
    '<label>Land size (m²)<input id="fLand" inputmode="numeric" value="' + esc(s.landSize != null ? s.landSize : '') + '"></label>' +
    '<label>Beds<input id="fBeds" inputmode="numeric" value="' + esc(s.beds != null ? s.beds : '') + '"></label>' +
    '<label>Baths<input id="fBaths" inputmode="numeric" value="' + esc(s.baths != null ? s.baths : '') + '"></label>' +
    '<label>Cars<input id="fCars" inputmode="numeric" value="' + esc(s.cars != null ? s.cars : '') + '"></label>' +
    '<label>LGA<input id="fLga" value="' + esc(s.lga || '') + '"></label>' +
    '<label>Strategy<input id="fStrat" value="' + esc(s.strategy || '') + '" placeholder="Foundation - Passive"></label>' +
    '<label style="grid-column:1/-1">Listing URL<input id="fList" value="' + esc(s.listingUrl || '') + '"></label>' +
    '<label>CRM link<input id="fCrm" value="' + esc(s.crmUrl || '') + '"></label>' +
    '<label>Drive folder<input id="fDrive" value="' + esc(s.driveUrl || '') + '"></label>' +
    '</div>' +
    '<div class="ib-intel" id="ibIntel"></div></div>' +

/* Suburb intelligence = Suburb Scoring (LT CAGR, quality, runway, rec — the
   old manual Looker step) MERGED with the Cotality suburb store (monthly:
   medians, 5/10/20yr CAGRs, 3yr/5yr growth, DOM, rent + change, yield, AVM
   with p25–p75 band, income, CBD distance) — the whole "paste Pricefinder
   history into the CAGR tab" step dies here. */
function intelPtype() {
  const t = ($('#fType') ? $('#fType').value : (CUR.setup || {}).propertyType) || '';
  return /unit|apart|town|villa|flat/i.test(t) ? 'U' : 'H';
}
/* ── property photos — stored per file in the ir-evidence bucket under
   <fileId>/photos/; setup.photos = [{path,name,at}], index 0 = the cover ── */
const PHOTO_URLS = {};   /* path → signed url cache (1h) */
async function signPhotoUrls(paths) {
  const need = (paths || []).filter(p => !PHOTO_URLS[p]);
  if (need.length) {
    try {
      const { data } = await sb.storage.from('ir-evidence').createSignedUrls(need, 3600);
      (data || []).forEach((r, i) => { if (r.signedUrl) PHOTO_URLS[need[i]] = r.signedUrl; });
    } catch (e) {}
  }
  return (paths || []).map(p => PHOTO_URLS[p] || null);
}
async function renderPhotos() {
  const box = document.getElementById('ibPhotos'); if (!box) return;
  const photos = ((CUR.setup || {}).photos) || [];
  if (!photos.length) { box.innerHTML = '<div class="ib-note">no photos yet</div>'; }
  else {
    const urls = await signPhotoUrls(photos.map(p => p.path));
    if (!document.getElementById('ibPhotos')) return;   /* view changed while signing */
    box.innerHTML = photos.map((p, i) =>
      '<div class="ib-photo" data-pi="' + i + '">' +
      (urls[i] ? '<img src="' + esc(urls[i]) + '" alt="">' : '<div class="ib-note" style="padding:20px">unavailable</div>') +
      (i === 0 ? '<span class="cv">cover</span>' : '') +
      (CANW ? '<div class="acts">' + (i !== 0 ? '<button type="button" class="mkcv">make cover</button>' : '') +
        '<button type="button" class="del">&times;</button></div>' : '') + '</div>').join('');
    box.querySelectorAll('.mkcv').forEach(b => b.onclick = async () => {
      const i = +b.closest('.ib-photo').dataset.pi;
      const setup = { ...CUR.setup }; const arr = [...(setup.photos || [])];
      arr.unshift(arr.splice(i, 1)[0]); setup.photos = arr;
      if (await saveSection('setup', setup, true)) renderPhotos();
    });
    box.querySelectorAll('.del').forEach(b => b.onclick = async () => {
      if (!confirm('Remove this photo?')) return;
      const i = +b.closest('.ib-photo').dataset.pi;
      const setup = { ...CUR.setup }; const arr = [...(setup.photos || [])];
      const [gone] = arr.splice(i, 1); setup.photos = arr;
      try { await sb.storage.from('ir-evidence').remove([gone.path]); } catch (e) {}
      if (await saveSection('setup', setup, true)) { toast('Photo removed'); renderPhotos(); }
    });
  }
  const addBtn = document.getElementById('ibPhotoAdd'), inp = document.getElementById('ibPhotoInput');
  if (addBtn && inp && !addBtn._wired) {
    addBtn._wired = true;
    addBtn.onclick = () => inp.click();
    inp.onchange = async () => {
      for (const file of inp.files) {
        if (file.size > 15 * 1024 * 1024) { toast(file.name + ' is over 15MB'); continue; }
        const path = CUR.id + '/photos/' + Date.now() + '-' + file.name.replace(/[^\w.\-]+/g, '_');
        const { error } = await sb.storage.from('ir-evidence').upload(path, file);
        if (error) { toast(/not.*found/i.test(error.message) ? 'Photo storage not set up — apply migration 105' : 'Upload failed: ' + error.message); return; }
        const setup = { ...CUR.setup };
        setup.photos = [...(setup.photos || []), { path, name: file.name, at: new Date().toISOString() }];
        if (!await saveSection('setup', setup, true)) return;
      }
      inp.value = ''; toast('Photos added'); renderPhotos();
    };
  }
}

async function fetchIntel() {
  const mkt = ($('#fMkt') ? $('#fMkt').value : CUR.market_label) || '';
  const sub = (($('#fSub') ? $('#fSub').value : CUR.suburb) || '').trim();
  const regions = ((CFG.regions || {}).regions) || [];
  const reg = regions.find(r => r.label === mkt);
  if (!sub) return null;
  const ptype = intelPtype();
  const out = { asof: new Date().toISOString().slice(0, 10), ptype };
  if (reg) {
    try {
      const key = reg.slug + '-' + (ptype === 'U' ? 'u' : 'h');
      const { data } = await sb.from('suburb_scores').select('payload').eq('key', key).maybeSingle();
      const row = data && (data.payload.rows || []).find(r => String(r.suburb || '').toLowerCase() === sub.toLowerCase());
      if (row) out.scores = { lt: row.lt, quality: row.quality, yield: row.yield, price: row.price, rent: row.rent,
        dom: row.dom, demand: row.demand, runway: row.runway, rec: row.rec, topPrice: row.topPrice, source: 'suburb_scores/' + key };
    } catch (e) {}
  }
  try {
    const st = (($('#fState') ? $('#fState').value : CUR.state) || (reg && reg.state) || '').trim();
    let q = sb.from('forge_cl_suburbs').select('month,postcode,lga,metrics').eq('level', 'suburb')
      .eq('ptype', ptype).ilike('name', sub).order('month', { ascending: false }).limit(1);
    if (st) q = q.eq('state', st);
    const { data } = await q;
    if (data && data[0]) {
      const m = data[0].metrics || {};
      out.cl = { month: data[0].month, lga: data[0].lga, postcode: data[0].postcode,
        med12: m.med12, med3: m.med3, medChg12: m.medChg12, medChg36: m.medChg36, medChg60: m.medChg60,
        cagr5: m.cagr5, cagr10: m.cagr10, cagr20: m.cagr20,
        cagr3_derived: m.medChg36 != null ? Math.pow(1 + m.medChg36, 1 / 3) - 1 : null,
        dom: m.dom, rent: m.rent, rentChg12: m.rentChg12, yield: m.yield,
        avm: m.avm, p25: m.p25, p75: m.p75, income: m.income, distCbd: m.dist,
        holdPeriod: m.holdPeriod, sales12: m.sales12, listings: m.listings1 };
    }
  } catch (e) {}
  return (out.scores || out.cl) ? out : null;
}

/* ── auto-fill as EDITABLE PREFILL (Van's rule 2026-08-19): the fields the
   team knows stay editable; our data lands in them first, only where the
   human hasn't already typed something. suburb_stats stays the pristine
   auto reference so the UI can mark each value auto vs edited. ── */
function intelAutoMap(ss) {
  const sc = (ss && ss.scores) || {}, cl = (ss && ss.cl) || {};
  return {
    suburbYield: cl.yield != null ? cl.yield : sc.yield,
    cagr3: cl.cagr3_derived, cagr5: cl.cagr5, cagr10: cl.cagr10, cagr20: cl.cagr20,
    ltCagr: sc.lt, suburbRating: sc.quality,
    dom: cl.dom != null ? cl.dom : sc.dom,
    suburbRent: cl.rent != null ? cl.rent : sc.rent,
    suburbMedian: cl.med12 != null ? cl.med12 : sc.price,
    avm: cl.avm, p25: cl.p25, p75: cl.p75,
  };
}
async function seedPrefills(ss) {
  const auto = intelAutoMap(ss);
  /* pricing.suburb — the 5j "suburb summary" numbers, prefilled where empty */
  const pricing = { ...(CUR.pricing || {}) };
  const subj = { ...(pricing.suburb || {}) };
  let changed = false;
  for (const [k, v] of Object.entries(auto)) {
    if (k === 'suburbRating') continue;
    if (v != null && (subj[k] == null || subj[k] === '')) { subj[k] = v; changed = true; }
  }
  if (changed) { pricing.suburb = subj; await saveSection('pricing', pricing, true); }
  /* grading.suburbRating + setup.lga */
  if (auto.suburbRating && !(CUR.grading || {}).suburbRating) {
    await saveSection('grading', { ...(CUR.grading || {}), suburbRating: auto.suburbRating }, true);
  }
  if (ss.cl && ss.cl.lga && !(CUR.setup || {}).lga) {
    await saveSection('setup', { ...(CUR.setup || {}), lga: ss.cl.lga }, true);
  }
}
/* provenance chip: does the live editable value still equal the auto one? */
function provChip(val, autoVal) {
  if (autoVal == null) return '';
  const eq = (typeof val === 'number' && typeof autoVal === 'number')
    ? Math.abs(val - autoVal) < 1e-9 : String(val) === String(autoVal);
  return '<span class="ib-prov ' + (eq ? 'auto' : 'edited') + '">' + (eq ? 'auto' : 'edited') + '</span>';
}

/* ── PRELIMINARY DD step ── */
function ruleFor(item, variable) { const r = RULES.find(x => x.item === item && x.variable === variable); return r ? r.value : null; }
/* jsonb does NOT preserve key order (shortest key first, then bytewise) —
   always sort DD checks by their code before rendering anywhere */
function ddSorted(keys) { return [...keys].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true })); }
function ddItems() {
  const items = [...new Set(RULES.map(r => r.item))];
  const cur = Object.keys((CUR.dd || {}).items || {});
  for (const c of cur) if (!items.includes(c)) items.push(c);
  return ddSorted(items);
}
function ddResult(items) {
  const ratings = Object.values(items || {}).map(x => x.rating).filter(Boolean);
  if (ratings.includes('Failed')) return 'Failed';
  if (ratings.includes('Review')) return 'Review';
  return ratings.length ? 'Approved' : null;
}
function renderDD(el) {
  const dd = CUR.dd || {}; const items = dd.items || {};
  const list = ddItems();
  if (!list.length) { el.innerHTML = '<div class="ib-card"><div class="ib-note">Pick a market in Setup first — the DD checklist is region-specific (the rulebook drives sources and criteria).</div></div>'; return; }
  const res = ddResult(items);
  el.innerHTML = (res ? '<span class="ib-ddres ' + res + '">DD result: ' + res + '</span>' : '') +
    '<div class="ib-dd">' + list.map(it => {
      const v = items[it] || {};
      const src = ruleFor(it, 'Source');
      const crit = ['Approved', 'Review', 'Failed'].map(k => { const c = ruleFor(it, k);
        return c ? '<div><b class="' + { Approved: 'g', Review: 'w', Failed: 'b' }[k] + '">' + k + ':</b> ' + esc(c) + '</div>' : ''; }).join('');
      return '<div class="ib-dditem" data-item="' + esc(it) + '"><div class="row1">' +
        '<span class="nm">' + esc(it) + '</span>' +
        (src && /^https?:/i.test(src) ? '<a class="src" href="' + esc(src) + '" target="_blank" rel="noopener">source ↗</a>'
          : (src ? '<span class="src" style="color:var(--ib-mut)">' + esc(src) + '</span>' : '')) +
        (crit ? '<button class="ib-btn sm ib-critbtn" type="button">criteria</button>' : '') +
        '<select class="ib-ddrating' + (v.rating ? ' s-' + v.rating : '') + '"' + (CANW ? '' : ' disabled') + '>' +
        '<option value="">—</option>' + DD_RATINGS.map(r => '<option' + (v.rating === r ? ' selected' : '') + '>' + r + '</option>').join('') +
        '</select></div>' +
        (crit ? '<div class="ib-crit">' + crit + '</div>' : '') +
        '<textarea class="ib-ddnotes" placeholder="Notes"' + (CANW ? '' : ' disabled') + '>' + esc(v.notes || '') + '</textarea>' +
        '<div class="ib-files">' + ddFileChips(v.files) +
          (CANW ? '<button class="ib-attach" type="button">&#128206; attach evidence</button><input type="file" hidden multiple accept="image/*,.pdf">' : '') +

    }).join('') + '</div>' +

  document.querySelectorAll('.ib-critbtn').forEach(b => b.onclick = () => b.closest('.ib-dditem').classList.toggle('open'));
  document.querySelectorAll('.ib-ddrating').forEach(s => s.onchange = () => { s.className = 'ib-ddrating' + (s.value ? ' s-' + s.value : ''); });
  wireDdEvidence(el);
  $('#ibSaveDD').onclick = async () => {
    const out = {};

        out[d.dataset.item] = { rating, notes, ...(files && files.files ? { files: files.files } : {}) };
    });

/* ── DD evidence attachments (bucket 'ir-evidence', migration 105) ── */
function ddFileChips(files) {
  return (files || []).map((f, i) =>
    '<span class="ib-file" data-path="' + esc(f.path) + '"><span class="nm">' + esc(f.name) + '</span>' +
    (CANW ? '<span class="x" data-rmi="' + i + '" title="remove">&times;</span>' : '') + '</span>').join('');
}
function ddSlug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 50); }
function wireDdEvidence(root) {
  root.querySelectorAll('.ib-dditem').forEach(d => {
    const item = d.dataset.item;
    const btn = d.querySelector('.ib-attach'), inp = d.querySelector('input[type="file"]');
    if (btn) btn.onclick = () => inp.click();
    if (inp) inp.onchange = async () => {
      for (const file of inp.files) {
        if (file.size > 15 * 1024 * 1024) { toast(file.name + ' is over 15MB'); continue; }
        const path = CUR.id + '/' + ddSlug(item) + '/' + Date.now() + '-' + file.name.replace(/[^\w.\-]+/g, '_');
        const { error } = await sb.storage.from('ir-evidence').upload(path, file);
        if (error) { toast(/not.*found/i.test(error.message) ? 'Evidence storage not set up — apply migration 105' : 'Upload failed: ' + error.message); return; }
        const dd = { ...(CUR.dd || {}) }; dd.items = { ...(dd.items || {}) };
        const it = { ...(dd.items[item] || {}) };
        it.files = [...(it.files || []), { path, name: file.name, size: file.size, at: new Date().toISOString() }];
        dd.items[item] = it;
        if (!await saveSection('dd', dd, true)) return;
      }
      toast('Evidence attached'); renderFile();
    };
    d.querySelectorAll('.ib-file').forEach(chip => {
      chip.querySelector('.nm').onclick = async () => {
        const { data, error } = await sb.storage.from('ir-evidence').createSignedUrl(chip.dataset.path, 3600);
        if (error || !data) { toast('Could not open (apply migration 105?)'); return; }
        window.open(data.signedUrl, '_blank', 'noopener');
      };
      const x = chip.querySelector('.x');
      if (x) x.onclick = async () => {
        if (!confirm('Remove this evidence file?')) return;
        await sb.storage.from('ir-evidence').remove([chip.dataset.path]);
        const dd = { ...(CUR.dd || {}) }; dd.items = { ...(dd.items || {}) };
        const it = { ...(dd.items[item] || {}) };
        it.files = (it.files || []).filter(f => f.path !== chip.dataset.path);
        dd.items[item] = it;
        if (await saveSection('dd', dd, true)) { toast('Removed'); renderFile(); }
      };
    });
  });
}

function cagrBetween(d1, p1, d2, p2) {
  const y1 = parseDateAny(d1), y2 = parseDateAny(d2);
  if (!y1 || !y2 || !p1 || !p2) return null;
  const yrs = (y2 - y1) / 31557600000;
  if (yrs <= 0.2) return null;
  return Math.pow(p2 / p1, 1 / yrs) - 1;
}
function parseDateAny(s) {
  const t = String(s || '').trim(); if (!t) return null;
  let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return new Date(y, +m[2] - 1, +m[1]).getTime(); }
  const d = new Date(t); return isNaN(d) ? null : d.getTime();
}

function suggestLandTax(budget, state) {
  const cfg = CFG.land_tax || {}; const ratio = ((CFG.defaults || {}).landValueRatio) || 0.6;
  const lv = budget * ratio;
  const rows = (cfg.brackets || []).filter(b => b.state === state && b.low != null);
  const b = rows.find(b => lv >= b.low && lv <= (b.high || 9e10));
  if (!b || b.pct == null) return null;
  return Math.round((b.fixed || 0) + b.pct * (lv - b.low));
}
function suggestInsurance(budget) {
  const rows = ((CFG.insurance || {}).brackets) || [];
  let best = null;
  for (const b of rows) if (b.low != null && budget >= b.low && b.premium != null) best = b.premium;
  return best;
}

}
function renderCompliance(el) {

          (t ? '<span class="w">' + esc((t.by || '').split('@')[0]) + ' · ' + auDay(t.at) + '</span>' : '') + '</div>'; }).join('')).join('') +
    '</div>';

}

function pathGet(o, p) { return p.reduce((a, k) => (a == null ? a : a[k]), o); }
function pathSet(o, p, v) { let a = o; for (let i = 0; i < p.length - 1; i++) a = a[p[i]]; a[p[p.length - 1]] = v; }
function fmtVal(v) {
  if (v == null || v === '') return '—';
  if (typeof v === 'number') return Math.abs(v) < 1 && v !== 0 ? (v * 100).toFixed(2) + '%' : (Number.isInteger(v) ? v.toLocaleString() : String(v));
  return String(v);
}
function rv(sec, path, v) {
  return '<span class="ib-rv' + (typeof v === 'number' ? ' num' : '') + '" data-sec="' + sec + '" data-path="' + esc(JSON.stringify(path)) + '">' + esc(fmtVal(v)) + '</span>';
}
function kvGrid(sec, obj, base) {
  const pairs = Object.entries(obj || {}).filter(([, v]) => typeof v !== 'object' || v === null);
  if (!pairs.length) return '<div class="ib-note">nothing here yet</div>';
  return '<div class="ib-kv">' + pairs.map(([k, v]) =>
    '<div class="pair"><span class="k">' + esc(label(k)) + '</span><span class="v">' + rv(sec, [...base, k], v) + '</span></div>').join('') + '</div>';
}
function tbl(sec, rows, base, cols) {
  if (!rows || !rows.length) return '';
  cols = cols || [...new Set(rows.flatMap(r => Object.keys(r)))];
  return '<div class="ib-tblwrap"><table class="ib-tbl"><thead><tr>' + cols.map(c => '<th>' + esc(label(c)) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map((r, i) => '<tr>' + cols.map(c => '<td>' + rv(sec, [...base, i, c], r[c]) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}
function checkedBtn(sec) {
  const rvw = (CUR.compliance && CUR.compliance.review) || {};
  const c = rvw[sec];
  return '<button class="ib-checkbtn' + (c ? '' : ' off') + '" data-check="' + sec + '" type="button"' + (CANW ? '' : ' disabled') + '>' +
    (c ? '✓ checked · ' + esc((c.by || '').split('@')[0]) + ' ' + auDay(c.at) : 'mark checked') + '</button>';
}

function calcCashflow(cf, mode, normRate) {
  const n = k => +cf[k] || 0;
  const budget = n('budget'); if (!budget) return null;
  const rate = mode === 'norm' ? (normRate || RATES.normalised || 0.0494) : (n('rate') || RATES.current || 0.065);
  const loan = budget * (n('lvr') || 0.9);
  const interest = loan * rate;
  const mPmt = loan * (rate / 12) / (1 - Math.pow(1 + rate / 12, -((n('loanTermYears') || 30) * 12)));
  const principal = mode === 'io' ? 0 : (mPmt * 12 - interest);
  const rent = n('rent'), income = rent * (n('weeksLet') || 52);
  const letting = (n('lettingFeeWeeks') || 0) * rent;
  const pm = income * (n('pmFeePct') || 0);
  const repairs = income * (n('repairsPctOfRent') || 0);
  /* flexible fee lines (e.g. QLD's Advice / Portfolio Management 2.2%): pct of income and/or flat $ */
  const fees = (cf.feeLines || []).reduce((a, f) => a + income * (+f.pct || 0) + (+f.amount || 0), 0);
  const other = n('strata') + n('councilWater') + n('landTax') + n('insurance');
  const runningLessFin = letting + pm + repairs + fees + other;
  const acq = n('stampDuty') + n('engagementFee') + n('acquisitionFee') + n('titleTransfer') + n('conveyancing') + n('buildingPest') + n('depreciationSchedule') + n('professionalClean');
  const totalCost = budget + n('maintenanceAllowance') + n('minRentalStdCost') + n('cosmeticWorks') + acq;
  const annual = income - (runningLessFin + interest + principal);
  return { loan, requiredCapital: totalCost - loan, grossYield: income / budget, netYield: (income - runningLessFin) / budget,
    expenseRatio: runningLessFin / (income || 1), annual, weekly: annual / 52, interest, principal, income, totalCost, rate };
}

function pubIsCommercial() {

function pubSegment() {
  const t = ((CUR.setup || {}).propertyType) || '';
  if (pubIsCommercial()) {
    if (/block/i.test(t)) return 'unit_block';

/* Delete an IR file. The audit trigger (mig 104) writes a section='deleted'
   row with who/when before the row goes — that is the deletion history the
   home screen shows. Deleting a PUBLISHED file CASCADES in the DATABASE
   (mig 118, BEFORE DELETE trigger): its IR Library row, the Documents
   auto-folder entry (same row) and every report PDF under published/<id>/
   go in the SAME transaction, on every delete path — not just this button.
   The deck picker reads ir_files live so it drops out on its own; slides
   already inserted into decks baked their data and are untouched. RLS gates
   who may delete — dev tier only for published files (mig 117), and mig 118
   also stops a non-dev from un-publishing to sneak around that. So the
   client just issues the delete; a refusal comes back errorless with zero
   rows (the deck-lock lesson). */
function openDeleteIr() {
  if (!CUR) return;
  ensurePubModal();
  const pub = !!(CUR.compliance || {}).published;
  $('#ibpDlg').innerHTML =
    '<h2>Delete this IR?</h2>' +
    '<div class="ib-note" style="margin:10px 0 14px">' +
    '<b>' + esc(CUR.address) + '</b> will be permanently removed from the Builder. ' +
    'The deletion is recorded in the audit history (who + when).' +
    (pub ? '<br><br>This file is <b>published</b> — its IR Library entry, its report PDF and its Documents copy will also be deleted, and it will no longer be offered in the Presentation builder.' : '') +
    '</div>' +
    '<div class="ib-savebar"><button class="ib-btn" id="delCancel" type="button">Cancel</button>' +
    '<button class="ib-btn sm" id="delGo" type="button" style="color:#fff;background:var(--ib-bad);border-color:var(--ib-bad)">Delete IR</button>' +
    '<span class="ib-note" id="delStat"></span></div>';
  $('#ibpOv').classList.add('show');
  $('#delCancel').onclick = () => $('#ibpOv').classList.remove('show');
  $('#delGo').onclick = doDeleteIr;
}
async function doDeleteIr() {
  const stat = m => { const e = $('#delStat'); if (e) e.textContent = m; };
  $('#delGo').disabled = true;
  const delId = CUR.id;
  const pub = !!(CUR.compliance || {}).published;
  try {
    /* RLS refusal returns NO error and zero rows — check the rows, not the
       error (the deck-lock lesson). On success the DB trigger (mig 118) has
       already removed the IR Library row and the Documents entry in the same
       transaction. */
    const { data, error } = await sb.from('ir_files').delete().eq('id', delId).select('id');
    if (error) throw error;
    if (!data || !data.length) {
      stat(pub ? 'Refused — published IRs can only be deleted by Vandolf.' : 'Refused — deleting needs ir-builder access.');
      $('#delGo').disabled = false;
      return;
    }
    /* The report PDF(s) can't be deleted from SQL (Supabase blocks direct
       storage-table deletes), so clear them here via the Storage API. Only a
       published file has any — re-publishes stack timestamped files under the
       one prefix. Best-effort: the visible surfaces are already clean. */
    if (pub) {
      try {
        const prefix = 'published/' + delId;
        const { data: objs } = await sb.storage.from('ir-library').list(prefix, { limit: 100 });
        const paths = (objs || []).map(o => prefix + '/' + o.name);
        if (paths.length) await sb.storage.from('ir-library').remove(paths);
      } catch (_) { /* the entry is gone from every list either way */ }
    }
    toast('IR deleted — recorded in the audit history');
    $('#ibpOv').classList.remove('show');
    CUR = null; history.replaceState(null, '', location.pathname);
    await refreshList();
  } catch (e) {
    stat('Delete failed: ' + (e.message || e));
    $('#delGo').disabled = false;
  }
}

function loadScript(src) {

    const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej;
    document.head.appendChild(sc);
  });
}
async function generateReportPdfBlob(statFn) {
  statFn('loading PDF engine…');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  /* make sure the print pages exist + are renderable (photos need signed urls) */
  await signPhotoUrls((((CUR.setup || {}).photos) || []).slice(0, 4).map(p => p.path));
  const pages = buildReportPages();
  const total = pages.length;
  const root = document.getElementById('ibPrint');
  root.innerHTML = pages.map((p, i) => '<div class="pg">' + p.h + pgFoot(i + 1, total) + '</div>').join('');
  root.style.cssText = 'display:block;position:fixed;left:-12000px;top:0;width:794px';
  try {
    const pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', compress: true });
    const els = [...root.querySelectorAll('.pg')];
    for (let i = 0; i < els.length; i++) {
      statFn('rendering page ' + (i + 1) + ' of ' + els.length + '…');
      const canvas = await html2canvas(els[i], { scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true });
      if (i > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 595.28, 841.89);
    }
    return pdf.output('blob');
  } finally { root.style.cssText = ''; }
}
async function doPublish() {
  const stat = m => { const e = $('#pubStat'); if (e) e.textContent = m; };
  const month = $('#pubMonth').value;
  if (!month) { stat('Pick the settlement / purchase month first.'); return; }
  $('#pubGo').disabled = true;
  try {
    const pi = calcCashflow(CUR.cashflow || {}, 'pi');
    const metrics = {};
    if (pi) { metrics.gross_yield_pct = +(pi.grossYield * 100).toFixed(2); metrics.net_yield_pct = +(pi.netYield * 100).toFixed(2); }
    /* find an existing library row for this property (update-in-place) */
    stat('checking the library…');
    let q = sb.from('investment_reports').select('id,metrics,link_url').ilike('address', CUR.address + '%').limit(1);
    if (CUR.suburb) q = q.eq('suburb', CUR.suburb);
    const { data: found } = await q;
    const existing = found && found[0];
    /* optional PDF */
    let pdfPath = null;
    if ($('#pubPdf').checked) {
      try {
        const blob = await generateReportPdfBlob(stat);
        stat('uploading the PDF…');
        pdfPath = 'published/' + CUR.id + '/IR-' + ddSlug(CUR.address) + '-' + Date.now() + '.pdf';
        const up = await sb.storage.from('ir-library').upload(pdfPath, blob, { contentType: 'application/pdf' });
        if (up.error) { pdfPath = null; stat(/not.*found/i.test(up.error.message) ? 'PDF skipped — apply migration 106. Publishing without it…' : 'PDF upload failed (' + up.error.message + ') — publishing without it…'); }
      } catch (e) { pdfPath = null; stat('PDF render failed — publishing without it…'); }
    }
    if (pdfPath) metrics.report_pdf = pdfPath;
    const rec = {
      domain: pubIsCommercial() ? 'commercial' : 'residential',
      market_label: CUR.market_label, market_slug: CUR.market_slug,
      segment: pubSegment(), strategy: pubStrategy(),
      budget: (((CUR.pricing || {}).adopted) || {}).topPrice || (CUR.cashflow || {}).budget || null,
      address: pubFullAddress(), suburb: CUR.suburb, state: CUR.state, lga: (CUR.setup || {}).lga || null,
      sold_date: month + '-01', link_url: $('#pubLink').value.trim() || null,
      notes: $('#pubNotes').value.trim() || null, status: 'current', source: 'ir-builder',
    };
    stat(existing ? 'updating the library entry…' : 'creating the library entry…');
    let libId;
    if (existing) {
      const patch = {};
      for (const [k, v] of Object.entries(rec)) if (v != null) patch[k] = v;   /* never blank existing values */
      patch.metrics = { ...(existing.metrics || {}), ...metrics };
      const { error } = await sb.from('investment_reports').update(patch).eq('id', existing.id);
      if (error) throw error;
      libId = existing.id;
    } else {
      rec.metrics = metrics;
      const { data, error } = await sb.from('investment_reports').insert(rec).select('id').single();
      if (error) throw error;
      libId = data.id;
    }
    /* stamp the file + flip to final */
    const comp = { ...(CUR.compliance || {}), published: { at: new Date().toISOString(), libraryId: libId, sold_date: month + '-01', pdf: pdfPath || null } };
    await saveSection('compliance', comp, true);
    if (CUR.status !== 'final') {
      await sb.from('ir_files').update({ status: 'final' }).eq('id', CUR.id);
      CUR.status = 'final';
    }
    stat('');
    $('#ibpDlg').innerHTML = '<h2>Published ✓</h2>' +
      '<div class="ib-note">The library entry is live' + (pdfPath ? ' with the report PDF attached' : '') +
      '. This file is now <b>final</b> (read-only — flip the status back to active if it needs edits).</div>' +
      '<div class="ib-savebar"><button class="ib-btn" id="pubClose" type="button">Close</button>' +
      '<a class="ib-btn pri" style="text-decoration:none" href="investment-reports.html?id=' + libId + '" target="_blank" rel="noopener">Open in the library ↗</a></div>';
    $('#pubClose').onclick = () => { $('#ibpOv').classList.remove('show'); renderFile(); };
  } catch (e) {
    stat('Publish failed: ' + (e.message || e));
    $('#pubGo').disabled = false;
  }
}

/* ── AUDIT tab: who changed what — rows from the ir_files_audit trigger,
   field-level diff computed here from each row's old/new section values ── */
function jsonDiff(a, b, base, out, depth) {
  base = base || []; out = out || []; depth = depth || 0;
  if (depth > 6 || out.length > 40) return out;
  const isObj = x => x && typeof x === 'object';
  if (!isObj(a) || !isObj(b)) {
    if (JSON.stringify(a === undefined ? null : a) !== JSON.stringify(b === undefined ? null : b))
      out.push({ path: base.join('.'), from: a, to: b });
    return out;
  }
  const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const k of keys) jsonDiff(a ? a[k] : undefined, b ? b[k] : undefined, [...base, k], out, depth + 1);
  return out;
}
async function renderAudit(el) {
  el.innerHTML = '<div class="ib-card"><div class="ib-note">Loading the trail&hellip;</div></div>';
  const { data, error } = await sb.from('ir_files_audit').select('*')
    .eq('file_id', CUR.id).order('changed_at', { ascending: false }).limit(200);
  if (error) { el.innerHTML = '<div class="ib-card"><div class="ib-note">Audit unavailable: ' + esc(error.message) + '</div></div>'; return; }
  if (!data || !data.length) { el.innerHTML = '<div class="ib-card"><div class="ib-note">No changes recorded yet.</div></div>'; return; }
  el.innerHTML = '<div class="ib-card"><h3>Audit trail <span class="right"><span class="ib-note">' + data.length + ' change(s) · every save is logged by the database, per section</span></span></h3>' +
    '<div class="ib-dd">' + data.map(r => {
      const who = esc((r.changed_email || 'system').split('@')[0]);
      const when = auTs(r.changed_at);
      let body = '';
      if (r.section === 'created') body = '<div class="ib-note">file created</div>';
      else if (r.section === 'deleted') body = '<div class="ib-note">file deleted</div>';
      else {
        const fmtA = v => v == null ? '—' : (typeof v === 'object' ? JSON.stringify(v).slice(0, 80) : fmtVal(v));
        const diffs = jsonDiff(r.old_value, r.new_value);
        const lines = diffs.slice(0, 10).map(d =>
          '<div class="ib-note" style="color:var(--ib-ink2)"><b>' + esc(d.path || r.section) + '</b>: ' +
          '<span style="color:var(--ib-bad)">' + esc(fmtA(d.from)) + '</span> → ' +
          '<span style="color:var(--ib-good)">' + esc(fmtA(d.to)) + '</span></div>').join('');
        body = lines + (diffs.length > 10 ? '<div class="ib-note">+' + (diffs.length - 10) + ' more field(s)</div>' : '') +
          (!diffs.length ? '<div class="ib-note">section rewritten (no field-level difference detected)</div>' : '');
      }
      return '<div class="ib-dditem"><div class="row1"><span class="nm">' + esc(label(r.section)) + '</span>' +
        '<span class="ib-chip">' + who + '</span><span class="ib-note">' + when + '</span></div>' + body + '</div>';
    }).join('') + '</div></div>';
}
