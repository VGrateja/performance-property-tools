<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IR Builder &mdash; Performance Property</title>
<link rel="icon" href="../assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<!-- OS chrome: mode/period/shade + legacy data-theme bridge -->
<script src="../shared/os-chrome.js?v=ea374003"></script>
<link rel="stylesheet" href="../shared/os-theme.css?v=bcea6d52"/>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   IR BUILDER (Phase A, 2026-08-19) — the acquisition team's Property Master
   File, hub-native. Replaces the 30-tab per-property Google Sheet: the DD
   team fills a guided stepper, the BA team checks everything in ONE Review
   window (inline-editable, per-section "checked" marks). Data = ir_files +
   the ported rulebook/rubric/config (migration 104, seeded from the sample
   workbook). Suburb stats auto-fill from suburb_scores — the manual
   "enter LT CAGR from Looker" step is dead.
   Phase A ships: file list · Review window (all sections) · Setup + DD
   editors · computed cashflows (P&I / IO / Normalised — the cloned-template
   drift bug fixed in code). Inspection/Grading/Pricing editors: Phase B/C.
   Write access = dev/admin or a tool_roles 'ir-builder' grant.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --ib-ink:#F4F6F8; --ib-ink2:#C6CCD6; --ib-mut:var(--mut,#8B93A1);
  --ib-surface:rgba(255,255,255,0.045); --ib-surface-2:rgba(255,255,255,0.025);
  --ib-solid:#1A2130;
  --ib-border:rgba(255,255,255,0.10); --ib-border-2:rgba(255,255,255,0.18);
  --ib-teal:#00A0B4; --ib-navy:#171B24;
  --ib-good:#71B357; --ib-warn:#FFA91F; --ib-bad:#E72347; --ib-blue:#54A6DE; --ib-euc:#3E7967;
  --ib-teal-soft:rgba(0,160,180,0.14); --ib-good-soft:rgba(113,179,87,0.16);
  --ib-warn-soft:rgba(255,169,31,0.14); --ib-bad-soft:rgba(231,35,71,0.12); --ib-blue-soft:rgba(84,166,222,0.14);
  --ib-field-bg:#141A28; --ib-field-ink:#F4F6F8; --ib-field-border:rgba(255,255,255,0.20);
}
[data-theme="light"]{
  --ib-ink:#171B24; --ib-ink2:#3F4650;
  --ib-surface:#ffffff; --ib-surface-2:#F7F9FA; --ib-solid:#ffffff;
  --ib-border:rgba(23,27,36,0.12); --ib-border-2:rgba(23,27,36,0.22);
  --ib-teal-soft:#E8F7FA; --ib-good-soft:#F0F7ED; --ib-warn-soft:#FFF6E8; --ib-bad-soft:#FDECEF; --ib-blue-soft:#EDF5FC;
  --ib-field-bg:#ffffff; --ib-field-ink:#171B24; --ib-field-border:rgba(23,27,36,0.24);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat',system-ui,sans-serif;color:var(--ib-ink);-webkit-font-smoothing:antialiased}
.ib-wrap{max-width:1340px;margin:0 auto;padding:24px 28px 84px}
.ib-eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ib-teal)}
h1{font-size:28px;font-weight:800;letter-spacing:-0.02em;margin:4px 0 2px}
.ib-sub{font-size:12.5px;color:var(--ib-mut);margin:0;line-height:1.5;max-width:820px}
.ib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.ib-btn{border-radius:10px;padding:9px 16px;font:800 12.5px 'Montserrat',sans-serif;cursor:pointer;
  border:1px solid var(--ib-border-2);background:transparent;color:var(--ib-ink)}
.ib-btn.pri{background:var(--ib-teal);border-color:var(--ib-teal);color:#fff}
.ib-btn.sm{padding:6px 11px;font-size:11px}
.ib-btn:hover{filter:brightness(1.12)}
.ib-btn:disabled{opacity:.45;cursor:default}

/* home list */
.ib-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ib-fcard{text-align:left;border:1px solid var(--ib-border);background:var(--ib-surface);border-radius:14px;
  padding:14px 16px;cursor:pointer;color:var(--ib-ink);font-family:inherit;transition:border-color .15s,transform .15s}
.ib-fcard:hover{border-color:var(--ib-teal);transform:translateY(-2px)}
.ib-fcard .a{font-size:15px;font-weight:800;letter-spacing:-0.01em}
.ib-fcard .m{font-size:11.5px;font-weight:700;color:var(--ib-ink2);margin-top:3px}
.ib-fcard .r{font-size:10.5px;font-weight:600;color:var(--ib-mut);margin-top:7px}
.ib-chip{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  border-radius:6px;padding:2.5px 7px;line-height:1.5;background:var(--ib-teal-soft);color:var(--ib-teal);margin-left:6px}
.ib-chip.warn{background:var(--ib-warn-soft);color:var(--ib-warn)}
.ib-chip.good{background:var(--ib-good-soft);color:var(--ib-good)}
.ib-empty{padding:40px 10px;text-align:center;font-size:13px;font-weight:600;color:var(--ib-mut)}
.ib-ghead{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ib-teal);
  margin:18px 2px 9px;display:flex;align-items:center;gap:10px;grid-column:1/-1}
.ib-ghead::after{content:"";flex:1;height:1px;background:var(--ib-border)}
.ib-ghead .n{color:var(--ib-mut);letter-spacing:0;font-weight:700}

/* file header + steps */
.ib-fhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:2px 0 14px}
.ib-fhead h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-0.015em}
.ib-fhead .sub{font-size:12px;font-weight:700;color:var(--ib-mut)}
.ib-steps{display:flex;gap:6px;flex-wrap:wrap;background:var(--ib-surface-2);border:1px solid var(--ib-border);
  border-radius:12px;padding:5px;margin-bottom:16px}
.ib-step{border:0;background:transparent;color:var(--ib-mut);font:700 12px 'Montserrat',sans-serif;
  padding:8px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ib-step.on{background:var(--ib-teal);color:#fff}
.ib-step .d{width:7px;height:7px;border-radius:50%;background:var(--ib-mut);opacity:.6}
.ib-step .d.done{background:var(--ib-good);opacity:1}

/* forms */
.ib-card{border:1px solid var(--ib-border);background:var(--ib-surface);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.ib-card h3{margin:0 0 12px;font-size:14px;font-weight:800;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px}
.ib-card h3 .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.ib-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 12px}
.ib-form label,.ib-lb{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ib-mut)}
.ib-form input,.ib-form select,.ib-form textarea,.ib-inp{
  border-radius:9px;border:1px solid var(--ib-field-border);background:var(--ib-field-bg);
  color:var(--ib-field-ink);padding:9px 11px;font:600 12.5px 'Montserrat',sans-serif;outline:none}
.ib-form textarea{min-height:70px;resize:vertical;line-height:1.5}
.ib-form :focus,.ib-inp:focus{border-color:var(--ib-teal)}
.ib-note{font-size:11px;font-weight:600;color:var(--ib-mut);line-height:1.5}
.ib-form input[type=checkbox]{width:16px;height:16px;padding:0;margin:0;flex:0 0 auto}
.ib-savebar{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

/* suburb intel */
.ib-intel{border:1px solid rgba(0,160,180,.4);background:linear-gradient(140deg,var(--ib-teal-soft),transparent);border-radius:12px;padding:12px 14px;margin-top:12px}
.ib-intel .t{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ib-teal);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.ib-intel .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.ib-intel .cellk{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ib-mut)}
.ib-intel .cellv{font-size:14px;font-weight:800;margin-top:1px}

/* DD list */
.ib-dd{display:flex;flex-direction:column;gap:9px}
.ib-dditem{border:1px solid var(--ib-border);background:var(--ib-surface-2);border-radius:11px;padding:11px 13px}
.ib-dditem .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ib-dditem .nm{font-size:12.5px;font-weight:800;flex:1;min-width:200px}
.ib-dditem select{border-radius:8px;border:1px solid var(--ib-field-border);background:var(--ib-field-bg);
  color:var(--ib-field-ink);padding:6px 9px;font:700 11.5px 'Montserrat',sans-serif}
.ib-dditem select.s-Approved{color:var(--ib-good);border-color:rgba(113,179,87,.5)}
.ib-dditem select.s-Review{color:var(--ib-warn);border-color:rgba(255,169,31,.5)}
.ib-dditem select.s-Failed{color:var(--ib-bad);border-color:rgba(231,35,71,.5)}
.ib-dditem .src{font-size:10.5px;font-weight:700;color:var(--ib-blue);text-decoration:none}
.ib-dditem .src:hover{text-decoration:underline}
.ib-dditem textarea{width:100%;margin-top:8px;border-radius:8px;border:1px solid var(--ib-field-border);
  background:var(--ib-field-bg);color:var(--ib-field-ink);padding:7px 10px;font:600 11.5px 'Montserrat',sans-serif;min-height:34px;resize:vertical}
.ib-crit{margin-top:7px;font-size:10.5px;color:var(--ib-mut);line-height:1.5;display:none}
.ib-dditem.open .ib-crit{display:block}
.ib-crit b{font-weight:800}
.ib-crit .g{color:var(--ib-good)} .ib-crit .w{color:var(--ib-warn)} .ib-crit .b{color:var(--ib-bad)}
.ib-ddres{font-size:12px;font-weight:800;padding:8px 12px;border-radius:10px;display:inline-block;margin-bottom:12px}
.ib-ddres.Approved{background:var(--ib-good-soft);color:var(--ib-good)}
.ib-ddres.Review{background:var(--ib-warn-soft);color:var(--ib-warn)}
.ib-ddres.Failed{background:var(--ib-bad-soft);color:var(--ib-bad)}

/* review window */
.ib-rev-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ib-rev-prog{font-size:12px;font-weight:800;color:var(--ib-mut)}
.ib-rv{cursor:pointer;border-bottom:1px dashed var(--ib-border-2);padding:0 1px}
.ib-rv:hover{color:var(--ib-teal);border-color:var(--ib-teal)}
.ib-rv.num{font-variant-numeric:tabular-nums}
.ib-kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:7px 18px}
.ib-kv .pair{display:flex;gap:8px;align-items:baseline;font-size:12px;min-width:0}
.ib-kv .k{flex:none;max-width:46%;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ib-mut)}
.ib-kv .v{font-weight:700;overflow-wrap:anywhere}
.ib-tblwrap{overflow-x:auto}
.ib-tbl{border-collapse:collapse;width:100%;font-size:11.5px}
.ib-tbl th{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ib-mut);
  text-align:left;padding:5px 8px;border-bottom:1px solid var(--ib-border-2)}
.ib-tbl td{padding:6px 8px;border-bottom:1px solid var(--ib-border);font-weight:600;vertical-align:top}
.ib-checkbtn{border-radius:9px;padding:7px 12px;font:800 11px 'Montserrat',sans-serif;cursor:pointer;
  border:1px solid rgba(113,179,87,.55);background:var(--ib-good-soft);color:var(--ib-good)}
[data-theme="light"] .ib-checkbtn{color:#4E8A38}
.ib-checkbtn.off{border-color:var(--ib-border-2);background:transparent;color:var(--ib-mut)}
.ib-cashsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.ib-cash{border:1px solid var(--ib-border);border-radius:11px;padding:11px 13px;background:var(--ib-surface-2)}
.ib-cash .t{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ib-teal);margin-bottom:7px}
.ib-cash .row{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;padding:2px 0}
.ib-cash .row b{font-variant-numeric:tabular-nums}
.ib-cash .row.neg b{color:var(--ib-bad)} .ib-cash .row.pos b{color:var(--ib-good)}

/* rooms (inspection) */
.ib-room{border:1px solid var(--ib-border);background:var(--ib-surface-2);border-radius:11px;margin-bottom:9px;overflow:hidden}
.ib-room-h{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;font-size:12.5px;font-weight:800}
.ib-room-h .cnt{margin-left:auto;font-size:10px;font-weight:700;color:var(--ib-mut)}
.ib-room-b{display:none;padding:2px 13px 11px}
.ib-room.open .ib-room-b{display:block}
.ib-feat{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--ib-border)}
.ib-feat .fn{flex:1 1 150px;font-size:11.5px;font-weight:700;min-width:130px}
.ib-tgl{border:1px solid var(--ib-field-border);background:var(--ib-field-bg);color:var(--ib-mut);
  font:800 9.5px 'Montserrat',sans-serif;letter-spacing:.05em;text-transform:uppercase;border-radius:7px;padding:5px 9px;cursor:pointer}
.ib-tgl.on-p{background:var(--ib-good-soft);border-color:rgba(113,179,87,.55);color:var(--ib-good)}
.ib-tgl.on-r{background:var(--ib-warn-soft);border-color:rgba(255,169,31,.55);color:var(--ib-warn)}
.ib-tgl.on-m{background:var(--ib-bad-soft);border-color:rgba(231,35,71,.55);color:var(--ib-bad)}
.ib-feat input.fcost{width:84px;border-radius:7px;border:1px solid var(--ib-field-border);background:var(--ib-field-bg);
  color:var(--ib-field-ink);padding:5px 8px;font:600 11px 'Montserrat',sans-serif}
.ib-feat input.fnote{flex:2 1 160px;border-radius:7px;border:1px solid var(--ib-field-border);background:var(--ib-field-bg);
  color:var(--ib-field-ink);padding:5px 8px;font:600 11px 'Montserrat',sans-serif}

/* editable tables (pricing) */
.ib-etbl{border-collapse:collapse;width:100%;font-size:11.5px}
.ib-etbl th{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ib-mut);text-align:left;padding:4px 6px}
.ib-etbl td{padding:3px 4px;vertical-align:middle}
.ib-etbl input,.ib-etbl select{width:100%;min-width:56px;border-radius:7px;border:1px solid var(--ib-field-border);
  background:var(--ib-field-bg);color:var(--ib-field-ink);padding:6px 8px;font:600 11px 'Montserrat',sans-serif}
.ib-etbl .rm{border:0;background:transparent;color:var(--ib-bad);cursor:pointer;font-size:14px;padding:2px 6px}
.ib-derived{font-size:11px;font-weight:800;color:var(--ib-teal)}

/* evidence chips */
.ib-files{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.ib-file{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;border:1px solid var(--ib-border-2);
  border-radius:7px;padding:3px 7px;background:var(--ib-surface);cursor:pointer;color:var(--ib-ink2)}
.ib-file:hover{border-color:var(--ib-teal);color:var(--ib-ink)}
.ib-file .x{color:var(--ib-bad);cursor:pointer;font-weight:800}
.ib-attach{border:1px dashed var(--ib-border-2);background:transparent;color:var(--ib-mut);
  font:700 10px 'Montserrat',sans-serif;border-radius:7px;padding:4px 9px;cursor:pointer}
.ib-attach:hover{border-color:var(--ib-teal);color:var(--ib-teal)}

/* compliance */
.ib-comp-role{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ib-teal);margin:12px 0 5px}
.ib-comp-item{display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:1px dashed var(--ib-border);font-size:12px;font-weight:700}
.ib-comp-item .w{color:var(--ib-mut);font-size:10px;font-weight:600;margin-left:auto}
.ib-cbx{width:17px;height:17px;flex:none;border-radius:5px;border:1.5px solid var(--ib-field-border);background:var(--ib-field-bg);
  cursor:pointer;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900}
.ib-cbx.on{background:var(--ib-good);border-color:var(--ib-good)}
.ib-cbx.auto{cursor:default}
.ib-cbx.auto.off{background:var(--ib-surface-2)}

/* report preview + print */
.ib-prevwrap{display:flex;flex-wrap:wrap;gap:14px}
.ib-prev{width:315px;height:445px;overflow:hidden;border:1px solid var(--ib-border-2);border-radius:8px;background:#fff;
  box-shadow:0 10px 26px -14px #000;position:relative}
.ib-prev .pg{transform:scale(0.397);transform-origin:top left}
.ib-prev .lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(23,27,36,.85);color:#fff;
  font:700 9.5px 'Montserrat',sans-serif;padding:3px 8px;text-align:center}
#ibPrint{display:none}
.pg{width:794px;min-height:1122px;background:#fff;color:#2a3038;font-family:'Montserrat',system-ui,sans-serif;
  padding:44px 48px;position:relative;box-sizing:border-box}
.pg .band{background:#171B24;color:#fff;font-size:15px;font-weight:700;padding:9px 16px;margin:0 -48px 18px;display:flex;justify-content:space-between}
.pg .band .r{color:#9fe8f0}
.pg h2.pt{font-size:22px;font-weight:800;color:#171B24;margin:0 0 12px}
.pg .tealband{background:#37BCC8;color:#fff;text-align:center;font-size:20px;font-weight:800;padding:12px;margin:14px -12px}
.pg .gband{background:#DFF0CF;color:#2F5F50;font-size:16px;font-weight:700;padding:8px 14px;margin:6px 0}
/* cover: the distance band under the address (Saskia 2026-09-29) */
.pg .cbd{text-align:center;font-size:12px;font-weight:600;color:#555;margin:-6px 0 6px}
/* cashflow page: the disclaimer under the table, in the page's small print */
.pg .cfdisc{margin-top:10px}
.pg .cfdisc p{font-size:9.5px;line-height:1.5;color:#666;margin:0 0 4px}
/* many fee lines: tighter rows so the table + disclaimer still end inside A4 */
.pg table.cfb.dense td{padding:1.5px 6px}
.pg table.cfb.denser td{padding:1px 6px;font-size:10px}
.pg table{border-collapse:collapse;width:100%;font-size:11px}
.pg th{text-align:left;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:#666;padding:5px 8px;border-bottom:1.5px solid #ccc}
.pg td{padding:5px 8px;border-bottom:1px solid #eee;vertical-align:top}
.pg .chip{display:inline-block;font-size:9.5px;font-weight:800;border-radius:4px;padding:2px 8px;color:#fff}
.pg .c-Approved,.pg .c-Excellent{background:#4caf50}
.pg .c-Review,.pg .c-Average{background:#5f6771}
.pg .c-Failed{background:#E72347}
.pg .c-AboveAverage{background:#54c0de}
.pg .c-BelowAverage,.pg .c-Poor{background:#e08a3c}
.pg .c-neutral{background:#5f6771}
.pg .foot{position:absolute;bottom:18px;left:48px;right:48px;font-size:8.5px;color:#9aa;display:flex;justify-content:space-between}
.pg p{font-size:10.5px;line-height:1.55;margin:0 0 8px}
.pg .sec{font-size:12px;font-weight:800;color:#171B24;background:#eef1f4;padding:6px 10px;margin:12px 0 6px}
.pg .kvrow{display:flex;justify-content:space-between;font-size:11px;padding:4px 2px;border-bottom:1px solid #eee}
.pg .kvrow b{font-variant-numeric:tabular-nums}
.pg .cash3{display:flex;gap:14px}
.pg .cash3>div{flex:1;border:1px solid #ddd;border-radius:8px;padding:10px 12px}
.pg .cash3 .t{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#37BCC8;margin-bottom:6px}
/* cashflow breakdown (label · basis · amount) and the comparable-sales tables */
.pg table.cfb td{padding:2.5px 6px;font-size:10.5px;border-bottom:1px solid #eee;vertical-align:middle}
.pg .cfb td.m{color:#777;text-align:right;white-space:nowrap}
.pg .cfb td.v{text-align:right;font-variant-numeric:tabular-nums;width:112px;white-space:nowrap}
.pg .cfb tr.tot td{font-weight:800;border-top:1.5px solid #171B24;border-bottom:0;background:#F2F8F9}
.pg .cfb tr.neg td.v{color:#E72347}
.pg .sec.tight{margin:8px 0 3px;padding:4px 10px}
.pg table.cmp{font-size:9.5px}.pg table.cmp th{font-size:8.5px;padding:4px 6px}.pg table.cmp td{padding:3.5px 6px;white-space:nowrap}
.pg table.cmp td.wrap{white-space:normal}
.pg .pa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.pg .pa>div{border:1px solid #ddd;border-radius:8px;padding:8px 10px}
.pg .pa .k{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#37BCC8}
.pg .pa .v{font-size:14px;font-weight:800;color:#171B24;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg img.logo{height:34px}
@media print{
  body>*{display:none !important}
  body>#ibPrint{display:block !important}
  #ibPrint .pg{page-break-after:always;margin:0;box-shadow:none}
  @page{size:A4;margin:0}
}

.ib-prov{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  border-radius:5px;padding:1.5px 5px;margin-left:6px;vertical-align:1px}
.ib-prov.auto{background:var(--ib-teal-soft);color:var(--ib-teal)}
.ib-prov.edited{background:var(--ib-warn-soft);color:var(--ib-warn)}
[data-theme="light"] .ib-prov.edited{color:#B36F00}
/* property photos */
.ib-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.ib-photo{position:relative;border:1px solid var(--ib-border-2);border-radius:11px;overflow:hidden;background:var(--ib-surface-2);aspect-ratio:4/3}
.ib-photo img{width:100%;height:100%;object-fit:cover;display:block}
.ib-photo .cv{position:absolute;top:7px;left:7px;font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;

.ib-photo .acts{position:absolute;inset:auto 0 0 0;display:flex;gap:5px;justify-content:flex-end;padding:6px;

.ib-photo .acts button{border:0;border-radius:6px;font:800 9px 'Montserrat',sans-serif;padding:4px 8px;cursor:pointer;

.ib-photo .acts button.del{background:var(--ib-bad);color:#fff}

/* publish modal */
.ibp-ov{display:none;position:fixed;inset:0;z-index:9300;background:var(--shade-bg,rgba(10,14,22,0.72));

.ibp-dlg{width:min(620px,94vw);margin:8vh 0 6vh;background:var(--ib-solid);border:1px solid var(--ib-border-2);

.ibp-dlg .ib-form{margin-top:12px}
.ibp-stat{font-size:11.5px;font-weight:700;color:var(--ib-mut);margin-top:10px;min-height:16px}
.ib-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;

  padding:10px 18px;font:700 12.5px 'Montserrat',sans-serif;z-index:9400;pointer-events:none;transition:opacity .2s,transform .2s}
.ib-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══ 2026-09-30 redesign (the 30 Sep team structure) — report pages ═══
   Every client page: .ph header (title + address), content inside .pgc (a
   flow-root so the paginator measures exactly what prints), the .foot line. */
.pg .pgc{display:flow-root}
.pg .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid #D9D9D6}
.pg .ph .t{font-size:21px;font-weight:800;color:#171B24;letter-spacing:-.01em;line-height:1.15}
.pg .ph .t::before{content:"";display:block;width:34px;height:4px;border-radius:2px;background:#00A0B4;margin-bottom:9px}
.pg .ph .a{font-size:9.5px;font-weight:600;color:#63666A;text-align:right;line-height:1.45;max-width:55%}
.pg .ph .a b{color:#00A0B4;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:8.5px}
.pg .sh{font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#00A0B4;margin:14px 0 6px}
.pg .sh.first{margin-top:0}
.pg .lede{font-size:10.5px;line-height:1.55;color:#3F4650;margin:0 0 10px}
.pg .fine{font-size:8.5px;line-height:1.5;color:#63666A;margin:6px 0 0}
.pg .muted{color:#63666A}
.pg b.neg{color:#E72347}
/* grade chips on the 2.5–5 band: Excellent / Above Average teal, Average neutral,
   Below Average yellow, Poor red (word AND number print); .rc = comparability */
.pg .gc,.pg .rc{display:inline-block;font-size:8.5px;font-weight:800;line-height:1.35;border-radius:4px;padding:1px 6px;border:1px solid transparent;white-space:nowrap;letter-spacing:.01em}
.pg .gc.g5,.pg .rc.r5{background:#00A0B4;color:#fff}
.pg .gc.g4,.pg .rc.r4{background:#E8F7FA;border-color:#00A0B4;color:#171B24}
.pg .gc.g3,.pg .rc.r3{background:#D9D9D6;color:#171B24}
.pg .gc.g2,.pg .rc.r2{background:#FFA91F;color:#171B24}
.pg .gc.g1,.pg .rc.r1{background:#E72347;color:#fff}
.pg .gc.gn,.pg .rc.rn{background:#F1F2F3;color:#63666A;border-color:#D9D9D6}
.pg .bb{display:inline-flex;gap:2px;vertical-align:middle}
.pg .bb i{display:block;width:11px;height:6px;border-radius:2px;background:#ECEDEE}
.pg .bb.g5 i.on{background:#00A0B4}.pg .bb.g4 i.on{background:#00A0B4;opacity:.55}
.pg .bb.g3 i.on{background:#63666A;opacity:.55}.pg .bb.g2 i.on{background:#FFA91F}.pg .bb.g1 i.on{background:#E72347}
/* cover */
.pg.cover{padding:0}
.pg .cv{padding:44px 48px 0}
.pg .cv-top{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.pg .cv-top .eb{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#00A0B4}
.pg .cv-top .pr{font-size:9.5px;font-weight:600;color:#63666A}
.pg .cv-addr{font-size:30px;font-weight:800;letter-spacing:-.02em;color:#171B24;line-height:1.12;margin:26px 0 4px}
.pg .cv-loc{font-size:14px;font-weight:600;color:#63666A}
.pg .cv .cbd{text-align:left;font-size:12px;font-weight:700;color:#00A0B4;margin:8px 0 0}
.pg .cv-facts{font-size:11.5px;font-weight:700;color:#3F4650;margin:8px 0 0}
.pg .cv-hero{margin:22px 0 0;height:440px;overflow:hidden;background:#F1F2F3}
.pg .cv-hero img{width:100%;height:100%;object-fit:cover;display:block}
.pg .cv-bands{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:22px 48px 0}
.pg .cv-bands>div{border:1px solid #E4E7EA;border-radius:10px;padding:11px 14px}
.pg .cv-bands .k{font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#63666A}
.pg .cv-bands .v{font-size:15px;font-weight:800;color:#171B24;margin-top:3px}
.pg .cv-prep{padding:14px 48px 0;font-size:10px;font-weight:600;color:#63666A}
.pg .cv-imp{position:absolute;left:48px;right:250px;bottom:44px;font-size:7.5px;line-height:1.5;color:#7A7F86}
.pg .cv-imp b{display:block;font-size:8px;letter-spacing:.08em;color:#63666A;margin-bottom:2px}
.pg img.cv-logo{position:absolute;right:48px;bottom:46px;height:40px}
/* executive summary */
.pg .xline{font-size:10.5px;font-weight:600;color:#3F4650;margin:-4px 0 12px}
.pg .xc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pg .xc>div{border:1px solid #E4E7EA;border-radius:10px;padding:10px 12px;min-height:96px}
.pg .xc .k{font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#00A0B4}
.pg .xc .v{font-size:19px;font-weight:800;color:#171B24;margin-top:4px;white-space:nowrap}
.pg .xc .v small{font-size:11px;font-weight:700;color:#63666A}
.pg .xc .s{font-size:8.5px;font-weight:600;color:#63666A;margin-top:4px;line-height:1.45}
.pg .xc .dv{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:4px}
.pg .xc .dv b{font-size:15.5px;font-weight:800;color:#171B24;white-space:nowrap}
.pg .xc .dv span{font-size:8px;font-weight:700;color:#63666A;text-align:right}
.pg .xq{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.pg .xq>div{border-top:3px solid #00A0B4;padding-top:8px}
.pg .xq h4{margin:0 0 6px;font-size:12px;font-weight:800;color:#171B24}
.pg .xq p{font-size:10px;line-height:1.6;color:#3F4650;margin:0}
.pg .xq ul{margin:0;padding-left:13px}
.pg .xq li{font-size:10px;line-height:1.5;color:#3F4650;margin:0 0 4px}
.pg .mk{margin-top:18px;background:#F2F8F9;border:1px solid #D5EBEE;border-radius:12px;padding:13px 15px}
.pg .mk .mt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px}
.pg .mk .mt b{font-size:13px;font-weight:800;color:#171B24}
.pg .mk .mt span{font-size:8.5px;font-weight:700;color:#63666A}
.pg .mk .mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pg .mk .mg>div{background:#fff;border-radius:8px;padding:8px 10px;border:1px solid #E4EEF0}
.pg .mk .mg .k{font-size:7.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#63666A}
.pg .mk .mg .v{font-size:13.5px;font-weight:800;color:#171B24;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg .mk .mg .s{font-size:8px;font-weight:600;color:#63666A;margin-top:2px;line-height:1.4}
.pg .mk .note{font-size:9.5px;line-height:1.5;color:#3F4650;margin:9px 0 0}
.pg.tight .xq li,.pg.tight .xq p{font-size:8.8px;line-height:1.45}
.pg.tight .xc>div{min-height:84px}
/* map + location grading */
.pg .mapw{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}
.pg .mapbox{position:relative;width:330px;height:520px;border-radius:10px;overflow:hidden;background:#F1F2F3;border:1px solid #E4E7EA}
.pg .mapbox img{display:block;width:330px;height:520px;object-fit:cover}
.pg .mapbox.auto{height:auto}.pg .mapbox.auto img{height:auto;max-height:520px;object-fit:cover}
.pg .mapbox .chip{position:absolute;left:10px;top:10px;background:#171B24;color:#fff;font-size:9px;font-weight:800;border-radius:6px;padding:4px 9px}
.pg .mapbox .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:10.5px;font-weight:700;color:#63666A;line-height:1.5}
.pg .mapattr{font-size:7.5px;color:#7A7F86;margin-top:4px}
.pg .lr{display:grid;grid-template-columns:1fr auto 62px;gap:8px;align-items:center;padding:5.5px 0;border-bottom:1px solid #EEF0F1;font-size:10px;font-weight:600;color:#171B24}
.pg .lr .nm small{display:block;font-size:8px;font-weight:500;color:#7A7F86;margin-top:1px}
.pg .legend{font-size:8px;font-weight:600;color:#63666A;line-height:1.6;margin:0 0 6px}
.pg .legend .gc{margin-right:3px}
.pg .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pg .tiles>div{border:1px solid #E4E7EA;border-radius:10px;padding:10px 12px}
.pg .tiles .k{font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#00A0B4}
.pg .tiles .v{font-size:15px;font-weight:800;color:#171B24;margin-top:3px}
.pg .tiles .s{font-size:8.5px;font-weight:600;color:#63666A;margin-top:3px;line-height:1.45}
/* clean tables for the new pages */
.pg table.t2 th{font-size:8px;letter-spacing:.07em;color:#63666A;padding:5px 6px;border-bottom:1.5px solid #171B24}
.pg table.t2 td{font-size:9.5px;padding:5px 6px;border-bottom:1px solid #EEF0F1;vertical-align:middle}
.pg table.t2 td.r,.pg table.t2 th.r{text-align:right}
.pg table.t2 td.c,.pg table.t2 th.c{text-align:center}
.pg table.t2 td.nw{white-space:nowrap}
/* comparable sales: eleven columns on one A4 page — tighter cells and chips than the other t2 tables */
.pg table.t2.cs th{padding:5px 3px}.pg table.t2.cs td{padding:5px 3px}.pg table.t2.cs .rc{font-size:8px;padding:1px 4px}
.pg table.t2 td.cm{color:#63666A;font-size:9px;line-height:1.45}
.pg table.t2 tr.tot td{font-weight:800;border-top:1.5px solid #171B24;border-bottom:0;background:#F2F8F9}
.pg table.t2.cp td{padding:3px 6px;font-size:9px}
/* cashflow: the two bottom lines + the IC rate definition */
.pg .cfb tr.bl td{font-size:11px;background:#E8F6F8}
.pg table.cfb.densest td{padding:.5px 6px;font-size:9.5px}
.pg .icdef{font-size:9px;line-height:1.5;color:#3F4650;margin:8px 0 0}
/* inspection / minimum standards */
.pg .ckg{font-size:10.5px;font-weight:800;color:#171B24;margin:10px 0 3px;padding-bottom:3px;border-bottom:1.5px solid #171B24}
.pg .cksub{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#63666A;margin:6px 0 1px}
.pg .ck{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:3.5px 0;border-bottom:1px solid #EEF0F1;font-size:9px;line-height:1.45;color:#171B24}
.pg .ck .cmt{display:block;color:#3F4650;font-style:italic;margin-top:2px}
.pg .ck .phs{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.pg .ck .phs img{width:84px;height:63px;object-fit:cover;border-radius:4px;display:block}
.pg .pp{display:inline-block;width:40px;text-align:center;font-size:7.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 0;align-self:start}
.pg .pp.pass{background:#00A0B4;color:#fff}.pg .pp.fail{background:#E72347;color:#fff}
.pg .pp.na{background:#D9D9D6;color:#171B24}.pg .pp.none{background:#F4F5F6;color:#9AA0A6}
.pg .ticks{margin:6px 0 0;padding:0;list-style:none}
.pg .ticks li{font-size:9.5px;line-height:1.5;margin:2px 0;display:flex;gap:7px;align-items:flex-start}
.pg .ticks li i{flex:none;width:11px;height:11px;border:1.5px solid #171B24;border-radius:2px;margin-top:1px;font-style:normal;font-size:8px;line-height:9px;text-align:center;font-weight:900}
.pg .ticks li i.on{background:#00A0B4;border-color:#00A0B4;color:#fff}
.pg .sign{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.pg .sign>div{border-bottom:1px solid #171B24;padding:4px 0}
.pg .sign .k{font-size:7.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#63666A}
.pg .sign .v{font-size:10px;font-weight:700;min-height:14px}
/* additional costs + settlement: boilerplate in two columns */
.pg .cols2{column-count:2;column-gap:24px}
.pg .cols2 p{font-size:9.3px;line-height:1.5;margin:0 0 6px;break-inside:avoid-column}
.pg .cols2 p.hd{font-size:10px;font-weight:800;color:#171B24;margin:8px 0 3px;break-after:avoid-column}
.pg .cols2 ul{margin:0 0 6px;padding-left:13px}
.pg .cols2 li{font-size:9.3px;line-height:1.45}
.pg .cols2 .lbl{font-weight:800;color:#171B24}
/* strata fact sheet */
.pg .fs{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.pg .fs>div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #EEF0F1;font-size:9.5px}
.pg .fs>div span{color:#63666A;font-weight:600}
.pg .fs>div b{text-align:right;font-weight:700;color:#171B24}
.pg .para{font-size:9.5px;line-height:1.55;color:#171B24;margin:0 0 8px;white-space:pre-wrap}
/* price analysis tiles */
.pg .pa2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 4px}
.pg .pa2>div{border:1px solid #E4E7EA;border-radius:9px;padding:8px 11px}
.pg .pa2 .k{font-size:8px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#00A0B4}
.pg .pa2 .v{font-size:13.5px;font-weight:800;color:#171B24;margin-top:3px}
.pg .rcleg{font-size:8px;font-weight:600;color:#63666A;margin:5px 0 0;line-height:1.8}
.pg .rcleg .rc{margin:0 2px 0 8px}
.pg .rcleg .rc:first-child{margin-left:0}

/* ═══ 2026-09-30 redesign — editor ═══ */
.ib-seg{display:inline-flex;gap:3px;background:var(--ib-surface-2);border:1px solid var(--ib-border);border-radius:10px;padding:3px}
.ib-seg button{border:0;background:transparent;color:var(--ib-mut);font:800 11px 'Montserrat',sans-serif;padding:6px 12px;border-radius:7px;cursor:pointer}
.ib-seg button.on{background:var(--ib-teal);color:#fff}
.ib-map{height:260px;border-radius:11px;border:1px solid var(--ib-border-2);margin:10px 0 8px;overflow:hidden;background:var(--ib-surface-2)}
.ib-gchip{display:inline-block;font-size:9px;font-weight:800;border-radius:6px;padding:3px 8px;white-space:nowrap}
.ib-gchip.g5{background:var(--ib-teal);color:#fff}
.ib-gchip.g4{background:var(--ib-teal-soft);color:var(--ib-teal);box-shadow:inset 0 0 0 1px rgba(0,160,180,.55)}
.ib-gchip.g3{background:var(--ib-surface-2);color:var(--ib-ink2);box-shadow:inset 0 0 0 1px var(--ib-border-2)}
.ib-gchip.g2{background:var(--ib-warn-soft);color:var(--ib-warn);box-shadow:inset 0 0 0 1px rgba(255,169,31,.55)}
.ib-gchip.g1{background:var(--ib-bad-soft);color:var(--ib-bad);box-shadow:inset 0 0 0 1px rgba(231,35,71,.5)}
[data-theme="light"] .ib-gchip.g2{color:#9A5F00}
/* comparability selects, coloured like the report chips */
.ib-etbl select.cr-5{background:var(--ib-teal);color:#fff;border-color:var(--ib-teal)}
.ib-etbl select.cr-4{background:var(--ib-teal-soft);color:var(--ib-teal);border-color:rgba(0,160,180,.6)}
.ib-etbl select.cr-3{border-color:var(--ib-border-2)}
.ib-etbl select.cr-2{background:var(--ib-warn-soft);color:var(--ib-warn);border-color:rgba(255,169,31,.6)}
.ib-etbl select.cr-1{background:var(--ib-bad-soft);color:var(--ib-bad);border-color:rgba(231,35,71,.55)}
[data-theme="light"] .ib-etbl select.cr-2{color:#9A5F00}
.ib-etbl select option{background:var(--ib-field-bg);color:var(--ib-field-ink)}
/* checklist */
.ib-ckgrp{border:1px solid var(--ib-border);background:var(--ib-surface-2);border-radius:11px;margin-bottom:9px;overflow:hidden}
.ib-ckgrp>.h{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;font-size:12.5px;font-weight:800}
.ib-ckgrp>.h .cnt{margin-left:auto;font-size:10px;font-weight:700;color:var(--ib-mut)}
.ib-ckgrp>.b{display:none;padding:0 13px 10px}
.ib-ckgrp.open>.b{display:block}
.ib-cksub{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ib-teal);margin:10px 0 2px}
.ib-ck{padding:9px 0;border-top:1px dashed var(--ib-border)}
.ib-ck .tx{font-size:12px;font-weight:600;line-height:1.5}
.ib-ck .phint{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ib-blue);margin-left:6px}
.ib-ck .ctl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}
.ib-tri{display:inline-flex;gap:0;border:1px solid var(--ib-field-border);border-radius:8px;overflow:hidden}
.ib-tri button{border:0;border-right:1px solid var(--ib-field-border);background:var(--ib-field-bg);color:var(--ib-mut);font:800 10px 'Montserrat',sans-serif;
  letter-spacing:.05em;text-transform:uppercase;padding:7px 12px;cursor:pointer;min-width:58px}
.ib-tri button:last-child{border-right:0}
.ib-tri button.on.pass{background:var(--ib-teal);color:#fff}
.ib-tri button.on.fail{background:var(--ib-bad);color:#fff}
.ib-tri button.on.na{background:var(--ib-ink2);color:var(--ib-solid)}
.ib-tri button:disabled{cursor:default}
.ib-ck textarea{width:100%;margin-top:7px;border-radius:8px;border:1px solid var(--ib-field-border);background:var(--ib-field-bg);color:var(--ib-field-ink);
  padding:7px 10px;font:600 11.5px 'Montserrat',sans-serif;min-height:38px;resize:vertical}
.ib-thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = v => (v == null || !isFinite(v)) ? '—' : (v < 0 ? '-$' : '$') + Math.abs(Math.round(v)).toLocaleString();

/* ── Distance from CBD + the cashflow disclaimer (Saskia, 2026-09-29) ─────
   The client report prints the grading page's "Distance From CBD" grade as a
   distance band under the cover's address (no map screenshot needed), and the
   cashflow page closes on the disclaimer below — the same two things the IR
   Samples deck shows, so a Vault example IR (this report, published as a PDF)
   reads the same as the sample. A grade's own rubric note is one bound and
   its neighbour's the other; the two ends stay open. Derived at render time
   from grading.items (nothing stored); no grade → no line.
   LOCKSTEP: same table + text as ir-samples.html and presentation.html —
   see docs/pp-os-migration/ir-chain.md. */
const CBD_BANDS = {
  'excellent':     'Within 2.5 KM of the CBD',          /* rubric: "Within 2.5km of the CBD" */
  'above average': 'Between 2.5 - 5 KM from the CBD',   /* rubric: "Within 5km of the CBD" */
  'average':       'Between 5 - 25 KM from the CBD',    /* rubric: "More than 5km from the CBD" */
  'below average': 'Between 25 - 50 KM from the CBD',   /* rubric: "More than 25km from the CBD" */
  'poor':          'More than 50 KM from the CBD',      /* rubric: "More than 50km to the CBD" */
};
function cbdBand(file) {
  const items = (((file || {}).grading || {}).items) || {};
  const key = Object.keys(items).find(k => /^\s*distance\s+from\s+cbd\s*$/i.test(k));
  return (key && CBD_BANDS[String(items[key] || '').trim().toLowerCase()]) || '';
}
const CF_DISCLAIMER = [
  'The above cashflow is an indicative example considering many variables and assumptions.',
  'It does not include any tax impacts that may be applicable, including benefits such as depreciation and negative gearing. Where negative gearing is not available, the annual loss may still be carried forward and applied to the final capital gains outcome. Tax outcomes are individual and must be discussed with an accountant or financial planner, and are therefore not factored into the cashflow.',
];


/* ════════ 2026-09-30 REDESIGN — the 30 Sep team structure (Johny's brief) ════════
   Client report = 11 sections (cover · executive summary · map + location
   grading · asset grading · two-rate cashflow · inspection / minimum standards ·
   additional costs + settlement · strata DD (units) · AMP · price analysis ·
   disclaimer); the Preliminary DD, the full grading matrix and Insurance Help
   moved to the Internal pack. Every new field lives inside the existing jsonb
   section columns (no migration). Full inventory for the pp-os port:
   docs/pp-os-migration/ir-builder.md — append every later change to its Changelog. */

/* ── location vs asset attributes. The rubric (ir_grading_rubric, 31 items) is
   split HERE, not by ir_config.grading_layout: that layout files Views under
   location, lists "Title Type" (not a rubric item) and has no Building Quality.
   Anything graded that is in neither list (Title Type, the commercial rubric's
   Lease Terms, Tenant Quality …) is an asset attribute unless its name says
   location. ── */
const LOCATION_ATTRS = ['Distance From CBD', 'Security of the Area', 'Public Transport', 'Average Area Income',
  'University/Schools in Area', 'Café', 'Shops', 'Proximity to Open Space', 'Proximity to Ocean/Bay/River/Lake',
  'Street Scape/Traffic Flow', 'Properties Adjoining'];
const ASSET_ATTRS = ['Property Type', 'Building Quality', 'Natural Light', 'Privacy', 'Noise', 'Land Content', 'Scarcity Factor',
  'Price Risk', 'Orientation', 'Outdoor Space', 'Parking', 'Internal Floor Plan Flow', 'Slope', 'Outdoor Access and Flow',
  'Stand Alone', 'Stairs', 'Shape/Frontage', 'Value Add Opportunity', 'Building Condition', 'Views'];
const ATTR_ALIAS = { 'Proximity to Ocean/Bay/River': 'Proximity to Ocean/Bay/River/Lake' };   /* the old layout's spelling */
const FACT_OPTIONS = { 'Title Type': ['Torrens', 'Strata', 'Company', 'Community'] };          /* graded facts, not qualities */
const attrKey = k => ATTR_ALIAS[k] || k;
function isLocationAttr(item) {
  const k = attrKey(item);
  if (LOCATION_ATTRS.includes(k)) return true;
  if (ASSET_ATTRS.includes(k)) return false;
  return /location|distance|proximity/i.test(k);
}
/* graded items → [[item, grade]] in the brief's order, extras (non-rubric) last */
function splitGrading(items) {
  const it = items || {}, keys = Object.keys(it).filter(k => it[k] != null && it[k] !== '');
  const order = list => list.map(a => keys.find(k => attrKey(k) === a)).filter(Boolean);
  const locK = order(LOCATION_ATTRS), astK = order(ASSET_ATTRS);
  const extra = keys.filter(k => !locK.includes(k) && !astK.includes(k));
  return {
    loc: locK.concat(extra.filter(isLocationAttr)).map(k => [k, it[k]]),
    asset: astK.concat(extra.filter(k => !isLocationAttr(k))).map(k => [k, it[k]]),
  };
}
/* grade → the 2.5–5 band. The word AND the number print; Excellent spans 4.5–5
   (4.75 when averaged). Colour: Excellent / Above Average teal, Average neutral,
   Below Average yellow, Poor red. */
const GRADE_BAND = {
  'Poor':          { n: 2.5,  txt: '2.5',     cls: 'g1', rank: 1 },
  'Below Average': { n: 3,    txt: '3',       cls: 'g2', rank: 2 },
  'Average':       { n: 3.5,  txt: '3.5',     cls: 'g3', rank: 3 },
  'Above Average': { n: 4,    txt: '4',       cls: 'g4', rank: 4 },
  'Excellent':     { n: 4.75, txt: '4.5–5',   cls: 'g5', rank: 5 },
};
function gradeBand(v) {
  const k = Object.keys(GRADE_BAND).find(g => g.toLowerCase() === String(v == null ? '' : v).trim().toLowerCase());
  return k ? Object.assign({ word: k }, GRADE_BAND[k]) : null;
}
/* report chip: "Above Average · 4"; a non-grade value (House, Strata) is a neutral fact chip */
function gradeChip(v) {
  const b = gradeBand(v);
  return b ? '<span class="gc ' + b.cls + '">' + esc(b.word) + ' · ' + b.txt + '</span>'
    : '<span class="gc gn">' + esc(v == null || v === '' ? '—' : v) + '</span>';
}
function gradeBar(v) {
  const b = gradeBand(v); if (!b) return '';
  return '<span class="bb ' + b.cls + '">' + [1, 2, 3, 4, 5].map(i => '<i' + (i <= b.rank ? ' class="on"' : '') + '></i>').join('') + '</span>';
}
/* comparability (comparable sales / rents): Superior + Slightly Superior teal shades,
   Comparable neutral grey, Slightly Inferior yellow, Inferior red. Case-insensitive —
   a few imported rows carry "slightly inferior". */
const COMP_BAND = { 'inferior': ['r1', 'Inf'], 'slightly inferior': ['r2', 'Sl. inf'], 'comparable': ['r3', 'Comp'],
  'slightly superior': ['r4', 'Sl. sup'], 'superior': ['r5', 'Sup'] };
function compChip(v, short) {
  const k = String(v == null ? '' : v).trim().toLowerCase(), b = COMP_BAND[k];
  if (!b) return v ? '<span class="rc rn">' + esc(v) + '</span>' : '<span class="muted">—</span>';
  const word = COMPARABILITY.find(c => c.toLowerCase() === k) || v;
  return '<span class="rc ' + b[0] + '"' + (short ? ' title="' + esc(word) + '"' : '') + '>' + esc(short ? b[1] : word) + '</span>';
}
function compCls(v) { const b = COMP_BAND[String(v == null ? '' : v).trim().toLowerCase()]; return b ? 'cr-' + b[0].slice(1) : ''; }

/* ── the strata gate: units / apartments / flats / townhouses / villas, or any
   file graded "Title Type: Strata". A whole unit block (a commercial purchase of
   the building on its own title) is NOT a strata-lot purchase. ── */
function isStrata(file) {
  const c = file || CUR || {}, s = c.setup || {};
  const t = String(s.propertyType || '');
  if (/block/i.test(t) || s.commercial === true) return false;
  if (/unit|apart|flat|townhouse|villa/i.test(t)) return true;
  const tt = (((c.grading || {}).items) || {})['Title Type'];
  return /^\s*strata\s*$/i.test(String(tt || ''));
}
const isVicFile = c => String((c || CUR || {}).state || '').trim().toUpperCase() === 'VIC';

/* ── the client cashflow: interest only, the SAME inputs run twice — at today's
   rate (RATES.current, rdp_runway_config rates.current.rate) and at the IC rate
   (RATES.normalised = rates.forecast.rate). calcCashflow() is untouched (LOCKSTEP
   with ir-samples.html); in 'io' mode it reads cf.rate, so each run gets a copy
   carrying its rate. Everything but interest / annual / weekly is identical. ── */
function cfTwoRate(cf) {
  const run = r => calcCashflow(Object.assign({}, cf || {}, { rate: r }), 'io', r);
  const cur = run(RATES.current), ic = run(RATES.normalised);
  return cur && ic ? { cur, ic, rCur: RATES.current, rIc: RATES.normalised } : null;
}

/* ── measured pagination. Report pages are A4 (794 × 1122 px, 44 px padding top
   and bottom), and the publish PDF squeezes each .pg into ONE A4 image — so no
   page may run long. flowPages() lays blocks onto pages by measuring them in an
   off-screen .pg; table rows are blocks too (a row never splits; the table head
   repeats on every page); `keep` blocks (headings) move with the block after. ── */
const PG_INNER_MAX = 1030;   /* content box: 1122 − 44 − 44 = 1034, minus a hair for rounding */
function _measureHost() {
  let m = document.getElementById('ibMeasure');
  if (!m) {
    m = document.createElement('div'); m.id = 'ibMeasure'; m.setAttribute('aria-hidden', 'true');
    m.style.cssText = 'position:fixed;left:-30000px;top:0;width:794px;visibility:hidden;pointer-events:none;z-index:-1';
    document.body.appendChild(m);
  }
  return m;
}
function pageHeight(html, pgCls) {
  const m = _measureHost();
  m.innerHTML = '<div class="pg' + (pgCls ? ' ' + pgCls : '') + '"><div class="pgc">' + html + '</div></div>';
  const h = m.querySelector('.pgc').offsetHeight;
  m.innerHTML = '';
  return h;
}
function _blocksHtml(blocks) {
  let h = '', open = null;
  for (const b of blocks) {
    if (b.row != null) {
      if (open !== b.tbl) { if (open) h += '</table>'; h += '<table class="' + (b.cls || '') + '">' + (b.head || ''); open = b.tbl; }
      h += b.row;
    } else { if (open) { h += '</table>'; open = null; } h += b.h; }
  }
  if (open) h += '</table>';
  return h;
}
function flowPages(title, headFn, blocks, pgCls) {
  const out = []; let cur = [];
  const fits = arr => pageHeight(headFn(out.length) + _blocksHtml(arr), pgCls) <= PG_INNER_MAX;
  for (const b of blocks) {
    if (fits(cur.concat([b]))) { cur.push(b); continue; }
    const carry = [];
    while (cur.length && cur[cur.length - 1].keep) carry.unshift(cur.pop());
    if (cur.length) out.push(cur);
    cur = carry.concat([b]);
    if (!fits(cur)) {            /* one block taller than a page: it gets a page of its own */
      if (carry.length) { out.push(carry); cur = [b]; }
      out.push(cur); cur = [];
    }
  }
  if (cur.length || !out.length) out.push(cur);
  return out.map((arr, k) => ({ t: title + (out.length > 1 ? ' (' + (k + 1) + '/' + out.length + ')' : ''),
    h: headFn(k) + _blocksHtml(arr), cls: pgCls || '' }));
}

/* ── the map. CARTO light_all was the decided basemap, but CARTO now answers every
   keyless tile request with an "API KEY REQUIRED" watermark (checked 2026-09-30,
   light_all and dark_all, any referer). So tiles come from OpenStreetMap's own
   server (CORS-enabled, free with attribution, light use only) and are lightened
   in the canvas toward the CARTO look; swap MAP_TILES.url back to CARTO once a key
   exists. The report prints a canvas SNAPSHOT (data URL): html2canvas misplaced
   Leaflet's SVG marker in testing, and an <img> prints identically in window.print,
   page.pdf and the publish PDF. Leaflet stays for the Setup pin picker. ── */
const MAP_TILES = {
  url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  attribution: 'Map data © OpenStreetMap contributors',
  lighten: true,
};
const MAP_ZOOM = 15;
const MAP_SNAP = {};
function _tileImg(url) {
  return new Promise(res => {
    const im = new Image(); let done = false;
    const fin = v => { if (!done) { done = true; res(v); } };
    im.crossOrigin = 'anonymous';
    im.onload = () => fin(im); im.onerror = () => fin(null);
    setTimeout(() => fin(null), 9000);
    im.src = url;
  });
}
async function mapSnapshot(lat, lng, w, h, zoom) {
  lat = +lat; lng = +lng; const z = zoom || MAP_ZOOM;
  if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 85) return null;
  const key = [lat.toFixed(6), lng.toFixed(6), z, w, h].join(',');
  if (MAP_SNAP[key] !== undefined) return MAP_SNAP[key];
  const n = Math.pow(2, z), T = 256;
  const px = (lng + 180) / 360 * n * T;
  const lr = lat * Math.PI / 180;
  const py = (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n * T;
  const x0 = px - w / 2, y0 = py - h / 2;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#F1F2F3'; ctx.fillRect(0, 0, w, h);
  const jobs = [];
  for (let tx = Math.floor(x0 / T); tx <= Math.floor((x0 + w) / T); tx++)
    for (let ty = Math.floor(y0 / T); ty <= Math.floor((y0 + h) / T); ty++) {
      if (ty < 0 || ty >= n) continue;
      const wx = ((tx % n) + n) % n;
      const u = MAP_TILES.url.replace('{z}', z).replace('{x}', wx).replace('{y}', ty);
      jobs.push(_tileImg(u).then(im => ({ im, dx: Math.round(tx * T - x0), dy: Math.round(ty * T - y0) })));
    }
  const tiles = await Promise.all(jobs);
  let got = 0;
  for (const t of tiles) if (t.im) { ctx.drawImage(t.im, t.dx, t.dy); got++; }
  if (!got) { MAP_SNAP[key] = null; return null; }
  try {
    if (MAP_TILES.lighten) {
      const d = ctx.getImageData(0, 0, w, h), a = d.data;
      for (let i = 0; i < a.length; i += 4) {
        const l = 0.3 * a[i] + 0.59 * a[i + 1] + 0.11 * a[i + 2];
        for (let c = 0; c < 3; c++) { const v = a[i + c] * 0.45 + l * 0.55; a[i + c] = Math.min(255, v + (255 - v) * 0.22); }
      }
      ctx.putImageData(d, 0, 0);
    }
    /* the property: a teal pin with a white ring at the exact centre */
    const cx = w / 2, cy = h / 2;
    ctx.beginPath(); ctx.arc(cx, cy + 1.5, 13, 0, Math.PI * 2); ctx.fillStyle = 'rgba(23,27,36,.22)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, 8.5, 0, Math.PI * 2); ctx.fillStyle = '#00A0B4'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
    MAP_SNAP[key] = cv.toDataURL('image/png');
  } catch (e) { MAP_SNAP[key] = null; }   /* a tainted canvas (a tile without CORS) → no snapshot */
  return MAP_SNAP[key];
}
/* Leaflet for the Setup pin picker — the hub's pinned CDN build (demand-score.html) */
function loadLeaflet() {
  if (window.L && window.L.map) return Promise.resolve();
  if (loadLeaflet._p) return loadLeaflet._p;
  loadLeaflet._p = new Promise((res, rej) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    css.integrity = 'sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H'; css.crossOrigin = 'anonymous'; css.referrerPolicy = 'no-referrer';
    document.head.appendChild(css);

const _exTxt = (v, arr) => arr ? (Array.isArray(v) ? v : (v ? [String(v)] : [])).join('\n') : String(v == null ? '' : v);
/* stored text wins only once the BA has edited it; otherwise the live draft prints */
function execResolved(c, T, mk) {
  const D = execDrafts(c, T, mk), S = ((c.setup || {}).execSummary) || {}, A = S.auto || {}, out = {};
  for (const [k, arr] of EXEC_KEYS) {
    const sv = _exTxt(S[k], arr), av = _exTxt(A[k], arr);
    out[k] = (!sv.trim() || sv === av) ? D[k] : (arr ? sv.split('\n').map(x => x.trim()).filter(Boolean) : sv);
    out[k + 'Edited'] = !!(sv.trim() && sv !== av);
  }
  return out;
}

async function wireGeo() {
  GEO_WORK = {};
  if (GEO_MAP) { try { GEO_MAP.remove(); } catch (e) {} GEO_MAP = null; GEO_MARK = null; }
  const box = document.getElementById('ibGeoMap'); if (!box) return;
  const g = ((CUR.setup || {}).geo) || {};
  const inLat = $('#fLat'), inLng = $('#fLng');
  const autoPt = () => GEO_WORK.auto || g.auto || null;
  const chip = () => {
    const a = autoPt(), lat = parseFloat(inLat.value), lng = parseFloat(inLng.value);
    let h = '';
    if (isFinite(lat) && isFinite(lng)) {
      const isAuto = !!a && Math.abs(lat - a.lat) < 1e-6 && Math.abs(lng - a.lng) < 1e-6;
      h = '<span class="ib-prov ' + (isAuto ? 'auto' : 'edited') + '">' + (isAuto ? 'auto' : 'edited') + '</span>';
    }
    $('#geoChipLat').innerHTML = h; $('#geoChipLng').innerHTML = h;
  };
  let place = () => {};
  const put = (lat, lng, pan) => { inLat.value = (+lat).toFixed(6); inLng.value = (+lng).toFixed(6); place(+lat, +lng, pan); chip(); };
  inLat.oninput = inLng.oninput = () => { const a = parseFloat(inLat.value), b = parseFloat(inLng.value); if (isFinite(a) && isFinite(b)) place(a, b, true); chip(); };
  chip();
  const btn = $('#geoLocate');
  if (btn) btn.onclick = async () => {
    btn.disabled = true;
    const q = geoQuery({ address: $('#fAddr').value, suburb: $('#fSub').value, state: $('#fState').value, postcode: $('#fPost').value });
    $('#geoStat').textContent = 'Looking up the address…';
    const hit = await geocodeOnce(q);   /* one request per click */
    if (hit) { GEO_WORK = { auto: { lat: hit.lat, lng: hit.lng }, q, at: new Date().toISOString(), kind: hit.kind }; put(hit.lat, hit.lng, true);
      $('#geoStat').textContent = 'Found from the address' + (hit.kind ? ' (' + hit.kind + ')' : '') + ' — save Setup to keep it'; }
    else $('#geoStat').textContent = 'No match for this address — drag the pin or type the coordinates';
    setTimeout(() => { if (document.body.contains(btn)) btn.disabled = false; }, 1500);
  };
  try { await loadLeaflet(); } catch (e) { box.innerHTML = '<div class="ib-note" style="padding:14px">Map preview unavailable — the coordinates still save.</div>'; return; }
  if (!document.body.contains(box)) return;
  const has = hasGeo(g);
  GEO_MAP = L.map(box, { scrollWheelZoom: false }).setView(has ? [+g.lat, +g.lng] : [-27.5, 134], has ? 16 : 4);
  L.tileLayer(MAP_TILES.url, { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(GEO_MAP);
  place = (lat, lng, pan) => {
    if (!GEO_MARK) {
      GEO_MARK = L.marker([lat, lng], { draggable: CANW }).addTo(GEO_MAP);
      GEO_MARK.on('dragend', () => { const p = GEO_MARK.getLatLng(); put(p.lat, p.lng, false); });
    } else GEO_MARK.setLatLng([lat, lng]);
    if (pan) GEO_MAP.setView([lat, lng], Math.max(GEO_MAP.getZoom(), 15));
  };
  if (has) place(+g.lat, +g.lng, false);
  if (CANW) GEO_MAP.on('click', e => put(e.latlng.lat, e.latlng.lng, false));
  /* the card may still be laying out (fonts, the intel panel above) — re-measure once settled */
  setTimeout(() => { if (GEO_MAP && document.body.contains(box)) GEO_MAP.invalidateSize(); }, 250);
}
/* what setup.geo becomes on this save — at most ONE Nominatim request */
async function resolveGeoOnSave(top) {
  const prev = ((CUR.setup || {}).geo) || {};
  const latV = parseFloat(($('#fLat') || {}).value), lngV = parseFloat(($('#fLng') || {}).value);
  const typed = isFinite(latV) && isFinite(lngV);
  const q = geoQuery(top), now = new Date().toISOString();
  const auto = GEO_WORK.auto || prev.auto || null, autoQ = GEO_WORK.auto ? GEO_WORK.q : prev.q;
  const same = (a, b) => !!(a && b && Math.abs(a.lat - b.lat) < 1e-6 && Math.abs(a.lng - b.lng) < 1e-6);
  const lookup = async () => {
    const hit = await geocodeOnce(q);
    return hit ? { lat: hit.lat, lng: hit.lng, source: 'nominatim', q, at: now, auto: { lat: hit.lat, lng: hit.lng }, kind: hit.kind } : null;
  };
  if (typed) {
    const pt = { lat: +latV.toFixed(6), lng: +lngV.toFixed(6) };
    if (auto && same(pt, auto)) {
      if (autoQ === q) return { ...pt, source: 'nominatim', q, at: GEO_WORK.at || prev.at || now, auto, kind: GEO_WORK.kind || prev.kind || '' };
      /* the address changed and the pin is still the automatic one → look the new address up once */
      return (await lookup()) || { ...pt, source: 'nominatim', q: autoQ || q, at: prev.at || now, auto, kind: prev.kind || '' };
    }
    return { ...pt, source: 'manual', q, at: now, auto };
  }
  if (prev.q === q && (prev.source === 'miss' || prev.source === 'cleared')) return prev;   /* already asked for this address */
  if (prev.q === q && hasGeo(prev)) return { lat: null, lng: null, source: 'cleared', q, at: now, auto: prev.auto || null };
  return (await lookup()) || { lat: null, lng: null, source: 'miss', q, at: now };
}

function harvestExec() {

/* Suburb intelligence = Suburb Scoring (LT CAGR, quality, runway, rec — the
   old manual Looker step) MERGED with the Cotality suburb store (monthly:
   medians, 5/10/20yr CAGRs, 3yr/5yr growth, DOM, rent + change, yield, AVM
   with p25–p75 band, income, CBD distance) — the whole "paste Pricefinder
   history into the CAGR tab" step dies here. */
function intelPtype() {
  const t = ($('#fType') ? $('#fType').value : (CUR.setup || {}).propertyType) || '';
  return /unit|apart|town|villa|flat/i.test(t) ? 'U' : 'H';

/* ── property photos — stored per file in the ir-evidence bucket under
   <fileId>/photos/; setup.photos = [{path,name,at}], index 0 = the cover ── */
const PHOTO_URLS = {};   /* path → signed url cache (1h) */
async function signPhotoUrls(paths) {
  const need = (paths || []).filter(p => !PHOTO_URLS[p]);
  if (need.length) {
    try {
      const { data } = await sb.storage.from('ir-evidence').createSignedUrls(need, 3600);
      (data || []).forEach((r, i) => { if (r.signedUrl) PHOTO_URLS[need[i]] = r.signedUrl; });
    } catch (e) {}
  }
  return (paths || []).map(p => PHOTO_URLS[p] || null);
}
async function renderPhotos() {

async function fetchIntel() {
  const mkt = ($('#fMkt') ? $('#fMkt').value : CUR.market_label) || '';
  const sub = (($('#fSub') ? $('#fSub').value : CUR.suburb) || '').trim();
  const regions = ((CFG.regions || {}).regions) || [];
  const reg = regions.find(r => r.label === mkt);
  if (!sub) return null;
  const ptype = intelPtype();
  const out = { asof: new Date().toISOString().slice(0, 10), ptype };
  if (reg) {
    try {
      const key = reg.slug + '-' + (ptype === 'U' ? 'u' : 'h');
      const { data } = await sb.from('suburb_scores').select('payload').eq('key', key).maybeSingle();
      const row = data && (data.payload.rows || []).find(r => String(r.suburb || '').toLowerCase() === sub.toLowerCase());
      if (row) out.scores = { lt: row.lt, quality: row.quality, yield: row.yield, price: row.price, rent: row.rent,
        dom: row.dom, demand: row.demand, runway: row.runway, rec: row.rec, topPrice: row.topPrice, source: 'suburb_scores/' + key };
    } catch (e) {}
  }
  try {
    const st = (($('#fState') ? $('#fState').value : CUR.state) || (reg && reg.state) || '').trim();
    let q = sb.from('forge_cl_suburbs').select('month,postcode,lga,metrics').eq('level', 'suburb')
      .eq('ptype', ptype).ilike('name', sub).order('month', { ascending: false }).limit(1);
    if (st) q = q.eq('state', st);
    const { data } = await q;
    if (data && data[0]) {
      const m = data[0].metrics || {};
      out.cl = { month: data[0].month, lga: data[0].lga, postcode: data[0].postcode,
        med12: m.med12, med3: m.med3, medChg12: m.medChg12, medChg36: m.medChg36, medChg60: m.medChg60,
        cagr5: m.cagr5, cagr10: m.cagr10, cagr20: m.cagr20,
        cagr3_derived: m.medChg36 != null ? Math.pow(1 + m.medChg36, 1 / 3) - 1 : null,
        dom: m.dom, rent: m.rent, rentChg12: m.rentChg12, yield: m.yield,
        avm: m.avm, p25: m.p25, p75: m.p75, income: m.income, distCbd: m.dist,
        holdPeriod: m.holdPeriod, sales12: m.sales12, listings: m.listings1 };
    }
  } catch (e) {}
  return (out.scores || out.cl) ? out : null;
}

/* ── auto-fill as EDITABLE PREFILL (Van's rule 2026-08-19): the fields the
   team knows stay editable; our data lands in them first, only where the
   human hasn't already typed something. suburb_stats stays the pristine
   auto reference so the UI can mark each value auto vs edited. ── */
function intelAutoMap(ss) {
  const sc = (ss && ss.scores) || {}, cl = (ss && ss.cl) || {};
  return {
    suburbYield: cl.yield != null ? cl.yield : sc.yield,
    cagr3: cl.cagr3_derived, cagr5: cl.cagr5, cagr10: cl.cagr10, cagr20: cl.cagr20,
    ltCagr: sc.lt, suburbRating: sc.quality,
    dom: cl.dom != null ? cl.dom : sc.dom,
    suburbRent: cl.rent != null ? cl.rent : sc.rent,
    suburbMedian: cl.med12 != null ? cl.med12 : sc.price,
    avm: cl.avm, p25: cl.p25, p75: cl.p75,
  };
}
async function seedPrefills(ss) {
  const auto = intelAutoMap(ss);
  /* pricing.suburb — the 5j "suburb summary" numbers, prefilled where empty */
  const pricing = { ...(CUR.pricing || {}) };
  const subj = { ...(pricing.suburb || {}) };
  let changed = false;
  for (const [k, v] of Object.entries(auto)) {
    if (k === 'suburbRating') continue;
    if (v != null && (subj[k] == null || subj[k] === '')) { subj[k] = v; changed = true; }
  }
  if (changed) { pricing.suburb = subj; await saveSection('pricing', pricing, true); }
  /* grading.suburbRating + setup.lga */
  if (auto.suburbRating && !(CUR.grading || {}).suburbRating) {
    await saveSection('grading', { ...(CUR.grading || {}), suburbRating: auto.suburbRating }, true);
  }
  if (ss.cl && ss.cl.lga && !(CUR.setup || {}).lga) {
    await saveSection('setup', { ...(CUR.setup || {}), lga: ss.cl.lga }, true);
  }
}
/* provenance chip: does the live editable value still equal the auto one? */
function provChip(val, autoVal) {
  if (autoVal == null) return '';
  const eq = (typeof val === 'number' && typeof autoVal === 'number')
    ? Math.abs(val - autoVal) < 1e-9 : String(val) === String(autoVal);
  return '<span class="ib-prov ' + (eq ? 'auto' : 'edited') + '">' + (eq ? 'auto' : 'edited') + '</span>';
}

/* ── PRELIMINARY DD step ── */
function ruleFor(item, variable) { const r = RULES.find(x => x.item === item && x.variable === variable); return r ? r.value : null; }
/* jsonb does NOT preserve key order (shortest key first, then bytewise) —
   always sort DD checks by their code before rendering anywhere */
function ddSorted(keys) { return [...keys].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true })); }
function ddItems() {
  const items = [...new Set(RULES.map(r => r.item))];
  const cur = Object.keys((CUR.dd || {}).items || {});
  for (const c of cur) if (!items.includes(c)) items.push(c);
  return ddSorted(items);
}
function ddResult(items) {
  const ratings = Object.values(items || {}).map(x => x.rating).filter(Boolean);
  if (ratings.includes('Failed')) return 'Failed';

/* ── DD evidence attachments (bucket 'ir-evidence', migration 105) ── */
function ddFileChips(files) {
  return (files || []).map((f, i) =>
    '<span class="ib-file" data-path="' + esc(f.path) + '"><span class="nm">' + esc(f.name) + '</span>' +
    (CANW ? '<span class="x" data-rmi="' + i + '" title="remove">&times;</span>' : '') + '</span>').join('');
}
function ddSlug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 50); }
function wireDdEvidence(root) {
  root.querySelectorAll('.ib-dditem').forEach(d => {
    const item = d.dataset.item;
    const btn = d.querySelector('.ib-attach'), inp = d.querySelector('input[type="file"]');
    if (btn) btn.onclick = () => inp.click();
    if (inp) inp.onchange = async () => {
      for (const file of inp.files) {
        if (file.size > 15 * 1024 * 1024) { toast(file.name + ' is over 15MB'); continue; }
        const path = CUR.id + '/' + ddSlug(item) + '/' + Date.now() + '-' + file.name.replace(/[^\w.\-]+/g, '_');
        const { error } = await sb.storage.from('ir-evidence').upload(path, file);
        if (error) { toast(/not.*found/i.test(error.message) ? 'Evidence storage not set up — apply migration 105' : 'Upload failed: ' + error.message); return; }
        const dd = { ...(CUR.dd || {}) }; dd.items = { ...(dd.items || {}) };
        const it = { ...(dd.items[item] || {}) };
        it.files = [...(it.files || []), { path, name: file.name, size: file.size, at: new Date().toISOString() }];
        dd.items[item] = it;
        if (!await saveSection('dd', dd, true)) return;
      }
      toast('Evidence attached'); renderFile();
    };
    d.querySelectorAll('.ib-file').forEach(chip => {
      chip.querySelector('.nm').onclick = async () => {
        const { data, error } = await sb.storage.from('ir-evidence').createSignedUrl(chip.dataset.path, 3600);
        if (error || !data) { toast('Could not open (apply migration 105?)'); return; }
        window.open(data.signedUrl, '_blank', 'noopener');
      };
      const x = chip.querySelector('.x');
      if (x) x.onclick = async () => {
        if (!confirm('Remove this evidence file?')) return;
        await sb.storage.from('ir-evidence').remove([chip.dataset.path]);
        const dd = { ...(CUR.dd || {}) }; dd.items = { ...(dd.items || {}) };
        const it = { ...(dd.items[item] || {}) };
        it.files = (it.files || []).filter(f => f.path !== chip.dataset.path);
        dd.items[item] = it;
        if (await saveSection('dd', dd, true)) { toast('Removed'); renderFile(); }
      };
    });
  });
}

let PR = null;
function cagrBetween(d1, p1, d2, p2) {
  const y1 = parseDateAny(d1), y2 = parseDateAny(d2);
  if (!y1 || !y2 || !p1 || !p2) return null;
  const yrs = (y2 - y1) / 31557600000;
  if (yrs <= 0.2) return null;
  return Math.pow(p2 / p1, 1 / yrs) - 1;
}
function parseDateAny(s) {
  const t = String(s || '').trim(); if (!t) return null;
  let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return new Date(y, +m[2] - 1, +m[1]).getTime(); }
  const d = new Date(t); return isNaN(d) ? null : d.getTime();
}

/* ════════ CASHFLOW editor (Phase C) ════════ */
function suggestLandTax(budget, state) {
  const cfg = CFG.land_tax || {}; const ratio = ((CFG.defaults || {}).landValueRatio) || 0.6;
  const lv = budget * ratio;
  const rows = (cfg.brackets || []).filter(b => b.state === state && b.low != null);
  const b = rows.find(b => lv >= b.low && lv <= (b.high || 9e10));
  if (!b || b.pct == null) return null;
  return Math.round((b.fixed || 0) + b.pct * (lv - b.low));
}
function suggestInsurance(budget) {
  const rows = ((CFG.insurance || {}).brackets) || [];
  let best = null;
  for (const b of rows) if (b.low != null && budget >= b.low && b.premium != null) best = b.premium;
  return best;
}

  for (const [k, v] of Object.entries(defaults)) if (CFW[k] == null && v != null) CFW[k] = v;
  if (CFW.acquisitionFee == null && CFW.budget && D.acquisitionFeePct) CFW.acquisitionFee = Math.round(CFW.budget * D.acquisitionFeePct);
  /* pool: the tick starts from the inspection's "Pool or outdoor spa" answer and is then the

function renderCompliance(el) {
  const comp = CUR.compliance || {}; const items = comp.items || {};
  const roleOf = {}; for (const [role, list] of COMP_MANUAL) for (const [k] of list) roleOf[k] = role;
  const roleSum = COMP_MANUAL.map(([role, list]) => role + ' ' + list.filter(([k]) => items[k]).length + '/' + list.length).join(' · ');

      list.map(([k, lab]) => { const t = items[k];
        return '<div class="ib-comp-item"><span class="ib-cbx' + (t ? ' on' : '') + '" data-ck="' + k + '"' + '>' + (t ? '✓' : '') + '</span>' + esc(lab) +
          (t ? '<span class="w">' + esc((t.by || '').split('@')[0]) + ' · ' + auDay(t.at) + '</span>' : '') + '</div>'; }).join('')).join('') +
    '</div>';

  pages.push(pageCashflow(c));                                   /* 5  cashflow, two rates */
  pages.push(...pageInspection(c));                              /* 6  inspection / minimum standards */

  const cards = '<div class="xc">' +

    card('Rent and gross yield', '<div class="v">' + (K.rent != null ? money(K.rent) + '<small> /wk</small>' : '—') + '</div>',
      [K.grossYield != null ? 'Gross yield ' + pct(K.grossYield) : null]) +
    card('Weekly cash flow', T
      ? '<div class="dv"><b' + neg(K.weeklyCur) + '>' + money(K.weeklyCur) + '</b><span>at today\'s ' + pct(T.rCur) + '</span></div>' +
        '<div class="dv"><b' + neg(K.weeklyIc) + '>' + money(K.weeklyIc) + '</b><span>at the IC rate ' + pct(T.rIc) + '</span></div>'
      : '<div class="v">—</div>', [T ? 'Interest only · ' + pct(+cf.lvr || 0.9, 0) + ' LVR' : null]) +
    card('Capital required', '<div class="v">' + money(K.capital) + '</div>', [T ? 'To complete, incl. acquisition costs' : null]) + '</div>';
  const facts = [s.beds != null ? s.beds + ' bed' : null, s.baths != null ? s.baths + ' bath' : null, s.cars != null ? s.cars + ' car' : null].filter(Boolean).join(' · ');
  const xline = [[facts, s.propertyType ? String(s.propertyType).toLowerCase() : null].filter(Boolean).join(' ') + (s.landSize ? ' on ' + s.landSize + ' m²' : ''),
    g.strategy || s.strategy, g.propertyGrade].filter(Boolean).join(' · ');
  const ul = arr => arr && arr.length ? '<ul>' + arr.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<p class="muted">—</p>';
  const q3 = '<div class="xq">' +
    '<div><h4>Price and return</h4><p>' + esc(ex.priceReturn || '—') + '</p></div>' +
    '<div><h4>Why this property</h4>' + ul(ex.positives) + '</div>' +
    '<div><h4>What it will need</h4>' + ul(ex.maintenance) + '</div></div>';
  const h = pgHead('Executive summary') + (xline ? '<div class="xline">' + esc(xline) + '</div>' : '') + cards + q3 + marketPanelHtml(RP.mk, ex.marketNote);
  /* long hand-written text: one step tighter rather than a second page */
  const cls = pageHeight(h) > PG_INNER_MAX ? 'tight' : '';

}

/* 3 · map + location grading */
function pageMap(c) {
  const g = c.grading || {}, ss = c.suburb_stats || {};
  const sp = splitGrading(g.items || {});
  /* the numeric distance is Cotality's, measured to the STATE CAPITAL's CBD — only
     meaningful when the market is that capital (ir-chain.md §1.3) */
  const km = CAPITAL_SLUGS.includes(c.market_slug) && ss.cl && ss.cl.distCbd != null && isFinite(+ss.cl.distCbd)
    ? (+ss.cl.distCbd).toFixed(1) + ' km to the CBD' : '';
  let map;
  if (RP.mapUrl) map = '<img src="' + RP.mapUrl + '" width="330" height="520" alt="Map of the property location">';
  else if (RP.mapPngUrl) map = '<img crossorigin="anonymous" src="' + esc(RP.mapPngUrl) + '" width="330" alt="Map">';   /* the file's own map image: the box takes its shape */
  else map = '<div class="none">Map unavailable — add the property\'s location in Setup.</div>';
  const attr = RP.mapUrl ? MAP_TILES.attribution : (RP.mapPngUrl ? 'Map image from the property file' : '');
  const rows = sp.loc.map(([k, v]) => { const cm = rubricComment(attrKey(k), v);
    return '<div class="lr"><span class="nm">' + esc(attrKey(k)) + (cm ? '<small>' + esc(cm) + '</small>' : '') + '</span>' + gradeChip(v) + gradeBar(v) + '</div>'; }).join('');
  const nums = sp.loc.map(([, v]) => gradeBand(v)).filter(Boolean).map(b => b.n);
  const avg = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
  const legend = '<div class="legend">Grades on the 2.5–5 band: ' + ['Poor', 'Below Average', 'Average', 'Above Average', 'Excellent'].map(gradeChip).join(' ') + '</div>';
  const ac = {}; sp.asset.forEach(([, v]) => { const b = gradeBand(v); if (b) ac[b.word] = (ac[b.word] || 0) + 1; });
  const asum = ['Excellent', 'Above Average', 'Average', 'Below Average', 'Poor'].filter(w => ac[w]).map(w => ac[w] + ' ' + w.toLowerCase()).join(' · ');
  const tiles = '<div class="tiles">' +
    '<div><div class="k">Suburb rating</div><div class="v">' + esc(g.suburbRating || '—') + '</div><div class="s">Performance Property Suburb Scoring</div></div>' +
    '<div><div class="k">Distance from the CBD</div><div class="v" style="font-size:12.5px">' + esc(cbdBand(c) || '—') + '</div><div class="s">From the location grading</div></div>' +
    '<div><div class="k">Asset grade</div><div class="v">' + esc(g.propertyGrade || '—') + '</div><div class="s">' + esc(asum || 'Asset attributes not graded yet') + '</div></div></div>';
  const h = pgHead('Map and location grading') +
    '<div class="mapw"><div><div class="mapbox' + (!RP.mapUrl && RP.mapPngUrl ? ' auto' : '') + '">' + map + (km && (RP.mapUrl || RP.mapPngUrl) ? '<span class="chip">' + esc(km) + '</span>' : '') + '</div>' +
      (attr ? '<div class="mapattr">' + esc(attr) + '</div>' : '') + '</div>' +
    '<div><div class="sh first">Location attributes</div>' + legend + (rows || '<p class="muted">No location attributes graded yet.</p>') +
      (avg != null ? '<div class="fine">Average of the ' + nums.length + ' location grades: <b>' + avg.toFixed(1) + '</b> on the 2.5–5 band.</div>' : '') + '</div></div>' +
    tiles;
  return { t: 'Map and location grading', h };
}

/* 5 · cashflow — ONE table, interest only; finance interest at the current rate AND
   at the IC rate; two bottom lines. Only interest + the bottom lines differ. */
function pageCashflow(c) {
  const cf = c.cashflow || {}, insp = c.inspection || {}, T = RP.two;
  const head = pgHead('Cashflow', 'Interest only · current and IC rate');
  if (!T) return { t: 'Cashflow', h: head + '<p class="lede">No cashflow yet — the cashflow needs a purchase budget and a weekly rent.</p>' };
  const x = T.cur, y = T.ic;
  const nv = k => +cf[k] || 0;
  const lvr = nv('lvr') || 0.9, term = nv('loanTermYears') || 30;
  const pctTxt = v => v ? ((v * 100).toFixed(2).replace(/\.?0+$/, '') + '%') : '';
  const row = (lab, mid, val, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + lab + '</td><td class="m">' + (mid || '') + '</td><td class="v">' + val + '</td></tr>';
  const sec = t => '<tr><td colspan="3" style="padding:0;border:0"><div class="sec tight">' + t + '</div></td></tr>';
  const ip = String(insp.pool || '').trim(), inspPool = ip && !/^none$/i.test(ip);
  const pool = cf.hasPool === false ? null : ((cf.hasPool === true || inspPool) ? (inspPool ? ip : 'pool or spa') : null);
  let r = sec('Cost of property') +
    row('Top budget', '', money(nv('budget'))) + row('Maintenance allowance', '', money(nv('maintenanceAllowance'))) +
    row('Cosmetic works allowance', '', money(nv('cosmeticWorks'))) + (nv('minRentalStdCost') ? row('Minimum rental standards', '', money(nv('minRentalStdCost'))) : '') +
    row('Subtotal', '', money(nv('budget') + nv('maintenanceAllowance') + nv('cosmeticWorks') + nv('minRentalStdCost')), 'tot');
  const acq = nv('stampDuty') + nv('engagementFee') + nv('acquisitionFee') + nv('titleTransfer') + nv('conveyancing') + nv('buildingPest') + nv('depreciationSchedule') + nv('professionalClean');
  r += sec('Acquisition costs') +
    row('Stamp duty', '', money(nv('stampDuty'))) + row('Engagement fee', '', money(nv('engagementFee'))) + row('Acquisition fee', '', money(nv('acquisitionFee'))) +
    row('Mortgage &amp; title transfer fee', '', money(nv('titleTransfer'))) + row('Conveyancing / legal', '', money(nv('conveyancing'))) +
    row('Building &amp; pest inspection reports', '', money(nv('buildingPest'))) + row('Depreciation schedule', '', money(nv('depreciationSchedule'))) +
    row('Professional clean', '', money(nv('professionalClean'))) + row('Subtotal', '', money(acq), 'tot') + row('Total property + acquisition cost', '', money(x.totalCost), 'tot');
  const income = x.income, letting = (nv('lettingFeeWeeks') || 0) * nv('rent'), pm = income * (nv('pmFeePct') || 0), repairs = income * (nv('repairsPctOfRent') || 0);
  const poolCost = pool ? (x.pool || 0) : 0;
  r += sec('Running costs') +
    row('Finance – interest at the current rate (' + pct(T.rCur) + ')', pct(lvr, 0) + ' LVR &nbsp;·&nbsp; interest only', money(x.interest)) +
    row('Finance – interest at the IC rate (' + pct(T.rIc) + ')', pct(lvr, 0) + ' LVR &nbsp;·&nbsp; interest only', money(y.interest)) +
    row('Finance – principal', 'interest only &nbsp;·&nbsp; ' + term + '-year loan', money(0)) +
    row('Letting fee &amp; marketing', nv('lettingFeeWeeks') ? nv('lettingFeeWeeks') + ' weeks rent' : '', money(letting)) +
    row('Property management fee', pctTxt(nv('pmFeePct')), money(pm)) +
    (cf.feeLines || []).map(fl => row(esc(fl.label || 'Fee'), pctTxt(+fl.pct || 0), money(income * (+fl.pct || 0) + (+fl.amount || 0)))).join('') +
    row('Repairs &amp; maintenance', nv('repairsPctOfRent') ? pctTxt(nv('repairsPctOfRent')) + ' of rent' : '', money(repairs)) +
    (pool ? row('Pool maintenance', esc(pool), poolCost ? money(poolCost) : 'not costed') : '') +
    row('Strata fees', '', money(nv('strata'))) + row('Council &amp; water rates', '', money(nv('councilWater'))) +
    row('Land tax', '', money(nv('landTax'))) + row('Insurance estimate', '', money(nv('insurance'))) +
    row('Running costs less finance', '', money(x.runningLessFin), 'tot');
  r += sec('Income') +
    row('Rent', 'per week', money(nv('rent'))) + row('Income', (nv('weeksLet') || 52) + ' weeks let', money(income)) +
    row('Net income', 'after running costs, before finance', money(income - x.runningLessFin), 'tot');
  const bl = (lab, rate, o) => row(lab, pct(rate) + ' &nbsp;·&nbsp; interest only', money(o.annual) + ' / ' + money(o.weekly), 'tot bl' + (o.annual < 0 ? ' neg' : ''));
  r += sec('Investment summary') +
    row('Loan amount', pct(lvr, 0) + ' LVR', money(x.loan)) + row('Required capital', 'to complete', money(Math.max(0, x.requiredCapital))) +
    row('Gross yield', '', pct(x.grossYield)) + row('Net yield', '', pct(x.netYield)) + row('Expense ratio', '', pct(x.expenseRatio)) +
    bl('Annual / weekly cash flow at the current rate', T.rCur, x) +
    bl('Annual / weekly cash flow at the IC rate', T.rIc, y);
  const foot = '<div class="icdef"><b>IC rate</b> — the Investment Committee\'s normalised rate: the rolling 18-year average cash rate plus 2.29 percentage points.</div>' +
    /* the cashflow disclaimer (Saskia 2026-09-29), verbatim, under the table */
    '<div class="cfdisc">' + CF_DISCLAIMER.map(p => '<p>' + esc(p) + '</p>').join('') + '</div>';
  /* many fee lines: rows tighten a step (measured) so the page stays inside A4 */
  const build = d => head + '<table class="cfb' + d + '">' + r + '</table>' + foot;
  let dens = '';
  for (const d of ['', ' dense', ' denser', ' densest']) { dens = d; if (pageHeight(build(d)) <= PG_INNER_MAX) break; }
  return { t: 'Cashflow', h: build(dens) };
}

/* 6 · inspection notes / minimum standards */
function legacyFlagged(insp) {

function pageInspection(c) {
  const insp = c.inspection || {}, ck = insp.checklist || {}, s = c.setup || {};

  if (ckHasEntries(ck)) {

      VIC_ENERGY_2027.forEach(([a, b2, d]) => blocks.push({ tbl: 'en', cls: 't2', head: TH, row: '<tr><td><b>' + esc(a) + '</b></td><td>' + esc(b2) + '</td><td class="cm">' + esc(d) + '</td></tr>' }));
