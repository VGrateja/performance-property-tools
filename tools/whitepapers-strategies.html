/* Research Links search — inline search bar with a live results
   dropdown that searches across every subsection. Selecting a
   result triggers _flyCardForward to animate the chosen card to
   the centre of the screen with the rest of the page blurred out.
   Keyboard: Arrow keys move through results, Enter selects the
   highlighted (or first) result, Esc closes the dropdown. */
function _renderRlSearch(section) {
  const wrap = document.createElement('div');
  wrap.className = 'rl-search-wrap';
  wrap.innerHTML =
    '<span class="rl-search-icon" aria-hidden="true">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
        '<circle cx="10.5" cy="10.5" r="6.5"/>' +
        '<path d="M15.2 15.2 L19.5 19.5"/>' +
      '</svg>' +
    '</span>' +
    '<input type="text" class="rl-search-input" placeholder="Search regions…" autocomplete="off" spellcheck="false">' +
    '<div class="rl-search-results" role="listbox"></div>';

  const input  = wrap.querySelector('.rl-search-input');
  const results = wrap.querySelector('.rl-search-results');

  /* Flatten everything once at render time — { item, sub } pairs.
     If the user adds/removes cards in edit mode, renderAll() rebuilds
     this section so the index stays in sync. */
  const haystack = [];
  (section.subsections || []).forEach(sub => {
    (sub.items || []).forEach(item => haystack.push({ item, sub }));
  });

  let _activeIdx = -1;
  let _lastMatches = [];

  function update() {
    const q = input.value.trim().toLowerCase();
    if (!q) {
      results.classList.remove('show');
      results.innerHTML = '';
      _lastMatches = [];
      _activeIdx = -1;
      return;
    }
    _lastMatches = haystack.filter(({ item }) =>
      (item.title || '').toLowerCase().includes(q)
    ).slice(0, 8);

    if (!_lastMatches.length) {
      results.innerHTML = '<div class="rl-search-empty">No matching regions</div>';
      results.classList.add('show');
      _activeIdx = -1;
      return;
    }

    _activeIdx = 0;
    results.innerHTML = _lastMatches.map((m, i) =>
      '<div class="rl-search-result' + (i === 0 ? ' is-active' : '') + '" role="option" data-idx="' + i + '">' +
        '<span class="rl-search-result-title">' + _esc(m.item.title || 'Untitled') + '</span>' +
        '<span class="rl-search-result-region">' + _esc(m.sub.title || '') + '</span>' +
      '</div>'
    ).join('');
    results.classList.add('show');

    results.querySelectorAll('.rl-search-result').forEach(el => {
      el.addEventListener('click', () => {
        const idx = Number(el.getAttribute('data-idx'));
        const m = _lastMatches[idx];
        if (!m) return;
        _flyCardForward(m.item, m.sub);
        input.value = '';
        update();
        input.blur();
      });
    });
  }

  function setActive(idx) {
    _activeIdx = idx;
    results.querySelectorAll('.rl-search-result').forEach((el, i) => {
      el.classList.toggle('is-active', i === idx);
    });
  }

  input.addEventListener('input', update);
  input.addEventListener('keydown', (ev) => {
    if (!_lastMatches.length) return;
    if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      setActive(Math.min(_activeIdx + 1, _lastMatches.length - 1));
    } else if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      setActive(Math.max(_activeIdx - 1, 0));
    } else if (ev.key === 'Enter') {
      /* Stop this Enter from bubbling to the document — the
         _flyCardForward keydown listener attaches mid-dispatch and
         we don't want this same press to also fire card.click(). */
      ev.preventDefault();
      ev.stopPropagation();
      const m = _lastMatches[Math.max(0, _activeIdx)];
      if (!m) return;
      _flyCardForward(m.item, m.sub);
      input.value = '';
      update();
      input.blur();
    } else if (ev.key === 'Escape') {
      input.value = '';
      update();
      input.blur();
    }
  });

  /* Close the dropdown when clicking elsewhere on the page. */
  document.addEventListener('click', (ev) => {
    if (!wrap.contains(ev.target)) {
      results.classList.remove('show');
    }
  });

  return wrap;
}

/* Promote a card to the centre of the screen with a scale-in
   animation; rest of the page sits behind a blurred backdrop. The
   promoted card opens its url in a new tab when clicked; click on
   the backdrop (or press Esc) to dismiss. */
function _flyCardForward(item, sub) {
  const overlay = document.createElement('div');
  overlay.className = 'rl-fly-overlay';
  document.body.appendChild(overlay);

  const card = document.createElement(item.url ? 'a' : 'div');
  card.className = 'rl-fly-card';
  if (item.url) {
    card.href = item.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
  }
  card.innerHTML =
    '<div class="rl-fly-card-region">' + _esc(sub.title || 'Region') + '</div>' +
    '<h3 class="rl-fly-card-title">' + _esc(item.title || 'Untitled') + '</h3>' +
    (item.date ? '<div class="rl-fly-card-meta">Last updated ' + _esc(item.date) + '</div>' : '<div class="rl-fly-card-meta">Last updated —</div>') +
    (item.url
      ? '<span class="rl-fly-card-cta">Open ›</span>'
      : '<span class="rl-fly-card-cta is-disabled">Not Available Yet</span>');
  document.body.appendChild(card);

  /* Force a reflow so the initial transform/opacity sticks before
     we add the .show class — otherwise the browser may collapse
     them into a single frame and the entrance animation is skipped. */
  void card.offsetWidth;
  requestAnimationFrame(() => {
    overlay.classList.add('show');
    card.classList.add('show');
  });

  function dismiss() {
    overlay.classList.remove('show');
    card.classList.remove('show');
    document.removeEventListener('keydown', keyHandler);
    /* Return focus to the Research Links search input so the user
       can keep typing without having to click back into it. */
    const searchInput = document.querySelector('.rl-search-input');
    if (searchInput) searchInput.focus();
    /* Exit timeout matches the slow .95s scale-in so the elements
       finish their reverse animation before being removed. */
    setTimeout(() => {
      overlay.remove();
      card.remove();
    }, 1000);
  }
  /* Esc closes the overlay; Enter triggers the card's click (opens
     the url in a new tab and then dismisses). */
  function keyHandler(ev) {
    if (ev.key === 'Escape') {
      ev.preventDefault();
      dismiss();
      return;
    }
    if (ev.key === 'Enter') {
      ev.preventDefault();
      if (item.url) card.click();
      else dismiss();
    }
  }

  overlay.addEventListener('click', dismiss);
  /* Defer the document keydown listener to the next frame so the
     same Enter press that fired the search → animation doesn't
     also fire the click on the now-promoted card. The user has to
     press Enter a second time to open the link. */
  requestAnimationFrame(() => {
    document.addEventListener('keydown', keyHandler);
  });
  /* If the card is a real link, let the click open the url and then
     dismiss the overlay so the page is back to normal when the
     user comes back. */
  if (item.url) {
    card.addEventListener('click', () => setTimeout(dismiss, 120));
  }
}

/* Top-level folder header — editable name + × delete in edit mode. */
function _renderSectionHead(secIdx, section) {
  const head = document.createElement('div');
  head.className = 'ws-section-head';
  const eyebrow = String(secIdx + 1).padStart(2, '0');
  const itemCount = _countItems(section);
  const countText = itemCount + ' card' + (itemCount === 1 ? '' : 's');

  if (_editMode) {
    head.innerHTML =
      '<div class="ws-section-eyebrow">Type ' + eyebrow + '</div>' +
      '<input type="text" class="ws-section-title-input" data-section-title value="' + _esc(section.title) + '" placeholder="Type name">' +
      '<div class="ws-section-count">' + countText + '</div>' +
      '<button type="button" class="ws-section-delete" title="Delete this type">×</button>';
    const titleEl = head.querySelector('[data-section-title]');
    titleEl.addEventListener('input', () => {
      WS_DATA.sections[secIdx].title = titleEl.value;
      persist();
    });
    head.querySelector('.ws-section-delete')
        .addEventListener('click', () => deleteSection(secIdx));
  } else {
    head.innerHTML =
      '<div class="ws-section-eyebrow">Type ' + eyebrow + '</div>' +
      '<h2 class="ws-section-title">' + _esc(section.title || 'Untitled Type') + '</h2>' +
      '<div class="ws-section-count">' + countText + '</div>';
  }
  return head;
}

/* Render one subsection as a column (head + vertical item list).
   Used by all three sectioned folders. Edit-mode shows compact
   stacked forms per item; view-mode shows linkable rows with a
   status dot for whitepaper/strategy items. */
/* Grid-layout section view — stacks one square-card grid per
   subsection. Mirrors _renderGridSectionView in presentations-library
   so Documents looks consistent with the Buying/Selling Slides page.
   Subsection header always renders (Whitepapers / Strategies are
   meaningful labels here even when both subs are shown). */
function _renderGridSectionView(secIdx, section) {
  const wrap = document.createElement('div');
  wrap.className = 'ws-grid-section';
  const cols = Number(section.gridCols) || 3;
  const subs = section.subsections || [];
  /* 2+ subsections → render them side by side via the split CSS.
     Single-subsection sections fall through to the stacked default. */
  if (subs.length > 1) wrap.classList.add('ws-grid-section--split');
  subs.forEach((sub, subIdx) => {
    const block = document.createElement('div');
    block.className = 'ws-grid-sub';
    const h = document.createElement('div');
    h.className = 'ws-grid-sub-head';
    h.textContent = sub.title || 'Untitled';
    block.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'ws-square-grid';
    grid.style.setProperty('--cols', String(cols));
    grid.id = _gridIdFor(secIdx, subIdx);
    const isStrategy = sub.kind === 'strategy';
    (sub.items || []).forEach((item, itemIdx) => {
      if (_editMode) {
        grid.appendChild(isStrategy
          ? _renderSquareStrategyEdit(secIdx, subIdx, itemIdx, item)
          : _renderSquareItemEdit(secIdx, subIdx, itemIdx, item, sub.kind));
      } else {
        grid.appendChild(isStrategy
          ? _renderSquareStrategyView(item)
          : _renderSquareItemView(item, sub.kind));
      }
    });
    if (_editMode) {
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'ws-square-add';
      addBtn.title = 'Add card';
      addBtn.textContent = '+';
      addBtn.addEventListener('click', () => addItem(secIdx, subIdx));
      grid.appendChild(addBtn);
    }
    block.appendChild(grid);
    wrap.appendChild(block);
  });
  return wrap;
}

/* Square whitepaper / generic card. Whole card is the link to the
   item's URL (or a disabled tile when url is blank). Status pill in
   the top-right, title near the top, date pinned to the bottom. */
function _renderSquareItemView(item, kind) {
  const showStatus = kind === 'whitepaper';
  const statusKey = item.status || 'in-progress';
  const statusHtml = showStatus
    ? '<div class="ws-square-status ws-square-status--' + _esc(statusKey) + '">' + _esc(_statusLabel(statusKey)) + '</div>'
    : '';
  const iconHtml = '<div class="ws-square-icon" aria-hidden="true">' + _esc(_iconForTitle(item.title)) + '</div>';
  const titleHtml = '<h3 class="ws-square-card-title">' + _esc(item.title || 'Untitled') + '</h3>';
  const dateHtml = item.date
    ? '<div class="ws-square-card-date">Last updated ' + _esc(item.date) + '</div>'
    : '<div class="ws-square-card-date">Last updated —</div>';
  const inner = statusHtml + iconHtml + titleHtml + dateHtml;
  if (item.url) {
    const a = document.createElement('a');
    a.className = 'ws-square-card';
    a.href = item.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.innerHTML = inner;
    return a;
  }
  const div = document.createElement('div');
  div.className = 'ws-square-card is-disabled';
  div.title = 'Not Available Yet';
  div.innerHTML = inner;
  return div;
}

/* Square strategy card — dual buttons (Document + Slides). The card

   respective URLs. Buttons stop propagation so the card body's
   non-link surface stays inert. */
function _renderSquareStrategyView(item) {

  card.innerHTML =
    '<div class="ws-square-status ws-square-status--' + _esc(statusKey) + '">' + _esc(_statusLabel(statusKey)) + '</div>' +

/* Square edit — whitepaper / generic. Same fields as _renderItemEdit
   but stacked tightly inside the square. */
function _renderSquareItemEdit(secIdx, subIdx, itemIdx, item, kind) {
  const card = document.createElement('div');
  card.className = 'ws-square-edit';

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'ws-card-delete';
  del.title = 'Delete this card';
  del.textContent = '×';
  del.addEventListener('click', () => deleteItem(secIdx, subIdx, itemIdx));
  card.appendChild(del);

  const showStatus = kind === 'whitepaper';
  const statusFieldHtml = showStatus
    ? '<div class="ws-field">' +
        '<label class="ws-field-label">Status</label>' +
        '<select class="ws-select" data-field="status">' + _statusOptionsHtml(item.status) + '</select>' +
      '</div>'
    : '';

  card.insertAdjacentHTML('beforeend',
    statusFieldHtml +
    '<div class="ws-field">' +
      '<label class="ws-field-label">Name</label>' +
      '<input type="text" class="ws-input ws-input-title" data-field="title" value="' + _esc(item.title) + '" placeholder="Card title">' +
    '</div>' +
    '<div class="ws-field">' +
      '<label class="ws-field-label">URL</label>' +
      '<input type="url" class="ws-input" data-field="url" value="' + _esc(item.url) + '" placeholder="https://…">' +
    '</div>' +
    _dateFieldHtml(item, 'Last updated')
  );
  _wireEditCardFields(card, secIdx, subIdx, itemIdx);
  return card;
}

/* Square edit — strategy. Adds the Slides URL field on top of the
   generic shape. */
function _renderSquareStrategyEdit(secIdx, subIdx, itemIdx, item) {
  const card = document.createElement('div');
  card.className = 'ws-square-edit';

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'ws-card-delete';
  del.title = 'Delete this strategy';
  del.textContent = '×';
  del.addEventListener('click', () => deleteItem(secIdx, subIdx, itemIdx));
  card.appendChild(del);

  card.insertAdjacentHTML('beforeend',
    '<div class="ws-field">' +
      '<label class="ws-field-label">Status</label>' +
      '<select class="ws-select" data-field="status">' + _statusOptionsHtml(item.status) + '</select>' +
    '</div>' +
    '<div class="ws-field">' +
      '<label class="ws-field-label">Name</label>' +
      '<input type="text" class="ws-input ws-input-title" data-field="title" value="' + _esc(item.title) + '" placeholder="Strategy name">' +
    '</div>' +
    '<div class="ws-field">' +
      '<label class="ws-field-label">Document URL</label>' +
      '<input type="url" class="ws-input" data-field="url" value="' + _esc(item.url) + '" placeholder="https://…">' +
    '</div>' +
    '<div class="ws-field">' +
      '<label class="ws-field-label">Slides URL</label>' +
      '<input type="url" class="ws-input" data-field="slidesUrl" value="' + _esc(item.slidesUrl || '') + '" placeholder="https://… (blank = TBC)">' +
    '</div>' +
    _dateFieldHtml(item, 'Last upload')
  );
  _wireEditCardFields(card, secIdx, subIdx, itemIdx);
  return card;
}

function _renderSubsectionColumn(secIdx, subIdx, sub) {
  const col = document.createElement('div');
  col.className = 'ws-col';

  const head = document.createElement('div');
  head.className = 'ws-col-head';
  head.textContent = sub.title || 'Untitled';
  col.appendChild(head);

  const list = document.createElement('div');
  list.className = 'ws-col-list';
  const items = sub.items || [];
  const kind = sub.kind;
  const isStrategy = kind === 'strategy';
  const showStatusDot = kind === 'strategy' || kind === 'whitepaper';

  items.forEach((item, itemIdx) => {
    if (_editMode) {
      list.appendChild(isStrategy
        ? _renderColumnStrategyEdit(secIdx, subIdx, itemIdx, item)
        : _renderColumnItemEdit(secIdx, subIdx, itemIdx, item, kind));
    } else {
      list.appendChild(isStrategy
        ? _renderColumnStrategyView(item)
        : _renderColumnItemView(item, showStatusDot));
    }
  });
  if (_editMode) {
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'ws-col-add';
    addBtn.textContent = '+ Add';
    addBtn.addEventListener('click', () => addItem(secIdx, subIdx));
    list.appendChild(addBtn);
  }
  col.appendChild(list);
  return col;
}

/* Compact view item — clickable row when url is set, muted disabled
   row when not. The status dot only appears when the parent
   subsection has a status workflow (whitepaper/strategy). Date
   renders as a small muted line under the title when present. */
function _renderColumnItemView(item, showStatusDot) {
  const dotHtml = showStatusDot
    ? '<span class="ws-col-dot ws-col-dot--' + _esc(item.status || 'in-progress') + '" title="' + _esc(_statusLabel(item.status)) + '"></span>'
    : '';
  const dateHtml = item.date
    ? '<span class="ws-col-item-date">' + _esc(item.date) + '</span>'
    : '';
  const stackHtml =
    '<div class="ws-col-item-stack">' +
      '<span class="ws-col-item-title">' + _esc(item.title || 'Untitled') + '</span>' +
      dateHtml +
    '</div>';
  if (item.url) {
    const a = document.createElement('a');
    a.className = 'ws-col-item';
    a.href = item.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.innerHTML = dotHtml + stackHtml;
    return a;
  }
  const div = document.createElement('div');
  div.className = 'ws-col-item is-disabled';
  div.title = 'Not Available Yet';
  div.innerHTML = dotHtml + stackHtml;
  return div;
}

/* Strategy view item — title links to Document, with a small
   "Slides" sub-link if slidesUrl is set, then date if present. */
function _renderColumnStrategyView(item) {
  const wrap = document.createElement('div');
  wrap.className = 'ws-col-item' + (item.url ? '' : ' is-disabled');
  const dot = '<span class="ws-col-dot ws-col-dot--' + _esc(item.status || 'in-progress') + '" title="' + _esc(_statusLabel(item.status)) + '"></span>';
  const titleHtml = item.url
    ? '<a class="ws-col-item-title" href="' + _esc(item.url) + '" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">' + _esc(item.title || 'Untitled') + '</a>'
    : '<span class="ws-col-item-title">' + _esc(item.title || 'Untitled') + '</span>';
  const slidesHtml = item.slidesUrl
    ? '<a class="ws-col-slides" href="' + _esc(item.slidesUrl) + '" target="_blank" rel="noopener noreferrer">Slides ›</a>'
    : '<span class="ws-col-slides is-disabled">Slides · TBC</span>';
  const dateHtml = item.date
    ? '<span class="ws-col-item-date">' + _esc(item.date) + '</span>'
    : '';
  wrap.innerHTML = dot + '<div class="ws-col-item-stack">' + titleHtml + slidesHtml + dateHtml + '</div>';
  return wrap;
}

/* Compact edit item — narrow stacked form. Reuses the same
   data-field hooks _wireEditCardFields wires up so the persistence
   path is identical to the old wide-card editor. */
function _renderColumnItemEdit(secIdx, subIdx, itemIdx, item, kind) {
  const card = document.createElement('div');
  card.className = 'ws-col-edit';
  const showStatus = kind === 'whitepaper';

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'ws-card-delete';
  del.title = 'Delete';
  del.textContent = '×';
  del.addEventListener('click', () => deleteItem(secIdx, subIdx, itemIdx));
  card.appendChild(del);

  const statusFieldHtml = showStatus
    ? '<div class="ws-field">' +
        '<label class="ws-field-label">Status</label>' +
        '<select class="ws-select" data-field="status">' + _statusOptionsHtml(item.status) + '</select>' +
      '</div>'
    : '';

  card.insertAdjacentHTML('beforeend',
    statusFieldHtml +
    '<div class="ws-field">' +
      '<label class="ws-field-label">Name</label>' +
      '<input type="text" class="ws-input" data-field="title" value="' + _esc(item.title) + '" placeholder="Title">' +
    '</div>' +
    '<div class="ws-field">' +
      '<label class="ws-field-label">URL</label>' +
      '<input type="url" class="ws-input" data-field="url" value="' + _esc(item.url) + '" placeholder="https://…">' +
    '</div>' +
    _dateFieldHtml(item, 'Last updated')
  );
  _wireEditCardFields(card, secIdx, subIdx, itemIdx);
  return card;
}

/* Compact strategy edit — same shape as above plus a Slides URL. */
function _renderColumnStrategyEdit(secIdx, subIdx, itemIdx, item) {
  const card = document.createElement('div');
  card.className = 'ws-col-edit';

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'ws-card-delete';
  del.title = 'Delete';
  del.textContent = '×';
  del.addEventListener('click', () => deleteItem(secIdx, subIdx, itemIdx));
  card.appendChild(del);

  card.insertAdjacentHTML('beforeend',
    '<div class="ws-field">' +
      '<label class="ws-field-label">Status</label>' +
      '<select class="ws-select" data-field="status">' + _statusOptionsHtml(item.status) + '</select>' +
    '</div>' +
    '<div class="ws-field">' +
      '<label class="ws-field-label">Name</label>' +
      '<input type="text" class="ws-input" data-field="title" value="' + _esc(item.title) + '" placeholder="Strategy name">' +
    '</div>' +
    '<div class="ws-field">' +
      '<label class="ws-field-label">Document URL</label>' +
      '<input type="url" class="ws-input" data-field="url" value="' + _esc(item.url) + '" placeholder="https://…">' +
    '</div>' +
    '<div class="ws-field">' +
      '<label class="ws-field-label">Slides URL</label>' +
      '<input type="url" class="ws-input" data-field="slidesUrl" value="' + _esc(item.slidesUrl || '') + '" placeholder="https://… (blank = TBC)">' +
    '</div>' +
    _dateFieldHtml(item, 'Last upload')
  );
  _wireEditCardFields(card, secIdx, subIdx, itemIdx);
  return card;
}

/* Build the grid for either flat items or one subsection's items. */
function _renderItemsGrid(secIdx, subIdx, items, kind) {
  const grid = document.createElement('div');
  grid.className = 'ws-grid';
  grid.id = _gridIdFor(secIdx, subIdx);
  const isStrategy   = kind === 'strategy';
  const isWhitepaper = kind === 'whitepaper';

  if (!items.length && !_editMode) {
    grid.innerHTML = '<div class="ws-empty">No cards yet.</div>';
    return grid;
  }
  items.forEach((item, itemIdx) => {
    if (_editMode) {
      grid.appendChild(isStrategy
        ? _renderStrategyEdit(secIdx, subIdx, itemIdx, item)
        : _renderItemEdit(secIdx, subIdx, itemIdx, item, kind));
    } else {
      grid.appendChild(isStrategy
        ? _renderStrategyView(item)
        : _renderItemView(item, isWhitepaper ? 'Open Paper' : 'Open', isWhitepaper));
    }
  });
  if (_editMode) grid.appendChild(_renderAddItemTile(secIdx, subIdx));
  return grid;
}

function renderSectionView() {
  const root = document.getElementById('ws-section-root');
  if (!root) return;
  root.innerHTML = '';

  const section = WS_DATA.sections[_currentSecIdx];
  if (!section) {
    /* Section vanished underneath us (e.g. deleted in another tab).
       Drop back to the picker. */
    exitToPicker();
    return;
  }

  /* Research Links carries an editable "Current Edition" banner that
     spans the whole folder (not per-subsection) so the user can label
     which research edition the links belong to. The search bar sits
     directly below it and lets the user jump to any region card via
     the fly-forward animation. */
  if (section.id === 'research-links') {
    root.appendChild(_renderEditionBanner(section));
    root.appendChild(_renderRlSearch(section));
  }

  /* Grid-layout subsectioned folder — Whitepapers & Strategies. Each
     subsection renders as a stacked block of square-card tiles
     (3-up). Set on the section as layout:'grid' + gridCols. */
  if (section.layout === 'grid' && section.subsections && section.subsections.length) {
    root.appendChild(_renderGridSectionView(_currentSecIdx, section));
    return;
  }

  /* Subsectioned folder — render every subsection as a column inside
     a single grid so all subsections sit side-by-side and the page
     reads at a glance. The top-level folder header is skipped because
     the page header (h1) already shows the folder name. */
  if (section.subsections && section.subsections.length) {
    const cols = document.createElement('div');
    cols.className = 'ws-columns';
    section.subsections.forEach((sub, subIdx) => {
      cols.appendChild(_renderSubsectionColumn(_currentSecIdx, subIdx, sub));
    });
    root.appendChild(cols);
    return;
  }

  /* Flat folder — single grid with the editable folder header on top. */
  const wrap = document.createElement('div');
  wrap.className = 'ws-section';
  wrap.appendChild(_renderSectionHead(_currentSecIdx, section));
  wrap.appendChild(_renderItemsGrid(_currentSecIdx, null, section.items || [], null));
  root.appendChild(wrap);
}

/* ─── View navigation ─── */

function _setPageHeader(view, section) {
  const eyebrow = document.getElementById('ws-page-eyebrow');
  const title   = document.getElementById('ws-page-title');
  const sub     = document.getElementById('ws-page-sub');
  if (view === 'picker') {
    if (eyebrow) eyebrow.textContent = 'Library';
    if (title)   title.textContent   = 'Documents';
    if (sub)     sub.textContent     = 'Pick a document type to browse — research links, or whitepapers and strategies.';
  } else {
    /* Inside a type — header reflects the current section so the
       user always knows where they are. */
    if (eyebrow) eyebrow.textContent = 'Documents';
    if (title)   title.textContent   = (section && section.title) || 'Documents';
    if (sub)     sub.textContent     = '';
  }
}

function enterSection(secIdx) {
  _currentSecIdx = secIdx;
  _currentView   = 'section';
  renderAll();
  /* Scroll back to the top so the user sees the new view's header
     instead of being stuck at whatever scroll the picker had. */
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function exitToPicker() {
  _currentSecIdx = -1;
  _currentView   = 'picker';
  renderAll();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function renderAll() {
  const pickerEl  = document.getElementById('ws-picker-view');
  const sectionEl = document.getElementById('ws-section-view');
  if (!pickerEl || !sectionEl) return;

  document.body.classList.toggle('ws-in-section', _currentView === 'section');

  if (_currentView === 'picker') {
    pickerEl.hidden  = false;
    sectionEl.hidden = true;
    _setPageHeader('picker');
    renderPicker();
  } else {
    pickerEl.hidden  = true;
    sectionEl.hidden = false;
    _setPageHeader('section', WS_DATA.sections[_currentSecIdx]);
    renderSectionView();
  }
}

/* ─── View / Edit toggle ─── */

const segView = document.getElementById('ws-seg-view');
const segEdit = document.getElementById('ws-seg-edit');
function setEditMode(on) {
  _editMode = !!on;
  document.body.classList.toggle('ws-edit', _editMode);
  segView.classList.toggle('on', !_editMode);
  segEdit.classList.toggle('on', _editMode);
  segView.setAttribute('aria-selected', String(!_editMode));
  segEdit.setAttribute('aria-selected', String(_editMode));
  renderAll();
}
segView.addEventListener('click', () => setEditMode(false));
segEdit.addEventListener('click', () => setEditMode(true));

document.getElementById('ws-back-types').addEventListener('click', exitToPicker);

/* ─── Tier gating ─── tier 0/1 (dev/admin) get the View/Edit
   toggle; tier 2-4 see view mode only. We can't always rely on
   getAccessLevel being defined synchronously at boot, so we
   re-check on a tiny timeout in case auth.js hasn't applied the
   body class yet. The mode toggle is also hidden via CSS when
   body.ws-readonly is set so even a delayed gate is graceful. */
function applyTierGate() {
  let level = '';
  try { if (typeof getAccessLevel === 'function') level = getAccessLevel(); } catch (_) {}
  const canEdit = (level === 'dev' || level === 'admin');
  _canWriteCloud = canEdit;
  document.body.classList.toggle('ws-readonly', !canEdit);
  if (!canEdit && _editMode) setEditMode(false);
}
applyTierGate();
setTimeout(applyTierGate, 200);
setTimeout(applyTierGate, 800);

/* ─── Boot ─── */
renderAll();
/* Kick off cloud hydration after the synchronous render so the user
   sees something immediately. The cloud version, if present, will
   override and re-render. */
_hydrateFromCloud();

/* ─── Signed-URL interceptor for online-reports storage links ───
   Migration 028 flipped the online-reports bucket from public to
   private. The GitHub Actions renderer (scripts/render-reports.mjs)
   still writes deterministic public URLs into documents_state for
   each region's rendered PDF, and we don't want to force a re-render
   to migrate every entry. Instead, intercept clicks on any anchor
   whose href points at the now-locked-down public storage URL,
   extract the path inside the bucket, and request a 1-hour signed
   URL using the user's session. Open that in a new tab. Falls back
   to letting the click through unchanged if signing fails (so the
   user sees the 403 with the original URL in the address bar, which
   is at least debuggable). */
document.addEventListener('click', async function (e) {
  const a = e.target && e.target.closest && e.target.closest('a[href*="/storage/v1/object/public/online-reports/"]');
  if (!a) return;
  const m = a.href.match(/\/storage\/v1\/object\/public\/online-reports\/(.+)$/);
  if (!m) return;
  e.preventDefault();
  const path = decodeURIComponent(m[1]);
  if (!window.sb || !window.sb.storage) {
    window.open(a.href, '_blank', 'noopener,noreferrer');
    return;
  }
  try {
    const { data, error } = await window.sb.storage
      .from('online-reports')
      .createSignedUrl(path, 60);
    if (error || !data || !data.signedUrl) {
      console.warn('Could not sign report URL', error);
      window.open(a.href, '_blank', 'noopener,noreferrer');
      return;
    }
    window.open(data.signedUrl, '_blank', 'noopener,noreferrer');
  } catch (err) {
    console.warn('Signed URL fetch failed', err);
    window.open(a.href, '_blank', 'noopener,noreferrer');
  }
}, true);
</script>
