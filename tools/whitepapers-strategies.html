<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents — Performance Property</title>
<link rel="icon" href="../assets/logo.png" type="image/png"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/common.css"/>
<script src="../shared/theme.js"></script>
<style>
  :root{
    --bg-dark: #0a1426;
    --bg-mid:  #142036;
    --bg-light:#fafbff;
    --fg-light:#e6ecff;
    --fg-dark: #1a2236;
    --accent:  #00b6cb;
  }
  *{box-sizing:border-box}
  html{
    margin:0; padding:0; min-height:100%;
    background:#1a2236;
  }
  /* Body picks up the same animated --pp-bg-* / --pp-orb-* palette
     the hub uses (defined in shared/common.css). The pp-cycle-dark
     keyframes drift the bg + orb colours together so the page never
     feels static. Light mode swaps to pp-cycle-light. */
  body{
    margin:0; padding:0;
    color:var(--fg-light);
    font-family:'Montserrat',sans-serif;
    overflow-x:hidden;
  }
  [data-theme="light"] body{ color:var(--fg-dark) }

  /* ─── Floating chrome buttons ─── matches the Property Clock pattern.
     The old .ws-chrome bar is gone; Hub / Theme / View-Edit / Save
     indicator now float over the page, leaving the gradient + orbs
     uninterrupted at the top. */
  #pp-back-to-hub{
    position:fixed; top:16px; left:16px; z-index:10000;
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 14px 9px 10px;
    background:rgba(15,23,42,.85);
    border:1px solid rgba(71,85,105,.5);
    border-radius:10px;
    color:#e2e8f0;
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    font-size:13px; font-weight:600; letter-spacing:.01em;
    text-decoration:none; cursor:pointer;
    white-space:nowrap;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:all .15s ease;
  }
  #pp-back-to-hub:hover{
    background:rgba(30,41,59,.95);
    border-color:rgba(148,163,184,.5);
    color:#f8fafc;
    transform:translateX(-1px);
  }
  #pp-back-to-hub svg{ width:14px; height:14px; }
  [data-theme="light"] #pp-back-to-hub{
    background:rgba(255,255,255,.85);
    border-color:rgba(31,40,63,.18);
    color:#1a2236;
  }
  [data-theme="light"] #pp-back-to-hub:hover{
    background:rgba(255,255,255,.97);
    border-color:rgba(0,182,203,.55);
    color:#0a1520;
  }

  /* Theme toggle sits at left:160 by default (right next to the Hub
     pill on the picker view). Inside section view, the Back-to-Types
     pill takes that slot, so we shift the theme toggle right via the
     ws-in-section body class added by renderAll(). */
  #ws-theme-toggle{
    position:fixed; top:16px; left:160px; z-index:10000;
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; border-radius:50%;
    padding:0; cursor:pointer;
    background:rgba(15,23,42,.85);
    border:1px solid rgba(71,85,105,.5);
    color:#e2e8f0;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:all .15s ease;
  }
  #ws-theme-toggle:hover{
    background:rgba(30,41,59,.95);
    border-color:rgba(148,163,184,.5);
    color:#f8fafc;
    transform:translateY(-1px);
  }
  #ws-theme-toggle svg{ width:15px; height:15px; display:block; }
  #ws-theme-toggle .pp-sun{display:block}
  #ws-theme-toggle .pp-moon{display:none}
  [data-theme="light"] #ws-theme-toggle{
    background:rgba(255,255,255,.85);
    border-color:rgba(31,40,63,.18);
    color:#1a2236;
  }
  [data-theme="light"] #ws-theme-toggle:hover{
    background:rgba(255,255,255,.97);
    border-color:rgba(0,182,203,.55);
    color:#0a1520;
  }
  [data-theme="light"] #ws-theme-toggle .pp-sun{display:none}
  [data-theme="light"] #ws-theme-toggle .pp-moon{display:block}
  body.ws-in-section #ws-theme-toggle{ left:316px }

  /* Floating View / Edit segmented pill — same vocabulary as the
     Hub button (dark slate bg, slate border, blur), with the active
     segment getting the cyan accent. Hidden for tier 2-4 via the
     ws-readonly body class set in the boot script. */
  .ws-mode-toggle{
    position:fixed; top:16px; right:16px; z-index:10000;
    display:inline-flex;
    background:rgba(15,23,42,.85);
    border:1px solid rgba(71,85,105,.5);
    border-radius:10px;
    overflow:hidden;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .ws-mode-seg{
    padding:9px 16px;
    background:transparent;
    border:none;
    color:rgba(226,232,240,.75);
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    cursor:pointer;
    transition:background .12s, color .12s;
  }
  .ws-mode-seg.on{
    background:#5cc8e0;
    color:#0a1520;
  }
  .ws-mode-seg:not(.on):hover{
    background:rgba(92,200,224,0.18);
    color:#f8fafc;
  }
  [data-theme="light"] .ws-mode-toggle{
    background:rgba(255,255,255,.85);
    border-color:rgba(31,40,63,.18);
  }
  [data-theme="light"] .ws-mode-seg{ color:rgba(31,40,63,.78); }
  [data-theme="light"] .ws-mode-seg.on{ background:#5cc8e0; color:#0a1520; }
  [data-theme="light"] .ws-mode-seg:not(.on):hover{ background:rgba(0,182,203,.18); color:#0a1520; }
  body.ws-readonly .ws-mode-toggle{ display:none }

  /* ─── Page shell ─── matches the hub aesthetic.
     bg uses the same animated --pp-bg-* gradient as #mainPage, and
     two large drifting blurred orbs (::before / ::after) ride the
     same --pp-orb-* palette + pp-hub-orb-* keyframes the hub uses.
     overflow:hidden clips orbs that translate beyond the page; all
     direct children get z-index:1 so they sit above the orbs. */
  .ws-page{
    padding:16px 24px 60px;
    min-height:100vh;
    position:relative; overflow:hidden;
    background:linear-gradient(160deg, var(--pp-bg-1) 0%, var(--pp-bg-2) 45%, var(--pp-bg-3) 100%);
    animation:pp-cycle-dark 50s ease-in-out infinite;
  }
  [data-theme="light"] .ws-page{
    animation:pp-cycle-light 50s ease-in-out infinite;
  }
  .ws-page > *{ position:relative; z-index:1 }

  .ws-page::before,
  .ws-page::after{
    content:'';
    position:absolute; border-radius:50%;
    filter:blur(80px); pointer-events:none; z-index:0;
    will-change:transform; contain:paint;
  }
  .ws-page::before{
    width:680px; height:680px;
    background:var(--pp-orb-1);
    opacity:0.32;
    top:-200px; left:-180px;
    animation:pp-hub-orb-a 24s ease-in-out infinite;
  }
  .ws-page::after{
    width:540px; height:540px;
    background:var(--pp-orb-2);
    opacity:0.28;
    bottom:-180px; right:-150px;
    animation:pp-hub-orb-b 28s ease-in-out infinite;
  }
  [data-theme="light"] .ws-page::before{ opacity:0.42 }
  [data-theme="light"] .ws-page::after { opacity:0.38 }
  @media (prefers-reduced-motion: reduce){
    .ws-page,
    .ws-page::before,
    .ws-page::after{ animation:none }
  }
  .ws-head{
    text-align:center;
    max-width:760px;
    margin:0 auto 18px;
  }
  .ws-eyebrow{
    font-size:11px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;
  }
  .ws-page-title{
    font-size:38px; font-weight:800;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .ws-page-sub{
    font-size:14px; opacity:0.65;
    margin:0;
  }
  .ws-page-sub:empty{ display:none }

  /* Research Links — editable "Current Edition" pill. Mirrors the
     .hub-tool-badge aesthetic from the hub: compact horizontal pill,
     subtle cyan-tinted gradient, hover lift on the container. The
     label sits left of a hairline divider; the value sits to its
     right (in edit mode the value becomes an inline text input). */
  .ws-edition-banner{
    display:flex; align-items:center; gap:10px;
    width:fit-content; margin:0 auto 28px;
    padding:7px 14px 7px 12px;
    background:linear-gradient(135deg, rgba(0,182,203,0.16) 0%, rgba(0,182,203,0.04) 100%);
    border:1px solid rgba(0,182,203,0.32);
    border-radius:999px;
    box-shadow:0 4px 14px rgba(0,182,203,0.10), inset 0 1px 0 rgba(255,255,255,0.06);
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    transition:all .22s cubic-bezier(.4,0,.2,1);
  }
  .ws-edition-banner:hover{
    border-color:rgba(0,182,203,0.62);
    background:linear-gradient(135deg, rgba(0,182,203,0.22) 0%, rgba(0,182,203,0.06) 100%);
    box-shadow:0 8px 22px rgba(0,182,203,0.16), inset 0 1px 0 rgba(255,255,255,0.10);
    transform:translateY(-1px);
  }
  [data-theme="light"] .ws-edition-banner{
    background:linear-gradient(135deg, rgba(0,182,203,0.12) 0%, rgba(0,182,203,0.03) 100%);
    border-color:rgba(0,182,203,0.36);
    box-shadow:0 4px 12px rgba(31,40,63,0.06), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  [data-theme="light"] .ws-edition-banner:hover{
    border-color:rgba(0,182,203,0.65);
    background:linear-gradient(135deg, rgba(0,182,203,0.18) 0%, rgba(0,182,203,0.05) 100%);
  }
  .ws-edition-label{
    font-size:9px; font-weight:800; letter-spacing:0.20em;
    text-transform:uppercase;
    color:var(--accent);
    opacity:0.85;
    padding-right:10px;
    border-right:1px solid rgba(0,182,203,0.28);
    line-height:1;
    white-space:nowrap;
  }
  .ws-edition-value{
    font-size:13px; font-weight:700;
    color:inherit;
    line-height:1;
    letter-spacing:0.02em;
    white-space:nowrap;
  }
  .ws-edition-value.is-empty{
    opacity:0.5; font-weight:600;
    font-style:italic;
  }
  .ws-edition-input{
    background:transparent;
    border:none;
    color:inherit;
    font-size:13px; font-weight:700;
    line-height:1;
    letter-spacing:0.02em;
    font-family:inherit;
    padding:0;
    outline:none;
    width:200px;
    max-width:50vw;
  }
  .ws-edition-input::placeholder{ opacity:0.45; font-style:italic; font-weight:600 }

  /* ─── Research Links search ─── inline search bar above the
     subsection columns. Live results dropdown shows matching items
     across every subsection; clicking a result triggers the
     "fly-forward" animation (a promoted card scales up to the
     centre of the screen with the rest of the page blurred behind
     it). Lives only on the Research Links section view. */
  .rl-search-wrap{
    max-width:520px;
    margin:0 auto 28px;
    position:relative;
  }
  .rl-search-input{
    width:100%;
    padding:11px 14px 11px 42px;
    background:rgba(15,23,42,0.55);
    border:1px solid rgba(0,182,203,0.32);
    border-radius:10px;
    color:inherit;
    font-family:inherit; font-size:14px; font-weight:500;
    outline:none;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:border-color .15s, background .15s;
  }
  .rl-search-input::placeholder{ opacity:0.5 }
  .rl-search-input:focus{
    border-color:rgba(0,182,203,0.65);
    background:rgba(15,23,42,0.7);
  }
  [data-theme="light"] .rl-search-input{
    background:rgba(255,255,255,0.55);
    border-color:rgba(0,182,203,0.32);
    color:#1a2236;
  }
  [data-theme="light"] .rl-search-input:focus{
    background:rgba(255,255,255,0.75);
    border-color:rgba(0,182,203,0.65);
  }
  .rl-search-icon{
    position:absolute; top:50%; left:14px;
    transform:translateY(-50%);
    pointer-events:none;
    width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
    z-index:1;
  }
  .rl-search-icon svg{
    width:18px; height:18px;
    display:block;
    stroke:rgba(226,232,240,0.85);     /* dark mode: pale slate */
  }
  [data-theme="light"] .rl-search-icon svg{
    stroke:rgba(31,40,63,0.65);        /* light mode: dark slate */
  }

  .rl-search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:rgba(15,23,42,0.92);
    border:1px solid rgba(0,182,203,0.32);
    border-radius:10px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    max-height:320px; overflow-y:auto;
    z-index:50;
    display:none;
    box-shadow:0 14px 36px rgba(0,0,0,0.32);
  }
  .rl-search-results.show{ display:block }
  [data-theme="light"] .rl-search-results{
    background:rgba(255,255,255,0.95);
    border-color:rgba(0,182,203,0.32);
    box-shadow:0 14px 36px rgba(31,40,63,0.18);
  }
  .rl-search-result{
    display:flex; align-items:center; gap:12px;
    padding:10px 14px;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,0.06);
    transition:background .12s;
  }
  [data-theme="light"] .rl-search-result{ border-bottom-color:rgba(31,40,63,0.06) }
  .rl-search-result:last-child{ border-bottom:none }
  .rl-search-result:hover,
  .rl-search-result.is-active{ background:rgba(0,182,203,0.12) }
  .rl-search-result-title{ flex:1; font-size:14px; font-weight:600 }
  .rl-search-result-region{
    font-size:10px; font-weight:700;
    letter-spacing:0.10em; text-transform:uppercase;
    color:var(--accent); opacity:0.78;
  }
  .rl-search-empty{
    padding:14px; text-align:center;
    font-size:13px; opacity:0.55;
  }

  /* ─── Fly-forward overlay ─── full-screen backdrop that blurs
     whatever's behind it; the promoted card sits in the centre and
     scales up from a small initial transform. Click anywhere on the
     overlay (or press Esc) to dismiss. */
  .rl-fly-overlay{
    position:fixed; inset:0; z-index:9000;
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(16px) saturate(1.4);
    -webkit-backdrop-filter:blur(16px) saturate(1.4);
    opacity:0;
    transition:opacity .55s cubic-bezier(.22,1,.36,1);
  }
  .rl-fly-overlay.show{ opacity:1 }
  [data-theme="light"] .rl-fly-overlay{ background:rgba(255,255,255,0.32) }

  .rl-fly-card{
    position:fixed;
    top:50%; left:50%;
    z-index:9001;
    width:min(420px, 88vw);
    padding:36px 32px 32px;
    border-radius:20px;
    background:linear-gradient(135deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.85) 100%);
    border:1.5px solid rgba(0,182,203,0.55);
    box-shadow:0 32px 72px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,182,203,0.20), inset 0 1px 0 rgba(255,255,255,0.08);
    color:#e2e8f0;
    text-align:center;
    text-decoration:none;
    display:block;
    transform:translate(-50%, -50%) scale(0.18);
    opacity:0;
    /* Slow, deliberate scale-in so the card feels like it's
       advancing toward the viewer rather than just appearing. */
    transition:transform .95s cubic-bezier(.22,1,.36,1),
               opacity .55s cubic-bezier(.22,1,.36,1);
    backdrop-filter:blur(24px) saturate(1.5);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);
  }
  .rl-fly-card.show{
    transform:translate(-50%, -50%) scale(1);
    opacity:1;
  }
  [data-theme="light"] .rl-fly-card{
    background:linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(250,251,253,0.84) 100%);
    border-color:rgba(0,182,203,0.55);
    box-shadow:0 32px 72px rgba(31,40,63,0.30), 0 0 0 1px rgba(0,182,203,0.20), inset 0 1px 0 rgba(255,255,255,0.7);
    color:#1a2236;
  }
  .rl-fly-card-region{
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    font-size:11px; font-weight:800; letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--accent);
    opacity:0.85;
    margin-bottom:10px;
  }
  .rl-fly-card-title{
    font-family:'Montserrat',sans-serif;
    font-size:26px; font-weight:800; letter-spacing:0.01em;
    margin:0 0 14px; line-height:1.2;
  }
  .rl-fly-card-meta{
    font-size:13px; opacity:0.6;
    margin-bottom:18px;
  }
  .rl-fly-card-cta{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 22px;
    background:rgba(0,182,203,0.18);
    border:1px solid rgba(0,182,203,0.50);
    border-radius:8px;
    color:var(--accent);
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    font-size:12px; font-weight:800; letter-spacing:0.10em;
    text-transform:uppercase;
    transition:background .15s, border-color .15s;
  }
  .rl-fly-card-cta:hover{
    background:rgba(0,182,203,0.30);
    border-color:rgba(0,182,203,0.75);
  }
  .rl-fly-card-cta.is-disabled{
    background:rgba(255,255,255,0.04);
    border-color:rgba(255,255,255,0.12);
    color:rgba(255,255,255,0.45);
    cursor:default;
  }
  [data-theme="light"] .rl-fly-card-cta.is-disabled{
    background:rgba(31,40,63,0.06);
    border-color:rgba(31,40,63,0.14);
    color:rgba(31,40,63,0.45);
  }

  /* Section. */
  .ws-section{
    max-width:1240px;
    margin:0 auto 48px;
  }
  .ws-section:last-child{ margin-bottom:0 }
  .ws-section-head{
    display:flex; align-items:flex-end; gap:18px;
    padding:0 4px 14px;
    border-bottom:1px solid rgba(0,182,203,0.22);
    margin-bottom:24px;
  }
  [data-theme="light"] .ws-section-head{ border-bottom-color:rgba(0,182,203,0.30) }
  .ws-section-eyebrow{
    font-size:10px; font-weight:800; letter-spacing:0.20em; text-transform:uppercase;
    color:var(--accent);
    opacity:0.85;
    flex:0 0 auto;
    padding-bottom:4px;
  }
  .ws-section-title{
    font-size:22px; font-weight:800;
    margin:0;
    letter-spacing:-0.01em;
  }
  .ws-section-count{
    margin-left:auto;
    font-size:11px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase;
    opacity:0.45;
    padding-bottom:4px;
  }

  .ws-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:18px;
  }

  /* ─── Square-card grid layout ─── opt-in via section.layout='grid'.
     Mirrors the Buying/Selling Slides layout in presentations-library:
     each subsection renders as a stacked block with its own grid of
     square tiles below. gridCols on the section sets the column count
     (3 for whitepapers-strategies); narrow viewports clamp to 2-up. */
  .ws-grid-section{
    max-width:1240px;
    margin:0 auto;
  }
  .ws-grid-sub{ margin-bottom:36px }
  .ws-grid-sub:last-child{ margin-bottom:0 }
  /* Side-by-side variant — applied when a grid-layout section has
     more than one subsection (e.g. Whitepapers left + Strategies
     right). Each subsection keeps its own square-card grid inside
     its half of the page; cards shrink because each side is
     narrower than a full-width grid. Falls back to stacked on
     narrow viewports. */
  .ws-grid-section.ws-grid-section--split{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:48px;
    align-items:start;
  }
  .ws-grid-section--split .ws-grid-sub{ margin-bottom:0 }
  @media (max-width:900px){
    .ws-grid-section.ws-grid-section--split{ grid-template-columns:1fr; gap:24px }
    .ws-grid-section--split .ws-grid-sub:not(:last-child){ margin-bottom:24px }
  }
  /* When split, each side's interior grid is 3 cards across so
     Whitepapers + Strategies together show 6 across the page. */
  .ws-grid-section--split .ws-square-grid{
    grid-template-columns:repeat(3, minmax(0, 1fr));
  }
  @media (max-width:760px){
    .ws-grid-section--split .ws-square-grid{ grid-template-columns:repeat(2, minmax(0, 1fr)) }
  }
  @media (max-width:520px){
    .ws-grid-section--split .ws-square-grid{ grid-template-columns:1fr }
  }
  .ws-grid-sub-head{
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    font-size:22px; font-weight:800; letter-spacing:0.01em;
    color:var(--accent);
    padding-bottom:12px; margin-bottom:18px;
    border-bottom:1px solid rgba(0,182,203,0.28);
  }
  [data-theme="light"] .ws-grid-sub-head{ border-bottom-color:rgba(0,182,203,0.32) }
  body.user-d-robbins .ws-grid-sub-head{
    color:#000080;
    border-bottom-color:rgba(0,0,128,0.30);
  }
  .ws-square-grid{
    display:grid;
    grid-template-columns:repeat(var(--cols, 3), minmax(0, 1fr));
    gap:16px;
  }
  @media (max-width:760px){
    .ws-square-grid{ grid-template-columns:repeat(2, minmax(0, 1fr)) }
  }
  @media (max-width:480px){
    .ws-square-grid{ grid-template-columns:1fr }
  }
  /* Square card — view mode. Slightly taller than wide so the dual
     button row at the bottom of a strategy card fits without
     crowding the title. */
  .ws-square-card{
    aspect-ratio:1 / 1.15;
    position:relative;
    display:flex; flex-direction:column;
    padding:16px;
    border-radius:14px;
    background:linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.015) 100%);
    border:1.5px solid rgba(0,182,203,0.22);
    color:inherit; text-decoration:none;
    text-align:left;
    box-shadow:0 4px 14px rgba(0,0,0,0.10), inset 0 1px 0 rgba(255,255,255,0.04);
    transition:all .22s cubic-bezier(.4,0,.2,1);
    overflow:hidden;
  }
  .ws-square-card::before{
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:linear-gradient(135deg, rgba(0,182,203,0.14) 0%, transparent 55%);
    opacity:0; transition:opacity .22s; pointer-events:none;
  }
  a.ws-square-card:hover{
    border-color:rgba(0,182,203,0.65);
    transform:translateY(-3px);
    box-shadow:0 14px 32px rgba(0,182,203,0.18), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  a.ws-square-card:hover::before{ opacity:1 }
  .ws-square-card.is-disabled{ opacity:0.5 }
  [data-theme="light"] .ws-square-card{
    background:linear-gradient(135deg, rgba(255,255,255,0.50) 0%, rgba(250,251,253,0.32) 100%);
    border-color:rgba(0,182,203,0.30);
    backdrop-filter:blur(14px) saturate(1.4);
    -webkit-backdrop-filter:blur(14px) saturate(1.4);
    box-shadow:0 4px 12px rgba(31,40,63,0.05), inset 0 1px 0 rgba(255,255,255,0.55);
  }
  [data-theme="light"] a.ws-square-card:hover{
    background:linear-gradient(135deg, rgba(255,255,255,0.62) 0%, rgba(250,251,253,0.45) 100%);
    border-color:rgba(0,182,203,0.65);
    box-shadow:0 14px 32px rgba(0,182,203,0.16), inset 0 1px 0 rgba(255,255,255,0.65);
  }
  /* Auto-icon block at the top of every square card — cyan-tinted
     square matching the hub-tool-icon aesthetic. Picked by
     _iconForTitle so users don't have to set one per card. */
  .ws-square-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:42px; height:42px;
    border-radius:10px;
    font-size:22px; line-height:1;
    background:linear-gradient(135deg, rgba(0,182,203,.18) 0%, rgba(0,182,203,.05) 100%);
    border:1px solid rgba(0,182,203,.28);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    margin-bottom:10px;
    position:relative; z-index:1;
    flex-shrink:0;
  }
  /* Status pill — top-right corner. */
  .ws-square-status{
    position:absolute; top:10px; right:10px; z-index:2;
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    font-size:9px; font-weight:800; letter-spacing:0.10em;
    text-transform:uppercase;
    padding:3px 7px;
    border-radius:4px;
    background:rgba(0,182,203,0.10);
    border:1px solid rgba(0,182,203,0.25);
    color:var(--accent);
    white-space:nowrap;
  }
  .ws-square-status--approved{
    background:rgba(0,182,203,0.15);
    border-color:rgba(0,182,203,0.45);
    color:var(--accent);
  }
  .ws-square-status--awaiting{
    background:rgba(245,166,35,0.14);
    border-color:rgba(245,166,35,0.50);
    color:#f5a623;
  }
  .ws-square-status--in-progress{
    background:rgba(102,153,255,0.14);
    border-color:rgba(102,153,255,0.50);
    color:#86a8ff;
  }
  .ws-square-status--not-completed{
    background:rgba(255,255,255,0.06);
    border-color:rgba(255,255,255,0.18);
    color:rgba(255,255,255,0.55);
  }
  [data-theme="light"] .ws-square-status--not-completed{
    background:rgba(31,40,63,0.06);
    border-color:rgba(31,40,63,0.20);
    color:rgba(31,40,63,0.60);
  }
  .ws-square-card-title{
    font-family:'Montserrat',sans-serif;
    font-size:17px; font-weight:800; letter-spacing:0.01em;
    margin:0; line-height:1.25;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
    position:relative; z-index:1;
  }
  .ws-square-card-date{
    font-size:12px; font-weight:600;
    opacity:0.55; letter-spacing:0.03em;
    margin-top:auto;
    padding-top:8px;
    position:relative; z-index:1;
  }
  /* Strategy bottom actions — Document + Slides side-by-side. */
  .ws-square-actions{
    display:flex; gap:6px; margin-top:10px;
    position:relative; z-index:1;
  }
  .ws-square-actions .ws-action{
    flex:1;
    padding:6px 8px;
    border-radius:6px;
    font-size:11px; font-weight:700; letter-spacing:0.02em;
    text-align:center;
    text-decoration:none;
    border:1px solid transparent;
    transition:all .15s;
  }
  .ws-square-actions .ws-action-primary{
    background:rgba(0,182,203,0.18);
    border-color:rgba(0,182,203,0.45);
    color:var(--accent);
  }
  .ws-square-actions .ws-action-primary:hover{
    background:rgba(0,182,203,0.28);
    border-color:rgba(0,182,203,0.65);
  }
  .ws-square-actions .ws-action-secondary{
    background:rgba(255,255,255,0.06);
    border-color:rgba(255,255,255,0.18);
    color:inherit;
  }
  .ws-square-actions .ws-action-secondary:hover{
    background:rgba(255,255,255,0.10);
    border-color:rgba(255,255,255,0.30);
  }
  [data-theme="light"] .ws-square-actions .ws-action-secondary{
    background:rgba(31,40,63,0.05);
    border-color:rgba(31,40,63,0.18);
  }
  .ws-square-actions .ws-action-disabled{
    background:rgba(255,255,255,0.04);
    border-color:rgba(255,255,255,0.10);
    color:rgba(255,255,255,0.35);
    cursor:not-allowed;
  }
  [data-theme="light"] .ws-square-actions .ws-action-disabled{
    background:rgba(31,40,63,0.04);
    border-color:rgba(31,40,63,0.10);
    color:rgba(31,40,63,0.40);
  }
  /* Square edit form — same outer shape, fields stacked inside. A
     touch taller than the view card to fit Status+Title+URL(+Slides
     for strategy)+Date without clipping. */
  .ws-square-edit{
    aspect-ratio:1 / 1.25;
    position:relative;
    display:flex; flex-direction:column; gap:6px;
    padding:12px 12px 10px;
    border-radius:14px;
    background:rgba(255,255,255,0.04);
    border:1.5px solid rgba(0,182,203,0.22);
  }
  [data-theme="light"] .ws-square-edit{
    background:rgba(255,255,255,0.55);
    border-color:rgba(0,182,203,0.30);
    backdrop-filter:blur(12px) saturate(1.4);
    -webkit-backdrop-filter:blur(12px) saturate(1.4);
  }
  .ws-square-edit .ws-card-delete{
    position:absolute; top:8px; right:8px;
  }
  .ws-square-edit .ws-input,
  .ws-square-edit .ws-select{
    padding:6px 8px;
    font-size:12px;
  }
  .ws-square-edit .ws-field{ gap:2px }
  .ws-square-edit .ws-field-label{ font-size:9px }
  /* "+ Add" tile sits in the grid as the last cell. */
  .ws-square-add{
    aspect-ratio:1 / 1.15;
    display:flex; align-items:center; justify-content:center;
    border-radius:14px;
    border:1.5px dashed rgba(0,182,203,0.40);
    background:transparent;
    color:var(--accent);
    font-family:inherit; font-size:32px; font-weight:300;
    cursor:pointer;
    transition:background .22s, border-color .22s;
  }
  .ws-square-add:hover{
    background:rgba(0,182,203,0.08);
    border-color:rgba(0,182,203,0.75);
  }

  /* ─── Column layout ─── replaces the per-subsection card grids
     for sectioned folders (Research Links, Whitepapers & Strategies,
     Selling/Buying Slides). Each subsection becomes a column with a
     compact list of items, so the page reads at a glance and the
     user doesn't scroll through stacked sections. */
  .ws-columns{
    max-width:1240px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
    gap:24px;
    align-items:start;
  }
  .ws-col{
    display:flex; flex-direction:column;
    min-width:0;            /* let flex children wrap titles cleanly */
  }
  .ws-col-head{
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    font-size:14px; font-weight:800; letter-spacing:0.02em;
    color:var(--accent);
    padding-bottom:10px; margin-bottom:12px;
    border-bottom:1px solid rgba(0,182,203,0.28);
  }
  [data-theme="light"] .ws-col-head{ border-bottom-color:rgba(0,182,203,0.32) }
  /* Per-user accessibility override — David Robbins. Cyan column
     headers (Research Links cluster names + Whitepapers/Strategies
     subsection names) swap to navy for him; border tint follows so
     the header still reads as a unit. Body class set in
     shared/auth.js. */
  body.user-d-robbins .ws-col-head{
    color:#000080;
    border-bottom-color:rgba(0,0,128,0.30);
  }
  .ws-col-list{
    display:flex; flex-direction:column;
    gap:8px;
  }

  /* View-mode item — whole row is a clickable link when url is set,
     muted plain text when not. The status dot only appears for
     whitepaper/strategy items (kind with an approval workflow). */
  .ws-col-item{
    display:flex; align-items:center; gap:8px;
    padding:7px 10px;
    border-radius:8px;
    color:inherit; text-decoration:none;
    font-size:14px; font-weight:600;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    transition:background .12s, border-color .12s, transform .12s;
    line-height:1.3;
  }
  .ws-col-item:hover{
    background:rgba(0,182,203,0.10);
    border-color:rgba(0,182,203,0.40);
    transform:translateX(2px);
  }
  .ws-col-item.is-disabled{ opacity:0.55; cursor:default }
  .ws-col-item.is-disabled:hover{
    background:rgba(255,255,255,0.03);
    border-color:rgba(255,255,255,0.08);
    transform:none;
  }
  [data-theme="light"] .ws-col-item{
    background:rgba(255,255,255,0.45);
    border-color:rgba(0,182,203,0.18);
    backdrop-filter:blur(8px) saturate(1.3);
    -webkit-backdrop-filter:blur(8px) saturate(1.3);
  }
  .ws-col-item-title{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .ws-col-item-date{
    font-size:10px; font-weight:600; opacity:0.55;
    letter-spacing:0.04em;
    margin-top:1px;
  }
  .ws-col-dot{
    width:8px; height:8px; flex:0 0 8px;
    border-radius:50%;
    background:rgba(255,255,255,0.25);
  }
  .ws-col-dot--approved   { background:#3ecf8e }
  .ws-col-dot--awaiting   { background:#e0a85c }
  .ws-col-dot--in-progress{ background:#5cc8e0 }
  .ws-col-dot--not-completed{ background:#9aa3b1 }

  /* Strategy items show a small "Slides" sub-link below the title. */
  .ws-col-item-stack{
    display:flex; flex-direction:column; flex:1; min-width:0;
    gap:2px;
  }
  .ws-col-slides{
    font-size:11px; font-weight:700; letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--accent); text-decoration:none;
    align-self:flex-start;
  }
  .ws-col-slides:hover{ text-decoration:underline }
  .ws-col-slides.is-disabled{ opacity:0.45; cursor:default }
  .ws-col-slides.is-disabled:hover{ text-decoration:none }

  /* Edit-mode item — narrow stacked form inside the column. Reuses
     the same data-field hooks that _wireEditCardFields wires up so
     persistence is identical to the old card editor. */
  .ws-col-edit{
    position:relative;
    display:flex; flex-direction:column; gap:6px;
    padding:10px 10px 10px 10px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:10px;
  }
  [data-theme="light"] .ws-col-edit{
    background:rgba(255,255,255,0.55);
    border-color:rgba(0,182,203,0.20);
    backdrop-filter:blur(10px) saturate(1.3);
    -webkit-backdrop-filter:blur(10px) saturate(1.3);
  }
  .ws-col-edit .ws-input,
  .ws-col-edit .ws-select{
    padding:6px 8px;
    font-size:13px;
  }
  .ws-col-edit .ws-field{ gap:2px }
  .ws-col-edit .ws-field-label{ font-size:10px }
  .ws-col-edit .ws-card-delete{
    position:absolute; top:6px; right:6px;
  }
  .ws-col-edit-row{
    display:flex; gap:6px;
  }
  .ws-col-edit-row > .ws-field{ flex:1; min-width:0 }

  /* "+ Add" tile at the bottom of each column in edit mode. */
  .ws-col-add{
    margin-top:4px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 10px;
    background:transparent;
    border:1px dashed rgba(0,182,203,0.45);
    border-radius:8px;
    color:var(--accent);
    font-family:inherit; font-size:13px; font-weight:700;
    cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  .ws-col-add:hover{
    background:rgba(0,182,203,0.10);
    border-color:rgba(0,182,203,0.75);
  }

  .ws-card{
    position:relative;
    display:flex; flex-direction:column;
    text-align:left;
    padding:20px 20px 18px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:14px;
    color:inherit; text-decoration:none;
    transition:transform .15s, background .15s, border-color .15s, box-shadow .15s;
    overflow:hidden;
  }
  .ws-card:hover{
    transform:translateY(-2px);
    background:rgba(0,182,203,0.08);
    border-color:rgba(0,182,203,0.40);
    box-shadow:0 12px 32px rgba(0,182,203,0.18);
  }
  /* Cards in edit mode get a static look — no hover lift, since
     the user is interacting with form fields, not a clickable
     surface. */
  body.ws-edit .ws-card{ cursor:default }
  body.ws-edit .ws-card:hover{
    transform:none;
    background:rgba(255,255,255,0.04);
    border-color:rgba(0,182,203,0.40);
    box-shadow:none;
  }
  [data-theme="light"] .ws-card{
    background:linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(250,251,253,0.40) 100%);
    border:1px solid rgba(0,182,203,0.22);
    backdrop-filter:blur(12px) saturate(1.4);
    -webkit-backdrop-filter:blur(12px) saturate(1.4);
    box-shadow:0 4px 14px rgba(31,40,63,0.05), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  [data-theme="light"] body.ws-edit .ws-card:hover{
    background:linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(250,251,253,0.40) 100%);
  }

  /* Status pill. */
  .ws-card-status{
    align-self:flex-start;
    padding:3px 9px;
    border-radius:999px;
    font-size:9.5px; font-weight:800; letter-spacing:0.10em; text-transform:uppercase;
    margin-bottom:12px;
  }
  .ws-status-approved{
    background:rgba(0,182,203,0.15);
    border:1px solid rgba(0,182,203,0.45);
    color:var(--accent);
  }
  .ws-status-awaiting{
    background:rgba(245,166,35,0.14);
    border:1px solid rgba(245,166,35,0.50);
    color:#f5a623;
  }
  .ws-status-in-progress{
    background:rgba(102,153,255,0.14);
    border:1px solid rgba(102,153,255,0.50);
    color:#86a8ff;
  }
  .ws-status-not-completed{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.18);
    color:rgba(255,255,255,0.55);
  }
  [data-theme="light"] .ws-status-not-completed{
    background:rgba(31,40,63,0.06);
    border-color:rgba(31,40,63,0.20);
    color:rgba(31,40,63,0.60);
  }

  .ws-card-title{
    font-size:17px; font-weight:800;
    margin:0 0 6px;
    line-height:1.25;
    letter-spacing:-0.01em;
  }
  .ws-card-meta{
    font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
    opacity:0.55;
    margin:0 0 16px;
  }

  /* Action buttons. */
  .ws-card-actions{
    display:flex; gap:8px; flex-wrap:wrap;
    margin-top:auto;
  }
  .ws-action{
    flex:1 1 auto;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 12px;
    border-radius:8px;
    font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    transition:background .12s, border-color .12s, color .12s;
    white-space:nowrap;
  }
  .ws-action span{ font-size:14px; transition:transform .15s }
  .ws-action:hover span{ transform:translateX(3px) }
  .ws-action-primary{
    background:var(--accent);
    border:1px solid var(--accent);
    color:#0a1520;
  }
  .ws-action-primary:hover{
    background:#26d4e8;
    border-color:#26d4e8;
  }
  .ws-action-secondary{
    background:transparent;
    border:1px solid rgba(0,182,203,0.45);
    color:var(--accent);
  }
  .ws-action-secondary:hover{
    background:rgba(0,182,203,0.14);
    border-color:rgba(0,182,203,0.70);
  }
  .ws-action-disabled{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.12);
    color:rgba(255,255,255,0.40);
    cursor:not-allowed;
    pointer-events:none;
  }
  [data-theme="light"] .ws-action-disabled{
    background:rgba(31,40,63,0.04);
    border-color:rgba(31,40,63,0.16);
    color:rgba(31,40,63,0.40);
  }

  /* ─── Edit-mode form fields ─── only rendered when body.ws-edit
     is on. Each card swaps its read-only text for paired
     label + input rows. Status pill becomes a <select> styled
     to match the read-only pill so the layout stays uniform. */
  .ws-field{
    display:flex; flex-direction:column; gap:4px;
    margin-bottom:10px;
  }
  .ws-field-label{
    font-size:9.5px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
    opacity:0.50;
  }
  .ws-input,
  .ws-select{
    width:100%;
    padding:8px 10px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:6px;
    color:inherit;
    font-family:inherit; font-size:13px;
    transition:border-color .15s, background .15s;
  }
  .ws-input:focus,
  .ws-select:focus{
    outline:none;
    border-color:rgba(0,182,203,0.70);
    background:rgba(0,182,203,0.06);
  }
  [data-theme="light"] .ws-input,
  [data-theme="light"] .ws-select{
    background:rgba(0,182,203,0.06);
    border-color:rgba(31,40,63,0.18);
  }
  /* color-scheme:dark on the <select> tells the browser to render
     the dropdown popup with dark-theme defaults; without it,
     Chrome/Windows draws a white popup that hides white text. */
  .ws-select{ color-scheme:dark }
  .ws-select option{ background:#1a2334; color:#e3eaf5 }
  [data-theme="light"] .ws-select{ color-scheme:light }
  [data-theme="light"] .ws-select option{ background:#fff; color:#1f283f }

  /* Date input + Today button — flex row inside the .ws-field so
     the date stretches and the Today button sits as a tight pill on
     the right. color-scheme:dark on the date input keeps the picker
     popup dark-themed in browsers that style it. */
  .ws-date-row{
    display:flex; gap:6px; align-items:stretch;
  }
  .ws-date-input{ flex:1 1 auto; color-scheme:dark; }
  [data-theme="light"] .ws-date-input{ color-scheme:light; }
  .ws-today-btn{
    flex:0 0 auto;
    padding:0 12px;
    background:rgba(0,182,203,0.18);
    border:1px solid rgba(0,182,203,0.55);
    border-radius:6px;
    color:inherit;
    font-family:inherit; font-size:11px; font-weight:700;
    letter-spacing:0.06em; text-transform:uppercase;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .ws-today-btn:hover{
    background:rgba(0,182,203,0.32);
    border-color:rgba(0,182,203,0.85);
  }
  [data-theme="light"] .ws-today-btn{
    background:rgba(0,182,203,0.10);
    border-color:rgba(0,182,203,0.40);
    color:#0a1520;
  }
  [data-theme="light"] .ws-today-btn:hover{
    background:rgba(0,182,203,0.22);
  }

  /* Title input is bigger / bolder so editing feels like editing
     the title, not just a generic field. */
  .ws-input-title{
    font-size:16px; font-weight:800;
    padding:8px 10px;
  }

  /* Delete button — top-right of the card while in edit mode. */
  .ws-card-delete{
    position:absolute; top:10px; right:10px;
    width:26px; height:26px;
    background:rgba(229,123,123,0.18);
    border:1px solid rgba(229,123,123,0.40);
    border-radius:6px;
    color:#ff8888;
    font-size:14px; font-weight:700;
    cursor:pointer;
    display:none;
  }
  body.ws-edit .ws-card-delete{ display:block }

<script>
/* ============================================================
   DOCUMENTS REGISTRY

   The page is organised into N user-managed sections, each
   containing N user-managed cards. Sections and cards can be
   added, renamed, edited, and deleted in edit mode (Tier 0/1).
   Edits live in localStorage; clear WS_STORAGE_KEY to reset.

     SECTION:
       id     — stable identifier (auto-generated for new sections)
       title  — section heading
       items  — array of card entries

     ITEM (card):
       title  — card title
       url    — link to the document/page ('' if unset)
       status — 'approved' | 'awaiting' | 'in-progress' | 'not-completed'
       date   — last upload date as displayed (e.g. "08/12/2025")

   Cards with no `url` show a disabled "Not Available Yet" chip.
   ============================================================ */
/* Strategy titles — used both as default seeds in the Strategies
   folder and to split a legacy merged "Whitepapers and Strategies"
   section during migration. Kept in a Set for O(1) lookup. */
const STRATEGY_TITLES = new Set([
  'Rentvester',
  'Debt Reducer',
  'Debt Reducer — New Build',
  'Upgrader',
  'High-Growth Residential',
  'Strategic Allocation',
  'Model Portfolios',
]);

/* Research Links subsections — capital cities + three regional
   clusters. kind:null so cards in here don't render the Status field
   (Research Links has no approval workflow). */
const RESEARCH_LINKS_SUBS = [
  { id: 'rl-capital',  title: 'Capital Cities',      kind: null, items: [] },
  { id: 'rl-qld',      title: 'QLD Regions',         kind: null, items: [] },
  { id: 'rl-nsw',      title: 'NSW Regions',         kind: null, items: [] },
  { id: 'rl-vicwatas', title: 'VIC/WA/TAS Regions',  kind: null, items: [] },
  { id: 'rl-others',   title: 'Others',              kind: null, items: [] },
];
const WS_DEFAULTS = {
  sections: [
    { id: 'research-links',        icon: '🔗', title: 'Research Links',             currentEdition: '', subsections: JSON.parse(JSON.stringify(RESEARCH_LINKS_SUBS)) },
    {
      id: 'whitepapers-strategies',
      icon: '📚',
      title: 'Whitepapers and Strategies',
      /* layout:'grid' renders each subsection (Whitepapers / Strategies)
         as its own 3-column square-card grid, mirroring the Buying/
         Selling Slides layout in presentations-library. The default
         column-list layout used by Research Links isn't ideal here
         since each subsection lists ~10+ items that read better as
         scannable square tiles. */
      layout: 'grid',
      gridCols: 3,
      /* This folder uses subsections rather than a flat items list.
         Each subsection has a `kind` that picks the card layout:
           'whitepaper' → single "Open Paper" CTA
           'strategy'   → dual "Document" + "Slides" buttons
         The two subsections are fixed for this folder — users add /
         edit / delete cards within them but can't rename or remove
         the sections themselves. */
      subsections: [
        {
          id: 'whitepapers-sub',
          title: 'Whitepapers',
          kind: 'whitepaper',
          items: [
            { title: 'Research Fundamental Principles',   url: '', status: 'approved',    date: '12/12/2025' },
            { title: 'Trading v Foundation',              url: '', status: 'approved',    date: '12/12/2025' },
            { title: 'Lifestyle Assets',                  url: '', status: 'approved',    date: '12/12/2025' },
            { title: 'Investing through Uncertain Times', url: '', status: 'approved',    date: '12/12/2025' },
            { title: 'Australian Housing Policy Cycle',   url: '', status: 'approved',    date: '25/03/2026' },
            { title: 'Buying in Melbourne',               url: '', status: 'approved',    date: '25/03/2026' },
            { title: 'Interest Rates',                    url: '', status: 'approved',    date: '26/03/2026' },
            { title: 'Asset Quality Performance',         url: '', status: 'awaiting',    date: '01/05/2026' },
            { title: 'Foundation v Multiple Trading',     url: '', status: 'in-progress', date: ''           },
          ],
        },
        {
          id: 'strategies-sub',
          title: 'Strategies',
          kind: 'strategy',
          items: [
            { title: 'Rentvester',                  url: '', slidesUrl: '', status: 'approved', date: '08/12/2025' },
            { title: 'Debt Reducer',                url: '', slidesUrl: '', status: 'approved', date: '08/12/2025' },
            { title: 'Debt Reducer — New Build',    url: '', slidesUrl: '', status: 'awaiting', date: '01/05/2026' },
            { title: 'Upgrader',                    url: '', slidesUrl: '', status: 'approved', date: '08/12/2025' },
            { title: 'High-Growth Residential',     url: '', slidesUrl: '', status: 'approved', date: '08/12/2025' },
            { title: 'Strategic Allocation',        url: '', slidesUrl: '', status: 'approved', date: '08/12/2025' },
            { title: 'Model Portfolios',            url: '', slidesUrl: '', status: 'approved', date: '27/01/2026' },
          ],
        },
      ],
    },
    /* Selling/Buying Slides moved out of Documents into the new
       Presentations Library tool (tools/presentations-library.html).
       Legacy migrations below still rebuild the folder for users with
       very old localStorage so nothing they've already entered is
       lost — they can copy items into the Presentations Library and
       delete the folder via edit-mode × on the type tile. */
  ],
};

const WS_STATUS_LABELS = {
  'approved':       'Approved',
  'awaiting':       'Awaiting Approval',
  'in-progress':    'In Progress',
  'not-completed':  'Not Yet Completed',
};

const WS_STORAGE_KEY     = 'ppa-doc-data-v3';
const WS_LEGACY_KEY_V0   = 'ppa-ws-data-v1';   /* original strategies/whitepapers shape       */
const WS_LEGACY_KEY_V1   = 'ppa-doc-data-v1';  /* merged-folder sections shape                */
const WS_LEGACY_KEY_V2   = 'ppa-doc-data-v2';  /* split into separate Whitepapers + Strategies folders */

function _genSectionId() {
  return 'sec-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function _normalizeItem(it) {
  return {
    title:  (it && it.title)  || '',
    url:    (it && it.url)    || '',
    status: (it && it.status) || 'approved',
    date:   (it && it.date)   || '',
  };
}

/* Build a fresh combined Whitepapers and Strategies folder shape. */
function _buildCombinedFolder(whitepaperItems, strategyItems) {
  return {
    id: 'whitepapers-strategies',
    icon: '📚',
    title: 'Whitepapers and Strategies',
    subsections: [
      { id: 'whitepapers-sub', title: 'Whitepapers', kind: 'whitepaper', items: whitepaperItems || [] },
      { id: 'strategies-sub',  title: 'Strategies',  kind: 'strategy',   items: strategyItems  || [] },
    ],
  };
}

/* Migrate the original { strategies, whitepapers } shape (v0) into
   v3. Whitepapers go into the Whitepapers subsection; strategies
   keep their slidesUrl and go into the Strategies subsection. */
function _migrateFromV0(old) {
  const strategyItems   = (old.strategies  || []).map(s => ({
    title:     s.title     || '',
    url:       s.url       || '',
    slidesUrl: s.slidesUrl || '',
    status:    s.status    || 'approved',
    date:      s.date      || '',
  }));
  const whitepaperItems = (old.whitepapers || []).map(_normalizeItem);
  return {
    sections: [
      { id: 'research-links',        icon: '🔗', title: 'Research Links',        items: [] },
      _buildCombinedFolder(whitepaperItems, strategyItems),
      { id: 'selling-buying-slides', icon: '🎯', title: 'Selling/Buying Slides', items: [] },
    ],
  };
}

/* Migrate v1 (merged-folder sections shape, flat items inside the
   Whitepapers and Strategies section) → v3. Items get split by exact
   title match against STRATEGY_TITLES; " — Slides" suffix items go
   to Selling/Buying Slides. User-added folders carry over. */
function _migrateFromV1(v1) {
  const out = [];
  let mergedHandled = false;

  (v1.sections || []).forEach(sec => {
    if (sec.id === 'whitepapers-strategies' || /whitepapers?\s*(?:and|&)\s*strategies/i.test(sec.title || '')) {
      const wp = [], st = [], sl = [];
      (sec.items || []).forEach(it => {
        const item = _normalizeItem(it);
        if (/ — Slides$/.test(item.title)) sl.push(item);
        else if (STRATEGY_TITLES.has(item.title))
          st.push({ ...item, slidesUrl: '' });   /* promote to strategy schema */
        else wp.push(item);
      });
      out.push(_buildCombinedFolder(wp, st));
      if (sl.length) sec._extractedSlides = sl;
      mergedHandled = true;
    } else {
      out.push({
        id:    sec.id    || _genSectionId(),
        icon:  sec.icon  || '📁',
        title: sec.title || 'Untitled',
        items: (sec.items || []).map(_normalizeItem),
      });
    }
  });

  /* Ensure the canonical folders exist, in canonical order at the
     front. Any user-added sections trail after them. */
  function ensure(id, makeSection) {
    if (!out.find(s => s.id === id)) out.unshift(makeSection());
  }
  ensure('selling-buying-slides', () => ({ id: 'selling-buying-slides', icon: '🎯', title: 'Selling/Buying Slides', items: [] }));
  ensure('whitepapers-strategies', () => _buildCombinedFolder([], []));
  ensure('research-links',         () => ({ id: 'research-links',        icon: '🔗', title: 'Research Links',        items: [] }));

  /* Drain extracted slides into Selling/Buying Slides. */
  const slidesFolder = out.find(s => s.id === 'selling-buying-slides');
  (v1.sections || []).forEach(sec => {
    if (sec._extractedSlides && slidesFolder) {
      slidesFolder.items = slidesFolder.items.concat(sec._extractedSlides);
    }
  });

  return { sections: out };
}

/* Migrate v2 (separate Whitepapers + Strategies folders) → v3.
   The two folders fold back into one combined folder with two
   subsections; strategies items pick up an empty slidesUrl so they
   match the strategy card schema. Other folders carry over. */
function _migrateFromV2(v2) {
  const out = [];
  let combinedAdded = false;
  let wpItems = null;
  let stItems = null;

  (v2.sections || []).forEach(sec => {
    if (sec.id === 'whitepapers') {
      wpItems = (sec.items || []).map(_normalizeItem);
    } else if (sec.id === 'strategies') {
      stItems = (sec.items || []).map(it => ({ ..._normalizeItem(it), slidesUrl: it.slidesUrl || '' }));
    } else {
      out.push({
        id:    sec.id    || _genSectionId(),
        icon:  sec.icon  || '📁',
        title: sec.title || 'Untitled',
        items: (sec.items || []).map(_normalizeItem),
        ...(sec.subsections ? { subsections: sec.subsections } : {}),
      });
    }
  });

  /* Insert the combined folder where the Whitepapers folder used
     to sit (between Research Links and Selling/Buying Slides). */
  const combined = _buildCombinedFolder(wpItems || [], stItems || []);
  const insertAt = out.findIndex(s => s.id === 'selling-buying-slides');
  if (insertAt >= 0) out.splice(insertAt, 0, combined);
  else out.push(combined);

  /* Ensure canonical anchors. */
  function ensure(id, makeSection) {
    if (!out.find(s => s.id === id)) out.unshift(makeSection());
  }
  ensure('selling-buying-slides', () => ({ id: 'selling-buying-slides', icon: '🎯', title: 'Selling/Buying Slides', items: [] }));
  ensure('research-links',         () => ({ id: 'research-links',        icon: '🔗', title: 'Research Links',        items: [] }));

  return { sections: out };
}

/* Load saved library from localStorage. Resolution order:
     1. Current key (v3)                       — return as-is.
     2. v2 key (split into separate folders)   — migrate, persist, return.
     3. v1 key (merged-folder, flat items)     — migrate, persist, return.
     4. Original ppa-ws-data-v1                — migrate, persist, return.
     5. Otherwise                              — seed defaults. */
/* Auto-icon picker for square cards — same lookup tables as
   presentations-library so Documents matches the Library look. Region
   names beat keywords (so "Buying in Melbourne" → 🚋 not 🛒), and
   region keys are sorted longest-first so "Port Macquarie" matches
   before any shorter substring. */
const REGION_ICONS = {
  'adelaide':       '🍷', 'brisbane':       '🌞', 'canberra':       '🏛️',
  'darwin':         '🌴', 'hobart':         '🏞️', 'melbourne':      '🚋',
  'perth':          '🌅', 'sydney':         '🌉',
  'bundaberg':      '🥃', 'cairns':         '🐠', 'gladstone':      '🛢️',
  'gold coast':     '🏄', 'ipswich':        '🏭', 'mackay':         '🍬',
  'rockhampton':    '🐂', 'sunshine coast': '🌊', 'toowoomba':      '🌹',
  'townsville':     '🌺',
  'albury':         '🌳', 'central coast':  '🐚', 'coffs harbour':  '🍌',
  'newcastle':      '⚓', 'orange':         '🍊', 'port macquarie': '🐨',
  'tamworth':       '🎵', 'wagga wagga':    '🌾', 'wollongong':     '🏖️',
  'ballarat':       '⛏️', 'bendigo':        '🪙', 'geelong':        '🏉',
  'mildura':        '🍇', 'wodonga':        '🌄', 'bunbury':        '🐋',
  'rockingham':     '🐬', 'launceston':     '🏔️',
};
const REGION_KEYS_BY_LENGTH = Object.keys(REGION_ICONS).sort((a, b) => b.length - a.length);
const TITLE_ICON_RULES = [
  [/rentvest|rental/i,              '🏘️'],
  [/new\s*build|construction/i,     '🏗️'],
  [/debt\s*reducer|debt/i,          '💳'],
  [/upgrad/i,                       '⬆️'],
  [/high.?growth|\bgrowth/i,        '🌱'],
  [/model\s*portfolio|portfolio/i,  '💼'],
  [/strategic|allocation|strateg/i, '🎯'],
  [/foundation/i,                   '🏛️'],
  [/trading|trade/i,                '📊'],
  [/lifestyle/i,                    '✨'],
  [/wealth|money|finance/i,         '💰'],
  [/selling|seller|\bsell/i,        '🏷️'],
  [/buying|buyer|\bbuy/i,           '🛒'],
  [/investment|investing|invest/i,  '📈'],
  [/property|housing|house|home/i,  '🏠'],
  [/research|analys|fundamentals/i, '🔍'],
  [/policy|cycle/i,                 '📜'],
  [/refinanc/i,                     '🔄'],
  [/\btax/i,                        '🧾'],
  [/cash.?flow|\bcash/i,            '💵'],
  [/multiple|multi/i,               '📚'],
  [/interest|rate/i,                '📉'],
  [/asset/i,                        '💼'],
  [/uncertain|risk/i,               '⚠️'],
];
function _iconForTitle(title) {
  const t = String(title || '');
  if (!t) return '📊';
  for (let i = 0; i < REGION_KEYS_BY_LENGTH.length; i++) {
    const key = REGION_KEYS_BY_LENGTH[i];
    const re = new RegExp('(?:^|[^a-z])' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:$|[^a-z])', 'i');
    if (re.test(t)) return REGION_ICONS[key];
  }
  for (let i = 0; i < TITLE_ICON_RULES.length; i++) {
    if (TITLE_ICON_RULES[i][0].test(t)) return TITLE_ICON_RULES[i][1];
  }
  return '📊';
}

/* Apply latest-schema metadata onto an already-loaded data object.
   Section-level fields like layout/gridCols are CODE-driven, not
   user-driven — they describe the visual treatment, not editable
   content. When we add or change these in the defaults, users who
   already have data in localStorage from an earlier release would
   otherwise never see the change. Walk known section ids and
   force-apply the current defaults' layout config. */
function _applyLatestSectionMetadata(data) {
  if (!data || !Array.isArray(data.sections)) return data;
  const defaultsBy = {};
  (WS_DEFAULTS.sections || []).forEach(s => { defaultsBy[s.id] = s; });
  data.sections.forEach(s => {
    const d = defaultsBy[s.id];
    if (!d) return;
    if (d.layout)   s.layout   = d.layout;
    if (d.gridCols) s.gridCols = d.gridCols;
  });
  return data;
}

function loadWsData() {
  try {
    const raw = localStorage.getItem(WS_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.sections)) return _applyLatestSectionMetadata(parsed);
    }
    const v2Raw = localStorage.getItem(WS_LEGACY_KEY_V2);
    if (v2Raw) {
      const v2 = JSON.parse(v2Raw);
      if (v2 && Array.isArray(v2.sections)) {
        const migrated = _migrateFromV2(v2);
        try { localStorage.setItem(WS_STORAGE_KEY, JSON.stringify(migrated)); } catch (_) {}
        return migrated;
      }
    }
    const v1Raw = localStorage.getItem(WS_LEGACY_KEY_V1);
    if (v1Raw) {
      const v1 = JSON.parse(v1Raw);
      if (v1 && Array.isArray(v1.sections)) {
        const migrated = _migrateFromV1(v1);
        try { localStorage.setItem(WS_STORAGE_KEY, JSON.stringify(migrated)); } catch (_) {}
        return migrated;
      }
    }
    const v0Raw = localStorage.getItem(WS_LEGACY_KEY_V0);
    if (v0Raw) {
      const v0 = JSON.parse(v0Raw);
      if (v0 && (Array.isArray(v0.strategies) || Array.isArray(v0.whitepapers))) {
        const migrated = _migrateFromV0(v0);
        try { localStorage.setItem(WS_STORAGE_KEY, JSON.stringify(migrated)); } catch (_) {}
        return migrated;
      }
    }
  } catch (_) { /* fall through to defaults */ }
  return JSON.parse(JSON.stringify(WS_DEFAULTS));
}
function saveWsData(data) {
  try { localStorage.setItem(WS_STORAGE_KEY, JSON.stringify(data)); } catch (_) {}
}

/* Idempotent normaliser — runs on every load path (localStorage +
   cloud). Two responsibilities:
     1. Strip the deprecated `selling-buying-slides` section. Those
        decks moved to the Presentations Library
        (tools/presentations-library.html); the Documents tool no
        longer surfaces the folder. The cloud bin gets the stripped
        shape pushed back up the next time _canWriteCloud is true so
        the change propagates to other users.
     2. Reshape the Research Links folder from its old flat-items
        shape into the subsection shape it uses now, and ensure the
        "Others" subsection is present. */
function _ensureSubsections(data) {
  if (!data || !Array.isArray(data.sections)) return data;

  const beforeLen = data.sections.length;
  data.sections = data.sections.filter(sec => sec && sec.id !== 'selling-buying-slides');
  const stripped = data.sections.length !== beforeLen;

  data.sections = data.sections.map(sec => {
    if (sec.id === 'research-links' && (!sec.subsections || !sec.subsections.length)) {
      const subs = JSON.parse(JSON.stringify(RESEARCH_LINKS_SUBS));
      const flat = Array.isArray(sec.items) ? sec.items.map(_normalizeItem) : [];
      if (flat.length) subs[0].items = flat;
      return { id: 'research-links', icon: sec.icon || '🔗', title: sec.title || 'Research Links', currentEdition: sec.currentEdition || '', subsections: subs };
    }
    return sec;
  });
  /* Add the "Others" Research Links subsection for legacy data that
     pre-dates it. Idempotent: skips if it already exists. */
  data.sections.forEach(sec => {
    if (sec.id === 'research-links' && Array.isArray(sec.subsections)) {
      if (!sec.subsections.some(s => s && s.id === 'rl-others')) {
        sec.subsections.push({ id: 'rl-others', title: 'Others', kind: null, items: [] });
      }
    }
  });

  if (stripped) {
    /* Persist locally so the strip survives a hard reload even if
       cloud is offline. _scheduleCloudSave silently no-ops when
       _canWriteCloud is false (non-admin users); admins push the
       stripped shape up to documents_state so it propagates. */
    try { localStorage.setItem(WS_STORAGE_KEY, JSON.stringify(data)); } catch (_) {}
    if (typeof _scheduleCloudSave === 'function') _scheduleCloudSave();
  }

  return data;
}

/* ═══ CLOUD SYNC ═══
   Backed by public.documents_state in Supabase (singleton row id=1,
   payload jsonb mirrors WS_DATA: { sections, lastEdited }).
   - GET  on boot to hydrate WS_DATA (overrides localStorage cache).
   - PUT  (debounced) on every persist() so admin edits propagate to
          everyone else's next page load.
   Auth boundary is RLS (only dev/admin can write) AND the page-level
   tier gate (_canWriteCloud) so non-writers never even attempt the
   update. */
const WS_SAVE_DEBOUNCE_MS = 800;

let WS_DATA          = _ensureSubsections(loadWsData());
let _editMode        = false;
let _cloudLoaded     = false;   /* true once we've hydrated from cloud */
let _canWriteCloud   = false;   /* true for Tier 0/1 — gates the PUT  */
/* View state: 'picker' shows the type chooser; 'section' drills
   into one type's cards. _currentSecIdx is which section is open. */
let _currentView     = 'picker';
let _currentSecIdx   = -1;

/* Save indicator — flashes "Saved" briefly after persist().
   Debounced so rapid keystrokes don't strobe the indicator. */
let _saveFlashTimer = null;
function flashSaved() {
  const el = document.getElementById('ws-save-indicator');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(_saveFlashTimer);
  _saveFlashTimer = setTimeout(() => el.classList.remove('show'), 1100);
}

/* Push WS_DATA to the cloud bin. Debounced so rapid keystrokes don't
   spam the function. Silently no-ops if the user can't write (Tier 2-4
   in-memory edits stay local; the body.ws-readonly class also hides
   the Edit toggle so this rarely matters in practice). */
let _cloudSaveTimer = null;
function _scheduleCloudSave() {
  if (!_canWriteCloud) return;
  clearTimeout(_cloudSaveTimer);
  _cloudSaveTimer = setTimeout(async () => {
    try {
      if (!window.sb) return;
      const { error } = await window.sb
        .from('documents_state')
        .update({ payload: WS_DATA })
        .eq('id', 1);
      if (error) console.warn('Documents cloud save:', error);
    } catch (e) {
      console.warn('Documents cloud save failed:', e);
    }
  }, WS_SAVE_DEBOUNCE_MS);
}

function persist() {
  /* Stamp every save so the cloud-hydrate logic can tell the
     difference between "cloud was seeded with default folders by
     the setup script" (no lastEdited) and "an admin has actually
     touched cloud" (lastEdited present). Without this marker,
     fresh-seed cloud content would overwrite real local edits the
     first time an admin loaded the tool. */
  if (WS_DATA) WS_DATA.lastEdited = Date.now();
  saveWsData(WS_DATA);   /* always update local cache (offline fallback) */
  _scheduleCloudSave();  /* push to shared cloud bin (admin-only, debounced) */
  flashSaved();
}

/* Pull the latest library from cloud and replace WS_DATA with it.
   Called once at boot AFTER the synchronous localStorage render so
   the user sees something immediately, then the cloud version
   overrides ONLY if it has been admin-edited (lastEdited present).
   If cloud is empty or only has the canonical seed and we have
   local data, push local up so the bin reflects what we see. */
async function _hydrateFromCloud() {
  try {
    if (!window.sb) return;
    const { data, error } = await window.sb
      .from('documents_state')
      .select('payload')
      .eq('id', 1)
      .single();
    if (error) return;
    const cloud = data && data.payload;
    if (cloud && cloud.lastEdited && Array.isArray(cloud.sections)) {
      /* _ensureSubsections rewrites the legacy flat shape of the
         Research Links and Selling/Buying Slides folders into the
         new subsection shape (any flat items move into the first
         subsection). Idempotent — no-op once cloud already has the
         new structure. */
      WS_DATA = _applyLatestSectionMetadata(_ensureSubsections(cloud));
      _cloudLoaded = true;
      try { localStorage.setItem(WS_STORAGE_KEY, JSON.stringify(WS_DATA)); } catch (_) {}
      renderAll();
      return;
    }
    /* Cloud is fresh / seed-only. If our local cache has any items,
       push it up so the bin reflects this admin's library. */
    if (_canWriteCloud && WS_DATA && WS_DATA.sections && WS_DATA.sections.some(s => _countItems(s) > 0)) {
      _scheduleCloudSave();
    }
  } catch (e) {
    console.warn('Documents cloud load failed; falling back to local cache:', e);
  }
}

/* HTML escape — every interpolated string runs through this since
   the data flows from user input. */
function _esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function _statusClass(status) { return 'ws-status-' + (status || 'approved'); }
function _statusLabel(status) { return WS_STATUS_LABELS[status] || 'Approved'; }
function _statusOptionsHtml(selected) {
  return Object.keys(WS_STATUS_LABELS).map(key => {
    const sel = (key === selected) ? ' selected' : '';
    return '<option value="' + _esc(key) + '"' + sel + '>' + _esc(WS_STATUS_LABELS[key]) + '</option>';
  }).join('');
}

/* ─── Subsection-aware data helpers ───
   A folder either has flat `items` or a `subsections` array. These
   helpers paper over the difference so add/edit/delete code can
   take an optional subIdx and not care which shape it's touching. */

function _itemsContainer(secIdx, subIdx) {
  const sec = WS_DATA.sections[secIdx];
  if (!sec) return null;
  if (subIdx != null && sec.subsections && sec.subsections[subIdx]) {
    if (!sec.subsections[subIdx].items) sec.subsections[subIdx].items = [];
    return sec.subsections[subIdx].items;
  }
  if (!sec.items) sec.items = [];
  return sec.items;
}

function _itemAt(secIdx, subIdx, itemIdx) {
  const arr = _itemsContainer(secIdx, subIdx);
  return arr ? arr[itemIdx] : null;
}

function _subsectionKind(secIdx, subIdx) {
  const sec = WS_DATA.sections[secIdx];
  if (!sec || subIdx == null || !sec.subsections) return null;
  return sec.subsections[subIdx] && sec.subsections[subIdx].kind;
}

/* Total card count across either flat items or all subsections —
   used by the picker tile and the section header. */
function _countItems(section) {
  if (section && section.subsections && section.subsections.length) {
    return section.subsections.reduce((n, sub) => n + ((sub.items || []).length), 0);
  }
  return (section && section.items ? section.items.length : 0);
}

function _gridIdFor(secIdx, subIdx) {
  return subIdx == null ? 'ws-sec-grid-' + secIdx : 'ws-sub-grid-' + secIdx + '-' + subIdx;
}

/* ─── Item (card) renderers ─── */

/* Generic / whitepaper card — single primary CTA. The CTA label is
   "Open Paper" inside a Whitepapers subsection, "Open" elsewhere. */
function _renderItemView(item, ctaLabel, showStatus) {
  const label = ctaLabel || 'Open';
  const meta = item.date ? 'Last updated ' + _esc(item.date) : 'Last updated —';
  const statusHtml = showStatus
    ? '<div class="ws-card-status ' + _esc(_statusClass(item.status)) + '">' + _esc(_statusLabel(item.status)) + '</div>'
    : '';
  const head =
    statusHtml +
    '<h3 class="ws-card-title">' + _esc(item.title || 'Untitled') + '</h3>' +
    '<div class="ws-card-meta">' + meta + '</div>';
  if (item.url) {
    const a = document.createElement('a');
    a.className = 'ws-card';
    a.href = item.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.innerHTML = head +
      '<div class="ws-card-actions"><span class="ws-action ws-action-primary">' + _esc(label) + ' <span>›</span></span></div>';
    return a;
  }
  const div = document.createElement('div');
  div.className = 'ws-card';
  div.innerHTML = head +
    '<div class="ws-card-actions"><span class="ws-action ws-action-disabled">Not Available Yet</span></div>';
  return div;
}

/* Strategy card — dual buttons (Document + Slides). Mirrors the
   original layout from before the picker refactor. */
function _renderStrategyView(item) {
  const card = document.createElement('div');
  card.className = 'ws-card';
  const docBtn = item.url
    ? '<a class="ws-action ws-action-primary" href="' + _esc(item.url) + '" target="_blank" rel="noopener noreferrer">Document <span>›</span></a>'
    : '<span class="ws-action ws-action-disabled">Document</span>';
  const slidesBtn = item.slidesUrl
    ? '<a class="ws-action ws-action-secondary" href="' + _esc(item.slidesUrl) + '" target="_blank" rel="noopener noreferrer">Slides <span>›</span></a>'
    : '<span class="ws-action ws-action-disabled">Slides · TBC</span>';
  card.innerHTML =
    '<div class="ws-card-status ' + _esc(_statusClass(item.status)) + '">' + _esc(_statusLabel(item.status)) + '</div>' +
    '<h3 class="ws-card-title">' + _esc(item.title || 'Untitled') + '</h3>' +
    '<div class="ws-card-meta">' + (item.date ? 'Last upload ' + _esc(item.date) : 'Last upload —') + '</div>' +
    '<div class="ws-card-actions">' + docBtn + slidesBtn + '</div>';
  return card;
}

/* Date helpers — storage uses Australian DD/MM/YYYY format; native
   <input type="date"> works in YYYY-MM-DD. We convert at the
   boundaries so the calendar picker is usable but the persisted
   string stays the same shape it always has. */
function _dateToInputValue(dmy) {
  if (!dmy) return '';
  const m = String(dmy).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return '';
  return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
}
function _dateFromInputValue(ymd) {
  if (!ymd) return '';
  const m = String(ymd).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return '';
  return m[3] + '/' + m[2] + '/' + m[1];
}
function _todayDmy() {
  const d = new Date();
  return String(d.getDate()).padStart(2, '0') + '/' +
         String(d.getMonth() + 1).padStart(2, '0') + '/' +
         d.getFullYear();
}

/* Render a "Last updated" field with a native calendar picker plus
   a small Today shortcut. Used by both the generic card editor and
   the strategy editor — same markup so styling stays consistent.
   Caller chooses the label so this works for "Last updated" /
   "Last upload" / etc. */
function _dateFieldHtml(item, label) {
  return '<div class="ws-field">' +
    '<label class="ws-field-label">' + _esc(label) + '</label>' +
    '<div class="ws-date-row">' +
      '<input type="date" class="ws-input ws-date-input" data-field="date" value="' + _esc(_dateToInputValue(item.date)) + '">' +
      '<button type="button" class="ws-today-btn" data-action="today">Today</button>' +
    '</div>' +
  '</div>';
}

/* Generic / whitepaper edit card — title, [status], date, single URL.
   Status is rendered only for sections that have a card kind set
   (whitepapers). Flat sections (Research Links, Selling/Buying
   Slides) skip the Status field per Paul's call — those cards
   don't carry an approval workflow. */
function _renderItemEdit(secIdx, subIdx, itemIdx, item, kind) {
  const card = document.createElement('div');
  card.className = 'ws-card';

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'ws-card-delete';
  del.title = 'Delete this card';
  del.textContent = '×';
  del.addEventListener('click', () => deleteItem(secIdx, subIdx, itemIdx));
  card.appendChild(del);

  const showStatus = kind === 'whitepaper';
  const statusFieldHtml = showStatus
    ? '<div class="ws-field">' +
        '<label class="ws-field-label">Status</label>' +
        '<select class="ws-select" data-field="status">' + _statusOptionsHtml(item.status) + '</select>' +
      '</div>'
    : '';

  card.insertAdjacentHTML('beforeend',
    statusFieldHtml +
    '<div class="ws-field">' +
      '<label class="ws-field-label">Name</label>' +
      '<input type="text" class="ws-input ws-input-title" data-field="title" value="' + _esc(item.title) + '" placeholder="Card title">' +
    '</div>' +
    _dateFieldHtml(item, 'Last updated') +
    '<div class="ws-field">' +
      '<label class="ws-field-label">URL</label>' +
      '<input type="url" class="ws-input" data-field="url" value="' + _esc(item.url) + '" placeholder="https://…">' +
    '</div>'
  );

  _wireEditCardFields(card, secIdx, subIdx, itemIdx);
  return card;
}

/* Shared field wiring for the edit cards. Handles the date field's
   YYYY-MM-DD ↔ DD/MM/YYYY conversion and the Today shortcut. */
function _wireEditCardFields(card, secIdx, subIdx, itemIdx) {
  card.querySelectorAll('[data-field]').forEach(el => {
    const field = el.getAttribute('data-field');
    const evt = (el.tagName === 'SELECT' || el.type === 'date') ? 'change' : 'input';
    el.addEventListener(evt, () => {
      const it = _itemAt(secIdx, subIdx, itemIdx);
      if (!it) return;
      let val = el.value;
      if (el.type === 'date') val = _dateFromInputValue(val);
      it[field] = val;
      persist();
    });
  });
  /* Today button — fills the sibling date input and dispatches a
     change so the wiring above persists the new value. */
  card.querySelectorAll('[data-action="today"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = btn.parentElement.querySelector('input[type="date"]');
      if (!input) return;
      input.value = _dateToInputValue(_todayDmy());
      input.dispatchEvent(new Event('change', { bubbles: true }));
    });
  });
}

/* Strategy edit card — adds a Slides URL field on top of the

/* ─── Add / Delete handlers ─── */

function addItem(secIdx, subIdx) {
  const arr = _itemsContainer(secIdx, subIdx);
  if (!arr) return;
  const kind = _subsectionKind(secIdx, subIdx);
  const isStrategy   = kind === 'strategy';
  const isWhitepaper = kind === 'whitepaper';
  /* Flat sections (Research Links, Selling/Buying Slides) don't have a
     status workflow — see commit 44d8be2. Seed status only when the
     subsection actually shows a Status field. */
  const seedStatus = (isStrategy || isWhitepaper) ? 'in-progress' : '';
  arr.push(isStrategy
    ? { title: '', url: '', slidesUrl: '', status: seedStatus, date: '' }
    : { title: '', url: '',                status: seedStatus, date: '' });
  persist();
  renderAll();
  /* Focus the new card's title input so the user can start typing
     immediately. New card is the last data card before the + tile. */
  requestAnimationFrame(() => {
    const grid = document.getElementById(_gridIdFor(secIdx, subIdx));
    const cards = grid ? grid.querySelectorAll('.ws-card') : [];
    const last = cards[cards.length - 1];
    const titleInput = last && last.querySelector('input[data-field="title"]');
    if (titleInput) titleInput.focus();
  });
}

function deleteItem(secIdx, subIdx, itemIdx) {
  const arr = _itemsContainer(secIdx, subIdx);
  if (!arr) return;
  const item = arr[itemIdx];
  const label = (item && item.title) ? '"' + item.title + '"' : 'this card';
  if (!confirm('Delete ' + label + '? This can\'t be undone from the UI.')) return;
  arr.splice(itemIdx, 1);
  persist();
  renderAll();
}

function addSection() {
  WS_DATA.sections.push({
    id: _genSectionId(),
    icon: '📁',
    title: 'New Type',
    items: [],
  });
  persist();
  renderAll();
  /* Focus + select the new tile's name input so the user can
     immediately rename it. */
  requestAnimationFrame(() => {
    const grid = document.getElementById('ws-types-grid');
    if (!grid) return;
    const tiles = grid.querySelectorAll('.ws-type-tile');
    const last = tiles[tiles.length - 1];
    const titleInput = last && last.querySelector('.ws-type-title-input');
    if (titleInput) { titleInput.focus(); titleInput.select(); }
  });
}

function deleteSection(secIdx) {
  const sec = WS_DATA.sections[secIdx];
  if (!sec) return;
  const label = sec.title ? '"' + sec.title + '"' : 'this type';
  const itemCount = _countItems(sec);
  const msg = itemCount
    ? 'Delete type ' + label + ' AND its ' + itemCount + ' card' + (itemCount === 1 ? '' : 's') + '? This can\'t be undone.'
    : 'Delete type ' + label + '?';
  if (!confirm(msg)) return;
  WS_DATA.sections.splice(secIdx, 1);
  /* If we just deleted the section we were viewing, bounce back
     to the picker — there's nothing left to render here. */
  if (_currentView === 'section' && _currentSecIdx === secIdx) {
    exitToPicker();
  } else if (_currentView === 'section' && _currentSecIdx > secIdx) {
    /* Index shifts down by one when an earlier section is removed. */
    _currentSecIdx -= 1;
  }
  persist();
  renderAll();
}

/* ─── + Add Card tile (per section/subsection, in section view) ─── */

function _renderAddItemTile(secIdx, subIdx) {
  const tile = document.createElement('button');

/* ─── Picker view ─── one big tile per type. View mode: tile is
   a clickable button; Edit mode: name + icon become inputs and a
   × delete appears at the corner. The "Open Section ›" CTA at the
   bottom navigates regardless of mode. */

function _renderTypeTile(secIdx, section) {
  const itemCount = _countItems(section);
  const countText = itemCount + ' card' + (itemCount === 1 ? '' : 's');
  const icon = section.icon || '📁';

  if (!_editMode) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ws-type-tile';
    btn.innerHTML =
      '<div class="ws-type-icon">' + _esc(icon) + '</div>' +
      '<h3 class="ws-type-title">' + _esc(section.title || 'Untitled Type') + '</h3>' +
      '<div class="ws-type-count">' + countText + '</div>' +
      '<span class="ws-type-cta">Open <span>›</span></span>';
    btn.addEventListener('click', () => enterSection(secIdx));
    return btn;
  }

  const div = document.createElement('div');
  div.className = 'ws-type-tile';

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'ws-type-delete';
  del.title = 'Delete this type';
  del.textContent = '×';
  del.addEventListener('click', () => deleteSection(secIdx));
  div.appendChild(del);

  div.insertAdjacentHTML('beforeend',
    '<input type="text" class="ws-type-icon-input" data-type-field="icon" value="' + _esc(icon) + '" maxlength="4" placeholder="📁" title="Icon (emoji)">' +
    '<input type="text" class="ws-type-title-input" data-type-field="title" value="' + _esc(section.title) + '" placeholder="Type name">' +
    '<div class="ws-type-count">' + countText + '</div>'
  );

  /* Wire icon + title inputs to mutate the section in-place. */
  div.querySelectorAll('[data-type-field]').forEach(el => {
    el.addEventListener('input', () => {
      WS_DATA.sections[secIdx][el.getAttribute('data-type-field')] = el.value;
      persist();
    });
  });

  /* CTA opens the section even in edit mode, so the user can
     switch to editing that section's cards. */
  const cta = document.createElement('button');
  cta.type = 'button';
  cta.className = 'ws-type-cta';
  cta.innerHTML = 'Open <span>›</span>';
  cta.addEventListener('click', () => enterSection(secIdx));
  div.appendChild(cta);

  return div;
}

function _renderAddTypeTile() {
  const tile = document.createElement('button');
  tile.type = 'button';
  tile.className = 'ws-card-add';

function renderPicker() {

/* Research Links "Current Edition" banner — view shows the stored

function _renderEditionBanner(section) {
